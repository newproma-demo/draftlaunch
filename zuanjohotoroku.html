  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 25px);
    }
    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 24px 32px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content-area-2 {
      flex: 1;
    }

    /* ガントチャート */
    .timeline-wrapper {
      position: relative;
      margin-bottom: 0;
      width: 450px;
    }

    .timeline-line {
      position: absolute;
      top: 47%;
      left: 50px;
      right: 50px;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      z-index: 1;
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* 画面の幅が768px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

      .dashboard-section {
        display: flex;
        gap: 24px;
        margin-top: 0;
        width: 100%;
        flex-direction: column;
        padding-bottom: 20px;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      .timeline-line {
        left: 20px;
        right: 20px;
      }
    }
    
    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    .filter-row input[type="text"] {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-area {

      margin-bottom: 10px;
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-area:first-of-type {
      margin-bottom: 5px;
    }
    
    .content-area h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }


    /* 商品情報エリア：3行が1画面に収まるように高さを確保 */
    #approvalNoticeArea {
      width: 100%;
      max-height: 82vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 画面右下固定 新規登録ボタン（承認通知の詳細ボタンと同じ見た目） */
    .btn-fab-new {
      position: fixed;
      right: 24px;
      bottom: 12px;
      z-index: 2001;
      min-width: 100px;
      width: clamp(80px, 5vw, 120px);
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
    }

    .product-swiper {
      position: relative;
      width: 100%;
      /* overflow: hidden; */
      touch-action: pan-y;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 3px;
      box-sizing: border-box;
      background: #fff;
    }

    .product-nav {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .product-nav-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--color-text);
      white-space: nowrap;
    }

    .product-nav-btn:hover:not(:disabled) {
      background: var(--color-surface);
    }

    .product-nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .product-image-block {
      display: flex;

      align-items: center;
      align-self: center;
    }

    .product-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 72px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image-wrapper.drag-over {
      border-color: var(--color-primary);
      background: #e6f4ea;
    }

    .product-image-wrapper img.product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      order: 0;
    }

    .product-table th,
    .product-table td {
      font-size: clamp(var(--fs-sm), 0.5vw + 8px, var(--fs-base));
      font-size:10pt;
      border: 1px solid var(--color-border);
      padding: 4px 6px;
      vertical-align: middle;
    }

    .product-table th {
      background: #f5f7fa;
    }

    .product-table input,
    .product-table textarea {
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 4px 6px;
    }

    .product-table .half-field {
      width: 100%;
      max-width: 100%;
    }

    @media (min-width: 900px) {
      .product-swiper {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(3, 1fr);
        gap: 10px 16px;
        align-items: stretch;
        max-height: 80vh;
        min-height: 0;
        overflow-y: auto;
        /* overflow: hidden; */
      }

      .product-card {
        padding: 8px;
        gap: 8px;
        /* min-height: 0; */
        /* overflow: hidden; */
      }

      .product-table th,
      .product-table td {
        padding: 2px 4px;
      }

      .product-table input,
      .product-table textarea,
      .product-table select {
        padding: 2px 4px;
      }

      .product-table textarea {
        min-height: 32px;
      }

      .product-image-block {
        max-width: 120px;
      }

      .product-image-wrapper {
        max-height: 56px;
      }
    }

    .content-area {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

  <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');   // ← オーバーレイ表示
      } else {

        overlay.classList.remove('show'); // ← オーバーレイ非表示
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.remove('active');
      overlay.classList.remove('show');
    }

    var GAUGE_ARC_LENGTH = Math.PI * 40;
    function setGaugeFillSegments(fillId, warn7Id, delayId, done, total, warn7, delay) {
      var L = GAUGE_ARC_LENGTH;
      var t = total > 0 ? total : 1;
      var w7 = (warn7 != null ? warn7 : 0);
      var dly = (delay != null ? delay : 0);
      var lenDone = (done / t) * L;
      var lenWarn7 = (w7 / t) * L;
      var lenDelay = (dly / t) * L;
      var el = document.getElementById(fillId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDone.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", "0");
      }
      el = document.getElementById(warn7Id);
      if (el) {
        el.setAttribute("stroke-dasharray", lenWarn7.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-lenDone).toFixed(2));
      }
      el = document.getElementById(delayId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDelay.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-(lenDone + lenWarn7)).toFixed(2));
      }
    }

    // 商品情報：商品カードの画像アップロード制御
    (function () {
      var swiper = document.getElementById("productSwiper");
      var indexLabel = document.getElementById("productIndex");
      var addBtn = document.getElementById("productAddBtn");
      var prevBtn = document.getElementById("productPrevBtn");
      var nextBtn = document.getElementById("productNextBtn");
      if (!swiper) return;

      var currentIndex = 0;

      function getCards() {
        return swiper.querySelectorAll(".product-card");
      }

      function attachImageHandler(card) {
        var fileInput = card.querySelector(".product-image-input");
        var img = card.querySelector(".product-image");
        var wrapper = card.querySelector(".product-image-wrapper");
        if (!fileInput || !img || !wrapper) return;

        function loadFile(file) {
          if (!file || !file.type || !file.type.match(/^image\//)) return;
          var reader = new FileReader();
          reader.onload = function (e) {
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }

        // ファイル選択（ボタン・ラベル）
        fileInput.addEventListener("change", function () {
          if (!this.files || !this.files[0]) return;
          loadFile(this.files[0]);
        });

        // 画像クリックでファイル選択
        wrapper.addEventListener("click", function () {
          fileInput.click();
        });

        // ドラッグ＆ドロップ
        ["dragenter", "dragover"].forEach(function (ev) {
          wrapper.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            wrapper.classList.add("drag-over");
          });
        });
        ["dragleave", "dragend"].forEach(function (ev) {
          wrapper.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            wrapper.classList.remove("drag-over");
          });
        });
        wrapper.addEventListener("drop", function (e) {
          e.preventDefault();
          e.stopPropagation();
          wrapper.classList.remove("drag-over");
          var files = e.dataTransfer && e.dataTransfer.files;
          if (!files || !files[0]) return;
          loadFile(files[0]);
        });
      }

      function resetCard(card) {
        Array.prototype.forEach.call(card.querySelectorAll("input, textarea"), function (el) {
          if (el.type === "file") {
            el.value = "";
          } else {
            el.value = "";
          }
        });
        var img = card.querySelector(".product-image");
        if (img) {
          img.src = "images/noimage.png";
        }
      }

      function updateIndex() {
        var cards = getCards();
        var total = cards.length;
        if (total === 0) {
          if (indexLabel) indexLabel.textContent = "";
          if (prevBtn) prevBtn.disabled = true;
          if (nextBtn) nextBtn.disabled = true;
          return;
        }
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= total) currentIndex = total - 1;
        cards.forEach(function (card, idx) {
          card.classList.toggle("is-active", idx === currentIndex);
        });
        if (indexLabel) {
          indexLabel.textContent = (currentIndex + 1) + " / " + total;
        }
        if (prevBtn) prevBtn.disabled = (total <= 1 || currentIndex === 0);
        if (nextBtn) nextBtn.disabled = (total <= 1 || currentIndex === total - 1);
      }

      // 初期カードに画像ハンドラを付与
      getCards().forEach(attachImageHandler);

      // カードを12件になるまで複製（商品数は12個固定）
      var desiredTotal = 12;
      var cards = getCards();
      if (cards.length) {
        var baseCard = cards[0];
        for (var i = cards.length; i < desiredTotal; i++) {
          var newCard = baseCard.cloneNode(true);
          resetCard(newCard);
          swiper.appendChild(newCard);
          attachImageHandler(newCard);
        }
      }

      // 前後ナビゲーション・スワイプは固定表示のため無効化
    })();

  </script>
</body>

</html>
