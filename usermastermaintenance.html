<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ビューポート内に収め、.user-table 側で縦スクロール */
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    body>.header {
      flex-shrink: 0;
    }

    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
      margin-top: 0;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 56px 32px;
      overflow: hidden;
      transition: margin-left 0.3s ease;
    }

    .content>h1 {
      flex-shrink: 0;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }
    
    /* pt は 96dpi で px 換算が割り切れずサブピクセルになり、文字がにじみやすい → px 整数に */
    h2 {
      font-size: 17px;
    }

    .content-area {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .user-swiper {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-panels-row {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 33px;
    }

    /* 画面右下固定アクションボタン群（shipiraishotoroku.html と同様） */
    .fab-actions {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 画面右下固定ボタン（fab-actions 内） */
    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .user-table {
      flex: 1;
      margin-bottom: 20px;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .user-table .form-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 0px 12px;
      margin-bottom: 12px;
    }

    .user-table .form-row>label {
      width: 180px;
      flex-shrink: 0;
      order: 1;
    }

    /* PC: ラベル → 入力 → 必須（入力のすぐ後ろ） */
    .user-table .form-row>.form-row__input-wrap {
      flex: 1;
      min-width: 0;
      order: 2;
    }

    .user-table .form-row>.badge-required {
      flex-shrink: 0;
      order: 3;
    }

    /* 必須あり: PCでは入力欄のすぐ後ろにバッジ（入力ラップを広げない） */
    .user-table .form-row--required > .form-row__input-wrap {
      flex: 0 0 auto;
    }

    .user-table .form-row--required {
      column-gap: 6px;
    }

    .badge-required {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 3px 5px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
      background: #dc2626;
      border-radius: 6px;
    }

    .password-expiry-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .password-expiry-row>label {
      margin: 0;
    }

    /* パスワード: PCは入力と有効期限の間／SPは見出しlabel直後（要素を切り替え） */
    .user-table .badge-required--password-sp {
      display: none;
    }

    .user-table .badge-required--password-pc {
      display: inline-flex;
    }

    .user-table input[type="text"]::placeholder {
      color: #9aa8a1;
      opacity: 1;
    }

    /* autocomplete のプルダウン展開アイコン */
    .user-table .autocomplete {
      position: relative;
    }

    .user-table .autocomplete input[type="text"] {
      padding-right: 32px;
    }

    .user-table .autocomplete::after {
      content: "";
      position: absolute;
      right: 12px;
      bottom: 20px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #8fa098;
      border-bottom: 2px solid #8fa098;
      transform: rotate(45deg);
      /* transition: transform 0.00s ease; */
      pointer-events: none;
    }

    .user-table .autocomplete.is-open::after {
      bottom: 15px;
      transform: rotate(-135deg);
    }

    /* .user-table .autocomplete.is-open .autocomplete-dropdown {
      margin-top: 10px;
    } */

    /* label がない行は入力欄の高さに合わせる */
    .user-table .form-row:not(:has(>label)) {
      align-items: flex-start;
    }

    .user-table .form-row:not(:has(>label))>.form-row__input-wrap {
      display: inline-flex;
      align-items: flex-start;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が767px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        /* var(--fs-xl) は 20pt で小数 px になりやすい */
        font-size: 27px;
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        min-height: 0;
        min-width: 0;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
        overflow: hidden;
      }

      .user-table .form-row {
        flex-direction: column;
        align-items: flex-start;
      }

      /* スマホ: 見出しlabelの直後に必須、その次に入力（PCの order と差し替え） */
      .user-table .form-row > label {
        order: 1;
      }

      .user-table .form-row > .badge-required {
        order: 2;
      }

      .user-table .form-row > .form-row__input-wrap {
        order: 3;
      }

      /* スマホ・必須あり: 見出しlabelの直後に必須（同一行）、その下に入力 */
      .user-table .form-row--required {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        column-gap: 6px;
        row-gap: 0px;
      }

      .user-table .form-row--required > label {
        width: auto;
        flex: 0 0 auto;
      }

      .user-table .form-row--required > .badge-required {
        order: 2;
        flex: 0 0 auto;
      }

      .user-table .form-row--required > .form-row__input-wrap {
        order: 3;
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
      }

      /* スマホ・必須なし: 従来どおり縦並び */
      .user-table .form-row:not(.form-row--required) > .form-row__input-wrap {
        width: 100%;
      }

      .user-table input[type="text"] {
        max-width: 415px;
      }

      /* スマホ時: パスワード有効期限を入力欄の下に表示 */
      .password-expiry-row {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .password-expiry-row>label {
        margin-left: 10px;
      }

      .user-table .badge-required--password-sp {
        display: inline-flex;
      }

      .user-table .badge-required--password-pc {
        display: none;
      }

    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定：登録 -->
    <div class="fab-actions" role="toolbar">
      <button type="button" class="btn-fab-new">登録</button>
    </div>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <!-- 画面タイトル -->
      <h2 class="page-title">ユーザーマスタメンテナンス</h2>
      <!-- ========== : ヘッダ部 ========== -->
      <div class="content-area">
        <div class="user-swiper" id="userSwiper">
          <div class="user-panels-row" id="userPanelsRow">
            <div class="user-table">
              <h2 style="margin-block-start:0.5em ;margin-block-end:0.5em;">ユーザー情報</h2>
              <div class="form-row form-row--required">
                <label>ユーザーID</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="ユーザーID" style="width: 130px;" maxlength="4">
                </div>
              </div>
              <div class="form-row form-row--required">
                <label>ユーザー名</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="ユーザー名" style="width: 300px;">
                </div>
              </div>
              <div class="form-row form-row--required form-row--password">
                <label>パスワード</label>
                <span class="badge-required badge-required--password-sp">必須</span>
                <div class="form-row__input-wrap">
                  <div class="password-expiry-row">
                    <input type="text" placeholder="パスワード" style="width: 200px;">
                    <span class="badge-required badge-required--password-pc">必須</span>
                    <label style="font-size: 15px; width: 300px;">パスワード有効期限：2026/09/30</label>
                  </div>
                </div>
              </div>
              <div class="form-row form-row--required">
                <label>メールアドレス</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="メールアドレス" style="width: 300px;">
                </div>
              </div>
              <h2 style="margin-block-start:1.5em ;margin-block-end:0.5em;">所属</h2>
              <div class="form-row form-row--required">
                <label>拠点</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <div class="autocomplete">
                    <input type="text" class="autocomplete-input" data-list="kyoten" placeholder="拠点" id="searchDesigner">
                    <div class="autocomplete-dropdown" style="margin-top: 10px;"></div>
                  </div>
                </div>
              </div>
              <div class="form-row form-row--required">
                <label>部署</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <div class="autocomplete">
                    <input type="text" class="autocomplete-input" data-list="busho" placeholder="部署" id="searchDesigner">
                    <div class="autocomplete-dropdown"></div>
                  </div>
                </div>
              </div>
              <h2 style="margin-block-start:1.5em ;margin-block-end:0.5em;">アクセス権</h2>
              <div class="form-row form-row--required">
                <label>権限グループ</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <div class="autocomplete">
                    <input type="text" class="autocomplete-input" data-list="kengengroup" placeholder="権限グループ"
                      id="searchDesigner">
                    <div class="autocomplete-dropdown"></div>
                  </div>
                </div>
              </div>
              <div class="form-row form-row--required">
                <label>顧客情報参照権限</label>
                <span class="badge-required">必須</span>
                <div class="form-row__input-wrap">
                  <div class="autocomplete">
                    <input type="text" class="autocomplete-input" data-list="kokyakujohosanshokengen"
                      placeholder="顧客情報参照権限" id="searchDesigner">
                    <div class="autocomplete-dropdown"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script>
    function loadSharedSidebar() {
      const mount = document.getElementById('sidebarMount');
      if (!mount) return;

      if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
        console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
        return;
      }

      mount.innerHTML = window.SHARED_SIDEBAR_HTML;
      initSidebarCollapseToggle();
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      const content = document.querySelector('.content');
      if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

      const toggleImg = toggle.querySelector('img');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        content.classList.toggle('expanded');

        if (sidebar.classList.contains('closed')) {
          if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
        } else {
          if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
        }
      });

      toggle.dataset.bound = '1';
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.remove('active');
      overlay.classList.remove('show');
    }

    function initAutocompleteChevronState() {
      const boxes = document.querySelectorAll('.user-table .autocomplete');
      boxes.forEach((box) => {
        const dropdown = box.querySelector('.autocomplete-dropdown');
        if (!dropdown) return;

        const syncOpenState = () => {
          const isOpen = window.getComputedStyle(dropdown).display !== 'none' && dropdown.children.length > 0;
          box.classList.toggle('is-open', isOpen);
        };

        const observer = new MutationObserver(syncOpenState);
        observer.observe(dropdown, {
          attributes: true,
          attributeFilter: ['style'],
          childList: true,
          subtree: true
        });
        syncOpenState();
      });
    }

    loadSharedSidebar();
    initAutocompleteChevronState();

    const icon = document.querySelector('.header-account_circle');
    const menu = document.querySelector('.account-menu');

    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // クリックが外側に伝播しないように
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

  </script>
</body>

</html>
