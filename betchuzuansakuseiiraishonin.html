<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

     body {
      display: flex;
      flex-direction: column;
    } 

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }
    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }
    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255,255,255,0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1; 
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }
    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 56px 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
    .content-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      overflow: hidden;
    }

    /* エントリーフォーム用スクロールエリア */
    .entry-form {
      margin-top: 16px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding-right: 8px;
      box-sizing: border-box;
    }

    .entry-form .form-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .entry-form .form-row.form-row-fileimg {
      padding-left: calc(180px + 12px);
    }

    .entry-form label {
      font-weight: 500;
      min-width: 180px;
      flex-shrink: 0;
      padding-top: 8px;
      line-height: 1.4;
    }

    /* チェック用 label は左列 180px を当てない（あり／なし) などが横に詰まる） */
    .entry-form .checkbox-label {
      min-width: 0;
      max-width: none;
      padding-top: 0;
      align-self: center;
    }

    .entry-form .form-row.form-row-hanbai-kubun .filter-label {
      font-weight: 500;
      min-width: 180px;
      flex-shrink: 0;
      padding-top: 8px;
      line-height: 1.4;
    }

    .entry-form .form-row.form-row-hanbai-kubun select {
      flex: 0 0 calc((100% - 32px) / 5);
      width: calc((100% - 32px) / 5);
      max-width: calc((100% - 32px) / 5);
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form input,
    .entry-form textarea {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base);
      box-sizing: border-box;
    }

    /* テキスト欄の padding が checkbox にも当たらないように（PC/スマホ共通・文言との間隔を一定に） */
    .entry-form input[type="checkbox"] {
      flex: 0 0 auto;
      padding: 0;
      margin: 0;
      width: 1.125rem;
      height: 1.125rem;
      min-width: 1.125rem;
      min-height: 1.125rem;
      border-radius: var(--radius-sm);
      vertical-align: middle;
    }

    .entry-form .form-row-multi5 .multi5-inputs {
      flex: 1;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .entry-form .form-row-multi5 .multi5-inputs input,
    .entry-form .form-row-multi5 .multi5-inputs .autocomplete {
      flex: 1;
      min-width: 0;
    }

    .entry-form .form-row-multi5 .multi5-inputs .autocomplete {
      position: relative;
    }

    .entry-form .form-row-multi5 .multi5-inputs .autocomplete .autocomplete-input {
      width: 100%;
      box-sizing: border-box;
    }

    /* PC：スマホ用インラインラベルは非表示。行ラッパーは display:contents で5入力が一列に並ぶ */
    .entry-form .form-multi5-sp-only-label {
      display: none;
    }

    .entry-form .form-multi5-sp-inline-row {
      display: contents;
    }

    /* PC：スマホ用の凡例ブロックは非表示（中身は .form-row の label を使用） */
    .form-multi5-sp-legend {
      display: none;
    }

    .form-multi5-matrix {
      min-width: 0;
    }

    .entry-form .form-row-two-cols {
      display: flex;
      flex-direction: row;
      gap: 24px;
      align-items: flex-start;
    }

    .entry-form .form-row-two-cols .form-field-inline {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .entry-form .form-row-two-cols .form-field-inline label {
      min-width: 180px;
      flex-shrink: 0;
      padding-top: 8px;
    }

    .entry-form .form-row-two-cols .form-field-inline input {
      flex: 1;
      min-width: 0;
    }

    .entry-form .form-row .autocomplete {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .entry-form .form-row .autocomplete .autocomplete-input {
      width: 100%;
      box-sizing: border-box;
    }

    .entry-form .form-row .autocomplete .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      z-index: 100;
      margin-top: 2px;
    }

    .entry-form .form-row .autocomplete .autocomplete-dropdown div {
      padding: 8px 10px;
      cursor: pointer;
    }

    .entry-form .form-row .autocomplete .autocomplete-dropdown div:hover {
      background: rgba(0, 134, 50, 0.08);
    }

    /* サンプル必要枚数の単位「枚」表示、および金額の単位表示 */
    .entry-form .sample-count-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .entry-form .sample-count-wrapper .sample-count-unit {
      white-space: nowrap;
    }

    .entry-form .amount-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .entry-form .amount-wrapper .amount-unit {
      white-space: nowrap;
    }

    .entry-form .product-image-block {
      display: flex;
      align-items: center;
      align-self: center;
      max-width: 200px;
    }

    .entry-form .product-image-wrapper {
      width: 150px;
      max-width: 250px;
      height: 150px;
      max-height: 150px;
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .entry-form .product-image-wrapper img[name="fileimg"] {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    /* 進行内容・表現方法：ラベル幅を揃えてチェックボックス左端を一致させる */
    /* .entry-form .form-row-shinkonaiyo > label,
    .entry-form .form-row-hyogenhoho > label {
      width: 180px;
      min-width: 180px;
    } */



    /* .entry-form .form-row-shinkonaiyo .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin: 0;
      white-space: nowrap;
    } */

    /* .entry-form .form-row-shinkonaiyo .checkbox-label input[type="checkbox"] {
      flex-shrink: 0;

    } */

    /* 表現方法・刺繍・ヘムのチェックボックス行 */
    /* .entry-form .form-row-hyogenhoho .hyogenhoho-options,
    .entry-form .shishu-options,
    .entry-form .hemu-options {
      flex: 1;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 16px 24px;
      min-width: 0;
      align-items: center;
    } */

    /* .entry-form .form-row-hyogenhoho .checkbox-label,
    .entry-form .shishu-options .checkbox-label,
    .entry-form .hemu-options .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin: 0;
      white-space: nowrap;
    } */

    /* .entry-form .form-row-hyogenhoho .checkbox-label input[type="checkbox"],
    .entry-form .shishu-options .checkbox-label input[type="checkbox"],
    .entry-form .hemu-options .checkbox-label input[type="checkbox"] {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    } */

    .entry-form .form-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .entry-form .btn-primary,
    .entry-form .btn-secondary {
      min-width: 100px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    .entry-form .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .entry-form .btn-secondary {
      background: var(--color-card);
      color: var(--color-text);
    }

    /* content-box内のpage-titleはdashboardのview-layout-titleと同じ見た目に合わせる */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    .content-box .search-box {
      flex-shrink: 0;
    }

    /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
    .content-box .pc-only {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-box .sp-only {
      flex: 1;
      min-height: 0;
    }

    .content-box .content-section {
      flex: 1;
      min-height: 0;
    }

    .modal-window {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      padding: 28px;
      width: 85%;
      max-width: 900px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2001;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      /*
       * スマホ：入力・チェックの左端を「図案予定期日」のテキストボックス位置に揃える。
       * ラベル列幅は --sp-label-col、ラベルと入力の左右のあいだは --sp-label-gap。
       */
      .entry-form {
        --sp-label-col: 7rem;
        --sp-label-gap: 0px;
      }

      /* 画像プレビュー：詳細（shosai）テキストエリアの左端にそろえる */
      .entry-form .form-row.form-row-fileimg {
        padding-left: calc(var(--sp-label-col) + var(--sp-label-gap));
        box-sizing: border-box;
      }

      /* 単独行のみラベル〜入力の gap を統一（2列ブロックの列間は下記ベースの 24px を維持） */
      .entry-form .form-row:not(.form-row-two-cols) {
        gap: var(--sp-label-gap);
      }

      /* 2列ブロック内の各行（図案予定／商品販売・提出日／デザイナー共通） */
      .entry-form .form-row-two-cols .form-field-inline {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: none;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: var(--sp-label-gap);
      }

      /* style.css の .period-range-inputs { width:100% } との組み合わせを、商品販売時期と同じに */
      .entry-form .form-row-two-cols .form-field-inline > .period-range-inputs {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        max-width: none;
      }

      .entry-form .form-row label:not(.checkbox-label),
      .entry-form .form-row.form-row-hanbai-kubun .filter-label,
      .entry-form .form-row-two-cols .form-field-inline > label:not(.checkbox-label) {
        flex: 0 0 var(--sp-label-col);
        width: var(--sp-label-col);
        min-width: var(--sp-label-col);
        max-width: var(--sp-label-col);
        box-sizing: border-box;
        flex-shrink: 0;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: break-word;
        padding-top: 6px;
      }

      .entry-form .form-row.form-row-hanbai-kubun select {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        max-width: none;
      }

      /* サンプル必要枚数：得意先名の .autocomplete と同じく右欄を占有し、入力の幅を揃える */
      .entry-form .form-row .sample-count-wrapper {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--sp-label-gap);
        width: auto;
        max-width: none;
      }

      .entry-form .form-row .sample-count-wrapper input[type="number"] {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        max-width: none;
      }

      /* 予定受注金額：得意先名の .autocomplete と同じく右欄を占有し、入力の幅を揃える */
      .entry-form .form-row .amount-wrapper {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--sp-label-gap);
        width: auto;
        max-width: none;
      }

      .entry-form .form-row .amount-wrapper input[type="number"] {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        max-width: none;
      }

      /*
       * アイテム～ブランド・キャラ（.form-multi5-matrix）：
       * 先頭は各項目名＋1列目を横並び（7行）、残りはセット2～5を縦並び
       */
      .entry-form .form-multi5-matrix {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }

      .entry-form .form-multi5-matrix .form-row-multi5 {
        display: contents;
      }

      .entry-form .form-multi5-matrix .form-row-multi5 > label {
        display: none;
      }

      .entry-form .form-multi5-matrix .multi5-inputs {
        display: contents;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: var(--sp-label-gap);
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#hinshu1) {
        order: -8;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#saizu1) {
        order: -7;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#haishoku1) {
        order: -6;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#yoteiHatchuSu1) {
        order: -5;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#garaSuTeianKosu1) {
        order: -4;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#category1) {
        order: -3;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row:has(#brand1) {
        order: -2;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-only-label {
        display: block;
        flex: 0 0 var(--sp-label-col);
        width: var(--sp-label-col);
        min-width: var(--sp-label-col);
        max-width: var(--sp-label-col);
        box-sizing: border-box;
        flex-shrink: 0;
        font-weight: 500;
        line-height: 1.35;
        padding-top: 6px;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row .autocomplete {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
      }

      .entry-form .form-multi5-matrix .form-multi5-sp-inline-row > input {
        flex: 1 1 auto;

    <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

      // 検索条件による検索結果一覧の絞り込み（得意先名入力時に実行）
      (function () {
        var inpTokuisaki = document.getElementById("searchTokuisaki");
        var tbody = document.querySelector("#approvalListArea .result-table tbody");
        if (!tbody) return;

        function applyFilter() {
          var cond = inpTokuisaki ? inpTokuisaki.value.trim() : "";
          Array.prototype.forEach.call(tbody.rows, function (row) {
            var cellTokuisaki = row.cells[1] ? row.cells[1].textContent.trim() : "";
            var match = !cond || cellTokuisaki.indexOf(cond) !== -1;
            row.style.display = match ? "" : "none";
          });
        }

        if (inpTokuisaki) {
          inpTokuisaki.addEventListener("input", applyFilter);
          inpTokuisaki.addEventListener("change", applyFilter);
        }
        applyFilter();
      })();

      // スマホ: 検索条件の折りたたみ開閉
      (function () {
        var btn = document.getElementById("searchToggleSp");
        var box = document.getElementById("searchBox");
        if (btn && box) {
          btn.addEventListener("click", function () {
            var isOpen = box.classList.toggle("is-open");
            btn.setAttribute("aria-expanded", isOpen);
            var textEl = btn.querySelector(".search-toggle-sp-text");
            if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
          });
        }
      })();

      // 図案予定期日・商品販売時期・提出日：カレンダーとテキスト入力の連動（yyyymmdd形式）
      (function () {
        var fields = document.querySelectorAll(".period-range-field");
        if (!fields || !fields.length) return;

        function formatDateToYyyymmdd(dateStr) {
          if (!dateStr) return "";
          var d = new Date(dateStr);
          if (isNaN(d.getTime())) return "";
          var y = d.getFullYear();
          var m = ("0" + (d.getMonth() + 1)).slice(-2);
          var day = ("0" + d.getDate()).slice(-2);
          return "" + y + m + day;
        }

        function yyyymmddToIso(value) {
          if (!/^\d{8}$/.test(value)) return "";
          var y = value.substring(0, 4);
          var m = value.substring(4, 6);
          var d = value.substring(6, 8);
          var iso = y + "-" + m + "-" + d;
          var dt = new Date(iso);
          if (isNaN(dt.getTime())) return "";
          return iso;
        }

        Array.prototype.forEach.call(fields, function (wrap) {
          var textInput = wrap.querySelector(".period-range-input");
          var dateInput = wrap.querySelector(".period-range-picker");
          var btn = wrap.querySelector(".period-range-calendar-btn");

          if (!textInput || !dateInput) return;

          // カレンダーで選択 → テキストに yyyymmdd 反映
          dateInput.addEventListener("change", function () {
            var ymd = formatDateToYyyymmdd(dateInput.value);
            if (ymd) {
              textInput.value = ymd;
            }
          });

          // テキストで8桁入力 → カレンダー側にも反映
          textInput.addEventListener("blur", function () {
            var v = textInput.value.replace(/[^\d]/g, "");
            if (v.length !== 8) return;
            var iso = yyyymmddToIso(v);
            if (iso) {
              dateInput.value = iso;
            }
          });

          // カレンダーアイコン押下 → 日付入力をフォーカス／クリック
          if (btn) {
            btn.addEventListener("click", function () {
              dateInput.showPicker && dateInput.showPicker();
              dateInput.focus();
            });
          }
        });
      })();

      // fileimg クリックで画像アップロード
      (function () {
        var previewImg = document.querySelector('img[name="fileimg"]');
        var previewWrapper = document.getElementById("fileimgWrapper");
        var fileInput = document.getElementById("fileimgInput");
        if (!previewImg || !fileInput) return;

        var triggerPicker = function () { fileInput.click(); };
        if (previewWrapper) {
          previewWrapper.addEventListener("click", triggerPicker);
        } else {
          previewImg.addEventListener("click", triggerPicker);
        }

        fileInput.addEventListener("change", function () {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          if (!file.type || file.type.indexOf("image/") !== 0) return;

          var objectUrl = URL.createObjectURL(file);
          previewImg.src = objectUrl;
        });
      })();
    </script>
