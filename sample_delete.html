<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proma</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="js/autocomplete.js"></script>
    <!--   <link rel="stylesheet" href="style.css"> -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            /* font-family: "Yu Gothic", "Meiryo", sans-serif; */
            background: #f4f7fb;
            color: #333;
        }

        /* #region ヘッダー */
        .header {
            position: relative;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;

            background: var(--color-card);
            color: var(--color-text);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--color-border);
        }

        .header a {
            text-decoration: none;
            color: inherit;
            letter-spacing: 0.02em;
        }

        .header a:hover {
            color: var(--color-primary);
        }

        .hamburger {
            display: none;
        }

        .header-title {
            margin: 0;
            font-size: var(--fs-xl);
            font-weight: 700;
        }

        .header-user {
            position: absolute;
            right: 70px;
            padding: 0;
            font-size: 14pt;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        .account-wrapper {
            position: absolute;
            right: 24px;
        }

        .account-menu {
            position: absolute;
            right: 0;
            top: 40px;
            min-height: 41px;
            background: var(--color-card);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            display: none;
            min-width: 120px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .account-menu .menu-item {
            padding: 12px 16px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .account-menu .menu-item:hover {
            background: var(--color-primary);
            color: #fff;
        }

        .header-account_circle {
            width: 28px;
            height: 28px;
            padding: 0;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .header-account_circle:hover {
            opacity: 0.85;
        }
        /* #endregion */

        /* #region ヘッダー下のメニューとメインコンテンツ */
        /* ヘッダーの下に全体レイアウトを配置 */
        .main-wrapper {
            display: flex;
            flex: 1;
            margin-top: 0;
            min-height: calc(100vh - 48px);
        }
        /* #endregion */

        /* #region メインコンテンツ */
        .content {
            background: var(--color-surface);
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 24px 24px 56px 24px;
            overflow-y: auto;
            transition: margin-left 0.3s ease, padding-left 0.3s ease;
        }

        .content:not(.expanded) {
            padding-left: 32px;
        }

        .content.expanded {
            margin-left: -220px;
            padding-left: 32px;
        }

        .content h1 {
            margin-top: 0;
        }

        /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
        .content-box {
            display: flex;
            flex-direction: column;
            flex: 1;
            /* overflow: hidden; */
        }

        /* content-box内のpage-title */
        .content-box .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-primary);
            margin: 0 0 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--color-primary);
            flex-shrink: 0;
        }
            
        /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
        .content-box .pc-only {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .content-box .sp-only {
            flex: 1;
            min-height: 0;
        }

        .content-box .content-section {
            flex: 1;
            min-height: 0;
        }

        .content-area {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .content-box .search-box {
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 24px;
            font-family: inherit;
            font-weight: 500;
            color: var(--color-text);
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
        }

        .search-box .search-box-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 24px;
            width: 100%;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .search-row label {
            margin: 0;
            font-size: var(--fs-xs);
            font-weight: 500;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        .search-row select,
        .search-row input:not([type="checkbox"]) {
            font-size: var(--fs-xs);
            min-width: 160px;
            padding: 3px 12px;
            font-family: inherit;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-card);
            color: var(--color-text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-row option {
            font-size: var(--fs-xs);
        }

        .multi-select {
            position: relative;
            width: 100%;
        }

        .multi-select-toggle {
            width: 100%;
            text-align: left;
            font-size: var(--fs-xs);
            min-width: 160px;
            padding: 3px 12px;
            font-family: inherit;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-card);
            color: var(--color-text);
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .multi-select-toggle:hover {
            border-color: #b0bdb5;
        }

        .multi-select.is-open .multi-select-toggle {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.12);
        }

        .multi-select-menu {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 10;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            max-height: 220px;
            padding: 8px;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .multi-select.is-open .multi-select-menu {
            display: block;
        }

        .multi-select-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 2px;
            cursor: pointer;
            font-size: var(--fs-xs);
            white-space: normal;
            width: 100%;
            box-sizing: border-box;
        }

        .multi-select-option input[type="checkbox"] {
            margin: 0;
        }

        .multi-select-option input[type="checkbox"]:focus,
        .multi-select-option input[type="checkbox"]:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .search-row select:hover,
        .search-row input:not([type="checkbox"]):hover {
            border-color: #b0bdb5;
        }

        .search-row select:focus,
        .search-row input:not([type="checkbox"]):focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.12);
        }

        .search-row input::placeholder {
            color: #9ca89f;
        }

        .search-cancel-wrapper {
            margin-left: auto;
            display: flex;
            align-items: center;
        }

        .btn-search-cancel {
            display: inline-block;
            padding: 6px 14px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            font-weight: 400;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-search-cancel:hover {
            background: var(--color-primary-dark);
            color: #fff;
        }
        /* #endregion */
        /* #region sample_inquiry.css */
        a {
            text-decoration: none;
            color: inherit;
        }

        .wrapper {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1d3557;
            margin: 0;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--color-primary);
        }

        .btn-secondary {
            background: #fff;
            color: var(--color-primary);;
            border: 1px solid var(--color-primary);;
        }

        .btn-secondary:hover {
            background: #eef5ff;
        }

        .btn-success {
            background: #2e8b57;
            color: #fff;
        }

        .btn-success:hover {
            background: #236b43;
        }

        .btn-danger {
            background: #d9534f;
            color: #fff;
        }

        .btn-danger:hover {
            background: #b33e3a;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-bottom: 22px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #1d3557;
            margin: 0 0 16px;
            padding-left: 10px;
            border-left: 5px solid #1d73e8;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(180px, 1fr));
            gap: 14px 16px;
        }

        .search-toggle-sp {
            display: none;
        }

        .inquiry-search-box {
            display: block;
        }

        .inquiry-search-box .search-box-inner {
            display: block;
        }

        .search-grid-actions {
            display: flex;
            grid-column: 1 / -1;
            justify-content: flex-end;
            align-items: end;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #4a5a6a;
        }

        .form-control {
            width: 100%;
            height: 40px;
            padding: 8px 12px;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: #1d73e8;
            box-shadow: 0 0 0 3px rgba(29, 115, 232, 0.12);
        }

        textarea.form-control {
            height: 90px;
            resize: vertical;
            padding-top: 10px;
        }

        .search-actions,
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .search-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 14px;
            line-height: 1;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1300px;
            background: #fff;
        }

        .table thead th {
            background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            /*background: #eaf2fd;*/
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            padding: 12px 10px;
            border-top: 1px solid #d8e3f1;
            border-bottom: 1px solid #d8e3f1;
            border-left: none;
            border-right: none;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 12px 10px;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            border-left: none;
            border-right: none;
            font-size: 13px;
            text-align: center;
            background: #fff;
        }

        .table tbody tr:nth-child(even) td {
            background: #f9fbfe;
        }

        .count-link {
            display: inline-block;
            min-width: 64px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eef5ff;
            color: #1d73e8;
            font-weight: 700;
            border: 1px solid #bfd6fb;
        }

        .count-link:hover {
            background: #dceaff;
        }

        .info-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 22px;
            align-items: start;
        }

        .branch-box {
            background: #f8fbff;
            border: 1px solid #d7e6f8;
            border-radius: 12px;
            padding: 16px;
        }

        .branch-box h3 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #1d3557;
        }

        .branch-list {
            width: 100%;
            border-collapse: collapse;
        }

        .branch-list th,
        .branch-list td {
            border: 1px solid #d9e4ef;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }

        .branch-list th {
            background: #eef5ff;
        }

        .note-box {
            background: #fff7e8;
            border: 1px solid #f3d187;
            border-radius: 12px;
            padding: 16px;
        }

        .note-box h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #8a5a00;
        }

        .note-box ul {
            margin: 0;
            padding-left: 18px;
        }

        .note-box li {
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        .status-chip {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-available {
            background: #e8f8ef;
            color: #227a47;
        }

        .status-rental {
            background: #fff4e5;
            color: #b26b00;
        }

        .barcode-area {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 16px;
        }

        .barcode-box {
            background: #f8fbff;
            border: 1px solid #d7e6f8;
            border-radius: 12px;
            padding: 16px;
        }

        .barcode-box h3 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #1d3557;
        }

        .barcode-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .barcode-preview {
            margin-top: 12px;
            padding: 14px;
            border: 1px dashed #8fb5e8;
            border-radius: 10px;
            background: #fff;
            text-align: center;
        }

        .barcode-preview .code {
            font-family: "Consolas", monospace;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1d3557;
        }

        .rental-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 14px 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .subtext {
            font-size: 12px;
            color: #6c7a89;
            margin-top: 4px;
        }

        .process-flow {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .flow-step {
            background: #f8fbff;
            border: 1px solid #d7e6f8;
            border-radius: 12px;
            padding: 16px;
        }

        .flow-step .step-no {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            background: #1d73e8;
            color: #fff;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .flow-step h3 {
            margin: 0 0 8px;
            color: #1d3557;
            font-size: 16px;
        }

        .flow-step p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: #4f5f6f;
        }

        details {
            border: 1px solid #d7e6f8;
            border-radius: 12px;
            background: #f8fbff;
            padding: 0;
        }

        details summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
            font-weight: 700;
            color: #1d3557;
            position: relative;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        details summary::after {
            content: "＋";
            position: absolute;
            right: 16px;
            top: 12px;
            font-size: 20px;
            color: #1d73e8;
        }

        details[open] summary::after {
            content: "－";
        }

        .details-content {
            padding: 0 16px 16px;
        }

        .footer-space {
            height: 16px;
        }

        @media (max-width: 1200px) {
            .search-grid,
            .rental-grid,
            .barcode-area,
            .process-flow,
            .info-layout {
                grid-template-columns: 1fr;
            }

            .summary-cards,
            .header-only-grid {
                grid-template-columns: 1fr;
            }

            .pickup-footer-grid {
                grid-template-columns: 1fr;
            }

            .pickup-footer-grid .full-width {
                grid-column: 1 / -1;
            }

            .manual-add-grid,
            .manual-add-grid-delete {
                grid-template-columns: 1fr;
            }
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            background: #eaf2fd;
            border-bottom: 1px solid #d7e6f8;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: #1d3557;
        }

        .modal-close-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #fff;
            color: #1d3557;
            font-size: 22px;
            cursor: pointer;
            font-weight: 700;
            line-height: 1;
        }

        .modal-close-btn:hover {
            background: #dceaff;
        }

        .modal-body {
            padding: 20px 22px;
        }

        .modal-footer {
            padding: 0 22px 20px;
            display: flex;
            justify-content: flex-end;
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .modal-info-item {
            background: #f8fbff;
            border: 1px solid #d7e6f8;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }

        .modal-info-item.full {
            grid-column: 1 / -1;
        }

        .modal-info-item .label {
            color: #5b6d7f;
            font-weight: 700;
            font-size: 12px;
        }

        .count-link {
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .modal-info {
                grid-template-columns: 1fr 1fr;
            }

            .modal-info {
                grid-template-columns: 1fr 1fr;
            }

            .move-info-grid,
            .delete-info-grid {
                grid-template-columns: 1fr;
            }

            .move-condition-row {
                grid-template-columns: 1fr;
            }

            .delete-condition-row {
                grid-template-columns: 1fr;
            }

            .delete-condition-row,
            .manual-add-grid-delete.unified-add-grid {
                grid-template-columns: 1fr;
            }

            .process-container {
                max-width: 100%;
            }

            .move-condition-row.unified-condition-row,
            .manual-add-grid-move.unified-add-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .modal-info {
                grid-template-columns: 1fr;
            }
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {

        // サイドバーの読み込み
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      // スマホ: 検索条件の折りたたみ開閉
      (function () {
        var btn = document.getElementById("searchToggleSp");
        var box = document.getElementById("searchBox");
        if (btn && box) {
          btn.addEventListener("click", function () {
            var isOpen = box.classList.toggle("is-open");
            btn.setAttribute("aria-expanded", isOpen);
            var textEl = btn.querySelector(".search-toggle-sp-text");
            if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
          });
        }
      })();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });
    </script>
</body>
</html>
