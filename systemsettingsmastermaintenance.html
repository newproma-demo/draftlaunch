<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ビューポート内に収め、.settings-table 側で縦スクロール */
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    body>.header {
      flex-shrink: 0;
    }

    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
      margin-top: 0;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 56px 32px;
      overflow: hidden;
      transition: margin-left 0.3s ease;
    }

    .content>h1 {
      flex-shrink: 0;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }
    
    h2 {
      font-size: 14pt;
    }

    .content-area {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .settings-swiper {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .settings-panels-row {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 33px;
    }

    /* 画面右下固定アクションボタン群 */
    .fab-actions {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 画面右下固定ボタン（fab-actions 内） */
    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .settings-table {
      flex: 1;
      margin-bottom: 20px;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .settings-table .form-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 0px 12px;
      margin-bottom: 12px;
    }

    .settings-table .form-row>label {
      width: 180px;
      flex-shrink: 0;
      order: 1;
    }

    .settings-table .form-row>.form-row__input-wrap {
      flex: 1;
      min-width: 0;
      order: 2;
    }

    .settings-table .form-row>.badge-required {
      flex-shrink: 0;
      order: 3;
    }

    .settings-table .badge-required {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 3px 5px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
      background: #dc2626;
      border-radius: 6px;
    }

    .settings-table input[type="text"]::placeholder {
      color: #9aa8a1;
      opacity: 1;
    }

    /* label がない行は入力欄の高さに合わせる */
    .settings-table .form-row:not(:has(>label)) {
      align-items: flex-start;
    }

    .settings-table .form-row:not(:has(>label))>.form-row__input-wrap {
      display: inline-flex;
      align-items: flex-start;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が767px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        min-height: 0;
        min-width: 0;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
        overflow: hidden;
      }

      /* 画面右下固定アクションボタン群 */
      .fab-actions {
        position: fixed;
        right: 10px;
        bottom: 10px;
        z-index: 2001;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .settings-table .form-row {
        flex-direction: column;
        align-items: flex-start;
      }

      /* スマホ: 入力の上に 見出しlabel → 必須 */
      .settings-table .form-row>.badge-required {
        order: 2;
      }

      .settings-table .form-row>.form-row__input-wrap {
        order: 3;
        width: 100%;
      }

      .settings-table input[type="text"] {
        max-width: 415px;
      }

    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>

  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定：登録 -->
    <div class="fab-actions" role="toolbar">
      <button type="button" class="btn-fab-new">登録</button>
    </div>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <!-- 画面タイトル -->

      <!-- ========== : ヘッダ部 ========== -->

        <div class="settings-swiper" id="settingsSwiper">

                </div>
              </div>
              <div class="form-row">
                <label>社名（英名）</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="社名（英名）" style="width: 500px; max-width: 80vw;">

              </div>
              <div class="form-row">
                <label>住所</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="本社住所" style="width: 700px; max-width: 80vw;">
                </div>
              </div>
              <div class="form-row">
                <label>電話番号</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="本社電話番号" style="width: 200px;" maxlength="12">
                </div>
              </div>
              <div class="form-row">
                <label>FAX番号</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="本社FAX番号" style="width: 200px;" maxlength="12">
                </div>
              </div>
              <h2 style="margin-block-start:1.5em ;margin-block-end:0.5em;">東京支社住所・連絡先</h2>
              <div class="form-row">
                <label>郵便番号</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="東京支社郵便番号" style="width: 200px;" maxlength="8">
                </div>
              </div>
              <div class="form-row">
                <label>住所</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="東京支社住所" style="width: 700px; max-width: 80vw;">
                </div>
              </div>
              <div class="form-row">
                <label>電話番号</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="東京支社電話番号" style="width: 200px;" maxlength="12">
                </div>

              <div class="form-row">
                <label>FAX番号</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="東京支社FAX番号" style="width: 200px;" maxlength="12">
                </div>
              </div>
              <h2 style="margin-block-start:1.5em ;margin-block-end:0.5em;">大阪支社住所・連絡先</h2>
              <div class="form-row">
                <label>郵便番号</label>
                <div class="form-row__input-wrap">

                </div>
              </div>
              <div class="form-row">
                <label>住所</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="大阪支社住所" style="width: 700px; max-width: 80vw;">
                </div>
              </div>
              <div class="form-row">
                <label>電話番号</label>
                <div class="form-row__input-wrap">

                </div>
              </div>
              <div class="form-row">

                  <input type="text" placeholder="大阪支社FAX番号" style="width: 200px;" maxlength="12">

              <h2 style="margin-block-start:1.5em ;margin-block-end:0.5em;">瀬戸物流センター住所・連絡先</h2>
              <div class="form-row">
                <label>郵便番号</label>

                  <input type="text" placeholder="瀬戸物流センター郵便番号" style="width: 200px;" maxlength="8">

                <label>住所</label>

                  <input type="text" placeholder="瀬戸物流センター住所" style="width: 700px; max-width: 80vw;">
                </div>
              </div>
              <div class="form-row">
                <label>電話番号</label>
                <div class="form-row__input-wrap">
                  <input type="text" placeholder="瀬戸物流センター電話番号" style="width: 200px;" maxlength="12">
                </div>

              <div class="form-row">
                <label>FAX番号</label>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script>
    function loadSharedSidebar() {
      const mount = document.getElementById('sidebarMount');
      if (!mount) return;

      if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
        console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
        return;
      }

      mount.innerHTML = window.SHARED_SIDEBAR_HTML;
      initSidebarCollapseToggle();
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      const content = document.querySelector('.content');
      if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

      const toggleImg = toggle.querySelector('img');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        content.classList.toggle('expanded');

        if (sidebar.classList.contains('closed')) {
          if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
        } else {
          if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
        }
      });

      toggle.dataset.bound = '1';
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.remove('active');
      overlay.classList.remove('show');
    }

    loadSharedSidebar();

    const icon = document.querySelector('.header-account_circle');
    const menu = document.querySelector('.account-menu');

    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // クリックが外側に伝播しないように
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

  </script>
</body>

</html>
