<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/autocomplete.js"></script>
  <style>
    :root {
      /* 「例: 80」＋パディング＋ number スピンボタン分（7rem 未満だと iPad 等で潰れる） */
      --rate-input-w: 7rem;
      /* モーダル・サイドバー背面（zuankensaku / style.css と同系統） */
      --modal-backdrop: rgba(0, 0, 0, 0.6);
      /* zuankensaku .content-box .page-title と同じ 18px */
      --fs-page-title: 18px;
      /* 週報サマリー大数字（html の clamp ベースに合わせてやや抑える） */
      --fs-kpi: clamp(1.125rem, 2.6vw, 1.375rem);
      /* 補助ラベル（バー内数値等） */
      --fs-caption: clamp(10px, 0.35vw + 8px, 12px);
    }

    .overlay.show {
      background: var(--modal-backdrop);
    }

    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    /* サイドバー表示時はトグルボタンに被らないよう左余白を確保 */
    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    .content > h2 {
      margin: 0 0 20px 0;
      font-size: var(--fs-page-title);
      font-weight: 600;
      color: var(--color-text);
      letter-spacing: 0.02em;
    }

    .page-title {
      font-size: inherit;
    }

    .page-title h2 {
      font-size: var(--fs-page-title);
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    /* =========================================================
       担当者単位グラフ（tantou-sample.html 風）
    ========================================================= */
    .tanto-wrap {
      padding: 6px 0;
      color: var(--color-text);
      min-width: 0;
    }

    /* --- 検索条件（hatchujokyokanri.html 風） --- */
    .search-box {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px 14px;
      margin: 0 0 12px 0;
      padding: 12px 14px;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      min-width: 0;
      box-sizing: border-box;
      /* 拡大時のみ @container で補正（100％で十分広いときは既定のまま） */
      container-type: inline-size;
      container-name: searchbar;
    }

    /* スマホ用「検索条件を開く」ボタン（PCでは非表示） */
    .search-toggle-sp {
      display: none;
    }

    /* 横並びは内容幅で詰める（1fr グリッドだと所属課〜担当者の間に空白が空く） */
    .search-box .search-box-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .search-box .search-box-inner > .search-row {
      flex: 0 1 auto;
      width: fit-content;
      max-width: 100%;
      min-width: 0;
    }

    .search-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .search-row-inline {
      display: grid;
      grid-template-columns: max-content max-content;
      align-items: center;
      column-gap: 6px;
      row-gap: 4px;
      min-width: 0;
      width: max-content;
      max-width: 100%;
    }

    .search-row-inline > label {
      padding-top: 0;
    }

    .search-row-inline > .autocomplete,
    .search-row-inline > .rate-filter-cell {
      grid-column: 2 / 3;
    }

    /* 達成率の「入力列」幅だけを計測し、狭いとき（拡大・細い列）だけ折り返す */
    .rate-filter-cell {
      container-type: inline-size;
      container-name: ratefilter;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      overflow: visible;
    }

    .search-row-inline .rate-filter-row {
      justify-content: flex-start;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      flex-wrap: nowrap;
    }

    .search-row-inline .autocomplete {
      /* style.css の固定幅 250px を上書き */
      min-width: 0;
      box-sizing: border-box;
    }

    .search-row-inline:not(.search-row-dept) .autocomplete {
      width: 20rem;
      max-width: min(20rem, 100%);
    }

    /* 所属課は担当者より狭め。「所属課を入力」が切れない幅を確保 */
    .search-row-inline.search-row-dept .autocomplete {
      width: 13rem;
      max-width: min(13rem, 100%);
    }

    /* チップは入力の下に固定。align-items:center でもチップブロックは上寄せ（1行目はラベル↔入力が中央揃え） */
    .search-row-inline .multi-chips {
      grid-column: 2 / 3;
      margin-top: 0;
      align-self: start;
    }

    .search-row label {
      margin: 0;
      font-weight: 700;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .rate-filter-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px 8px;
      min-width: 0;
      overflow: visible;
    }

    .rate-filter-row .rate-input {
      flex: 0 0 var(--rate-input-w);
      min-width: var(--rate-input-w);
      max-width: var(--rate-input-w);
    }

    /* 入力＋％＋トグルが横に収まらない幅のときだけ縦積み（極端に狭いときのみ） */
    @container ratefilter (max-width: 220px) {
      .rate-filter-row {
        flex-wrap: wrap;
      }

      .rate-filter-row .rate-input {
        flex: 0 1 var(--rate-input-w);
        max-width: 100%;
      }
    }

    /* ％＋トグルはまとめて1アイテムにし、狭いときは入力の下へ折り返す */
    .rate-inline-tail {
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .rate-toggle-group {
      display: inline-flex;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      overflow: hidden;
      background: var(--color-card);
    }

    .rate-toggle {
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .search-box .rate-toggle {
      padding: 6px 8px;
    }

    .rate-toggle.is-active {
      background: var(--color-primary);
      color: #fff;
    }

    .rate-input {
      width: var(--rate-input-w);
      min-width: var(--rate-input-w);
      max-width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      font-weight: 800;
      box-sizing: border-box;
    }

    .rate-suffix {
      font-weight: 900;
      color: var(--color-text-muted);
    }

    .multi-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      margin-top: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-weight: 800;
      color: var(--color-text);
      user-select: none;
    }

    /* autocomplete-input と同じフォントサイズ・ウェイト（tanto-wrap から継承） */
    .search-box .multi-chips .chip {
      font-size: inherit;
      font-weight: inherit;
      line-height: 1.35;
    }

    .chip button {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 900;
      color: var(--color-text-muted);
      line-height: 1;
      padding: 0;
    }

    .search-box .multi-chips .chip button {
      font-size: inherit;
      font-weight: 700;
    }

    .search-actions {
      display: flex;
      flex: 0 0 auto;
      margin-left: auto;
      align-self: center;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }

    /* ---------- 検索バーが狭いときだけ（拡大表示など）：間隔調整（rate幅は既定のまま） ---------- */
    @container searchbar (max-width: 1100px) {
      .search-box .search-box-inner {
        gap: 4px 6px;
        align-items: flex-start;
      }

      .search-box .search-box-inner > .search-row {
        flex: 0 1 auto;
        min-width: 0;
      }

      .search-row-inline.search-row-dept .autocomplete {
        width: min(13rem, 100%);
        max-width: 100%;
      }

      .search-row-inline:not(.search-row-dept) .autocomplete {
        width: min(17rem, 100%);
        max-width: 100%;
      }
    }

    /* かなり狭いときだけクリアを次行へ（iPad 横 1024px 付近では同じ行を維持） */
    @container searchbar (max-width: 600px) {
      .search-actions {
        flex: 0 0 100%;
        flex-basis: 100%;
        width: 100%;
        max-width: 100%;
        margin-left: 0;
        order: 99;
        align-self: stretch;
        justify-content: flex-end;
      }
    }

    /* ---------- タブレット（iPad 等 769–1199px）：達成率・％・トグル・一括を 1 行に、必要なら横スクロール ---------- */
    @media (min-width: 769px) and (max-width: 1199px) {
      .search-box .search-box-inner {
        flex-wrap: nowrap;
        align-items: center;
        overflow-x: auto;
        overflow-y: visible;
        gap: 8px;
        padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
      }

      .search-box .search-box-inner > .search-row {
        flex: 0 0 auto;
        flex-shrink: 0;
        width: auto;
        max-width: none;
      }

      .search-actions {
        flex: 0 0 auto;
        flex-shrink: 0;
        margin-left: auto;
        order: 0;
        width: auto;
      }

      .search-row-inline:not(.search-row-dept) .autocomplete {
        width: 14rem;
        max-width: 14rem;
      }

      .search-row-inline.search-row-dept .autocomplete {
        width: 11.5rem;
        max-width: 11.5rem;
      }

      .rate-filter-cell {
        min-width: 16rem;
      }
    }

    .search-button {
      padding: 10px 16px;
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-sm);
      font-weight: 800;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-button:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .search-button.secondary {
      background: var(--color-card);
      color: var(--color-primary);
    }

    .search-button.secondary:hover {
      background: var(--color-surface);
      transform: none;
      box-shadow: var(--shadow-sm);
    }

    /* クリアボタン */
    #resetBtn {
      display: inline-block;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-weight: 400;
      font-family: inherit;
      white-space: nowrap;
      box-shadow: none;
    }

    #resetBtn:hover {
      background: var(--color-primary-dark);
      color: #fff;
      transform: none;
      box-shadow: none;
    }

    /* --- 担当者カード（3列・クリック展開） --- */
    /* --- 課別 年間合計（直近2年）サマリー --- */
    .dept-annual-summary-wrap {
      margin: 0 0 18px 0;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      min-width: 0;
    }

    .dept-annual-summary-title {
      margin: 0 0 14px 0;
      font-size: var(--fs-page-title);
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: 0.02em;
    }

    .dept-annual-summary-empty {
      margin: 0;
      color: var(--color-text-muted);
      font-weight: 600;
    }

    .dept-annual-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .dept-annual-dept-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfdfb;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }

    .dept-annual-dept-card-head {
      margin: 0;
      padding: 10px 12px;
      text-align: center;
      font-size: inherit;
      font-weight: 900;
      color: #183a2b;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #f0faf3 0%, #e8f5ec 100%);
      border-top: 3px double rgba(0, 134, 50, 0.35);
      border-bottom: 2px solid #bfdcc8;
    }

    .dept-annual-dept-card-body {
      padding: 12px 14px 14px;
      font-weight: 800;
      color: var(--color-text);
      border-bottom: 3px double rgba(0, 134, 50, 0.25);
    }

    .dept-annual-year-line {
      margin: 0;
      padding: 10px 0;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px dashed rgba(0, 134, 50, 0.2);
    }

    .dept-annual-year-line:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    @media (max-width: 900px) {
      .dept-annual-cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .dept-annual-cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .tanto-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .tanto-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .tanto-card.is-dragging {
      opacity: 0.6;
      outline: 2px dashed rgba(0, 134, 50, 0.35);
      outline-offset: -2px;
    }

    .tanto-card.is-drop-target {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.14);
    }

    .tanto-card-header {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 14px 14px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      cursor: pointer;
    }

    .tanto-name {
      font-weight: 900;
      line-height: 1.2;
    }

    .tanto-total {
      grid-column: 1 / -1;
      font-weight: 800;
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .tanto-total-year-line {
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
      color: var(--color-text);
    }

    .tanto-total strong {
      color: var(--color-text);
      font-weight: 900;
    }

    .tanto-toggle {
      align-self: start;
      justify-self: end;
      font-size: var(--fs-xl);
      color: var(--color-text-muted);
      transform: rotate(0deg);
      transition: transform 0.18s ease;
    }

    .tanto-card.is-open .tanto-toggle {
      transform: rotate(45deg);
    }

    .tanto-card-body {
      display: none;
      border-top: 1px solid var(--color-border);
      padding: 12px 14px 14px;
    }

    .tanto-card.is-open .tanto-card-body {
      display: block;
    }

    .phase-row {
      display: grid;
      grid-template-columns: 88px 1fr 60px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .phase-label {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      text-align: right;
      padding-right: 4px;
      font-weight: 700;
      white-space: nowrap;
    }

    .bar-track {
      background: rgba(0,0,0,0.06);
      border-radius: 6px;
      height: 22px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width .4s ease;
    }

    .bar-text {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: var(--fs-caption);
      font-weight: 800;
    }

    .rate-val {
      font-weight: 800;
      text-align: right;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .tanto-grid { grid-template-columns: 1fr; }
    }

    .content-section {
      flex: 1;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }

    .dashboard-box {
      display: flex;
      flex-direction: column;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      overflow: hidden;
    }

    .shinko-box {
      max-height: 90vh;
      height: auto;
    }

    .dashboard-box h2 {
      margin: 0;
      padding: 16px 20px;
      font-size: inherit;
      font-weight: 600;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
      background: #fafbfa;
    }

    .search-box h2 {
      margin: 0 0 16px 0;
      font-size: inherit;
      font-weight: 600;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
      width: 100%;
    }


    /* #region レスポンシブ対応 */
    /* 画面の高さが750px以下ならロゴを非表示 */
    @media (max-height: 750px) {
      .sidebar-logo-proma {
        display: none;
      }
    }

    /* 画面の高さが600px以下ならロゴを非表示 */
    @media (max-height: 600px) {
      .sidebar-logo-marushin {
        display: none;
      }
    }

    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

      /* スマホ: 検索条件は折りたたみ式 */
      .search-toggle-sp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-weight: 500;
        color: var(--color-text);
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        cursor: pointer;
        text-align: left;
        box-sizing: border-box;
      }

      .search-toggle-sp-label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      .search-toggle-sp-icon {
        margin-right: 8px;
        flex-shrink: 0;
        vertical-align: middle;
      }

      .search-toggle-sp::after {
        content: "＋";
        color: var(--color-text-muted);
      }

      .search-box {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .search-box .search-box-inner {
        display: none;
        flex-direction: column;
        align-items: stretch;
        padding: 8px 0 0;
        gap: 8px 12px;
      }

      .search-box.is-open .search-box-inner {
        display: flex;
      }

      .search-box .search-box-inner > .search-row {
        width: 100%;
        max-width: 100%;
      }

      .search-box .search-box-inner .search-row-inline {
        width: 100%;
        max-width: 100%;
        grid-template-columns: max-content 1fr;
      }

      .search-box .search-box-inner .search-row-inline:not(.search-row-dept) .autocomplete,
      .search-box .search-box-inner .search-row-inline.search-row-dept .autocomplete {
        width: 100%;
        max-width: 100%;
      }

      .search-box.is-open .search-toggle-sp::after {
        content: "ー";
      }


      .search-row {
        min-width: 0;
      }

      .search-row label {
        flex-shrink: 0;
      }

      .search-row select,
      .search-row input:not(.rate-input),
      .search-row .autocomplete {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }

      .search-row-inline .rate-filter-cell {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .search-row-inline .rate-filter-row {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .search-row-inline .rate-filter-row .rate-input {
        width: var(--rate-input-w);
        min-width: 0;
        max-width: min(var(--rate-input-w), 100%);
        flex: 0 1 auto;
      }

      .search-actions {
        margin-left: 0;
        width: 100%;
        align-self: stretch;
        justify-content: flex-end;
      }

      .search-button {
        width: auto;
        min-width: 80px;
      }

      .content-section {
        display: flex;
        gap: 30px;
        margin-top: 0px;
        width: 100%;
        flex-direction: column;
      }

    }
    /* スマホ表示した時の進行状況 */
    /* ===============================
      SP CARD UI (差分CSS)
    =================================*/

    .sp-card-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* カード */
    .sp-card{
      background:#fff;
      border:1px solid var(--color-border);
      border-radius:12px;
      overflow:hidden;
      box-shadow:var(--shadow-sm);
    }

    /* ステータス帯 */
    .sp-status{
      padding:6px 12px;
      font-weight:600;
      color:#fff;
    }

    .status-warning{ background:#f9a825; }
    .status-delay{ background:#e53935; }
    .status-complete{ background:#008632; }
    .status-onschedule{ background:#1e88e5; }
    .status-default{ background:#9aa5a0; }

    /* メイン行 */
    .sp-card-main{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
    }

    /* 情報 */
    .sp-info{
      flex:1;
      min-width:0;
    }

    .sp-title{
      font-weight:600;
      font-size: var(--fs-sm);
      line-height:1.3;
    }

    .sp-meta{
      color:var(--color-text-muted);
      margin-top:4px;
    }

    /* 展開ボタン */
    .sp-expand{
      font-size: var(--fs-xl);
      color:var(--color-primary);
    }

    /* 詳細（初期非表示） */
    .sp-detail{
      display:none;
      padding:12px 16px 16px;
      border-top:1px solid var(--color-border);
    }

    /* 展開状態 */
    .sp-card.open .sp-detail{
      display:block;
    }

    .sp-card.open .sp-expand{
      transform:rotate(45deg);
    }

    /* 子カードの＋／×は常に非表示（親カードのみ＋→×にする） */
    .child-card .sp-expand-child{
      display:none !important;
    }

    /* 子のいない親カードは＋／×を非表示 */
    .sp-card.order-card:not(:has(.child-card)) .sp-expand{
      display:none !important;
    }

    /* ===============================
      縦タイムライン
    =================================*/

    .sp-timeline{
      position:relative;
      margin-left:8px;
      padding-left:18px;
    }

    .sp-timeline::before{
      content:"";
      position:absolute;
      left:6px;
      top:0;
      bottom:0;
      width:2px;
      background:#d5dfd9;
    }

    .sp-step{
      position:relative;
      margin-bottom:14px;
    }

    .sp-step::before{
      content:"";
      position:absolute;
      left:-18px;
      top:4px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#cfd8d3;
    }

    .sp-step.completed::before{
      background:#1e88e5;
    }

    .sp-step.nearing::before{
      background:#fdd835;
    }

    .sp-step.delay::before{
      background:#e53935;
    }

    .sp-step small{
      display:block;
      font-size: var(--fs-caption);
      color:var(--color-text-muted);
    }
    /* #endregion */
/* スマホ（幅 768px 以下）のときのモーダル・グラフ配置 */
@media (max-width: 768px) {
  .progress-chart-section {

    gap: 8px;
  }

  }

  }

    max-width: 100vw;

  }

  .manifest-modal-body {

    align-items: stretch;
    padding: 16px 14px 20px;
    gap: 12px;
  }

  .manifest-modal-icon {
    align-self: center;

    height: 120px;
  }

  .manifest-modal-meta {
    align-self: center;
    text-align: center;
  }

  .manifest-modal-desc {
    grid-column: auto;

  }

  .manifest-yearbox {
    grid-column: auto;

    overflow-x: auto;

  }

  .timeline-chart-rows {

}

  overflow: visible;
  background: transparent;
  max-height: 58vh;
  display: flex;
  flex-direction: column;
}

.weekly-table-wrap.is-collapsed {
  display: none;
}

#weeklyTable2025 {
  min-width: 920px;
}

#weeklyTable2026 {
  min-width: 1460px;
}

.weekly-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 920px;
  font-size: var(--fs-xs);
  line-height: 1.2;
  /* 行ホバー・列ホバーで同一色 */
  --weekly-hover-bg: #e8eaef;
}

.weekly-table th,
.weekly-table td {
  border-bottom: 1px solid #edf2ee;
  border-right: 1px solid #edf2ee;
  padding: 6px 7px;
  text-align: right;
  white-space: nowrap;
  font-size: var(--fs-xs);
  line-height: 1.2;
}

.weekly-table thead th,
.weekly-table tbody td {
  font-size: 12pt;
}

.weekly-table tbody td:first-child,
.weekly-table thead tr.group-row th:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  z-index: 4;
  background: #fff;
  min-width: 98px;
}

/* 2段目ヘッダー先頭セルは固定しない（2列目余白崩れ対策） */
.weekly-table thead tr.sub-row th:first-child {
  position: static;
  left: auto;
  z-index: auto;
}

.weekly-table thead tr.group-row th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: #eaf6ee;
  color: #1a4f31;
  font-weight: 900;
  text-align: center;
  border-bottom: 1px solid #d5e6db;
}

.weekly-table thead tr.sub-row th {
  position: sticky;
  top: var(--weekly-group-row-h, 32px);
  z-index: 2;
  background: #f7fcf8;
  color: #2b5140;
  font-weight: 800;
  text-align: center;
}

.weekly-table thead th.group-summary,
.weekly-table td.summary-col {
  background: #eef8f1;
}

.weekly-table td.name-cell {
  font-weight: 800;
  color: #1c4030;
}

.weekly-table thead tr.group-row th:first-child {
  top: 0;
  z-index: 5;
}

.weekly-table tbody tr:nth-child(odd) td {
  background: #fcfefd;
}

.weekly-table tbody tr:hover td {
  background: var(--weekly-hover-bg) !important;
}

.weekly-table th.is-col-hover,
.weekly-table td.is-col-hover {
  background: var(--weekly-hover-bg) !important;
}

.weekly-table thead th {
  border-top: 1px solid #d5e6db;
}

.weekly-table td.negative {

}

.weekly-table tr.total-row td {

      function formatNum(n) {
        return Number(n || 0).toLocaleString("ja-JP");
      }

      function formatDateYmd(d) {
        const dt = d instanceof Date ? d : new Date();
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const day = String(dt.getDate()).padStart(2, "0");
        return y + "/" + m + "/" + day;
      }

      const WEEKLY_SAVE_STORAGE_KEY = "weeklyReportSavedYmdByThursday";

      /** 表示中の週（週内の任意の日）。前後週ナビで ±7 日移動 */
      let weeklyReportWeekAnchor = new Date();

      function startOfDayLocal(d) {
        const x = new Date(d);
        x.setHours(0, 0, 0, 0);
        return x;
      }

      /** 月曜始まりの週として、その週の木曜日（ローカル 0:00） */
      function getThursdayOfWeekContaining(d) {
        const day = startOfDayLocal(d);
        const jsDow = day.getDay();
        const daysSinceMonday = (jsDow + 6) % 7;
        const monday = new Date(day);
        monday.setDate(day.getDate() - daysSinceMonday);
        const thu = new Date(monday);
        thu.setDate(monday.getDate() + 3);
        return thu;
      }

      function getWeeklySavedYmdForWeekKey(weekKey) {

          if (!raw) return null;
          const o = JSON.parse(raw);
          const v = o[weekKey];
          return typeof v === "string" && v ? v : null;
        } catch (e) {
          return null;
        }
      }

      function setWeeklySavedYmdForWeekKey(weekKey, ymd) {
        try {
          const raw = localStorage.getItem(WEEKLY_SAVE_STORAGE_KEY);
          const o = raw ? JSON.parse(raw) : {};
          o[weekKey] = ymd;
          localStorage.setItem(WEEKLY_SAVE_STORAGE_KEY, JSON.stringify(o));
        } catch (e) {}
      }

        return d;

        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const day = String(dt.getDate()).padStart(2, "0");
        const h = String(dt.getHours()).padStart(2, "0");
        const min = String(dt.getMinutes()).padStart(2, "0");
        return y + "/" + m + "/" + day + " " + h + ":" + min;
      }

      function fillWeeklyYearTable(table, groups, rows) {
        if (!table) return;

      function bindWeeklyYearTabs() {
        const t2025 = document.getElementById("weeklyTab2025");
        const t2026 = document.getElementById("weeklyTab2026");
        const p2025 = document.getElementById("weeklyPanel2025");
        const p2026 = document.getElementById("weeklyPanel2026");
        if (!t2025 || !t2026 || !p2025 || !p2026 || t2025.dataset.bound === "1") return;

        const tabs = [
          { tab: t2025, panel: p2025 },
          { tab: t2026, panel: p2026 }
        ];

        function activate(idx) {
          tabs.forEach((t, i) => {
            const on = i === idx;
            t.tab.setAttribute("aria-selected", on ? "true" : "false");
            t.tab.tabIndex = on ? 0 : -1;
            if (on) t.panel.removeAttribute("hidden");
            else t.panel.setAttribute("hidden", "");
          });
        }

        t2025.addEventListener("click", () => activate(0));
        t2026.addEventListener("click", () => activate(1));

        t2025.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            activate(1);
            t2026.focus();
          }
        });
        t2026.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            activate(0);
            t2025.focus();
          }
        });

        t2025.dataset.bound = "1";
      }

      function attachWeeklyTableColIndex(table) {
        if (!table) return;
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");
        if (!thead || !tbody) return;

        const groupRow = thead.querySelector("tr.group-row");
        const subRow = thead.querySelector("tr.sub-row");
        if (!subRow) return;

        // 2段目ヘッダー（実データ列）の列インデックス
        const subCells = Array.from(subRow.cells);
        subCells.forEach((cell, idx) => {
          cell.dataset.colIndex = String(idx);
        });

        // 1段目ヘッダー（colspanあり）の開始/終了列を付与
        if (groupRow) {
          const groupCells = Array.from(groupRow.cells);
          let cursor = 0;
          groupCells.forEach((cell, idx) => {
            // 先頭の「担当者」はデータ列に紐づけない
            if (idx === 0) return;
            const span = Number(cell.colSpan) || 1;
            cell.dataset.colStart = String(cursor);
            cell.dataset.colEnd = String(cursor + span - 1);
            cursor += span;
          });
        }

        // 明細行（1列目は担当者名なので除外）
        Array.from(tbody.rows).forEach((row) => {
          Array.from(row.cells).forEach((cell, idx) => {
            if (idx === 0) return;
            cell.dataset.colIndex = String(idx - 1);
          });
        });
      }

      function bindWeeklyTableColumnHover(table) {
        if (!table || table.dataset.colHoverBound === "1") return;

        function clearColHover() {
          table.querySelectorAll(".is-col-hover").forEach((el) => el.classList.remove("is-col-hover"));
        }

        function paintSingleCol(colIdx) {
          if (colIdx == null || colIdx < 0) return;
          clearColHover();

          table.querySelectorAll("thead tr.sub-row th, tbody td").forEach((el) => {
            if (el.dataset.colIndex === String(colIdx)) {
              el.classList.add("is-col-hover");
            }
          });
        }

        function paintRange(start, end) {
          clearColHover();
          const s = Number(start);
          const e = Number(end);
          if (!Number.isFinite(s) || !Number.isFinite(e)) return;
          table.querySelectorAll("thead tr.sub-row th, tbody td").forEach((el) => {
            const idx = Number(el.dataset.colIndex);
            if (Number.isFinite(idx) && idx >= s && idx <= e) {
              el.classList.add("is-col-hover");
            }
          });
        }

        table.addEventListener("mouseover", (e) => {
          const cell = e.target.closest("th, td");
          if (!cell || !table.contains(cell)) return;

          // 1段目ヘッダー（グループ）は範囲ハイライト
          if (cell.closest("tr.group-row")) {
            if (cell.dataset.colStart != null && cell.dataset.colEnd != null) {
              paintRange(cell.dataset.colStart, cell.dataset.colEnd);
            } else {
              clearColHover();
            }
            return;
          }

          // 2段目ヘッダー・明細は単列ハイライト
          if (cell.dataset.colIndex != null) {
            paintSingleCol(Number(cell.dataset.colIndex));
            return;
          }

          clearColHover();
        });

        table.addEventListener("mouseleave", () => {
          clearColHover();
        });

        table.dataset.colHoverBound = "1";
      }

      /**
       * 週報モーダル内容を PDF 出力（html2pdf.js）
       * ・シェルは append 前に十分な領域を確保し、不透過ベールでクローンを隠す（はみ出しフラッシュ防止）
       * ・pagebreak プラグインは inner.px.height、toPdf 分割は canvas.width×ratio のため、キャンバス幅を印刷幅に揃える
       *   （無理に幅だけ膨らませると 2 ページ目がずれる）。横に収まらない内容は scale で縮小する。
       * ・html2canvas の width/height は指定しない（上記の整合のため）
       */
      function exportWeeklyReportToPdf() {
        if (typeof html2pdf === "undefined") {
          window.alert("PDF生成に必要なライブラリを読み込めませんでした。ネットワーク接続を確認してください。");

        const shell = document.createElement("div");

        shell.style.cssText = [
          "position:fixed",
          "left:0",
          "top:0",
          "width:" + shellMinW + "px",
          "height:" + shellMinH + "px",
          "z-index:2147483646",
          "pointer-events:auto",
          "overflow:hidden",
          "background:#f8faf9"
        ].join(";");

        const clone = modal.cloneNode(true);
        clone.querySelector(".weekly-report-close")?.remove();
        clone.querySelector(".weekly-report-footer")?.remove();
        clone.querySelector(".weekly-table-toggle-row")?.remove();

        const origTa = modal.querySelector("#weeklyDeptIssuesInput");
        const cloneTa = clone.querySelector("#weeklyDeptIssuesInput");
        if (origTa && cloneTa) {
          cloneTa.value = origTa.value;
        }

        const betchuScroll = clone.querySelector(".weekly-betchu-scroll");
        if (betchuScroll) {
          betchuScroll.style.maxHeight = "none";
          betchuScroll.style.overflow = "visible";
        }

        const tableWrap = clone.querySelector("#weeklyTableWrap");
        if (tableWrap) {
          tableWrap.style.maxHeight = "none";
          tableWrap.style.overflow = "visible";
        }

        clone.querySelector(".weekly-year-tablist")?.remove();
        clone.querySelectorAll(".weekly-year-panel").forEach((panel) => {
          panel.removeAttribute("hidden");
          panel.style.display = "block";
          panel.style.overflow = "visible";
          panel.style.marginBottom = "24px";
          panel.style.pageBreakBefore = "auto";
          const cap = document.createElement("div");
          cap.className = "weekly-pdf-year-heading";
          cap.textContent = panel.id === "weeklyPanel2025" ? "2025年（詳細表）" : "2026年（詳細表）";
          cap.setAttribute("style", "font-weight:800;font-size:11pt;margin:12px 0 8px;color:#14452d;");
          panel.insertBefore(cap, panel.firstChild);
        });

        const w = Math.max(modal.offsetWidth, 800);
        clone.style.cssText = [
          "box-sizing:border-box",
          "position:absolute",
          "left:0",
          "top:0",
          "width:" + w + "px",
          "max-width:none",
          "max-height:none",
          "height:auto",
          "min-height:200px",
          "overflow:visible",
          "overflow-x:visible",
          "z-index:0",
          "background:#fff",
          "pointer-events:none",
          "box-shadow:none",
          "border-radius:0"
        ].join(";");

        const veil = document.createElement("div");
        veil.className = "weekly-pdf-capture-veil";
        veil.style.cssText = [
          "position:absolute",
          "left:0",
          "top:0",
          "right:0",
          "bottom:0",
          "width:100%",
          "height:100%",
          "z-index:2",
          "background:#f8faf9",
          "pointer-events:auto"
        ].join(";");

        const statusEl = document.createElement("p");
        statusEl.className = "weekly-pdf-capture-status";
        statusEl.textContent = "PDFを作成しています…";
        statusEl.setAttribute("role", "status");
        statusEl.setAttribute("aria-live", "polite");
        statusEl.style.cssText = [
          "position:absolute",
          "left:50%",
          "top:50%",
          "transform:translate(-50%,-50%)",
          "z-index:3",
          "margin:0",
          "pointer-events:none",
          "font-weight:700",
          "font-size:16px",
          "color:#14452d",
          "white-space:nowrap",
          "font-family:inherit"
        ].join(";");

        shell.appendChild(clone);
        shell.appendChild(veil);
        shell.appendChild(statusEl);
        document.body.appendChild(shell);

        const hokokuEl = document.getElementById("weeklyReportHokokuDate");
        const datePart = (hokokuEl && hokokuEl.textContent && hokokuEl.textContent !== "-"
          ? hokokuEl.textContent
          : formatDateYmd(new Date()))
          .replace(/\//g, "-")
          .replace(/\s+/g, "_")
          .replace(/:/g, "-");
        const filename = "週次報告_" + datePart + ".pdf";

        function runPdf() {
          var marginMm = 8;
          var innerWmm = 297 - marginMm * 2;
          function mmToCssPx(mm) {
            return Math.floor((mm * 96) / 25.4);
          }
          var innerWpx = mmToCssPx(innerWmm);

          clone.style.maxHeight = "none";
          var tableWrap = clone.querySelector("#weeklyTableWrap");
          if (tableWrap) {
            tableWrap.style.maxHeight = "none";
            tableWrap.style.width = "max-content";
            tableWrap.style.maxWidth = "none";
          }
          clone.querySelectorAll(".weekly-year-tabs").forEach(function (el) {
            el.style.width = "max-content";
            el.style.maxWidth = "none";
          });
          clone.querySelectorAll(".weekly-year-panel").forEach(function (panel) {
            panel.style.overflow = "visible";
            panel.style.overflowX = "visible";
            panel.style.maxWidth = "none";
            panel.style.width = "max-content";
          });
          clone.querySelectorAll(".weekly-table").forEach(function (tbl) {
            tbl.style.maxWidth = "none";
            tbl.style.width = "max-content";
            tbl.style.minWidth = "min-content";
          });

          clone.style.maxWidth = "none";
          clone.style.minWidth = "";
          clone.style.width = "max-content";
          if (clone.parentNode !== shell) {
            shell.insertBefore(clone, veil);
          }
          void clone.offsetWidth;

          var naturalW = Math.ceil(
            Math.max(clone.scrollWidth, clone.offsetWidth, 400)
          );
          var naturalH = Math.ceil(
            Math.max(clone.scrollHeight, clone.offsetHeight, 400)
          );

          if (naturalW < 4 || naturalH < 4) {
            shell.remove();
            window.alert("PDF用のレイアウト幅を取得できませんでした。");
            return Promise.resolve();
          }

          var scale = naturalW > innerWpx ? innerWpx / naturalW : 1;
          var outH = Math.ceil(naturalH * scale);

          if (clone.parentNode) {
            clone.parentNode.removeChild(clone);
          }

          var pdfRoot = document.createElement("div");
          pdfRoot.className = "weekly-pdf-root";
          pdfRoot.setAttribute("aria-hidden", "true");
          pdfRoot.style.cssText = [
            "box-sizing:border-box",
            "width:" + innerWpx + "px",
            "min-height:" + outH + "px",
            "height:" + outH + "px",
            "overflow:hidden",
            "background:#fff"
          ].join(";");

          var pdfScaler = document.createElement("div");
          pdfScaler.className = "weekly-pdf-scaler";
          pdfScaler.style.cssText = [
            "box-sizing:border-box",
            "position:relative",
            "width:" + naturalW + "px",
            "min-height:" + naturalH + "px",
            "transform:scale(" + scale + ")",
            "transform-origin:0 0",
            "will-change:transform"
          ].join(";");

          clone.style.width = naturalW + "px";
          clone.style.maxWidth = "none";
          clone.style.boxSizing = "border-box";
          clone.style.position = "relative";
          clone.style.left = "0";
          clone.style.top = "0";

          pdfScaler.appendChild(clone);
          pdfRoot.appendChild(pdfScaler);
          shell.insertBefore(pdfRoot, veil);

          shell.style.width = Math.max(window.innerWidth, innerWpx) + "px";
          shell.style.height = Math.max(window.innerHeight, outH + 40) + "px";

          /* 詳細表ブロック直前で改ページ（html2pdf pagebreak.before 用マーカー） */
          if (tableWrap && tableWrap.parentNode) {
            var prevPb = tableWrap.previousElementSibling;
            if (!prevPb || !prevPb.classList.contains("weekly-pdf-break-marker")) {
              var pb = document.createElement("div");
              pb.className = "weekly-pdf-break-marker";
              pb.setAttribute("aria-hidden", "true");
              pb.style.cssText =
                "height:1px;margin:0;padding:0;border:0;overflow:hidden;"
                + "page-break-before:always;break-before:page;";
              tableWrap.parentNode.insertBefore(pb, tableWrap);
            }
          }

          var dpr = typeof window.devicePixelRatio === "number" ? window.devicePixelRatio : 1;
          /* 最低 4 倍・最大 6 倍（DPR が高い端末はそれに追随）。PNG で JPEG 特有の滲みを避ける */
          var pdfCaptureScale = Math.min(6, Math.max(4, dpr));

          const opt = {
            margin: [marginMm, marginMm, marginMm, marginMm],
            filename: filename,
            image: { type: "png" },
            html2canvas: {
              scale: pdfCaptureScale,
              useCORS: true,
              allowTaint: true,
              logging: false,
              scrollX: 0,
              scrollY: 0
            },
            jsPDF: { unit: "mm", format: "a4", orientation: "landscape" },
            pagebreak: {
              mode: ["css", "legacy"],
              before: ".weekly-pdf-break-marker"
            }
          };
          return html2pdf()
            .set(opt)
            .from(pdfRoot)
            .save()
            .then(function () {
              shell.remove();
            })
            .catch(function (err) {
              shell.remove();
              console.error(err);
              window.alert("PDFの生成に失敗しました。");
            });
        }

        /* ベール＋シェルで1フレーム塗ってから計測・キャプチャ（クローンのフラッシュ低減） */
        return new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              runPdf().then(resolve).catch(resolve);
            });
          });
        });
      }

      function barColor(r, base) {
        if (r >= 80) return base;
        if (r >= 50) return base + "aa";
        return base + "66";
      }

      function getPersonTotals(personName) {
        const v = PHASE_VALUES[personName] || {};
        let totalU = 0;
        let totalT = 0;
        for (const def of PHASE_DEFS) {
          const seg = v[def.key];
          if (!seg) continue;
          totalU += Number(seg.u) || 0;
          totalT += Number(seg.t) || 0;
        }
        return { totalU, totalT, r: rate(totalU, totalT) };
      }

      function buildPhaseRows(person, container) {
        const values = PHASE_VALUES[person.name] || {};
        const frag = document.createDocumentFragment();

        for (const def of PHASE_DEFS) {
          const seg = values[def.key] || { u: 0, t: 0 };
          const r = rate(seg.u, seg.t);
          const bc = barColor(r, person.color);
          const lc = r >= 50 ? "#fff" : "var(--color-text-muted)";

          const row = document.createElement("div");
          row.className = "phase-row";
          row.innerHTML =
            '<div class="phase-label">' + def.label + '</div>'
            + '<div class="bar-track">'
            + '<div class="bar-fill" style="width:' + r + '%;background:' + bc + '"></div>'
            + '<span class="bar-text" style="color:' + lc + '">' + r + '%</span>'
            + '</div>'
            + '<div class="rate-val" style="color:' + person.textColor + '">' + ((Number(seg.t) || 0) - (Number(seg.u) || 0)) + '/' + (Number(seg.t) || 0) + '</div>';
          frag.appendChild(row);
        }

        container.innerHTML = "";
        container.appendChild(frag);
      }

      function renderChips(containerId, values, onRemove) {
        const box = document.getElementById(containerId);
        if (!box) return;
        box.innerHTML = "";
        values.forEach(v => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = `<span>${v}</span><button type="button" aria-label="${v} を削除">×</button>`;
          chip.querySelector("button").addEventListener("click", () => onRemove(v));
          box.appendChild(chip);
        });
      }

      function addToSet(set, value) {
        const v = String(value || "").trim();
        if (!v) return false;
        if (set.has(v)) return false;
        set.add(v);
        return true;
      }

      function removeFromSet(set, value) {
        set.delete(value);
      }

      function syncChipUIs() {
        renderChips("deptChips", selectedDepts, (v) => {
          removeFromSet(selectedDepts, v);
          syncChipUIs();
          renderCards();
        });
        renderChips("personChips", selectedPeople, (v) => {
          removeFromSet(selectedPeople, v);
          syncChipUIs();
          renderCards();
        });
      }

      function tryAddFromInput(inputId, set) {
        const input = document.getElementById(inputId);
        if (!input) return;
        if (addToSet(set, input.value)) {
          input.value = "";
          syncChipUIs();
          renderCards();
        }
      }

      function matchesFilters(person) {
        if (selectedDepts.size > 0 && !selectedDepts.has(person.dept)) return false;
        if (selectedPeople.size > 0 && !selectedPeople.has(person.name)) return false;
        if (rateThreshold != null && Number.isFinite(rateThreshold)) {
          const totals = getPersonTotals(person.name);
          const r = Number(totals.r) || 0;
          if (rateMode === "gte" && r < rateThreshold) return false;
          if (rateMode === "lte" && r > rateThreshold) return false;
        }
        return true;
      }

      function getOrderedDeptsFromPeople() {
        const seen = new Set();
        const out = [];
        for (const p of PEOPLE) {
          const d = p.dept;
          if (d && !seen.has(d)) {
            seen.add(d);
            out.push(d);
          }
        }
        return out;
      }

      function getDeptYearSubmissionStat(dept, year) {
        const byDept = DEPT_ANNUAL_SUBMISSION_STATS[dept];
        if (!byDept) return { total: 0, unsubmitted: 0 };
        const row = byDept[year];
        if (!row) return { total: 0, unsubmitted: 0 };
        const total = Number(row.total) || 0;
        const unsubmitted = Math.min(Math.max(0, Number(row.unsubmitted) || 0), total);
        return { total, unsubmitted };
      }

      function getPersonYearSubmissionStat(personName, year) {
        const byPerson = PERSON_ANNUAL_SUBMISSION_STATS[personName];
        if (!byPerson) return { total: 0, unsubmitted: 0 };
        const row = byPerson[year];
        if (!row) return { total: 0, unsubmitted: 0 };
        const total = Number(row.total) || 0;
        const unsubmitted = Math.min(Math.max(0, Number(row.unsubmitted) || 0), total);
        return { total, unsubmitted };
      }

      /** 課別・担当者カード共通：「2025 年計 …件／ 入稿済 …件 ／未入稿 …件」1行分 */
      function buildYearSubmissionLineText(y, st) {
        const total = Number(st.total) || 0;
        const u = Math.min(Math.max(0, Number(st.unsubmitted) || 0), total);
        const submitted = Math.max(0, total - u);
        return (
          y
          + " 年計 "
          + formatNum(total)
          + "件／ 入稿済 "
          + formatNum(submitted)
          + "件 ／未入稿 "
          + formatNum(u)
          + "件"
        );
      }

      /** 担当者カード見出し：前年・今年の2行（課別年間サマリーと同じ「直近2年」・同じ文言） */
      function buildPersonYearSummaryHtml(personName) {
        const nowY = new Date().getFullYear();
        const years = [nowY - 1, nowY];
        return years
          .map((y) => {
            const st = getPersonYearSubmissionStat(personName, y);
            const line = buildYearSubmissionLineText(y, st);
            return '<div class="tanto-total-year-line">' + weeklyEscapeHtml(line) + "</div>";
          })
          .join("");
      }

      /** カード見出し用（例: 第1課 → 1課） */
      function formatDeptCardTitle(dept) {
        const m = String(dept).match(/^第(\d+)課$/);
        return m ? m[1] + "課" : String(dept);
      }

      function renderDeptAnnualSummary() {
        const wrap = document.getElementById("deptAnnualSummaryWrap");
        if (!wrap) return;

        const nowY = new Date().getFullYear();
        const years = [nowY - 1, nowY];
        const depts = getOrderedDeptsFromPeople().filter((d) => selectedDepts.size === 0 || selectedDepts.has(d));

        const titleText = "課別 年間合計";

        if (depts.length === 0) {
          wrap.innerHTML =
            '<h3 class="dept-annual-summary-title">' + titleText + '</h3>'
            + '<p class="dept-annual-summary-empty">表示する課がありません</p>';
          return;
        }

        const cardsHtml = depts
          .map((dept) => {
            const titleShort = weeklyEscapeHtml(formatDeptCardTitle(dept));
            const ariaDept = weeklyEscapeHtml(dept);
            const yearLines = years
              .map((y) => {
                const st = getDeptYearSubmissionStat(dept, y);
                const line = buildYearSubmissionLineText(y, st);
                return '<p class="dept-annual-year-line">' + weeklyEscapeHtml(line) + "</p>";
              })
              .join("");
            return (
              '<article class="dept-annual-dept-card" aria-label="' + ariaDept + "の年間集計" + '">'
              + '<div class="dept-annual-dept-card-head">' + titleShort + "</div>"
              + '<div class="dept-annual-dept-card-body">' + yearLines + "</div>"
              + "</article>"
            );
          })
          .join("");

        wrap.innerHTML =
          '<h3 class="dept-annual-summary-title">' + titleText + '</h3>'
          + '<div class="dept-annual-cards-grid">' + cardsHtml + "</div>";
      }

      function renderCards() {
        const grid = document.getElementById("tantoGrid");
        if (!grid) return;
        grid.innerHTML = "";

        const visible = PEOPLE
          .filter(matchesFilters)
          .slice()
          .sort((a, b) => personOrder.indexOf(a.name) - personOrder.indexOf(b.name));

        for (const p of visible) {
          const card = document.createElement("article");
          card.className = "tanto-card";
          card.setAttribute("draggable", "true");
          card.dataset.person = p.name;

          const header = document.createElement("button");
          header.type = "button";
          header.className = "tanto-card-header";
          header.setAttribute("aria-expanded", "false");

          header.innerHTML =
            '<div class="tanto-name" style="color:' + p.color + '">' + p.name + '</div>'
            + '<div class="tanto-toggle">＋</div>'
            + '<div class="tanto-total">'
            + buildPersonYearSummaryHtml(p.name)
            + "</div>";

          const body = document.createElement("div");
          body.className = "tanto-card-body";

          header.addEventListener("click", () => {
            const isOpen = card.classList.toggle("is-open");
            header.setAttribute("aria-expanded", isOpen ? "true" : "false");
            if (isOpen) buildPhaseRows(p, body);
          });

          card.appendChild(header);
          card.appendChild(body);
          grid.appendChild(card);
        }

        bindDnD(grid);
        renderDeptAnnualSummary();
      }

      const personOrder = PEOPLE.map(p => p.name);
      let dragName = null;

      function bindDnD(grid) {
        if (!grid || grid.dataset.dndBound === "1") return;

        grid.addEventListener("dragstart", (e) => {
          const card = e.target.closest(".tanto-card");
          if (!card) return;
          dragName = card.dataset.person || null;
          card.classList.add("is-dragging");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", dragName || ""); } catch (_) {}
        });

        grid.addEventListener("dragend", (e) => {
          const card = e.target.closest(".tanto-card");
          if (card) card.classList.remove("is-dragging");
          grid.querySelectorAll(".tanto-card.is-drop-target").forEach(el => el.classList.remove("is-drop-target"));
          dragName = null;
        });

        grid.addEventListener("dragover", (e) => {
          const over = e.target.closest(".tanto-card");
          if (!over) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          grid.querySelectorAll(".tanto-card.is-drop-target").forEach(el => el.classList.remove("is-drop-target"));
          over.classList.add("is-drop-target");
        });

        grid.addEventListener("dragleave", (e) => {
          const over = e.target.closest(".tanto-card");
          if (!over) return;
          over.classList.remove("is-drop-target");
        });

        grid.addEventListener("drop", (e) => {
          const over = e.target.closest(".tanto-card");
          if (!over) return;
          e.preventDefault();

          const from = dragName;
          const to = over.dataset.person || null;
          if (!from || !to || from === to) return;

          const fromIdx = personOrder.indexOf(from);
          const toIdx = personOrder.indexOf(to);
          if (fromIdx < 0 || toIdx < 0) return;

          personOrder.splice(fromIdx, 1);
          personOrder.splice(toIdx, 0, from);
          renderCards();
        });

        grid.dataset.dndBound = "1";
      }

      function bindSearch() {
        const deptInput = document.getElementById("deptInput");
        const personInput = document.getElementById("personInput");
        const rateValue = document.getElementById("rateValue");
        const rateGte = document.getElementById("rateGte");
        const rateLte = document.getElementById("rateLte");
        const resetBtn = document.getElementById("resetBtn");
        const deptDrop = deptInput ? deptInput.parentElement.querySelector(".autocomplete-dropdown") : null;
        const personDrop = personInput ? personInput.parentElement.querySelector(".autocomplete-dropdown") : null;

        function syncRateFromUi() {
          const raw = rateValue && rateValue.value !== "" ? Number(rateValue.value) : NaN;
          if (Number.isFinite(raw)) {
            rateThreshold = Math.max(0, Math.min(100, raw));
          } else {
            rateThreshold = null;
          }
        }

        function setRateMode(next) {
          rateMode = next;
          if (rateGte && rateLte) {
            rateGte.classList.toggle("is-active", rateMode === "gte");
            rateLte.classList.toggle("is-active", rateMode === "lte");
            rateGte.setAttribute("aria-pressed", rateMode === "gte" ? "true" : "false");
            rateLte.setAttribute("aria-pressed", rateMode === "lte" ? "true" : "false");
          }
        }

        if (rateGte) rateGte.addEventListener("click", () => { setRateMode("gte"); renderCards(); });
        if (rateLte) rateLte.addEventListener("click", () => { setRateMode("lte"); renderCards(); });
        if (rateValue) rateValue.addEventListener("input", () => { syncRateFromUi(); renderCards(); });
        if (rateValue) rateValue.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            syncRateFromUi();
            renderCards();
          }
        });

        // Enter で追加
        if (deptInput) {
          deptInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              tryAddFromInput("deptInput", selectedDepts);
            }
          });
        }
        if (personInput) {
          personInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              tryAddFromInput("personInput", selectedPeople);
            }
          });
        }

        // autocomplete 選択時（dropdownクリック後）に追加
        if (deptDrop) {
          deptDrop.addEventListener("click", () => {
            setTimeout(() => tryAddFromInput("deptInput", selectedDepts), 0);
          });
        }
        if (personDrop) {
          personDrop.addEventListener("click", () => {
            setTimeout(() => tryAddFromInput("personInput", selectedPeople), 0);
          });
        }

        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            if (deptInput) deptInput.value = "";
            if (personInput) personInput.value = "";
            selectedDepts.clear();
            selectedPeople.clear();
            if (rateValue) rateValue.value = "";
            rateThreshold = null;
            setRateMode("gte");
            syncChipUIs();
            renderCards();
          });
        }

        setRateMode("gte");
        syncRateFromUi();
        syncChipUIs();
      }

      function loadSharedSidebar() {
        const mount = document.getElementById("sidebarMount");
        if (!mount) return;
        if (typeof window.SHARED_SIDEBAR_HTML !== "string" || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error("Sidebar include error: SHARED_SIDEBAR_HTML is not available.");
          return;
        }
        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === "1") return;
        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');
          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = "images/chevron_right_20dp_FFFFF.svg";
          } else {
            if (toggleImg) toggleImg.src = "images/chevron_left_20dp_FFFFF.svg";
          }
        });
        toggle.dataset.bound = "1";
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;
        sidebar.classList.toggle('active');
        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;
        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      // スマホ: 検索条件の折りたたみ開閉
      (function() {
        var btn = document.getElementById('searchToggleSp');
        var box = document.getElementById('searchBox');
        if (btn && box) {
          btn.addEventListener('click', function() {
            var isOpen = box.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', isOpen);
            var textEl = btn.querySelector('.search-toggle-sp-text');
            if (textEl) textEl.textContent = isOpen ? '検索条件を閉じる' : '検索条件を開く';
          });
        }
      })();

      loadSharedSidebar();
      bindSearch();
      renderCards();
      bindWeeklyReportModal();
      bindWeeklyYearTabs();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

    </script>
</body>
