<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css?v=20260318">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/autocomplete.js"></script>
  <style>
    :root {
      --font-size-base: 16pt;
      --fs-base: 16pt;
      --fs-sm: 14pt;
      --fs-xs: 12pt;
      --fs-lg: 18pt;
      --fs-xl: 20pt;
      --fs-content:14pt;
      --color-primary: #008632;
      --color-primary-dark: #006C29;
      --color-primary-light: #00a840;
      --color-surface: #f8faf9;
      --color-tanto-hover: #47bdc5;
      --color-card: #ffffff;
      --color-border: #e2e8e6;
      --color-text: #1a2e26;
      --color-text-muted: #5c6f66;
      --shadow-sm: 0 1px 3px rgba(0, 134, 50, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 134, 50, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 134, 50, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "Outfit", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      margin: 0;
      font-size: var(--font-size-base);
      font-family: var(--font-sans);
      background: var(--color-surface);
      color: var(--color-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      font-size: var(--fs-content);
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    /* サイドバー表示時はトグルボタンに被らないよう左余白を確保 */
    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    .content > h2 {
      margin: 0 0 20px 0;
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--color-text);
      letter-spacing: 0.02em;
    }

    .page-title {
        font-size: 16px;
      }
    .page-title h2 {
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    /* =========================================================
       担当者単位グラフ（tantou-sample.html 風）
    ========================================================= */
    .tanto-wrap {
      padding: 6px 0;
      font-size: 13px;
      color: var(--color-text);
    }

    /* --- 検索条件（hatchujokyokanri.html 風） --- */
    .search-box {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px 24px;
      margin: 0 0 16px 0;
      padding: 16px 18px;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }

    .search-box .search-box-inner {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 18px;
      align-items: start;
      width: 100%;
    }

    .search-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 220px;
    }

    .search-row-inline {
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: start;
      column-gap: 12px;
      row-gap: 8px;
      min-width: 0;
    }

    .search-row-inline > label {
      padding-top: 0;
      align-self: start;
    }

    .search-row-inline > .autocomplete,
    .search-row-inline > .rate-filter-row {
      grid-column: 2 / 3;
    }

    .search-row-inline .rate-filter-row {
      justify-content: flex-start;
    }

    .search-row-inline .autocomplete {
      min-width: 0;
    }

    /* チップは入力の下に固定 */
    .search-row-inline .multi-chips {
      grid-column: 2 / 3;
      margin-top: 8px;
    }

    .search-row label {
      margin: 0;
      font-size: var(--fs-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .rate-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rate-toggle-group {
      display: inline-flex;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      overflow: hidden;
      background: var(--color-card);
    }

    .rate-toggle {
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      font-size: var(--fs-xs);
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .rate-toggle.is-active {
      background: var(--color-primary);
      color: #fff;
    }

    .rate-input {
      width: 110px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      font-weight: 800;
    }

    .rate-suffix {
      font-size: var(--fs-xs);
      font-weight: 900;
      color: var(--color-text-muted);
    }

    .multi-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-size: var(--fs-xs);
      font-weight: 800;
      color: var(--color-text);
      user-select: none;
    }

    .chip button {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 900;
      color: var(--color-text-muted);
      line-height: 1;
      padding: 0;
    }

    .search-actions {
      grid-column: 1 / -1;
      justify-content: flex-end;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-button {
      padding: 10px 16px;
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: #fff;
      border-radius: var(--radius-sm);
      font-weight: 800;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-button:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .search-button.secondary {
      background: var(--color-card);
      color: var(--color-primary);
    }

    .search-button.secondary:hover {
      background: var(--color-surface);
      transform: none;
      box-shadow: var(--shadow-sm);
    }

    /* --- 担当者カード（3列・クリック展開） --- */
    .tanto-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .tanto-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .tanto-card.is-dragging {
      opacity: 0.6;
      outline: 2px dashed rgba(0, 134, 50, 0.35);
      outline-offset: -2px;
    }

    .tanto-card.is-drop-target {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.14);
    }

    .tanto-card-header {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 14px 14px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      cursor: pointer;
    }

    .tanto-name {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.2;
    }

    .tanto-total {
      grid-column: 1 / -1;
      font-size: 12px;
      font-weight: 800;
      color: var(--color-text-muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: baseline;
    }

    .tanto-total strong {
      color: var(--color-text);
      font-weight: 900;
    }

    .tanto-toggle {
      align-self: start;
      justify-self: end;
      font-size: 18px;
      color: var(--color-text-muted);
      transform: rotate(0deg);
      transition: transform 0.18s ease;
    }

    .tanto-card.is-open .tanto-toggle {
      transform: rotate(45deg);
    }

    .tanto-card-body {
      display: none;
      border-top: 1px solid var(--color-border);
      padding: 12px 14px 14px;
    }

    .tanto-card.is-open .tanto-card-body {
      display: block;
    }

    .phase-row {
      display: grid;
      grid-template-columns: 88px 1fr 60px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .phase-label {
      font-size: 11px;
      color: var(--color-text-muted);
      text-align: right;
      padding-right: 4px;
      font-weight: 700;
      white-space: nowrap;
    }

    .bar-track {
      background: rgba(0,0,0,0.06);
      border-radius: 6px;
      height: 22px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width .4s ease;
    }

    .bar-text {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 800;
    }

    .rate-val {
      font-size: 12px;
      font-weight: 800;
      text-align: right;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .tanto-grid { grid-template-columns: 1fr; }
    }

    .content-section {
      flex: 1;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }

    .dashboard-box {
      display: flex;
      flex-direction: column;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      overflow: hidden;
    }

    .shinko-box {
      max-height: 90vh;
      height: auto;
    }

    .dashboard-box h2 {
      margin: 0;
      padding: 16px 20px;
      font-size: var(--fs-base);
      font-weight: 600;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
      background: #fafbfa;
    }

    .search-box h2 {
      margin: 0 0 16px 0;
      font-size: var(--fs-base);
      font-weight: 600;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
      width: 100%;
    }


    /* #region レスポンシブ対応 */
    /* 画面の高さが750px以下ならロゴを非表示 */
    @media (max-height: 750px) {
      .sidebar-logo-proma {
        display: none;
      }
    }

    /* 画面の高さが600px以下ならロゴを非表示 */
    @media (max-height: 600px) {
      .sidebar-logo-marushin {
        display: none;
      }
    }

    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

      .page-title {
        font-size: 16px;
      }

      .search-box {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .search-box .search-box-inner {
        display: grid;
        grid-template-columns: 1fr;
        padding: 12px 0 0;
        gap: 12px 16px;
      }


      .search-row {
        min-width: 0;
      }

      .search-row-inline {
        grid-template-columns: 96px 1fr;
      }

      .search-row label {
        font-size: var(--fs-xs);
        flex-shrink: 0;
      }

      .search-row select,
      .search-row input,
      .search-row .autocomplete,
      .search-row-inline .rate-filter-row {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }

      .search-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }

      .search-button {
        width: auto;
        min-width: 80px;
      }

      .content-section {
        display: flex;
        gap: 30px;
        margin-top: 0px;
        width: 100%;
        flex-direction: column;
      }

    }
    /* スマホ表示した時の進行状況 */
    /* ===============================
      SP CARD UI (差分CSS)
    =================================*/

    .sp-card-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* カード */
    .sp-card{
      background:#fff;
      border:1px solid var(--color-border);
      border-radius:12px;
      overflow:hidden;
      box-shadow:var(--shadow-sm);
    }

    /* ステータス帯 */
    .sp-status{
      padding:6px 12px;
      font-size:12px;
      font-weight:600;
      color:#fff;
    }

    .status-warning{ background:#f9a825; }
    .status-delay{ background:#e53935; }
    .status-complete{ background:#008632; }
    .status-onschedule{ background:#1e88e5; }
    .status-default{ background:#9aa5a0; }

    /* メイン行 */
    .sp-card-main{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
    }

    /* 情報 */
    .sp-info{
      flex:1;
      min-width:0;
    }

    .sp-title{
      font-weight:600;
      font-size:14px;
      line-height:1.3;
    }

    .sp-meta{
      font-size:12px;
      color:var(--color-text-muted);
      margin-top:4px;
    }

    /* 展開ボタン */
    .sp-expand{
      font-size:20px;
      color:var(--color-primary);
    }

    /* 詳細（初期非表示） */
    .sp-detail{
      display:none;
      padding:12px 16px 16px;
      border-top:1px solid var(--color-border);
    }

    /* 展開状態 */
    .sp-card.open .sp-detail{
      display:block;
    }

    .sp-card.open .sp-expand{
      transform:rotate(45deg);
    }

    /* 子カードの＋／×は常に非表示（親カードのみ＋→×にする） */
    .child-card .sp-expand-child{
      display:none !important;
    }

    /* 子のいない親カードは＋／×を非表示 */
    .sp-card.order-card:not(:has(.child-card)) .sp-expand{
      display:none !important;
    }

    /* ===============================
      縦タイムライン
    =================================*/

    .sp-timeline{
      position:relative;
      margin-left:8px;
      padding-left:18px;
    }

    .sp-timeline::before{
      content:"";
      position:absolute;
      left:6px;
      top:0;
      bottom:0;
      width:2px;
      background:#d5dfd9;
    }

    .sp-step{
      position:relative;
      margin-bottom:14px;
      font-size:13px;
    }

    .sp-step::before{
      content:"";
      position:absolute;
      left:-18px;
      top:4px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#cfd8d3;
    }

    .sp-step.completed::before{
      background:#1e88e5;
    }

    .sp-step.nearing::before{
      background:#fdd835;
    }

    .sp-step.delay::before{
      background:#e53935;
    }

    .sp-step small{
      display:block;
      font-size:11px;
      color:var(--color-text-muted);
    }
    /* #endregion */
/* スマホ（幅 768px 以下）のときのモーダル・グラフ配置 */
@media (max-width: 768px) {
  .progress-chart-section {
    display: block;
    flex: none;
    min-height: auto;
  }

  .progress-chart-area {
    flex: none;
    min-height: auto;
    height: auto;
    padding: 14px 12px 16px;
    gap: 10px;
    overflow: visible;
  }

  .progress-chart-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .progress-chart-sub {
    width: 100%;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 6px;
  }

  .overall-badge {
    font-size: 12px;
    padding: 6px 12px;
  }

  .overall-badge span {
    font-size: 16px;
  }

  .manifest-modal {
    width: 100vw;
    max-width: 100vw;
    max-height: 100dvh;
    border-radius: 0;
  }

  .manifest-modal-body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 16px 14px 20px;
    gap: 12px;
  }

  .manifest-modal-icon {
    align-self: center;
    width: 120px;
    height: 120px;
  }

  .manifest-modal-meta {
    align-self: center;
    text-align: center;
  }

  .manifest-modal-desc {
    grid-column: auto;
    width: 100%;
    font-size: 13px;
  }

  .manifest-yearbox {
    grid-column: auto;
    margin-top: 8px;
    overflow-x: auto;
    display: none; /* スマホ時は年別バー非表示 */
  }

  .timeline-chart-rows {
    grid-template-columns: 1fr; /* 円グラフは1列で縦並び */
    grid-auto-rows: auto;
    align-content: start;
    gap: 12px;
    flex: none;
    min-height: auto;
  }

  .pie-card {
    max-width: 100%;
    height: auto;
    min-height: 300px;
    padding: 12px 12px 16px;
  }

  .pie-card-body {
    padding-top: 4px;
    min-height: 210px;
    align-items: center;
  }

  .pie-chart-wrap {
    max-width: 170px;
  }

  .pie-metric-percent {
    font-size: 18px;
  }

  .pie-metric-caption {
    font-size: 11px;
  }
}    
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー  -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <div class="page-title"><h2>担当者別入稿状況</h2></div>

      <section class="tanto-wrap" aria-label="担当者別のフェーズ別達成率">
        <div class="search-box" id="searchBox" aria-label="検索条件">
          <div class="search-box-inner">
            <div class="search-row search-row-inline">
              <label for="deptInput">所属課</label>
              <div class="autocomplete">
                <input type="text" id="deptInput" class="autocomplete-input" data-list="department" placeholder="所属課を入力">
                <div class="autocomplete-dropdown"></div>
              </div>
              <div class="multi-chips" id="deptChips" aria-label="選択中の所属課"></div>
            </div>

            <div class="search-row search-row-inline">
              <label for="personInput">担当者</label>
              <div class="autocomplete">
                <input type="text" id="personInput" class="autocomplete-input" data-list="tanto" placeholder="担当者名を入力">
                <div class="autocomplete-dropdown"></div>
              </div>
              <div class="multi-chips" id="personChips" aria-label="選択中の担当者"></div>
            </div>

            <div class="search-row search-row-inline">
              <label for="rateValue">達成率（合計）</label>
              <div class="rate-filter-row">
                <input type="number" id="rateValue" class="rate-input" min="0" max="100" step="0.1" placeholder="例: 80">
                <span class="rate-suffix">%</span>
                <div class="rate-toggle-group" role="group" aria-label="達成率の条件">
                  <button type="button" class="rate-toggle is-active" id="rateGte" aria-pressed="true">以上</button>
                  <button type="button" class="rate-toggle" id="rateLte" aria-pressed="false">以下</button>
                </div>
              </div>
            </div>

            <div class="search-actions">
              <button type="button" class="search-button secondary" id="resetBtn">一括クリア</button>
            </div>
          </div>
        </div>

        <div class="tanto-grid" id="tantoGrid" aria-label="担当者カード一覧"></div>
      </section>

    </div>

    <script src="js/sidebar.js"></script>
    <script>
      // ============================
      // 担当者カード（クリック展開でグラフ表示）
      // ※ いまは表示確認用のサンプル値
      // ============================
      const PEOPLE = [
        { name: "佐々木", dept: "第1課", color: "#534AB7", textColor: "#3C3489" },
        { name: "水野", dept: "第1課", color: "#0F6E56", textColor: "#085041" },
        { name: "鈴木", dept: "第2課", color: "#993C1D", textColor: "#712B13" },
        { name: "田中", dept: "第2課", color: "#0A97D1", textColor: "#08719B" },
        { name: "山本", dept: "第3課", color: "#8BC63E", textColor: "#5E8B28" }
      ];

      const PHASE_DEFS = [
        { key: "2026Q1", label: "2026Q1" },
        { key: "2026Q2", label: "2026Q2" },
        { key: "2026Q3", label: "2026Q3" },
        { key: "2026Q4", label: "2026Q4" },
        { key: "2026.4", label: "2026.4月" },
        { key: "2026.7a", label: "2026.7月①" },
        { key: "2026.7b", label: "2026.7月②" },
        { key: "maker", label: "メーカー変更" },
        { key: "betchu", label: "別注" }
      ];

      // 担当者ごとのフェーズ値（u: 未入稿 / t: 全件）
      const PHASE_VALUES = {
        "佐々木": { "2026Q1": { u: 33, t: 380 }, "2026Q2": { u: 12, t: 210 }, "2026Q3": { u: 8, t: 180 }, "2026Q4": { u: 6, t: 160 }, "2026.4": { u: 10, t: 60 }, "2026.7a": { u: 6, t: 40 }, "2026.7b": { u: 4, t: 35 }, "maker": { u: 1, t: 10 }, "betchu": { u: 12, t: 30 } },
        "水野":   { "2026Q1": { u: 24, t: 136 }, "2026Q2": { u: 14, t: 120 }, "2026Q3": { u: 9, t: 110 }, "2026Q4": { u: 6, t: 90 },  "2026.4": { u: 7,  t: 45 }, "2026.7a": { u: 4, t: 35 }, "2026.7b": { u: 3, t: 28 }, "maker": { u: 0, t: 6 },  "betchu": { u: 8, t: 22 } },
        "鈴木":   { "2026Q1": { u: 7,  t: 129 }, "2026Q2": { u: 5,  t: 120 }, "2026Q3": { u: 4, t: 118 }, "2026Q4": { u: 2, t: 110 }, "2026.4": { u: 3, t: 40 }, "2026.7a": { u: 2, t: 32 }, "2026.7b": { u: 1, t: 30 }, "maker": { u: 1, t: 5 },  "betchu": { u: 3, t: 18 } },
        "田中":   { "2026Q1": { u: 3,  t: 94 },  "2026Q2": { u: 2,  t: 90 },  "2026Q3": { u: 1, t: 86 },  "2026Q4": { u: 0, t: 80 },  "2026.4": { u: 1, t: 30 }, "2026.7a": { u: 1, t: 26 }, "2026.7b": { u: 0, t: 24 }, "maker": { u: 0, t: 3 },  "betchu": { u: 1, t: 12 } },
        "山本":   { "2026Q1": { u: 0,  t: 115 }, "2026Q2": { u: 0,  t: 110 }, "2026Q3": { u: 0, t: 100 }, "2026Q4": { u: 0, t: 90 },  "2026.4": { u: 0, t: 35 }, "2026.7a": { u: 0, t: 30 }, "2026.7b": { u: 0, t: 28 }, "maker": { u: 0, t: 4 },  "betchu": { u: 0, t: 14 } }
      };

      function rate(u, t) {
        const tt = Number(t) || 0;
        const uu = Number(u) || 0;
        if (tt <= 0) return 0;
        return Math.round(((tt - uu) / tt) * 100);
      }

      function barColor(r, base) {
        if (r >= 80) return base;
        if (r >= 50) return base + "aa";
        return base + "66";
      }

      function getPersonTotals(personName) {
        const v = PHASE_VALUES[personName] || {};
        let totalU = 0;
        let totalT = 0;
        for (const def of PHASE_DEFS) {
          const seg = v[def.key];
          if (!seg) continue;
          totalU += Number(seg.u) || 0;
          totalT += Number(seg.t) || 0;
        }
        return { totalU, totalT, r: rate(totalU, totalT) };
      }

      function buildPhaseRows(person, container) {
        const values = PHASE_VALUES[person.name] || {};
        const frag = document.createDocumentFragment();

        for (const def of PHASE_DEFS) {
          const seg = values[def.key] || { u: 0, t: 0 };
          const r = rate(seg.u, seg.t);
          const bc = barColor(r, person.color);
          const lc = r >= 50 ? "#fff" : "var(--color-text-muted)";

          const row = document.createElement("div");
          row.className = "phase-row";
          row.innerHTML =
            '<div class="phase-label">' + def.label + '</div>'
            + '<div class="bar-track">'
            + '<div class="bar-fill" style="width:' + r + '%;background:' + bc + '"></div>'
            + '<span class="bar-text" style="color:' + lc + '">' + r + '%</span>'
            + '</div>'
            + '<div class="rate-val" style="color:' + person.textColor + '">' + ((Number(seg.t) || 0) - (Number(seg.u) || 0)) + '/' + (Number(seg.t) || 0) + '</div>';
          frag.appendChild(row);
        }

        container.innerHTML = "";
        container.appendChild(frag);
      }

      const selectedDepts = new Set();
      const selectedPeople = new Set();
      let rateMode = "gte"; // gte | lte
      let rateThreshold = null; // number | null

      function renderChips(containerId, values, onRemove) {
        const box = document.getElementById(containerId);
        if (!box) return;
        box.innerHTML = "";
        values.forEach(v => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = `<span>${v}</span><button type="button" aria-label="${v} を削除">×</button>`;
          chip.querySelector("button").addEventListener("click", () => onRemove(v));
          box.appendChild(chip);
        });
      }

      function addToSet(set, value) {
        const v = String(value || "").trim();
        if (!v) return false;
        if (set.has(v)) return false;
        set.add(v);
        return true;
      }

      function removeFromSet(set, value) {
        set.delete(value);
      }

      function syncChipUIs() {
        renderChips("deptChips", selectedDepts, (v) => {
          removeFromSet(selectedDepts, v);
          syncChipUIs();
          renderCards();
        });
        renderChips("personChips", selectedPeople, (v) => {
          removeFromSet(selectedPeople, v);
          syncChipUIs();
          renderCards();
        });
      }

      function tryAddFromInput(inputId, set) {
        const input = document.getElementById(inputId);
        if (!input) return;
        if (addToSet(set, input.value)) {
          input.value = "";
          syncChipUIs();
          renderCards();
        }
      }

      function matchesFilters(person) {
        if (selectedDepts.size > 0 && !selectedDepts.has(person.dept)) return false;
        if (selectedPeople.size > 0 && !selectedPeople.has(person.name)) return false;
        if (rateThreshold != null && Number.isFinite(rateThreshold)) {
          const totals = getPersonTotals(person.name);
          const r = Number(totals.r) || 0;
          if (rateMode === "gte" && r < rateThreshold) return false;
          if (rateMode === "lte" && r > rateThreshold) return false;
        }
        return true;
      }

      function renderCards() {
        const grid = document.getElementById("tantoGrid");
        if (!grid) return;
        grid.innerHTML = "";

        const visible = PEOPLE
          .filter(matchesFilters)
          .slice()
          .sort((a, b) => personOrder.indexOf(a.name) - personOrder.indexOf(b.name));

        for (const p of visible) {
          const totals = getPersonTotals(p.name);

          const card = document.createElement("article");
          card.className = "tanto-card";
          card.setAttribute("draggable", "true");
          card.dataset.person = p.name;

          const header = document.createElement("button");
          header.type = "button";
          header.className = "tanto-card-header";
          header.setAttribute("aria-expanded", "false");

          header.innerHTML =
            '<div class="tanto-name" style="color:' + p.color + '">' + p.name + '</div>'
            + '<div class="tanto-toggle">＋</div>'
            + '<div class="tanto-total">'
            + '<span>合計達成率 <strong style="color:' + p.color + '">' + totals.r + '%</strong></span>'
            + '<span>入稿済 <strong>' + (totals.totalT - totals.totalU) + '</strong> / 全 <strong>' + totals.totalT + '</strong></span>'
            + '</div>';

          const body = document.createElement("div");
          body.className = "tanto-card-body";

          header.addEventListener("click", () => {
            const isOpen = card.classList.toggle("is-open");
            header.setAttribute("aria-expanded", isOpen ? "true" : "false");
            if (isOpen) buildPhaseRows(p, body);
          });

          card.appendChild(header);
          card.appendChild(body);
          grid.appendChild(card);
        }

        bindDnD(grid);
      }

      const personOrder = PEOPLE.map(p => p.name);
      let dragName = null;

      function bindDnD(grid) {
        if (!grid || grid.dataset.dndBound === "1") return;

        grid.addEventListener("dragstart", (e) => {
          const card = e.target.closest(".tanto-card");
          if (!card) return;
          dragName = card.dataset.person || null;
          card.classList.add("is-dragging");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", dragName || ""); } catch (_) {}
        });

        grid.addEventListener("dragend", (e) => {
          const card = e.target.closest(".tanto-card");
          if (card) card.classList.remove("is-dragging");
          grid.querySelectorAll(".tanto-card.is-drop-target").forEach(el => el.classList.remove("is-drop-target"));
          dragName = null;
        });

        grid.addEventListener("dragover", (e) => {
          const over = e.target.closest(".tanto-card");
          if (!over) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          grid.querySelectorAll(".tanto-card.is-drop-target").forEach(el => el.classList.remove("is-drop-target"));
          over.classList.add("is-drop-target");
        });

        grid.addEventListener("dragleave", (e) => {
          const over = e.target.closest(".tanto-card");
          if (!over) return;
          over.classList.remove("is-drop-target");
        });

        grid.addEventListener("drop", (e) => {
          const over = e.target.closest(".tanto-card");
          if (!over) return;
          e.preventDefault();

          const from = dragName;
          const to = over.dataset.person || null;
          if (!from || !to || from === to) return;

          const fromIdx = personOrder.indexOf(from);
          const toIdx = personOrder.indexOf(to);
          if (fromIdx < 0 || toIdx < 0) return;

          personOrder.splice(fromIdx, 1);
          personOrder.splice(toIdx, 0, from);
          renderCards();
        });

        grid.dataset.dndBound = "1";
      }

      function bindSearch() {
        const deptInput = document.getElementById("deptInput");
        const personInput = document.getElementById("personInput");
        const rateValue = document.getElementById("rateValue");
        const rateGte = document.getElementById("rateGte");
        const rateLte = document.getElementById("rateLte");
        const resetBtn = document.getElementById("resetBtn");
        const deptDrop = deptInput ? deptInput.parentElement.querySelector(".autocomplete-dropdown") : null;
        const personDrop = personInput ? personInput.parentElement.querySelector(".autocomplete-dropdown") : null;

        function syncRateFromUi() {
          const raw = rateValue && rateValue.value !== "" ? Number(rateValue.value) : NaN;
          if (Number.isFinite(raw)) {
            rateThreshold = Math.max(0, Math.min(100, raw));
          } else {
            rateThreshold = null;
          }
        }

        function setRateMode(next) {
          rateMode = next;
          if (rateGte && rateLte) {
            rateGte.classList.toggle("is-active", rateMode === "gte");
            rateLte.classList.toggle("is-active", rateMode === "lte");
            rateGte.setAttribute("aria-pressed", rateMode === "gte" ? "true" : "false");
            rateLte.setAttribute("aria-pressed", rateMode === "lte" ? "true" : "false");
          }
        }

        if (rateGte) rateGte.addEventListener("click", () => { setRateMode("gte"); renderCards(); });
        if (rateLte) rateLte.addEventListener("click", () => { setRateMode("lte"); renderCards(); });
        if (rateValue) rateValue.addEventListener("input", () => { syncRateFromUi(); renderCards(); });
        if (rateValue) rateValue.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            syncRateFromUi();
            renderCards();
          }
        });

        // Enter で追加
        if (deptInput) {
          deptInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              tryAddFromInput("deptInput", selectedDepts);
            }
          });
        }
        if (personInput) {
          personInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              tryAddFromInput("personInput", selectedPeople);
            }
          });
        }

        // autocomplete 選択時（dropdownクリック後）に追加
        if (deptDrop) {
          deptDrop.addEventListener("click", () => {
            setTimeout(() => tryAddFromInput("deptInput", selectedDepts), 0);
          });
        }
        if (personDrop) {
          personDrop.addEventListener("click", () => {
            setTimeout(() => tryAddFromInput("personInput", selectedPeople), 0);
          });
        }

        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            if (deptInput) deptInput.value = "";
            if (personInput) personInput.value = "";
            selectedDepts.clear();
            selectedPeople.clear();
            if (rateValue) rateValue.value = "";
            rateThreshold = null;
            setRateMode("gte");
            syncChipUIs();
            renderCards();
          });
        }

        setRateMode("gte");
        syncRateFromUi();
        syncChipUIs();
      }

      function loadSharedSidebar() {
        const mount = document.getElementById("sidebarMount");
        if (!mount) return;
        if (typeof window.SHARED_SIDEBAR_HTML !== "string" || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error("Sidebar include error: SHARED_SIDEBAR_HTML is not available.");
          return;
        }
        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === "1") return;
        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');
          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = "images/chevron_right_20dp_FFFFF.svg";
          } else {
            if (toggleImg) toggleImg.src = "images/chevron_left_20dp_FFFFF.svg";
          }
        });
        toggle.dataset.bound = "1";
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;
        sidebar.classList.toggle('active');
        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;
        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();
      bindSearch();
      renderCards();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

    </script>
</body>

</html>
