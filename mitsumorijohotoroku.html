<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 25px);
    }
    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 56px 32px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    .content-area-2 {
      flex: 1;
    }

    /* ガントチャート */
    .timeline-wrapper {
      position: relative;
      margin-bottom: 0;
      width: 450px;
    }

    .timeline-line {
      position: absolute;
      top: 47%;
      left: 50px;
      right: 50px;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      z-index: 1;
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が768px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      .dashboard-section {
        display: flex;
        gap: 24px;
        margin-top: 0;
        width: 100%;
        flex-direction: column;
        padding-bottom: 20px;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      .timeline-line {
        left: 20px;
        right: 20px;
      }

      /* 商品パネル内：ラベルと入力を近づける */
      .product-table .form-row {
        gap: 2px;
        margin-bottom: 8px;
        min-width: 0;
        max-width: 100%;
      }

      .product-table .form-row > label {
        width: 100px;
        padding-top: 4px;
      }

      .product-table .label-with-button {
        flex: 0 0 100px;
        width: 100px;
        max-width: 100px;
        gap: 2px;
      }

      .product-table .label-with-button > label {
        padding-top: 4px;
      }

      /* パネル内：入力・選択をパネル幅に収め、値列で最大まで使う */
      .product-panels-row .product-card {
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .product-table {
        min-width: 0;
      }

      .product-table .form-row > div,
      .product-table .form-row > .autocomplete,
      .product-table .form-row > .supplier-inputs-wrapper,
      .product-table .form-row > .reference-images-wrapper {
        min-width: 0;
        max-width: 100%;
      }

      .product-table input[type="text"],
      .product-table textarea {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        box-sizing: border-box;
      }

      .product-table select,
      .product-table .form-row-select-wide > select {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .product-table .form-row.form-row-select-wide {
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 6px 8px;
      }

      /* 仕様・Pt方法・刺繡（SP）：アイテム行と同じラベル幅・gap・値列（開始位置・幅を一致） */
      .product-table .form-row.form-row-textbox {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.form-row-textbox > label {
        width: 114px;
        max-width: 114px;
        flex: 0 0 114px;
        padding-top: 4px;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-textbox.form-row-select-stack-sp > .form-row-select-stack-sp__fields {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        flex: 1 1 0%;
        min-width: 0 !important;
        max-width: 100%;
        width: auto;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-textbox .form-row-select-stack-sp__fields > select,
      .product-table .form-row.form-row-textbox .form-row-select-stack-sp__fields > div {
        flex: 0 0 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-textbox .form-row-select-stack-sp__fields > div input[type="text"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      /* アイテム入力を刺繡テキストボックスと同じサイズにそろえる */
      .product-table .form-row.form-row-item-sp > .autocomplete {
        flex: 1 1 0%;
        width: auto;
        min-width: 0;
        max-width: 100%;
      }

      .product-table .form-row.form-row-item-sp > .autocomplete > input[type="text"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      /* 刺繡：SP では縦積み */
      .product-table .form-row.form-row-shishu.form-row-left > .form-row-select-stack-sp__fields {
        flex: 1 1 0%;
        width: auto;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-shishu .form-row-select-stack-sp__fields > div {
        margin-left: 0 !important;
      }

      .product-table .form-row.form-row-shishu .form-row-select-stack-sp__fields > div:last-of-type {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-shishu .form-row-select-stack-sp__fields > div:last-of-type input[placeholder="針数を入力"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      /* 検査基準・指定検査基準名・ホルマリン（SP） */
      .product-table .form-row.form-row-kensa-sp-stack {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.form-row-kensa-sp-stack.form-row-select-wide {
        flex-wrap: nowrap;
        gap: 2px;
      }

      .product-table .form-row.form-row-kensa-sp-stack > .form-row-kensa-sp-stack__labels {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        flex: 0 0 114px;
        width: 114px;
        max-width: 114px;
        gap: 4px;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__labels > label.form-row-kensa-sp-stack__label-placeholder {
        display: none;
      }

      .product-table .form-row-kensa-sp-stack__labels > label {
        width: 100%;
        max-width: 100%;
        flex: 0 0 auto;
        padding-top: 4px;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-kensa-sp-stack > .form-row-kensa-sp-stack__fields {
        flex: 1 1 0%;
        width: auto;
        min-width: 0;
        max-width: 100%;
        margin-left: 28px;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__fields--with-inline-label {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .product-table .form-row-kensa-sp-stack__inline-label {
        padding-top: 4px;
        width: 100%;
      }

      /* 指定検査基準名 */
      .product-table .form-row-kensa-sp-stack__fields--with-inline-label > .form-row-kensa-sp-stack__shitei-nested {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__shitei-heading {
        display: block;
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding-top: 4px;
        line-height: 1.4;
        font-weight: 500;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__shitei-nested > div {
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      /* ホルマリン検査 */
      .product-table .form-row-kensa-sp-stack__fields--with-inline-label > .form-row-kensa-sp-stack__horumarin-nested {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__horumarin-heading {
        display: block;
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding-top: 4px;
        line-height: 1.4;
        font-weight: 500;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__horumarin-nested > select {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      .product-table .form-row-kensa-sp-stack__fields > select {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .product-table .form-row-kensa-sp-stack__fields > div {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      /* 手配先・請求先（SP） */
      .product-table .form-row.form-row-tehai-seikyu-sp {
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.form-row-tehai-seikyu-sp.form-row-select-wide {
        flex-wrap: nowrap;
        gap: 2px;
      }

      .product-table .form-row-tehai-seikyu-sp > .form-row-tehai-seikyu-sp__label-placeholder {
        display: block;
        flex: 0 0 114px;
        width: 114px;
        max-width: 114px;
        min-height: 0;
        margin: 0;
        padding: 0;
        align-self: flex-start;
        box-sizing: border-box;
      }

      .product-table .form-row-tehai-seikyu-sp__fields {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        flex: 1 1 0%;
        min-width: 0;
        max-width: 100%;
        width: auto;
        box-sizing: border-box;
        margin-left: 28px;
      }

      .product-table .form-row-tehai-seikyu-sp__row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row-tehai-seikyu-sp__row > label {
        width: 100%;
        max-width: 100%;
        flex: 0 0 auto;
        padding-top: 4px;
        box-sizing: border-box;
      }

      .product-table .form-row-tehai-seikyu-sp__row > select {
        flex: 0 0 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      .product-table .fukushizai-block {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .fukushizai-block > select {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-table .desired-delivery-fields {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      /* 本番希望納期（SP） */
      .product-table .form-row.desired-delivery-row {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.desired-delivery-row > label {
        width: 114px;
        max-width: 114px;
        flex: 0 0 114px;
        padding-top: 4px;
        box-sizing: border-box;
      }

      /* 備考（SP） */
      .product-table .form-row.remarks-row {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.remarks-row > label {
        width: 114px;
        max-width: 114px;
        flex: 0 0 114px;
        padding-top: 4px;
        box-sizing: border-box;
      }

      /* 仕入得意先・得意先・仕入先（SP） */
      .product-table .form-row.form-row-supplier-inputs-sp {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.form-row-supplier-inputs-sp.form-row-select-wide {
        flex-wrap: nowrap;
        gap: 2px;
      }

      .product-table .form-row.form-row-supplier-inputs-sp > .label-with-button {
        flex: 0 0 114px;
        width: 114px;
        max-width: 114px;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-supplier-inputs-sp > .supplier-inputs-wrapper {
        margin-left: 28px;
        flex: 1 1 0%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      /* 参考画像（SP） */
      .product-table .form-row.form-row-reference-images-sp {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 2px;
      }

      .product-table .form-row.form-row-reference-images-sp > .label-with-button {
        flex: 0 0 114px;
        width: 114px;
        max-width: 114px;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-reference-images-sp > .reference-images-wrapper {
        margin-left: 28px;
        flex: 1 1 0%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .product-table .supplier-input-row {
        flex-wrap: wrap;
      }

      .product-table .supplier-input-row .autocomplete {
        flex: 1 1 100% !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      /* 仕入得意先・仕入先（SP）*/
      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row {
        position: relative;
        flex-wrap: nowrap;
        align-items: center;
        padding-right: 28px;
        box-sizing: border-box;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row .btn-delete-supplier {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        margin: 0;
      }

      /* アイテム行の .autocomplete（form-row-item-sp）と同じ値列の伸び方に揃える */
      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row .autocomplete {
        flex: 1 1 0% !important;
        width: auto !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
        row-gap: 8px;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .autocomplete {
        flex: 1 1 0% !important;
        width: auto !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields {
        flex: 1 1 0%;
        max-width: 100%;
        min-width: 0;
        width: 100%;
        gap: 8px;
        flex-direction: column;
        align-items: stretch;
        align-self: stretch;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields .supplier-input {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        box-sizing: border-box;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields .supplier-row-check-label {
        align-self: flex-start;
      }

      /* 試作データ入稿予定・希望サンプル納期（SP） */
      .product-table .date-wide-row .period-range-row--from-only {
        width: auto;
        max-width: 100%;
        min-width: 0;
      }

      .product-table .date-wide-row .period-range-field {
        position: relative;
        display: inline-block;
        width: auto;
        max-width: 100%;
        min-width: 0;
        vertical-align: middle;
        box-sizing: border-box;
      }

      .product-table .date-wide-row .period-range-field .period-range-calendar-btn {
        right: 5px;
      }

      .product-table .date-wide-row .period-range-input.period-range-yyyymmdd {
        width: 170px !important;
        min-width: 170px !important;
        max-width: 100%;
        font-size: 16px !important;
        flex: 0 0 auto !important;
        box-sizing: border-box;
        padding: 6px 7px !important;
        padding-right: 2.6em !important;
        font-variant-numeric: tabular-nums;
      }

      .product-table .form-row.date-wide-row--calender .period-range-row--from-only {
        margin-left: -49px;
      }

      /* 開始位置指定　*/
      .product-table .form-row.form-row-left > div {
        margin-left: 28px;
      }

      .product-table .hem-type-length-inline {
        padding-top: 4px;
        gap: 3px 4px;
        max-width: 100%;
      }

      .product-table .hem-type-length-inline > label:nth-of-type(1) {
        order: 1;
        width: 100%;
      }

      .product-table .hem-type-length-inline > label:nth-of-type(2) {
        order: 3;
        width: 100%;
      }

      .product-table .hem-type-length-inline .hem-field {
        flex: 1 1 140px;
        min-width: 0;
        max-width: 100%;
      }

      .product-table .hem-type-length-inline .hem-field:nth-of-type(1) {
        order: 2;
        flex: 1 1 100%;
      }

      .product-table .hem-type-length-inline .hem-field:nth-of-type(2) {
        order: 4;
        flex: 1 1 100%;
      }

      .fab-actions {
        right: 12px;
        bottom: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: calc(100vw - 24px);
      }

      /* ヘッダ（SP）：見積依頼日入力幅を定番/別注・概算/正式・得意先と同じ幅に揃える */
      .top-filter-row .top-filter-item > .period-range-row--from-only .period-range-input.period-range-yyyymmdd {
        width: var(--top-filter-control-width) !important;
        min-width: 0 !important;
        max-width: 100% !important;
      }
    }
    
    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    .filter-row input[type="text"] {
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-area {

      margin-bottom: 10px;
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-area:first-of-type {
      margin-bottom: 5px;
    }
    
    .content-area h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }


    /* 商品情報エリア：3行が1画面に収まるように高さを確保 */
    #approvalNoticeArea {
      width: 100%;
      max-height: none;
      /* 商品パネル横スクロールを隠さない（hidden だと子の overflow-x が効かない） */
      overflow-x: visible;
      overflow-y: visible;
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      const content = document.querySelector('.content');
      if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

      const toggleImg = toggle.querySelector('img');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        content.classList.toggle('expanded');

        if (sidebar.classList.contains('closed')) {
          if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
        } else {
          if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
        }
      });

      toggle.dataset.bound = '1';
    }

      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

          textInput.value = picker.value.replace(/-/g, '');

    var GAUGE_ARC_LENGTH = Math.PI * 40;
    function setGaugeFillSegments(fillId, warn7Id, delayId, done, total, warn7, delay) {
      var L = GAUGE_ARC_LENGTH;
      var t = total > 0 ? total : 1;
      var w7 = (warn7 != null ? warn7 : 0);
      var dly = (delay != null ? delay : 0);
      var lenDone = (done / t) * L;
      var lenWarn7 = (w7 / t) * L;
      var lenDelay = (dly / t) * L;
      var el = document.getElementById(fillId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDone.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", "0");
      }
      el = document.getElementById(warn7Id);
      if (el) {
        el.setAttribute("stroke-dasharray", lenWarn7.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-lenDone).toFixed(2));
      }
      el = document.getElementById(delayId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDelay.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-(lenDone + lenWarn7)).toFixed(2));
      }
    }

    // 商品情報：商品カードの画像アップロード制御
    (function () {
      var swiper = document.getElementById("productSwiper");
      if (!swiper) return;

      function getCards() {
        return swiper.querySelectorAll(".product-card");
      }

      function attachImageHandler(card) {
        var fileInput = card.querySelector(".product-image-input");
        var img = card.querySelector(".product-image");
        var wrapper = card.querySelector(".product-image-wrapper");
        if (!fileInput || !img || !wrapper) return;

        function loadFile(file) {
          if (!file || !file.type || !file.type.match(/^image\//)) return;
          var reader = new FileReader();
          reader.onload = function (e) {
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }

        // ファイル選択（ボタン・ラベル）
        fileInput.addEventListener("change", function () {
          if (!this.files || !this.files[0]) return;
          loadFile(this.files[0]);
        });

        // 画像クリックでファイル選択
        wrapper.addEventListener("click", function () {
          fileInput.click();
        });

        // ドラッグ＆ドロップ
        ["dragenter", "dragover"].forEach(function (ev) {
          wrapper.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            wrapper.classList.add("drag-over");
          });
        });
        ["dragleave", "dragend"].forEach(function (ev) {
          wrapper.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            wrapper.classList.remove("drag-over");
          });
        });
        wrapper.addEventListener("drop", function (e) {
          e.preventDefault();
          e.stopPropagation();
          wrapper.classList.remove("drag-over");
          var files = e.dataTransfer && e.dataTransfer.files;
          if (!files || !files[0]) return;
          loadFile(files[0]);
        });
      }

      // 初期カードに画像ハンドラを付与（複製パネル用に公開）
      getCards().forEach(attachImageHandler);
      window.__attachProductCardImage = attachImageHandler;
    })();

        preview.className = "image-preview";
        preview.src = "images/noimage.png";
        preview.alt = "クリックして画像を選択";

        var fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";
        fileInput.setAttribute("name", "referenceImage[]");
        fileInput.addEventListener("change", function () {
          var file = this.files && this.files[0];
          if (file && file.type && file.type.indexOf("image/") === 0) {
            var reader = new FileReader();
            reader.onload = function (e) {
              preview.src = e.target.result;
            };
            reader.readAsDataURL(file);
          } else {
            preview.src = "images/noimage.png";
          }
        });

        var deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn-delete-image";
        deleteBtn.innerHTML = "×";
        deleteBtn.title = "削除";
        deleteBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          item.remove();
        });

        item.appendChild(preview);
        item.appendChild(fileInput);
        item.appendChild(deleteBtn);
        return item;
      }

      var row = document.getElementById("productPanelsRow");
      if (!row) return;

      row.addEventListener("click", function (e) {
        var btn = e.target.closest(".js-add-reference-image");
        if (!btn) return;
        e.preventDefault();
        var card = btn.closest(".product-card");
        var container = card && card.querySelector(".js-reference-images-container");
        if (!container) return;
        container.appendChild(createReferenceImageSlot());
      });
    })();

    // 仕入得意先・仕入先：追加（パネルごとに委譲）
    (function () {
      function createSupplierRow(placeholder, inputName, rowKind) {
        var item = document.createElement("div");
        item.className = "supplier-input-item";

        var row = document.createElement("div");
        row.className =
          rowKind === "shiire"
            ? "supplier-input-row supplier-input-row--shiire-tokuisaki"
            : "supplier-input-row";

        var autocompleteDiv = document.createElement("div");
        autocompleteDiv.className = "autocomplete";
        var input = document.createElement("input");
        input.type = "text";
        input.className = "autocomplete-input";
        input.setAttribute("data-list", "supplier");
        input.placeholder = placeholder;
        input.setAttribute("name", inputName);
        var dropdown = document.createElement("div");
        dropdown.className = "autocomplete-dropdown";
        autocompleteDiv.appendChild(input);
        autocompleteDiv.appendChild(dropdown);

        var deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn-delete-supplier";
        deleteBtn.innerHTML = "×";
        deleteBtn.title = "削除";
        deleteBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          item.remove();
        });

        row.appendChild(autocompleteDiv);
        if (rowKind === "shiire") {
          var side = document.createElement("div");
          side.className = "supplier-row-side-fields";

          function makeTankaInput(name, placeholder, ariaLabel) {
            var el = document.createElement("input");
            el.type = "text";
            el.className = "supplier-input";
            el.setAttribute("name", name);
            el.placeholder = placeholder;
            el.setAttribute("inputmode", "decimal");
            el.setAttribute("autocomplete", "off");
            el.setAttribute("aria-label", ariaLabel);
            return el;
          }

          var tanka = makeTankaInput("shiireTokuisakiTanka[]", "単価", "単価");
          var uedai = makeTankaInput("shiireTokuisakiUedai[]", "上代", "上代");
          var kawase = makeTankaInput("shiireTokuisakiKawase[]", "為替", "為替");
          var keihiritsu = makeTankaInput("shiireTokuisakiKeihiritsu[]", "経費率", "経費率");
          var irirate = makeTankaInput("shiireTokuisakiIriRate[]", "値入率（％）", "値入率（％）");

          var checkLab = document.createElement("label");
          checkLab.className = "supplier-row-check-label";
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "supplier-row-checkbox";
          cb.setAttribute("name", "shiireTokuisakiCheck[]");
          cb.value = "1";
          cb.setAttribute("aria-label", "対象");
          checkLab.appendChild(cb);

          side.appendChild(tanka);
          side.appendChild(uedai);
          side.appendChild(kawase);
          side.appendChild(keihiritsu);
          side.appendChild(irirate);
          side.appendChild(checkLab);
          row.appendChild(side);
        }
        row.appendChild(deleteBtn);
        item.appendChild(row);
        return item;
      }

      var row = document.getElementById("productPanelsRow");
      if (!row) return;

      row.addEventListener("click", function (e) {
        var t1 = e.target.closest(".js-add-shiire-tokuisaki");
        var t2 = e.target.closest(".js-add-shiiresaki");
        if (!t1 && !t2) return;
        e.preventDefault();
        var card = (t1 || t2).closest(".product-card");
        if (!card) return;
        var container = t1
          ? card.querySelector(".js-shiire-tokuisaki-container")
          : card.querySelector(".js-shiiresaki-container");
        if (!container) return;
        var item = t1
          ? createSupplierRow("仕入得意先を入力", "shiireTokuisaki[]", "shiire")
          : createSupplierRow("仕入先を入力", "shiiresaki[]", "shiiresaki");
        container.appendChild(item);
        if (window.initAutocomplete) {
          window.initAutocomplete(item.querySelector(".autocomplete"));
        }
      });
    })();

    // 商品パネル：先頭「追加」で右にパネル複製
    (function () {
      var btn = document.getElementById("addProductPanelBtn");
      var row = document.getElementById("productPanelsRow");
      if (!btn || !row) return;

      function syncProductPanelsMultiMode() {
        var multi = row.querySelectorAll(".product-card").length > 1;
        document.body.classList.toggle("product-panels-multi", multi);
      }

      function resetSupplierContainer(container) {
        if (!container) return;
        var items = container.querySelectorAll(".supplier-input-item");
        for (var i = 1; i < items.length; i++) {
          items[i].remove();
        }
        var first = container.querySelector(".supplier-input-item");
        if (first) {
          first.querySelectorAll("input").forEach(function (inp) {
            inp.value = "";
          });
        }
      }

      function resetPanelForm(card) {
        card.querySelectorAll("input, textarea, select").forEach(function (el) {
          if (el.tagName === "SELECT") {
            return;
          }
          if (el.type === "file") {
            el.value = "";
          } else if (el.type === "checkbox" || el.type === "radio") {
            el.checked = false;
          } else {
            el.value = "";
          }
        });
        /* 各 select は先頭の「選択してください」相当（1番目の option）を選ぶ */
        card.querySelectorAll("select").forEach(function (sel) {
          if (sel.options.length > 0) {
            sel.selectedIndex = 0;
          }
        });
        card.querySelectorAll("img.product-image").forEach(function (img) {
          img.src = "images/noimage.png";
        });
        card.querySelectorAll(".reference-image-item").forEach(function (n) {
          n.remove();
        });
        resetSupplierContainer(card.querySelector(".js-shiire-tokuisaki-container"));
        resetSupplierContainer(card.querySelector(".js-shiiresaki-container"));
        card.querySelectorAll(".period-range-field[data-period-bound]").forEach(function (n) {
          n.removeAttribute("data-period-bound");
        });
      }

      btn.addEventListener("click", function () {
        var template = row.querySelector(".product-card");
        if (!template) return;
        var clone = template.cloneNode(true);
        clone.classList.remove("is-active");
        clone.querySelectorAll("[id]").forEach(function (el) {
          el.removeAttribute("id");
        });
        resetPanelForm(clone);
        row.appendChild(clone);

        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-delete-product-panel";
        delBtn.setAttribute("aria-label", "このパネルを削除");
        delBtn.title = "削除";
        delBtn.innerHTML = "×";
        delBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          clone.remove();
          syncProductPanelsMultiMode();
        });
        clone.insertBefore(delBtn, clone.firstChild);

        syncProductPanelsMultiMode();

        if (typeof window.__attachProductCardImage === "function") {
          window.__attachProductCardImage(clone);
        }

        clone.querySelectorAll(".autocomplete").forEach(function (box) {
          if (window.initAutocomplete) {
            window.initAutocomplete(box);
          }
        });
        attachPeriodRangeFields(clone);

        var teibanSel = document.getElementById("teibanBetchuSelect");
        if (teibanSel) {
          teibanSel.dispatchEvent(new Event("change"));
        }

        clone.scrollIntoView({ behavior: "smooth", inline: "end", block: "nearest" });
      });
    })();

    // 見積図案サムネイル：クリックでモーダル表示
    (function () {
      var thumb = document.querySelector(".item-thumb");
      var modal = document.getElementById("estimateImageModal");
      var modalImage = document.getElementById("estimateImageModalImage");
      var closeBtn = document.getElementById("estimateImageModalClose");
      if (!thumb || !modal || !modalImage || !closeBtn) return;

      function openModal(src) {
        modalImage.src = src || "images/noimage.png";
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
      }

      thumb.addEventListener("click", function () {
        openModal(thumb.getAttribute("src"));
      });

      closeBtn.addEventListener("click", function () {
        closeModal();
      });

      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("is-open")) {
          closeModal();
        }
      });
    })();

  </script>
</body>
