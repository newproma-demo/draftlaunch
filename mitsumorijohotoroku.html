<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    /* body を縦方向の flex にし、ヘッダー + main-wrapper を viewport 内に収める */
    html, body {
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
    }
    .header {
      flex: 0 0 auto;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1 1 auto;
      margin-top: 0;
      min-height: 0;
      overflow: hidden;
    }
    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 56px 32px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }
    
    .content h1 {
      grid-column: 1 / 3;
      grid-row: 1;
      margin-left: 10px;
    } 

    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    .content-area-2 {
      flex: 1;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が768px以下ならスマホ*/
    @media (max-width: 767px) {
      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      /* 商品パネル内：ラベルと入力を近づける */
      .product-table .form-row {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--product-label-input-gap, 4px);
        margin-bottom: 8px;
        min-width: 0;
        max-width: 100%;
      }

      .product-table .field-label,
      .product-table .form-row > .field-label,
      .product-table .label-with-button > .field-label {
        font-size: var(--product-label-font-size, 12px);
        padding-top: 0;
        width: auto;
        max-width: 100%;
      }

      .product-fields-compact {
        --product-field-label-width: 100px;
        --product-field-label-value-gap: 1px;
        --product-field-group-gap: 10px;
        --product-shishu-input-width: 100%;
        --product-field-input-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .product-table .form-row > .field-label {
        width: 100px;
        padding-top: 4px;
      }

      .product-fields-compact > .form-row > .field-label,
      .product-fields-compact > .form-row.form-row-textbox > .field-label {
        width: auto !important;
        max-width: none !important;
        flex: unset !important;
        padding-top: 0;
      }

      .product-fields-compact > .form-row:has(textarea) > .field-label {
        padding-top: 4px;
      }

      .product-fields-compact > .form-row > div input,
      .product-fields-compact > .form-row > .autocomplete input {
        width: 100%;
        box-sizing: border-box;
      }

      /* アイテム～その他（SP）：各項目1行・100%縦並び */
      .product-fields-compact {
        width: 100%;
        max-width: 100%;
      }

      .product-fields-compact__row,
      .product-fields-compact__row--with-spec-select,
      .product-fields-compact__row--pt-shirring-shishu {
        display: grid;
        grid-template-columns: 1fr !important;
        gap: 8px;
        width: 100%;
        max-width: 100%;
      }

      .product-fields-compact__row > label.field,
      .product-fields-compact__row--with-spec-select > label.field,
      .product-fields-compact__row--pt-shirring-shishu > label.field {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0;
        padding-left: 0 !important;
        margin-bottom: 6px;
        box-sizing: border-box;
      }

      .product-fields-compact__row > label.field .field-label,
      .product-fields-compact__row--with-spec-select > label.field .field-label,
      .product-fields-compact__row--pt-shirring-shishu > label.field .field-label {
        font-size: var(--product-label-font-size, 12px);
        align-self: flex-start;
      }

      .product-fields-compact__row > label.field .autocomplete,
      .product-fields-compact__row > label.field > div,
      .product-fields-compact__row > label.field > div:has(> input[type="text"]),
      .product-fields-compact__row > label.field > .form-row-select-stack-sp__fields,
      .product-fields-compact__row > label.field .field-inline-selects,
      .product-fields-compact__row > label.field .field-inline-selects--shishu {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      .product-fields-compact .autocomplete {
        width: 100% !important;
        max-width: 100% !important;
      }

      .product-fields-compact__row > label.field input[type="text"],
      .product-fields-compact__row > label.field select,
      .product-fields-compact__row > label.field .autocomplete-input,
      .product-fields-compact__row--pt-shirring-shishu .select-product-field-wide,
      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects > select,
      .product-fields-compact__row--pt-shirring-shishu > label.field--shirring > select,
      .product-fields-compact__row--pt-shirring-shishu .field--pt-hoho .field-inline-selects > select {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        box-sizing: border-box;
      }

      .product-fields-compact__row > label.field select,
      .product-fields-compact__row > label.field select option {
        font-size: 14px !important;
      }

      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects,
      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects--shishu {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        width: 100% !important;
      }

      /* 刺繡（SP）：select の下にテキストボックスを 100%・左寄せ */
      .product-fields-compact__row--pt-shirring-shishu > label.field--shishu {
        align-items: flex-start;
      }

      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects--shishu {
        display: flex !important;
        flex-direction: column !important;
        flex-wrap: nowrap !important;
        align-items: flex-start !important;
        align-self: stretch;
        width: 100% !important;
        max-width: 100% !important;
        gap: 8px;
      }

      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects--shishu > select {
        order: 1;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects--shishu > div {
        order: 2;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        margin-left: 0 !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-fields-compact__row--pt-shirring-shishu .field-inline-selects--shishu > div input[type="text"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        text-align: left;
        box-sizing: border-box;
      }

      .product-fields-compact > .form-row.form-row-textbox.form-row-left {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 0;
      }

      .product-fields-compact > .form-row.form-row-textbox > .field-label {
        width: auto !important;
        max-width: 100% !important;
        flex: none !important;
        padding-top: 0;
      }

      .product-fields-compact > .form-row.form-row-textbox > div {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        flex: 0 0 auto !important;
        align-self: stretch;
      }

      .product-fields-compact > .form-row.form-row-textbox textarea {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      .product-fields-compact > .form-row.form-row-left > div,
      .product-fields-compact > .form-row.form-row-left > .autocomplete,
      .product-fields-compact .form-row .form-row-select-stack-sp__fields {
        margin-left: 0 !important;
      }

      .product-table .label-with-button {
        flex: 0 0 100px;
        width: 100px;
        max-width: 100px;
        gap: 2px;
      }

      .product-table .label-with-button > .field-label {
        padding-top: 4px;
      }

      /* パネル内：入力・選択をパネル幅に収め、値列で最大まで使う */
      .product-panels-row .product-card {
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .product-table {
        min-width: 0;
      }

      .product-table .form-row > div,
      .product-table .form-row > .autocomplete,
      .product-table .form-row > .supplier-inputs-wrapper,
      .product-table .form-row > .reference-images-wrapper {
        min-width: 0;
        max-width: 100%;
      }

      .product-table input[type="text"],
      .product-table textarea {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        box-sizing: border-box;
      }

      .product-table select,
      .product-table .form-row-select-wide > select {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .product-table .form-row.form-row-select-wide {
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 6px 8px;
      }

      /* 仕様・Pt方法・刺繡・その他・副資材など（SP）：1項目1行 */
      .product-table .form-row.form-row-textbox {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 8px;
      }

      .product-table .form-row.form-row-textbox > .field-label {
        width: auto;
        max-width: 100%;
        flex: none;
        padding-top: 0;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-textbox > div,
      .product-table .form-row.form-row-textbox > .fukushizai-block {
        width: 100%;
        max-width: 100%;
        margin-left: 0 !important;
      }

      .product-table .form-row.form-row-textbox.form-row-select-stack-sp > .form-row-select-stack-sp__fields {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        flex: 1 1 0%;
        min-width: 0 !important;
        max-width: 100%;
        width: auto;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-textbox .form-row-select-stack-sp__fields > select,
      .product-table .form-row.form-row-textbox .form-row-select-stack-sp__fields > div {
        flex: 0 0 auto !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-textbox .form-row-select-stack-sp__fields > div input[type="text"] {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      /* 検査基準（SP）：kensa-fields-row は末尾の @media (max-width: 767px) で縦積み */
      #betchuOnlyFieldsAfterKensa .form-row-kensa-inline {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .product-table .fukushizai-block {
        --fukushizai-inputs-col-gap: 10px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      /* 副資材（SP）：有無 select の下に品番入力2つを 100% 縦並び */
      .product-table .fukushizai-main-row {
        display: flex !important;
        flex-direction: column !important;
        flex-wrap: nowrap !important;
        align-items: stretch !important;
        gap: 8px;
        width: 100% !important;
        max-width: 100% !important;
        grid-template-columns: none !important;
      }

      .product-table .fukushizai-main-row > #fukushizaiumu.form-row-select1 {
        order: 1;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-table .fukushizai-main-row > #fukushizai-1 {
        order: 2;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      .product-table .fukushizai-main-row > #fukushizai-2 {
        order: 3;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        align-self: stretch;
        box-sizing: border-box;
      }

      /* 副資材：手配先・請求先（SP）各 select 100% 縦並び */
      .product-table .fukushizai-tehai-seikyu-row {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 8px;
        width: 100% !important;
        max-width: 100% !important;
      }

      .product-table .fukushizai-tehai-seikyu-row__spacer {
        display: none;
      }

      .product-table .fukushizai-tehai-seikyu-row > label.field {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 6px;
        box-sizing: border-box;
      }

      .product-table .fukushizai-tehai-seikyu-row > label.field > select.select-tehai-seikyu-wide,
      .product-table .form-row-delivery-case-inline .field--production-delivery .desired-delivery-fields > select.desired-delivery-select {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        flex: 0 0 auto !important;
        min-height: unset !important;
        height: auto !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 8px 10px !important;
        font-family: inherit !important;
        font-size: 14px !important;
        line-height: 1.4 !important;
        align-self: stretch !important;
        box-sizing: border-box;
      }

      .product-table .select-tehai-seikyu-wide option,
      .product-table select.desired-delivery-select option {
        font-size: 14px !important;
      }

      .product-table .desired-delivery-fields {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      /* 備考（SP）：1項目1行 */
      .product-table .form-row.remarks-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .product-table .form-row.remarks-row > .field-label {
        width: auto;
        max-width: 100%;
        flex: none;
        padding-top: 0;
        box-sizing: border-box;
      }

      .product-table .form-row.remarks-row > .remarks-inputs-row {
        grid-template-columns: 1fr;
        gap: 8px;
        width: 100%;
        margin-left: 0;
      }

      .product-table .remarks-inputs-row input[type="text"] {
        width: 100% !important;
        max-width: 100% !important;
      }

      /* 仕入得意先・仕入先・参考画像（SP）：1項目1行 */
      .product-table .form-row.form-row-supplier-inputs-sp,
      .product-table .form-row.form-row-supplier-inputs-sp.form-row-select-wide {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 8px;
      }

      .product-table .form-row.form-row-supplier-inputs-sp > .label-with-button {
        flex: none;
        width: auto;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-supplier-inputs-sp > .supplier-inputs-wrapper {
        margin-left: 0 !important;
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-reference-images-sp {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 8px;
      }

      .product-table .form-row.form-row-reference-images-sp > .label-with-button {
        flex: none;
        width: auto;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .product-table .form-row.form-row-reference-images-sp > .reference-images-wrapper {
        margin-left: 0 !important;
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .product-table .supplier-input-row {
        flex-wrap: wrap;
      }

      .product-table .supplier-input-row:not(.supplier-input-row--shiiresaki):not(.supplier-input-row--shiire-tokuisaki) .autocomplete {
        flex: 1 1 100% !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      /* 仕入得意先・仕入先（SP）*/
      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row {
        position: relative;
        flex-wrap: nowrap;
        align-items: center;
        padding-right: 28px;
        box-sizing: border-box;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row .btn-delete-supplier {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        margin: 0;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row .autocomplete {
        flex: 1 1 0% !important;
        width: auto !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiiresaki {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiiresaki .autocomplete {
        flex: 0 0 auto !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;
        overflow-x: visible;
        row-gap: 8px;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .autocomplete {
        flex: 0 0 auto !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        width: 100%;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields .supplier-input,
      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields .supplier-input[name="shiireTokuisakiIriRate[]"] {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        flex: 0 0 auto !important;
        box-sizing: border-box;
      }

      .product-table .form-row.supplier-inputs-dynamic-rows-sp .supplier-input-row--shiire-tokuisaki .supplier-row-side-fields .supplier-row-check-label {
        align-self: flex-start;
      }

      /* ケース仕様・納期関連（SP）：各項目 100% 縦並び */
      .product-table .form-row-delivery-case-inline {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 8px;
        width: 100% !important;
        max-width: 100% !important;
        justify-items: stretch;
        box-sizing: border-box;
      }

      .product-table .form-row-delivery-case-inline > label.field {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0;
        margin: 0;
        box-sizing: border-box;
      }

      .product-table .form-row-delivery-case-inline > label.field > .field-label {
        width: auto;
        max-width: 100%;
        flex: none;
        white-space: normal;
        align-self: flex-start;
      }

      .product-table .form-row-delivery-case-inline > label.field--case-specification .autocomplete,
      .product-table .form-row-delivery-case-inline #caseSpecification {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }

      .product-table .form-row-delivery-case-inline > label.field .period-range-row--from-only,
      .product-table .form-row-delivery-case-inline > label.field .period-range-field {
        display: block;
        width: 100% !important;

  <script src="js/sidebar.js"></script>
  <script>
    function loadSharedSidebar() {
      const mount = document.getElementById('sidebarMount');
      if (!mount) return;

      if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
        console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
        return;
      }

      mount.innerHTML = window.SHARED_SIDEBAR_HTML;
      initSidebarCollapseToggle();
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      const content = document.querySelector('.content');
      if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

      const toggleImg = toggle.querySelector('img');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        content.classList.toggle('expanded');

        if (sidebar.classList.contains('closed')) {
          if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
        } else {
          if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
        }
      });

      toggle.dataset.bound = '1';
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.remove('active');
      overlay.classList.remove('show');
    }

    loadSharedSidebar();    

    const icon = document.querySelector('.header-account_circle');
    const menu = document.querySelector('.account-menu');

    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // クリックが外側に伝播しないように
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    // 見積依頼日・各種日付: カレンダーボタン押下で日付ピッカーを開く（root 以下に対して付与可能）
    function attachPeriodRangeFields(root) {
      var scope = root || document;
      var mqSp = window.matchMedia('(max-width: 767px)');

      function isSp() {
        return mqSp.matches;
      }

      function syncPickerFromText(picker, textInput) {
        var digits = (textInput.value || '').replace(/\D/g, '');
        if (digits.length === 8) {
          picker.value = digits.slice(0, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6, 8);
        } else {
          picker.value = '';
        }
      }

      function captureScrollState(anchor) {
        var saved = [];
        var seen = new Set();
        var node = anchor;
        while (node && node !== document.documentElement) {
          if (node.scrollLeft || node.scrollTop) {
            if (!seen.has(node)) {
              seen.add(node);
              saved.push({ el: node, left: node.scrollLeft, top: node.scrollTop });
            }
          }
          node = node.parentElement;
        }
        scope.querySelectorAll('.product-swiper, .content, .main-wrapper').forEach(function (el) {
          if ((el.scrollLeft || el.scrollTop) && !seen.has(el)) {
            seen.add(el);
            saved.push({ el: el, left: el.scrollLeft, top: el.scrollTop });
          }
        });
        saved.push({
          el: null,
          left: window.scrollX || document.documentElement.scrollLeft || 0,
          top: window.scrollY || document.documentElement.scrollTop || 0
        });
        return saved;
      }

      function restoreScrollState(saved) {
        if (!saved || !saved.length) return;
        function apply() {
          saved.forEach(function (item) {
            if (item.el === null) {
              window.scrollTo(item.left, item.top);
            } else {
              item.el.scrollLeft = item.left;
              item.el.scrollTop = item.top;
            }
          });
        }
        apply();
        requestAnimationFrame(apply);
        setTimeout(apply, 0);
        setTimeout(apply, 50);
        setTimeout(apply, 150);
      }

      function setPickerOpenLock(on) {
        document.documentElement.classList.toggle('period-picker-open', !!on);
      }

      function finishPickerSession(field, textInput) {
        var savedScroll = field._periodScrollSaved;
        if (!savedScroll) return;
        field._periodScrollSaved = null;
        setPickerOpenLock(false);
        restoreScrollState(savedScroll);
        try {
          textInput.focus({ preventScroll: true });
        } catch (_) {
          textInput.focus();
        }
      }

      function openDatePicker(field, picker, textInput) {
        syncPickerFromText(picker, textInput);

        if (isSp()) {
          field._periodScrollSaved = captureScrollState(field);
          setPickerOpenLock(true);
        }

        function restoreScrollNow() {
          if (!field._periodScrollSaved) return;
          restoreScrollState(field._periodScrollSaved);
        }

        try {
          if (typeof picker.showPicker === 'function') {
            var result = picker.showPicker();
            if (result && typeof result.finally === 'function') {
              result.finally(function () {
                if (isSp()) {
                  finishPickerSession(field, textInput);
                }
              });
            } else if (result && typeof result.then === 'function') {
              result.then(function () {
                if (isSp()) {
                  finishPickerSession(field, textInput);
                }
              }, function () {
                if (isSp()) {
                  finishPickerSession(field, textInput);
                }
              });
            }
          } else {
            var prevOpacity = picker.style.opacity;
            var prevPointer = picker.style.pointerEvents;
            picker.style.opacity = '0.01';
            picker.style.pointerEvents = 'auto';
            try {
              picker.focus({ preventScroll: true });
            } catch (_) {
              picker.focus();
            }
            picker.click();
            window.setTimeout(function () {
              picker.style.opacity = prevOpacity;
              picker.style.pointerEvents = prevPointer;
              finishPickerSession(field, textInput);
            }, 0);
          }
        } catch (_) {
          try {
            picker.focus({ preventScroll: true });
          } catch (__) {
            picker.focus();
          }
          picker.click();
          finishPickerSession(field, textInput);
        }

        if (isSp()) {
          restoreScrollNow();
          setTimeout(restoreScrollNow, 0);
          setTimeout(restoreScrollNow, 100);
        }
      }

      var fields = scope.querySelectorAll('.period-range-row--from-only .period-range-field');
      fields.forEach(function (field) {
        if (field.getAttribute('data-period-bound') === '1') return;
        field.setAttribute('data-period-bound', '1');
        var textInput = field.querySelector('.period-range-yyyymmdd');
        var picker = field.querySelector('.period-range-picker');
        var btn = field.querySelector('.period-range-calendar-btn');
        if (!picker || !btn || !textInput) return;

        picker.addEventListener('blur', function () {

          }
        });

        if ('oncancel' in picker) {

            }
          });
        }

        btn.addEventListener('click', function (e) {

          openDatePicker(field, picker, textInput);
        });

        picker.addEventListener('change', function () {
          if (!picker.value) return;
          textInput.value = picker.value.replace(/-/g, '');
          textInput.dispatchEvent(new Event('change', { bubbles: true }));
          if (isSp()) {
            finishPickerSession(field, textInput);
          }
        });
      });

    var GAUGE_ARC_LENGTH = Math.PI * 40;
    function setGaugeFillSegments(fillId, warn7Id, delayId, done, total, warn7, delay) {
      var L = GAUGE_ARC_LENGTH;
      var t = total > 0 ? total : 1;
      var w7 = (warn7 != null ? warn7 : 0);
      var dly = (delay != null ? delay : 0);
      var lenDone = (done / t) * L;
      var lenWarn7 = (w7 / t) * L;
      var lenDelay = (dly / t) * L;
      var el = document.getElementById(fillId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDone.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", "0");
      }
      el = document.getElementById(warn7Id);
      if (el) {
        el.setAttribute("stroke-dasharray", lenWarn7.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-lenDone).toFixed(2));
      }
      el = document.getElementById(delayId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDelay.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-(lenDone + lenWarn7)).toFixed(2));
      }
    }

    (function () {
      var swiper = document.getElementById("productSwiper");

      function getCards() {
        return swiper.querySelectorAll(".product-card");
      }

      function attachImageHandler(card) {
        var fileInput = card.querySelector(".product-image-input");
        var img = card.querySelector(".product-image");
        var wrapper = card.querySelector(".product-image-wrapper");
        if (!fileInput || !img || !wrapper) return;

        function loadFile(file) {
          if (!file || !file.type || !file.type.match(/^image\//)) return;
          var reader = new FileReader();
          reader.onload = function (e) {
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }

        // ファイル選択（ボタン・ラベル）
        fileInput.addEventListener("change", function () {
          if (!this.files || !this.files[0]) return;
          loadFile(this.files[0]);
        });

        // 画像クリックでファイル選択
        wrapper.addEventListener("click", function () {
          fileInput.click();
        });

        // ドラッグ＆ドロップ
        ["dragenter", "dragover"].forEach(function (ev) {
          wrapper.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            wrapper.classList.add("drag-over");
          });
        });
        ["dragleave", "dragend"].forEach(function (ev) {
          wrapper.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            wrapper.classList.remove("drag-over");
          });
        });
        wrapper.addEventListener("drop", function (e) {
          e.preventDefault();
          e.stopPropagation();
          wrapper.classList.remove("drag-over");
          var files = e.dataTransfer && e.dataTransfer.files;
          if (!files || !files[0]) return;
          loadFile(files[0]);
        });
      }

      getCards().forEach(attachImageHandler);
    })();

            var el = document.createElement("input");

            el.className = "supplier-input";
            el.setAttribute("name", name);
            el.placeholder = placeholder;
            el.setAttribute("inputmode", "decimal");
            el.setAttribute("autocomplete", "off");
            el.setAttribute("aria-label", ariaLabel);
            return el;
          }

          var tanka = makeTankaInput("shiireTokuisakiTanka[]", "単価", "単価");
          var uedai = makeTankaInput("shiireTokuisakiUedai[]", "上代", "上代");
          var kawase = makeTankaInput("shiireTokuisakiKawase[]", "為替", "為替");
          var keihiritsu = makeTankaInput("shiireTokuisakiKeihiritsu[]", "経費率", "経費率");
          var irirate = makeTankaInput("shiireTokuisakiIriRate[]", "値入率（％）", "値入率（％）");

          var checkLab = document.createElement("label");
          checkLab.className = "supplier-row-check-label";
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "supplier-row-checkbox";
          cb.setAttribute("name", "shiireTokuisakiCheck[]");
          cb.value = "1";
          cb.setAttribute("aria-label", "対象");
          checkLab.appendChild(cb);

          side.appendChild(tanka);
          side.appendChild(uedai);
          side.appendChild(kawase);
          side.appendChild(keihiritsu);
          side.appendChild(irirate);
          side.appendChild(checkLab);
          row.appendChild(side);
        }
        row.appendChild(deleteBtn);
        item.appendChild(row);
        return item;
      }

      var row = document.getElementById("productPanelsRow");
      if (!row) return;

      row.addEventListener("click", function (e) {
        var t1 = e.target.closest(".js-add-shiire-tokuisaki");
        var t2 = e.target.closest(".js-add-shiiresaki");
        if (!t1 && !t2) return;
        e.preventDefault();
        var card = (t1 || t2).closest(".product-card");
        if (!card) return;
        var container = t1
          ? card.querySelector(".js-shiire-tokuisaki-container")
          : card.querySelector(".js-shiiresaki-container");
        if (!container) return;
        var item = t1
          ? createSupplierRow("仕入得意先を入力", "shiireTokuisaki[]", "shiire")
          : createSupplierRow("仕入先を入力", "shiiresaki[]", "shiiresaki");
        container.appendChild(item);
        if (window.initAutocomplete) {
          window.initAutocomplete(item.querySelector(".autocomplete"));
        }
      });
    })();

    // 見積図案サムネイル：クリックでモーダル表示
    (function () {
      var thumb = document.querySelector(".item-thumb");
      var modal = document.getElementById("estimateImageModal");
      var modalImage = document.getElementById("estimateImageModalImage");
      var closeBtn = document.getElementById("estimateImageModalClose");
      if (!thumb || !modal || !modalImage || !closeBtn) return;

      function openModal(src) {
        modalImage.src = src || "images/noimage.png";
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
      }

      thumb.addEventListener("click", function () {
        openModal(thumb.getAttribute("src"));
      });

      closeBtn.addEventListener("click", function () {
        closeModal();
      });

      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("is-open")) {
          closeModal();
        }
      });
    })();

    /* ページネーション（keiyakushosofuiraikakunin.html より） */
    let deadlinePageCount = 0;
    let deadlineActivePage = 1;

    const MS_PAGINATION_PATH_FIRST = 'M440-240 200-480l240-240 56 56-183 184 183 184-56 56Zm264 0L464-480l240-240 56 56-183 184 183 184-56 56Z';
    const MS_PAGINATION_PATH_PREV = 'M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z';
    const MS_PAGINATION_PATH_NEXT = 'M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z';
    const MS_PAGINATION_PATH_LAST = 'M383-480 200-664l56-56 240 240-240 240-56-56 183-184Zm264 0L464-664l56-56 240 240-240 240-56-56 183-184Z';

    const DEADLINE_PAGINATION_VISIBLE_PAGE_COUNT = 5;

    function deadlinePaginationMsIcon(pathD) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 -960 960 960');
      svg.setAttribute('width', '15');
      svg.setAttribute('height', '15');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', pathD);
      p.setAttribute('fill', 'currentColor');
      svg.appendChild(p);
      return svg;
    }

    function renderDeadlinePagination() {
      const ul = document.getElementById('deadlinePaginationList');
      const nav = document.getElementById('deadlinePaginationNav');
      if (!ul || !nav) return;
      ul.replaceChildren();
      if (deadlinePageCount < 1) {
        nav.hidden = true;
        return;
      }
      nav.hidden = false;

      function appendNavControl(label, pathD, disabled, onActivate) {
        const li = document.createElement('li');
        li.className = 'deadline-pagination-item';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'deadline-pagination-link deadline-pagination-link--icon';
        b.setAttribute('aria-label', label);
        b.disabled = !!disabled;
        b.appendChild(deadlinePaginationMsIcon(pathD));
        b.addEventListener('click', () => {
          if (b.disabled) return;
          onActivate();
          renderDeadlinePagination();
        });
        li.appendChild(b);
        ul.appendChild(li);
      }

      const atFirst = deadlineActivePage <= 1;
      const atLast = deadlineActivePage >= deadlinePageCount;

      appendNavControl('先頭のページへ', MS_PAGINATION_PATH_FIRST, atFirst, () => {
        deadlineActivePage = 1;
      });
      appendNavControl('前のページへ', MS_PAGINATION_PATH_PREV, atFirst, () => {
        deadlineActivePage = Math.max(1, deadlineActivePage - 1);
      });

      const total = deadlinePageCount;
      const maxVis = DEADLINE_PAGINATION_VISIBLE_PAGE_COUNT;
      let rangeStart = 1;
      let rangeEnd = total;
      if (total > maxVis) {
        rangeStart = Math.max(1, Math.min(deadlineActivePage - 2, total - maxVis + 1));
        rangeEnd = rangeStart + maxVis - 1;
      }
      for (let i = rangeStart; i <= rangeEnd; i++) {
        const li = document.createElement('li');
        li.className = 'deadline-pagination-item';
        if (i === deadlineActivePage) li.classList.add('is-active');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'deadline-pagination-link';
        b.textContent = String(i);
        b.setAttribute('aria-label', 'ページ ' + i);
        if (i === deadlineActivePage) {
          b.setAttribute('aria-current', 'page');
        }
        b.addEventListener('click', () => {
          deadlineActivePage = i;
          renderDeadlinePagination();
        });
        li.appendChild(b);
        ul.appendChild(li);
      }

      appendNavControl('次のページへ', MS_PAGINATION_PATH_NEXT, atLast, () => {
        deadlineActivePage = Math.min(deadlinePageCount, deadlineActivePage + 1);
      });
      appendNavControl('末尾のページへ', MS_PAGINATION_PATH_LAST, atLast, () => {
        deadlineActivePage = deadlinePageCount;
      });
    }

    function setAddPageBtnVisible(show) {
      const addBtn = document.getElementById('deadlineAddPageBtn');
      if (!addBtn) return;
      addBtn.hidden = !show;
      addBtn.classList.toggle('deadline-area2-add-page--suppressed', !show);
      addBtn.toggleAttribute('aria-hidden', !show);
    }

    function setDeletePageBtnVisible(show) {
      const deleteBtn = document.getElementById('deadlineDeletePageBtn');
      if (!deleteBtn) return;
      const visible = !!show && deadlinePageCount >= 1;
      const canDelete = deadlinePageCount > 1;
      deleteBtn.hidden = !visible;
      deleteBtn.classList.toggle('deadline-area2-delete-page--suppressed', !visible);
      deleteBtn.toggleAttribute('aria-hidden', !visible);
      deleteBtn.disabled = !visible || !canDelete;
    }

    function showMitsumoriPagingUi() {
      deadlinePageCount = Math.max(1, deadlinePageCount || 1);
      deadlineActivePage = Math.min(
        Math.max(1, deadlineActivePage || 1),
        deadlinePageCount
      );
      setAddPageBtnVisible(true);
      setDeletePageBtnVisible(true);
      renderDeadlinePagination();
    }

    function initDeadlinePaging() {
      const deleteBtn = document.getElementById('deadlineDeletePageBtn');
      const addBtn = document.getElementById('deadlineAddPageBtn');
      if (!deleteBtn || !addBtn || addBtn.dataset.bound === '1') return;

      function refreshDeleteButtonInPagingMode() {
        setDeletePageBtnVisible(true);
      }

      addBtn.dataset.bound = '1';
      deleteBtn.dataset.bound = '1';
      addBtn.addEventListener('click', () => {
        deadlinePageCount += 1;
        deadlineActivePage = deadlinePageCount;
        renderDeadlinePagination();
        refreshDeleteButtonInPagingMode();
      });
      deleteBtn.addEventListener('click', () => {
        /* ページが1枚のみのときは削除しない */
        if (deadlinePageCount <= 1) return;
        deadlinePageCount -= 1;
        if (deadlineActivePage > deadlinePageCount) {
          deadlineActivePage = deadlinePageCount > 0 ? deadlinePageCount : 1;
        }
        renderDeadlinePagination();
        refreshDeleteButtonInPagingMode();
      });
    }

    initDeadlinePaging();
    showMitsumoriPagingUi();

  </script>
</body>
