<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 56px 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
    .content-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      overflow: hidden;
    }

    /* content-box内のpage-titleはdashboardのview-layout-titleと同じ見た目に合わせる */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    .content-box .search-box {
      flex-shrink: 0;
    }

    /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
    .content-box .pc-only {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-box .sp-only {
      flex: 1;
      min-height: 0;
    }

    .content-box .content-section {
      flex: 1;
      min-height: 0;
    }

    .modal-window {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      padding: 28px;
      width: 85%;
      max-width: 900px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2001;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      /* スマホ: 検索条件は折りたたみ式 */
      .search-toggle-sp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-weight: 500;
        color: var(--color-text);
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        cursor: pointer;
        text-align: left;
        box-sizing: border-box;
      }

      .search-toggle-sp-label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      .search-toggle-sp-icon {
        margin-right: 8px;
        flex-shrink: 0;
        vertical-align: middle;
      }

      .search-toggle-sp::after {
        content: "＋";
        color: var(--color-text-muted);
      }

      .search-box {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .search-box-inner {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }

      .search-box.is-open .search-box-inner {
        display: grid;
      }

      .search-box.is-open .search-toggle-sp::after {
        content: "ー";
      }

      /* 検索条件エリア：参照画面と同じ余白・レイアウト */
      .view-layout-1-group>.content-box:first-of-type {
        padding: 8px;
      }

      .view-layout-1-group>.content-box:first-of-type .view-layout-title {
        margin: 0 0 12px;
        padding: 0 0 8px;
      }

      .search-box-inner .filter-row {
        display: contents;
      }

      .search-box-inner .filter-item {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        min-width: 0;
      }

      .search-box-inner .filter-item .filter-label {
        margin-right: 0;
      }

      .search-box-inner .filter-item select,
      .search-box-inner .filter-item input[type="text"] {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }

      /* 検索結果一覧：スマホ時はカード形式（ヘッダ「図案情報」・5段構成） */
      #approvalListArea {
        overflow-x: visible;
        max-height: none;
      }

      #approvalListArea .result-table {
        min-width: 0;
      }

      #approvalListArea .result-table thead {
        display: none;
      }

      #approvalListArea .result-table tbody tr {
        display: block;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        margin-bottom: 12px;
        background: var(--color-card);
      }

      #approvalListArea .result-table tbody tr::before {

        display: block;
        color: var(--color-primary);
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--color-border);
      }

      #approvalListArea .result-table tbody td {
        display: block;
        border: none;
        padding: 4px 0;
        white-space: normal;
      }

      #approvalListArea .result-table tbody td:nth-child(1)::before {
        content: "図案管理番号：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(2)::before {
        content: "販売区分：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(3)::before {
        content: "展示会：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(4)::before {
        content: "カテゴリー：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(5)::before {
        content: "名称：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(6)::before {
        content: "アイテム数：";
        font-weight: 600;
      }

      /* 2段目は販売区分・展示会・商品分類を横並びで表示 */
      #approvalListArea .result-table tbody td:nth-child(2),
      #approvalListArea .result-table tbody td:nth-child(3),
      #approvalListArea .result-table tbody td:nth-child(4) {
        display: inline-block;
        width: auto;
        margin-right: 12px;
      }

      /* イメージ案②: スマホ用 */
      .view-layout-2 .status-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      /* ガントチャート */
      .timeline-wrapper {
        width: 100%;
        max-width: 400px;
      }

      .timeline-line {
        left: 20px;
        right: 20px;
      }
    }

    #tenjikaiSelect:hover,
    .dashboard-box select:hover {
      border-color: var(--color-primary);
    }

    #tenjikaiSelect:focus,
    .dashboard-box select:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.15);
    }

    /* ========== イメージ案：3つとも一括表示 ========== */
    .view-layout {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-1-group,
    .view-layout-3 {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    /* 図案情報検索（ページタイトル）専用の余白・線調整 */
    h1.view-layout-title {
      margin: 4px 0 8px 12px;
      padding-bottom: 0;
      border-bottom: none;
    }

    /* ========== 案①: 半円グラフ・承認通知・全体・課別 ========== */
    .view-layout-1 {
      padding: 0;
    }

    /* PCでは検索条件開閉ボタンを非表示（スマホは別メディアクエリで表示） */
    @media (min-width: 769px) {
      .search-toggle-sp {
        display: none;
      }
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    .filter-row input[type="text"],
    .filter-row select {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      min-width: 160px;
    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-box {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-box:first-of-type {
      margin-bottom: 5px;
    }

    .content-box h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }

    /* 検索結果一覧テーブル（スクロール対応） */
    /* PC/タブレット共通：テーブルエリアに縦横スクロール */
    #approvalListArea {
      width: 100%;
      max-height: 70vh;
      overflow-x: auto;
      overflow-y: auto;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      table-layout: fixed;
    }

    .result-table th,
    .result-table td {
      padding: 8px 10px;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      border-left: none;
      border-right: none;
      text-align: left;
      white-space: nowrap;
    }

    .result-table th {
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: #fff;
      font-weight: 600;
      border-top: none;
    }

    .result-table tr:nth-child(even) {
      background: var(--color-surface);
    }

    .result-table tr:hover {
      background: rgba(0, 134, 50, 0.06);
    }

    /* 図案管理番号リンク */
    .result-table a {
      color: #0066cc;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .result-table a:hover {
      opacity: 0.9;
    }

    /* 画面右下固定 新規登録ボタン（承認通知の詳細ボタンと同じ見た目） */
    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      min-width: 140px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    /* ========== 案②: ステータスボタン・①～⑨一覧・詳細ボタン ========== */
    .view-layout-2 {
      padding: 0;
    }

    .view-layout-2 .status-buttons {
      margin-bottom: 20px;
    }

    .view-layout-2 .list-section-title {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
    }

    /* 提出図案一覧（画像20個を折り返し表示） */
    .zuan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      padding: 8px 0 0;
    }

    .zuan-grid-item {
      display: block;
      background: var(--color-card);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      padding: 4px;
      box-shadow: var(--shadow-sm);
      text-align: center;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }

    .zuan-grid-item:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .zuan-grid-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: calc(var(--radius-sm) - 2px);
      display: block;
    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <div class="content-box">
        <h2 class="page-title">図案検索</h2>

        <!-- ========== 検索条件・検索結果一覧 ========== -->
        <div class="view-layout view-layout-1-group">
          <!-- 検索条件ボックス -->
          <div class="content-area">
            <div class="search-box" id="searchBox">
              <button type="button" class="search-toggle-sp" id="searchToggleSp" aria-expanded="false"
                aria-controls="searchRowsPanel">
                <span class="search-toggle-sp-label">
                  <img class="search-toggle-sp-icon" src="images/search_20dp_008632.svg" alt="" width="20" height="20">
                  <span class="search-toggle-sp-text">検索条件を開く</span>
                </span>
              </button>
              <div class="search-box-inner" id="searchRowsPanel">
                <div class="filter-row">
                  <div class="filter-item">
                    <span class="filter-label">販売区分</span>
                    <select id="searchHanbaiKubun">
                      <option value="">すべて</option>
                      <option value="teiban">定番</option>
                      <option value="teibankako">定番加工</option>
                      <option value="betchu">別注</option>
                      <option value="oem">OEM</option>
                    </select>
                  </div>
                  <div class="filter-item" id="tenjikaiFilterItem">
                    <span class="filter-label">展示会</span>
                    <select id="tenjikaiSelect">
                      <option value="">すべて</option>
                      <option value="2026.06">2026.06 展示会</option>
                      <option value="2026.03">2026.03 展示会</option>
                      <option value="2026.01">2026.01 展示会</option>
                    </select>
                  </div>
                  <div class="filter-item">
                    <span class="filter-label">カテゴリー</span>
                    <select id="searchCategory">
                      <option value="">すべて</option>
                      <option value="tanpin">単品タオル</option>
                      <option value="kikaku">企画物タオル</option>
                    </select>
                  </div>
                  <div class="filter-item">
                    <label class="filter-label">商品コード</label>
                    <select id="productCodeSelect">

  <script>
    function loadSharedSidebar() {
      const mount = document.getElementById('sidebarMount');
      if (!mount) return;

      if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
        console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
        return;
      }

      mount.innerHTML = window.SHARED_SIDEBAR_HTML;
      initSidebarCollapseToggle();
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      const content = document.querySelector('.content');
      if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

      const toggleImg = toggle.querySelector('img');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        content.classList.toggle('expanded');

        if (sidebar.classList.contains('closed')) {
          if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
        } else {
          if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
        }
      });

      toggle.dataset.bound = '1';
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.remove('active');
      overlay.classList.remove('show');
    }

    loadSharedSidebar();
    
    const icon = document.querySelector('.header-account_circle');
    const menu = document.querySelector('.account-menu');

    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // クリックが外側に伝播しないように
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    // 初期表示（承認待ち）※ updateLayout1 が定義されている場合のみ実行

      var sel = document.getElementById("tenjikaiSelect");
      if (!sel || typeof updateLayout1 !== "function") return;

      sel.value = "";

      sel.addEventListener("change", function () {
        updateLayout1(this.value);
      });
    })();

        return {
          tanpin: "単品タオル",
          kikaku: "企画物タオル"
        }[value] || "";
      }

      function applyFilter() {
        var condHanbai = selHanbai ? selHanbai.value : "";
        var condTenjikai = selTenjikai ? selTenjikai.value : "";
        var condCategory = selCategory ? selCategory.value : "";
        var hanbaiLabel = mapHanbai(condHanbai);
        var categoryLabel = mapCategory(condCategory);

        Array.prototype.forEach.call(tbody.rows, function (row) {
          var cellHanbai = row.cells[1] ? row.cells[1].textContent.trim() : "";
          var cellTenjikai = row.cells[2] ? row.cells[2].textContent.trim() : "";
          var cellCategory = row.cells[4] ? row.cells[4].textContent.trim() : "";
          var match = true;

          if (condHanbai === "teiban_else") {
            if (cellHanbai === "定番") match = false;
          } else if (condHanbai && cellHanbai !== hanbaiLabel) {
            match = false;
          }

          if (condTenjikai) {
            if (!cellTenjikai || cellTenjikai.indexOf(condTenjikai) !== 0) match = false;
          }
          if (condCategory && cellCategory !== categoryLabel) match = false;

          row.style.display = match ? "" : "none";
        });
      }

      [selHanbai, selTenjikai, selCategory].forEach(function (el) {
        if (el) el.addEventListener("change", applyFilter);
      });
      applyFilter();
    })();

    // スマホ: 検索条件の折りたたみ開閉
    (function () {
      var btn = document.getElementById("searchToggleSp");
      var box = document.getElementById("searchBox");
      if (btn && box) {
        btn.addEventListener("click", function () {
          var isOpen = box.classList.toggle("is-open");
          btn.setAttribute("aria-expanded", isOpen);
          var textEl = btn.querySelector(".search-toggle-sp-text");
          if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
        });
      }
    })();
  </script>
</body>

</html>
