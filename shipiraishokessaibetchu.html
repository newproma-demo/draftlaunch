<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    html {
      height: 100%;
      overflow: hidden;
      scrollbar-gutter: auto;
    }

    @supports (height: 100dvh) {
      html {
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    body {
      margin: 0;
      background: var(--color-surface);
      color: var(--color-text);
      height: 100%;
      min-height: 0;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @supports (height: 100dvh) {
      body {
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      /* max-height: calc(100%-48px); */
      overflow: hidden;
    }

    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 16px;
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      /* margin-left: 10px; */
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
      font-size: 16px;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      height: calc(100%-48px);
      width: 100%;
      background: var(--color-surface);
      padding: 24px 24px 24px 32px;
      transition: margin-left 0.3s ease;
    }


    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    /* #endregion */

    /* 画面右下固定 新規登録・修正ボタン（承認通知の詳細ボタンと同じ見た目） */
    .fab-buttons-wrap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      flex-direction: row;
      gap: 8px;
      align-items: center;
    }

    .fab-buttons-wrap .btn-fab-new {
      position: static;
    }

    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      min-width: 60px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .view-layout {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-1-group,
    .view-layout-3 {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
    }

    .view-layout-1 {
      padding: 0;
    }

    .content-area {
      flex: 1;
      height: 88%;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      /* margin-bottom: 24px; */
      box-shadow: var(--shadow-sm);
    }

    .tab-list {
      font-size: 16px;
      display: flex;
      gap: 0;
      margin: 0 0 0;
      padding: 0;
      list-style: none;
      border-bottom: 2px solid var(--color-border);
    }

    .tab-list li {
      margin: 0;
    }

    .tab-list button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-list button:hover {
      color: var(--color-text);
    }

    .tab-list button.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }

    .shiyosho-tabpanel {
      flex: 1;
      height: 85%;
      display: none;
      margin-top: 12px;
      min-height: 0;
      box-sizing: border-box;
    }

    .shiyosho-tabpanel.is-active {
      display: block;
    }

    .shiyosho-panel-grid {
      display: grid;
      grid-template-columns: 6.5fr 3.5fr;
      grid-template-rows: 1fr 12fr;
      gap: 12px;
      height: 100%;
      min-height: 0;
      min-width: 0;
      box-sizing: border-box;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .shiyosho-panel1 {
      grid-row: 1 / -1;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel2 {
      grid-row: 1;
      grid-column: 2;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel3 {
      grid-row: 2;
      grid-column: 2;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    /* 画面イメージ右横：決裁結果セレクト＋その下に理由入力 */
    .shiyosho-panel-kessai-select-top {
      grid-row: 1 / -1;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 10px;
      min-height: 0;
      min-width: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel-kessai-select-top .result-reason-wrap {
      display: none;
      align-self: stretch;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .shiyosho-panel-kessai-select-top .result-reason-wrap.is-visible {
      display: block;
    }

    .shiyosho-panel-kessai-select-top .result-reason-wrap textarea {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      min-height: 88px;
      padding: 8px 12px;
      font-size: var(--fs-sm);
      font-family: inherit;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      color: var(--color-text);
      resize: vertical;
    }

    .btn-panel-register {
      display: inline-block;
      text-decoration: none;
      min-width: 80px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      font-size: inherit;
    }

    .btn-panel-register:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .panel2-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel2-page-nav {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1px solid #d8d8d8;
      border-radius: 4px;
      overflow: hidden;
    }

    .btn-panel-page {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      background: transparent;
      color: #0d6efd;
      border: none;
      border-right: 1px solid #d8d8d8;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      font-size: 16px;
      line-height: 34px;
    }

    .btn-panel-page:last-child {
      border-right: none;
    }

    .btn-panel-page.is-current {
      background: #0d6efd;
      color: #fff;
      font-weight: 600;
    }

    .btn-panel-page.is-ellipsis {
      color: #6c757d;
      cursor: default;
    }

    .shiyosho-item {
      /* flex: 1; */
      max-width: 70%;
      padding: 12px;
    }

    .shiyosho-item.img-scroll {
      height: 90%;
      width: 100%;
      max-width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -ms-overflow-style: none;
    }

    .shiyosho-panel1>.shiyosho-item.img-scroll {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .shiyosho-item.img-scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .img-scroll img {
      /* width: 60%;
      max-width: 70%; */
      width: 100%;
      max-width: none;
      height: auto;
      display: block;
    }


    /*  */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      font-size: 16px;
      margin-right: 4px;
    }

    .filter-row input[type="text"],
    .filter-row select {
      font-size: 16px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      min-width: 160px;
    }

    /* 決裁結果セレクト：選択時のリスト表示を小さめに（ブラウザにより option の反映度は異なる） */
    #kessaiResultSelectPanel1 {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      min-width: 160px;
      font-family: inherit;
      background: var(--color-card);
      color: var(--color-text);
    }

    /*  */

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      /* 縦に収まらないコンテンツ（理由テキストエリアなど）をスクロールで見られるようにする */
      html {
        overflow-x: hidden;
        overflow-y: auto;
        height: auto;
        min-height: 100%;
        max-height: none;
        -webkit-overflow-scrolling: touch;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
        height: auto;
        min-height: 100%;
        max-height: none;
        -webkit-overflow-scrolling: touch;
      }

      .main-wrapper {
        flex: none;
        min-height: calc(100vh - 48px);
        overflow: visible;
      }

      @supports (height: 100dvh) {
        html {
          min-height: 100dvh;
        }

        body {
          min-height: 100dvh;
        }

        .main-wrapper {
          min-height: calc(100dvh - 48px);
        }
      }

      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 0 0 auto;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        overflow: visible;
      }

      .content-area {
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        height: auto;
        min-height: 0;
        flex: 0 0 auto;
        overflow: visible;
      }

      .shiyosho-tabpanel {
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        height: auto;
        min-height: 0;
        flex: none;
        overflow: visible;
      }

      /* スマホ：依頼書イメージを小さくしすぎない（70%制限解除＋縦積みで横幅いっぱい） */
      .shiyosho-panel-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        max-width: 100%;
        height: auto;
        min-height: 0;
        overflow: visible;
      }

      .shiyosho-panel1 {
        grid-row: 1;
        grid-column: 1;
        min-height: min(42vh, 380px);
        flex-shrink: 0;
      }

      .shiyosho-panel-kessai-select-top {
        grid-row: 2;
        grid-column: 1;
        align-items: stretch;
        max-width: 100%;
        flex-shrink: 0;
        min-height: 0;
      }

      /* テキストエリア・セレクトがパネル幅を超えないようにする */
      #kessaiResultSelectPanel1 {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .shiyosho-panel1 .shiyosho-item {
        max-width: 100%;
        width: 100%;
        align-self: stretch;
        box-sizing: border-box;
      }

      .shiyosho-panel1 .shiyosho-item.img-scroll {
        flex: 1 1 auto;
        min-height: 200px;
        overflow-y: auto;
      }

      .shiyosho-panel-kessai-select-top .result-reason-wrap textarea {
        min-height: 7.5rem;
      }

    }

    /* #endregion */
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定 登録ボタン -->
    <div class="fab-buttons-wrap">
      <a href="" class="btn-fab-new">登録</a>
    </div>

    <!--#region メインコンテンツ  -->
    <div class="content">
      <div class="content-area" id="approvalNoticeArea">
        <h2 class="view-layout-title">Ship依頼書決裁（別注）</h2>

        <!-- Ship依頼書決裁（別注）パネル -->
        <div id="panel1" class="shiyosho-tabpanel is-active" role="tabpanel" aria-labelledby="tab1">
          <div class="shiyosho-panel-grid">
            <div class="shiyosho-panel1">
              <div class="shiyosho-item img-scroll">
                <img src="images/別注SHIP依頼書.png" alt="Ship依頼書（別注）">
              </div>
            </div>
            <div class="shiyosho-panel-kessai-select-top">
              <select id="kessaiResultSelectPanel1" name="kessaiResultPanel1" aria-label="決裁結果">
                <option value="" selected disabled>決裁結果を選択してください</option>
                <option value="承認">承認</option>
                <option value="差戻し">差戻し</option>
                <option value="中止">中止</option>
              </select>
              <div id="resultReasonWrap" class="result-reason-wrap" aria-hidden="true">
                <textarea id="resultReason" name="resultReason" rows="4" placeholder="理由を入力してください"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- #endregion -->

  <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    tabs.forEach(tab => {
      const button = tab.querySelector('button');

      button.addEventListener('click', () => {

        // タブの状態切替
        tabs.forEach(t => {
          const btn = t.querySelector('button');
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-selected', 'true');

        // パネル切替
        const target = tab.getAttribute('aria-controls');
        panels.forEach(p => {
          if (p.id === target) {
            p.hidden = false;
            p.classList.add('is-active');
          } else {
            p.hidden = true;
            p.classList.remove('is-active');
          }
        });
      });
    });

    (function initCartonMarkFormatPreview() {
      const select = document.getElementById('carton-mark-format');
      const img = document.getElementById('carton-mark-preview');
      if (!select || !img) return;

      function applySelection() {
        const opt = select.options[select.selectedIndex];
        img.src = opt.value;
        img.alt = opt.text;
      }

      select.addEventListener('change', applySelection);
      applySelection();
    })();

    (function initKessaiResultReasonVisibility() {
      const select = document.getElementById('kessaiResultSelectPanel1');
      const wrap = document.getElementById('resultReasonWrap');
      const reason = document.getElementById('resultReason');
      if (!select || !wrap) return;

      function needsReason(value) {
        return value === '差戻し' || value === '中止';
      }

      function apply() {
        const show = needsReason(select.value);
        if (show) {
          wrap.classList.add('is-visible');
          wrap.setAttribute('aria-hidden', 'false');
        } else {
          wrap.classList.remove('is-visible');
          wrap.setAttribute('aria-hidden', 'true');
          if (reason) reason.value = '';
        }
      }

      select.addEventListener('change', apply);
      apply();
    })();

  </script>
</body>

</html>
