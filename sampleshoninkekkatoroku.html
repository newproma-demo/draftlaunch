<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 25px);
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 24px 32px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      gap: 10px;
      height: 97vh;
      /* 登録ボタン（fixed bottom）の上まで確保 */
      padding-bottom: 56px;
      box-sizing: border-box;
      /* 必要なら画面いっぱいに */
    }

    .content h1 {
      grid-column: 1;
      grid-row: 1;
    }

    .content-area-1 {
      grid-column: 1;
      grid-row: 2;
      width: 100%;
    }

    .result-select-block {
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-select-block .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .result-reason-wrap {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 100%;
    }

    .result-reason-wrap.is-visible {
      display: flex;
    }

    .result-reason-wrap label {
      font-weight: 600;
      color: var(--color-text);
    }



    .product-image-wrapper {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      background-color: #fafafa;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .product-image-wrapper.dragover,
    .product-card.dragover .product-image-wrapper {
      border-color: var(--color-primary);
      background-color: #f0f8ff;
    }

    /* カード全体をドロップ可能に（子の canvas 上でも受け取れるよう capture で処理） */
    .product-card.dragover,
    .detail-row-upload.dragover {
      outline: 2px dashed var(--color-primary);
      outline-offset: 2px;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が768px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

      .dashboard-section {
        display: flex;
        gap: 24px;
        margin-top: 0;
        width: 100%;
        flex-direction: column;
        padding-bottom: 20px;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      .content-area-1 {
        position: relative;
        z-index: 2;
      }
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    /* 画面右下固定 新規登録ボタン */
    .btn-fab-new {
      position: fixed;
      right: 24px;
      bottom: 12px;
      z-index: 2001;
      min-width: 100px;
      width: clamp(80px, 5vw, 120px);
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
    }

    .product-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 3px;
      box-sizing: border-box;
      background: #fff;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .product-nav {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .product-nav-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--color-text);
      white-space: nowrap;
    }

    .product-nav-btn:hover:not(:disabled) {
      background: var(--color-surface);
    }

    .product-nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* 枠内に必ず収める（縦横比は維持・はみ出し・スクロールなし） */
    img.product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    /* PDF は PDF.js で canvas に描画（iframe blob は多くの環境でブロックされるため） */
    .product-pdf-canvas-wrap {
      display: none;
      width: 100%;
      height: 100%;
      overflow: auto;
      align-items: center;
      justify-content: center;
      background: #e8e8e8;
      box-sizing: border-box;
    }

    .product-image-wrapper.is-pdf .product-pdf-canvas-wrap {
      display: flex;
    }

    .product-image-wrapper.is-pdf img.product-image {
      display: none;
    }

    .product-pdf-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .product-pdf-fallback {
      display: none;
      padding: 12px;
      text-align: center;
      font-size: var(--fs-sm, 14px);
    }

    .product-image-wrapper.is-pdf-fallback .product-pdf-fallback {
      display: block;
    }

    .product-image-wrapper.is-pdf-fallback .product-pdf-canvas-wrap {
      display: none;
    }

    .product-pdf-fallback a {
      color: var(--color-primary, #008632);
      word-break: break-all;
    }

    .product-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      order: 0;
    }

    .product-table th,
    .product-table td {
      font-size: clamp(var(--fs-sm), 0.5vw + 8px, var(--fs-lg));
      border: 1px solid var(--color-border);
      padding: 4px 6px;
      vertical-align: middle;
    }

    .product-table th {
      background: #f5f7fa;
    }

    .product-table input,
    .product-table textarea {
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 4px 6px;
    }

    .product-table .half-field {
      width: 100%;
      max-width: 100%;
    }

    .detail-table {
      width: 95%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .detail-table tr+tr td {
      border-top: 1px solid var(--color-border);
    }

    .detail-table td {
      padding: 6px 8px;
    }

    /* 先頭行（例: 1stサンプル）だけを上に寄せる */
    .detail-table td .detail-name:first-of-type {
      position: relative;
      top: -12px;
    }

    .detail-delete-cell {
      width: 32px;
      text-align: center;
      vertical-align: middle;
    }

    .detail-delete-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: #fff;
      color: #000;
      cursor: pointer;
      line-height: 1;
      font-weight: 700;
      padding: 0;
    }

    .detail-delete-btn:hover {
      background: #f0f0f0;
    }

    /* detail-meta の後ろ列：行ごとの画像アップロード（product-card と同機能・コンパクト） */
    .detail-table td.detail-image-cell {
      width: 150px;
      max-width: 160px;
      vertical-align: top;
      padding: 6px;
    }

    .detail-row-upload {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      overflow: hidden;
      min-height: 0;
    }

    .detail-row-upload .product-image-wrapper {
      flex: none;
      height: 100px;
      min-height: 80px;
      cursor: pointer;
    }

    .detail-row-upload .product-pdf-fallback {
      padding: 6px;
      font-size: var(--fs-xs, 10px);
    }

    .detail-row-upload .product-pdf-fallback p {
      margin: 0 0 4px;
    }

    @media (min-width: 900px) {
      .product-card {
        padding: 8px;
        gap: 8px;
        min-height: 0;
        overflow: hidden;
      }

      .product-table th,
      .product-table td {
        padding: 2px 4px;
      }

      .product-table input,
      .product-table textarea,
      .product-table select {
        padding: 2px 4px;
      }

      .product-table textarea {
        min-height: 32px;
      }
    }

    .content-area-1 {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion --> 

    <!-- 画面右下固定 新規登録ボタン -->
    <button type="button" class="btn-fab-new">登録</button>

    <!--#region メインコンテンツ  -->
    <div class="content">
      <!-- 画面タイトル -->
      <h1>サンプル承認結果登録</h1>
      <!-- ========== : 検索条件・検索結果一覧 ========== -->
      <!-- 検索条件ボックス -->
      <div class="content-area-1">
        <table class="detail-table" id="detailTableProductList">
          <tbody id="detailTableProductListBody">
            <tr>
              <td>
                <div class="detail-name">1stサンプル</div>
                <div class="detail-name">999991&nbsp;&nbsp;&nbsp;ミッキーA柄タオル</div>
                <div class="detail-meta">定番（2026.01展示会）｜単品タオル｜ミニタオル｜ディズニー</div>
              </td>
              <td class="detail-image-cell">
                <div class="detail-row-upload">
                  <div class="product-image-wrapper">
                    <img class="product-image" src="images/zuan002.png" alt="商品画像プレビュー">
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="result-select-block">
          <div class="filter-item">
            <select id="resultSelect" name="result">
              <option value="" selected disabled>選定結果を選択してください</option>
              <option value="承認">承認</option>
              <option value="差戻し">差戻し</option>
              <option value="取消">取消</option>
            </select>
          </div>
          <div id="resultReasonWrap" class="result-reason-wrap" aria-hidden="true">
            <textarea id="resultReason" name="resultReason" rows="4" placeholder="理由を入力してください"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF.js（blob URL の iframe 表示がブロックされる環境向け） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

    const icon = document.querySelector('.header-account_circle');
    const menu = document.querySelector('.account-menu');

    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // クリックが外側に伝播しないように
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    // 共通項目「展示会」は販売区分が「定番」のときだけ表示
    (function () {
      var selHanbaiCommon = document.getElementById("searchHanbaiKubun");
      var tenjikaiField = document.getElementById("commonTenjikaiField");
      var searchTenjikai = document.getElementById("searchTenjikai");
      if (!selHanbaiCommon || !tenjikaiField) return;

      function toggleTenjikaiByHanbai() {
        if (selHanbaiCommon.value === "teiban") {
          tenjikaiField.style.display = "";
        } else {
          tenjikaiField.style.display = "none";
          if (searchTenjikai) {
            searchTenjikai.value = "";
          }
        }
      }

      // 初期表示と変更時の制御
      toggleTenjikaiByHanbai();
      selHanbaiCommon.addEventListener("change", toggleTenjikaiByHanbai);
    })();

    // 画像／PDF アップロード（product-card および detail-row-upload 各行で共通）
    (function () {
      if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      function getFilesFromDataTransfer(dt) {
        if (!dt) return null;
        if (dt.files && dt.files.length) return dt.files;
        if (dt.items && dt.items.length) {
          var arr = [];
          for (var i = 0; i < dt.items.length; i++) {
            if (dt.items[i].kind === 'file') {
              var f = dt.items[i].getAsFile();
              if (f) arr.push(f);
            }
          }
          if (arr.length) return arr;
        }
        return null;
      }

      function bindImageUploader(container) {
        if (!container) return;
        var wrapper = container.querySelector('.product-image-wrapper');
        var img = container.querySelector('.product-image');
        var pdfCanvas = container.querySelector('.product-pdf-canvas');
        var pdfOpenTab = container.querySelector('.product-pdf-open-tab');
        var fileInput = container.querySelector('.product-image-input');
        if (!wrapper || !img || !fileInput) return;

        var pdfObjectUrl = null;

        function revokePdfUrl() {
          if (pdfObjectUrl) {
            URL.revokeObjectURL(pdfObjectUrl);
            pdfObjectUrl = null;
          }
        }

        function showImagePreview(dataUrl) {
          revokePdfUrl();
          wrapper.classList.remove('is-pdf', 'is-pdf-fallback');
          if (pdfOpenTab) pdfOpenTab.href = '#';
          img.src = dataUrl;
        }

        function showPdfFallback(file) {
          revokePdfUrl();
          pdfObjectUrl = URL.createObjectURL(file);
          wrapper.classList.add('is-pdf', 'is-pdf-fallback');
          if (pdfOpenTab) pdfOpenTab.href = pdfObjectUrl;
        }

        function showPdfPreview(file) {
          wrapper.classList.remove('is-pdf-fallback');
          if (typeof pdfjsLib === 'undefined' || !pdfCanvas) {
            showPdfFallback(file);
            return;
          }
          revokePdfUrl();
          pdfObjectUrl = URL.createObjectURL(file);
          if (pdfOpenTab) pdfOpenTab.href = pdfObjectUrl;

          var reader = new FileReader();
          reader.onerror = function () { showPdfFallback(file); };
          reader.onload = function (e) {
            var arrayBuffer = e.target.result;
            var loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            loadingTask.promise.then(function (pdf) { return pdf.getPage(1); })
              .then(function (page) {
                var baseViewport = page.getViewport({ scale: 1 });
                var w = wrapper.clientWidth || 400;
                var h = wrapper.clientHeight || 300;
                var scale = Math.min(w / baseViewport.width, h / baseViewport.height, 2);
                var viewport = page.getViewport({ scale: scale });
                pdfCanvas.width = viewport.width;
                pdfCanvas.height = viewport.height;
                var ctx = pdfCanvas.getContext('2d');
                return page.render({ canvasContext: ctx, viewport: viewport }).promise;
              })
              .then(function () { wrapper.classList.add('is-pdf'); })
              .catch(function () { showPdfFallback(file); });
          };
          reader.readAsArrayBuffer(file);
        }

        function handleFiles(files) {
          if (!files || !files.length) return;
          var file = files[0];
          var isPdfLike = file.type === 'application/pdf' ||
            /\.pdf$/i.test(file.name) || /\.ai$/i.test(file.name);
          var isImage = file.type && file.type.indexOf('image/') === 0;
          if (isPdfLike) {
            showPdfPreview(file);
            return;
          }
          if (!isImage) return;
          var r = new FileReader();
          r.onload = function (e) { showImagePreview(e.target.result); };
          r.readAsDataURL(file);
        }

        wrapper.addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function (e) { handleFiles(e.target.files); });

        var dropZone = container.classList.contains('product-card') ? container :
          (container.classList.contains('detail-row-upload') ? container : wrapper);

        function setDragOver(active) {
          wrapper.classList.toggle('dragover', active);
          dropZone.classList.toggle('dragover', active);
        }

        function isOutsideDropZone(target) {
          if (!target || !dropZone.contains) return true;
          return !dropZone.contains(target);
        }

        dropZone.addEventListener('dragenter', function (e) {
          e.preventDefault();
          e.stopPropagation();
          setDragOver(true);
        }, true);
        dropZone.addEventListener('dragover', function (e) {
          e.preventDefault();
          e.stopPropagation();
          try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {}
          setDragOver(true);
        }, true);
        dropZone.addEventListener('dragleave', function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (isOutsideDropZone(e.relatedTarget)) setDragOver(false);
        }, true);
        dropZone.addEventListener('drop', function (e) {
          e.preventDefault();
          e.stopPropagation();
          setDragOver(false);
          var fileList = getFilesFromDataTransfer(e.dataTransfer);
          if (fileList && fileList.length) handleFiles(fileList);
        }, true);
        dropZone.addEventListener('dragend', function () { setDragOver(false); }, true);

        if (pdfOpenTab) {
          pdfOpenTab.addEventListener('click', function (e) {
            e.stopPropagation();
            if (pdfOpenTab.getAttribute('href') === '#') e.preventDefault();
          });
        }
      }

      // メインの product-card
      var mainInput = document.getElementById('productImageInput');
      if (mainInput) {
        bindImageUploader(mainInput.closest('.product-card'));
      }
      // detail-table 各行の detail-row-upload
      document.querySelectorAll('.detail-row-upload').forEach(function (el) {
        bindImageUploader(el);
      });

      // モーダル追加で行が増えたあとに呼ぶ用（グローバルに出す）
      window.bindDetailRowImageUploader = function (root) {
        if (root) {
          root.querySelectorAll('.detail-row-upload').forEach(bindImageUploader);
        }
      };
    })();

    // 結果select：差戻し・取消のとき理由入力欄を表示
    (function () {
      var sel = document.getElementById('resultSelect');
      var wrap = document.getElementById('resultReasonWrap');
      var reason = document.getElementById('resultReason');
      if (!sel || !wrap) return;

      function toggleReason() {
        var v = sel.value;
        var needReason = (v === '差戻し' || v === '取消');
        if (needReason) {
          wrap.classList.add('is-visible');
          wrap.setAttribute('aria-hidden', 'false');
        } else {
          wrap.classList.remove('is-visible');
          wrap.setAttribute('aria-hidden', 'true');
          if (reason) reason.value = '';
        }
      }

      sel.addEventListener('change', toggleReason);
      toggleReason();
    })();

    // 明細行の削除（×ボタン）
    (function () {
      const table = document.querySelector('.detail-table');
      if (!table) return;

      table.addEventListener('click', function (e) {
        const btn = e.target.closest('.detail-delete-btn');
        if (!btn) return;

        const row = btn.closest('tr');
        if (row) {
          row.remove();
        }
      });
    })();
  </script>
</body>

</html>
