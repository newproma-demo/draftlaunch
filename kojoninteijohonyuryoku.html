<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メニュー */
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: #fff;
      padding: 12px 0;
      box-sizing: border-box;
      overflow: visible;
      position: relative;
      z-index: 100;
      transition: transform 0.3s ease;
      box-shadow: 2px 0 12px rgba(0, 134, 50, 0.15);
    }

    .sidebar.closed {
      transform: translateX(-220px);
    }

    .sidebar-toggle {
      position: absolute;
      left: 220px;
      top: 12px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-left: none;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      cursor: pointer;
      padding: 6px 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s ease;
    }

    .sidebar-toggle:hover {
      background: var(--color-surface);
    }

    .sidebar-toggle img {
      width: 12px;
      height: 13px;
      padding-top: 0;
      pointer-events: none;
    }

    .sidebar h2 {
      margin: 8px 12px 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
    }

    .sidebar-logo-proma {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
    }

    .sidebar-logo-marushin {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 56px 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
    .content-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      overflow: hidden;
    }

    /* エントリーフォーム用スクロールエリア */
    .entry-form {
      margin-top: 16px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding-right: 8px;
      box-sizing: border-box;
    }

    .entry-form .form-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .entry-form label {
      font-weight: 500;
      width: 180px;
      flex-shrink: 0;
      padding-top: 8px;
      line-height: 1.4;
    }

    /* .period-range-picker は style.css で絶対配置の補助用のため除外 */
    .entry-form input:not(.period-range-picker),
    .entry-form textarea {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base);
      box-sizing: border-box;
    }

    .entry-form .form-row-hinshu .hinshu-inputs {
      flex: 1;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .entry-form .form-row-hinshu .hinshu-inputs input {
      flex: 1;
      min-width: 0;
    }

    .entry-form .form-row-item-inputs .label-with-button {
      width: 180px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding-top: 8px;
      box-sizing: border-box;
    }

    .entry-form .form-row-item-inputs .label-with-button label {
      width: auto;
      padding-top: 0;
    }

    .entry-form .item-inputs-wrapper {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .entry-form .item-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .entry-form .item-input-row .autocomplete {
      width: 250px;
      max-width: 100%;
      min-width: 0;
    }

    .entry-form #itemInputsContainer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 追加ボタン共通（mitsumorijohotoroku.html と同様） */
    .entry-form .btn-add-image {
      align-self: flex-start;
      padding: 8px 16px;
      background: var(--color-primary);
      color: #fff;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      font-size: 16px;
    }

    .entry-form .btn-add-image:hover {
      background: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
    }

    .entry-form .btn-add-image--small {
      transform: scale(0.75);
      transform-origin: left top;
    }

    /* 削除×ボタン（mitsumorijohotoroku.html と同様） */
    .entry-form .item-input-row .btn-delete-supplier {
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .entry-form .item-input-row .btn-delete-supplier:hover {
      background: rgba(200, 0, 0, 0.9);
    }

    .entry-form .form-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .entry-form .btn-primary,
    .entry-form .btn-secondary {
      min-width: 100px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    .entry-form .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .entry-form .btn-secondary {
      background: var(--color-card);
      color: var(--color-text);
    }

    /* content-box内のpage-titleはdashboardのview-layout-titleと同じ見た目に合わせる */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    .content-box .search-box {
      flex-shrink: 0;
    }

    /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
    .content-box .pc-only {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-box .sp-only {
      flex: 1;
      min-height: 0;
    }

    .content-box .content-section {
      flex: 1;
      min-height: 0;
    }

    .modal-window {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      padding: 28px;
      width: 85%;
      max-width: 900px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2001;
    }

    /* #region レスポンシブ対応 */
    /* 画面の高さが750px以下ならロゴを非表示 */
    @media (max-height: 750px) {
      .sidebar-logo-proma {
        display: none;
      }
    }

    /* 画面の高さが600px以下ならロゴを非表示 */
    @media (max-height: 600px) {
      .sidebar-logo-marushin {
        display: none;
      }
    }

    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* サイドバーを隠す */
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 2000;
      }

      /* 開いた状態 */
      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar-toggle {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

      /*
       * スマホ：ラベル左・入力右の2列を .entry-form に一本化（各 .form-row は display:contents）。
       * 会社名（日本語）とアイテム（静的・動的）が同じ「入力列」トラックを共有し、テキストボックス幅が一致する。
       */
      .entry-form {
        /* ラベル列を抑え、入力列（1fr）を広げる */
        --entry-sp-label-col: 8em;
        --entry-sp-label-field-gap: 1px;
        padding-right: 2px;
        display: grid;
        grid-template-columns: var(--entry-sp-label-col) minmax(0, 1fr);
        column-gap: var(--entry-sp-label-field-gap);
        row-gap: 8px;
        align-items: start;
      }

      .entry-form label {
        width: auto;
        max-width: none;
      }

      .entry-form .form-row {
        display: contents;
      }

      .entry-form .form-row > label {
        grid-column: 1;
        width: 100%;
        padding-top: 1px;
        box-sizing: border-box;
        line-height: 1.3;
      }

      .entry-form .form-row > div {
        grid-column: 2;
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .form-row .autocomplete,
      .entry-form .form-row .autocomplete .autocomplete-input {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .form-row select,
      .entry-form .form-row input:not([type="checkbox"]):not([type="radio"]):not(.period-range-picker) {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .entry-form .form-row-item-inputs > .label-with-button {
        grid-column: 1;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding-top: 1px;
        box-sizing: border-box;
      }

      .entry-form .form-row-item-inputs > .item-inputs-wrapper {
        grid-column: 2;
        width: 100%;
        min-width: 0;
      }

      .entry-form .item-inputs-wrapper,
      .entry-form #itemInputsContainer {
        gap: 8px;
      }

      .entry-form .item-input-row {
        position: relative;
        gap: 6px;
      }

      /* 削除×をレイアウトから外し、.autocomplete を会社名などと同じ列幅いっぱい（100%）に */
      .entry-form .item-input-row .btn-delete-supplier {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        z-index: 1;
      }

      /* 先頭（×なし）・追加（×あり）で同一：右余白を全行に付け、入力欄の見かけ幅を揃える（×は absolute） */
      .entry-form .item-input-row .autocomplete {
        width: 100%;
        max-width: 100%;
        flex: 1;
        min-width: 0;
        padding-right: 28px;
        box-sizing: border-box;
      }

      .entry-form .form-row > .period-range-row,
      .entry-form .form-row .period-range-inputs {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      /* 備考：入力列（2列目）いっぱい（PCの max-width はスマホで解除済み） */
      .entry-form .form-row > textarea#entryRemarksInput {
        grid-column: 2;
        flex: 1;
        max-width: none;
        width: 100%;
        min-width: 0;
      }

      /* 監査レポート／提出締切：改行＋ラベル〜入力の余白を詰める（<br> は下の PC 専用ルールで非表示にしない） */
      .entry-form label.label-kansa-deadline {
        white-space: normal;
        padding-top: 0;
        line-height: 1.15;
        margin-right: -1px;
      }

      .entry-form label.label-kansa-deadline + .period-range-row {
        padding-top: 0 !important;
      }

      /*
       * 監査提出締切のみ：有効期限と同じ「📅でカレンダーを開く」結果にする。
       * 一部 iOS ではごく薄い type=date 重ねが反応しないため、スマホでは補助 date をタップ不可にし、
       * 📅ボタンを前面にして既存の click → showPicker() 経路に載せる（有効期限行は従来の重ねのまま）。
       */
      .entry-form .period-range-field--kansa-date .period-range-picker {
        pointer-events: none !important;
        z-index: 1 !important;
      }

      .entry-form .period-range-field--kansa-date .period-range-calendar-btn {
        pointer-events: auto !important;
        z-index: 50 !important;
      }
    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-box {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-box:first-of-type {
      margin-bottom: 5px;
    }

    .content-box h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }

    /* 画面右下固定アクションボタン群 */
    .fab-actions {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 画面右下固定 登録ボタン（承認通知の詳細ボタンと同じ見た目） */
    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }
    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    /* PCのみ：<br> を無効化して1行表示（スマホでは後続ルールに負けず改行が効く） */
    @media (min-width: 769px) {
      br.only-sp-br {
        display: none;
      }
    }

    /* ライセンス契約：エントリー内の From～To 日付（検索画面と同様） */
    .entry-form .form-row > .period-range-row {
      flex: 1;
      min-width: 0;
      max-width: 100%;
      padding-top: 4px;
    }

    /* 備考：テキストエリアの幅を他行より狭く */
    .entry-form textarea#entryRemarksInput {
      flex: 0 1 auto;
      width: 100%;
      max-width: 300px;
    }

    /* 日付補助 input：グローバル style.css の寸法・重ね順を form 内の width:100% 指定で壊さない */
    .entry-form .period-range-field .period-range-picker {
      width: 2.75em;
      min-width: 2.75em;
      max-width: 3.25rem;
      flex: 0 0 auto;
      padding: 0;
      margin: 0;
      border: 0;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>

    <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      // アイテム：追加ボタンで入力欄を追加（追加分は×で削除）
      (function () {
        var addBtn = document.getElementById("addItemBtn");
        var container = document.getElementById("itemInputsContainer");
        if (!addBtn || !container) return;

        function createItemRow() {
          var row = document.createElement("div");
          row.className = "item-input-row";

          var autocompleteDiv = document.createElement("div");
          autocompleteDiv.className = "autocomplete";

          var input = document.createElement("input");
          input.type = "text";
          input.className = "autocomplete-input";
          input.setAttribute("data-list", "item");
          input.placeholder = "アイテムを入力";
          input.name = "item[]";
          input.setAttribute("autocomplete", "off");
          input.setAttribute("aria-label", "アイテム");

          var dropdown = document.createElement("div");
          dropdown.className = "autocomplete-dropdown";
          autocompleteDiv.appendChild(input);
          autocompleteDiv.appendChild(dropdown);

          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn-delete-supplier";
          deleteBtn.innerHTML = "×";
          deleteBtn.title = "削除";
          deleteBtn.setAttribute("aria-label", "アイテムを削除");
          deleteBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            row.remove();
          });

          row.appendChild(autocompleteDiv);
          row.appendChild(deleteBtn);
          return row;
        }

        addBtn.addEventListener("click", function (e) {
          e.preventDefault();
          var row = createItemRow();
          container.appendChild(row);
          if (window.initAutocomplete) {
            window.initAutocomplete(row.querySelector(".autocomplete"));
          }
        });
      })();

      // yyyymmdd入力 + カレンダーボタン連携（有効期限／監査レポート提出締切 共通）
      (function () {
        function toYyyyMmDd(value) {
          if (!value) return "";
          return String(value).replace(/-/g, "");
        }

        function toIsoDate(value) {
          var v = String(value || "").replace(/\D/g, "");
          if (v.length !== 8) return "";
          return v.slice(0, 4) + "-" + v.slice(4, 6) + "-" + v.slice(6, 8);
        }

        document.querySelectorAll(".period-range-field").forEach(function (field) {
          var textInput = field.querySelector(".period-range-input.period-range-yyyymmdd");
          var picker = field.querySelector(".period-range-picker");
          var opener = field.querySelector(".period-range-calendar-btn");
          if (!textInput || !picker || !opener) return;

          function syncPickerFromText() {
            var iso = toIsoDate(textInput.value);
            if (iso) picker.value = iso;
          }

          picker.addEventListener("focus", syncPickerFromText);
          picker.addEventListener("pointerdown", syncPickerFromText);

          function openPicker() {
            syncPickerFromText();
            try {
              if (typeof picker.showPicker === "function") {
                var ret = picker.showPicker();
                if (ret && typeof ret.catch === "function") {
                  ret.catch(function () {
                    picker.focus();
                    picker.click();
                  });
                }
              } else {
                picker.focus();
                picker.click();
              }
            } catch (_) {
              picker.focus();
              picker.click();
            }
          }

          opener.addEventListener("mousedown", syncPickerFromText);
          opener.addEventListener("touchstart", syncPickerFromText, { passive: true });
          /* キーボード：フォーカスが装飾ボタンにあるとき（マウスは上層の type=date が受ける） */
          opener.addEventListener("click", function (e) {
            e.preventDefault();
            openPicker();
          });

          picker.addEventListener("change", function () {
            textInput.value = toYyyyMmDd(picker.value);
            textInput.dispatchEvent(new Event("input", { bubbles: true }));
          });

          textInput.addEventListener("blur", function () {
            var iso = toIsoDate(textInput.value);
            if (iso) picker.value = iso;
          });
        });
      })();

      // 監査レポート提出締切：yyyymmdd 以外・不正な日付はエラー表示（HTML5 制約 + 見た目）
      (function () {
        var el = document.getElementById("entryKansaShimekiri");
        var form = document.querySelector("form.entry-form");
        if (!el) return;

        function isValidYyyyMmDd(raw) {
          var s = String(raw || "").trim();
          if (s === "") return true;
          if (!/^\d{8}$/.test(s)) return false;
          var y = parseInt(s.slice(0, 4), 10);
          var m = parseInt(s.slice(4, 6), 10);
          var d = parseInt(s.slice(6, 8), 10);
          if (m < 1 || m > 12 || d < 1 || d > 31) return false;
          var dt = new Date(Date.UTC(y, m - 1, d));
          return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
        }

        function refresh() {
          var ok = isValidYyyyMmDd(el.value);
          el.classList.toggle("period-range-invalid", !ok);
          el.setCustomValidity(ok ? "" : "8桁の日付（yyyymmdd）で入力してください。例: 20260315");
          el.setAttribute("aria-invalid", ok ? "false" : "true");
        }

        el.addEventListener("input", refresh);
        el.addEventListener("blur", refresh);

        if (form) {
          form.addEventListener("submit", function (e) {
            refresh();
            if (!isValidYyyyMmDd(el.value)) {
              e.preventDefault();
              el.reportValidity();
              el.focus();
            }
          });
        }
      })();

    </script>
