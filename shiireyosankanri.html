<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仕入予算管理 | Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .pc-only { display: block; }
    .sp-only { display: none; }

    html {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      max-width: 100vw;
      box-sizing: border-box;
    }

    /* #region ヘッダー・レイアウト（他画面と共通） */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      font-size: var(--fs-base);
      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
      min-width: 0;
      max-width: 100%;
      overflow-x: hidden;
    }

    .content {
      font-size: 14px;
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
      overflow-x: hidden;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
      box-sizing: border-box;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    /* flex 子が中身幅で親を押し広げないよう（期別カード内の横スクロールに閉じる） */
    .content-box {
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* ページタイトル：mitsumoribunseki.html 等と同一 */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    /* スマホ・狭幅（mitsumoribunseki.html と同じ：スクロールは .content 内のみ → ヘッダー／ハンバーゲー固定） */
    @media (max-width: 768px) {
      .header-title {
        margin: 5px 0 0 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0 0;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
        height: 30px;
        display: block;
      }

      .content {
        flex-direction: column;
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 100%;
        padding: 12px 12px calc(56px + env(safe-area-inset-bottom, 0px)) 12px;
        margin-left: -220px;
        overflow-x: hidden;
        overflow-y: auto;
        box-sizing: border-box;
      }

      .content:not(.expanded) {
        padding-left: 12px;
      }

      .content.expanded {
        width: 100%;
        max-width: 100%;
        margin-left: -220px;
        padding-left: 12px;
      }

      .content-box {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 4px 0;
        flex: none;
        min-height: 0;
      }

      .account-wrapper {
        right: 16px;
      }
    }

    /* タブレット〜中幅：検索4列や基準ボタンが詰まるのを緩和 */
    @media (max-width: 1024px) {
      .shiire-page .page-header {
        flex-wrap: wrap;
      }

      .shiire-page .header-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
        width: 100%;
      }

      .shiire-page .basis-switch {
        flex-wrap: wrap;
      }

      .shiire-page .basis-buttons {
        flex: 1 1 auto;
        min-width: 0;
      }

      .shiire-page .basis-btn {
        min-width: 0;
        flex: 1 1 auto;
      }

      .shiire-page .wide-summary-wrap {
        margin-left: 0;
        margin-right: 0;
        padding-left: 12px;
        padding-right: 12px;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* #endregion */

    /* ========== shiire/purchase-plan.css 統合（body のみ省略） ========== */
    .shiire-page * {
      box-sizing: border-box;
    }

    .shiire-page {
      margin: 0;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      color: #1f2937;
      max-width: 1600px;
      margin-left: auto;
      margin-right: auto;
      padding: 0;
      flex: 1;
      width: 100%;
      min-width: 0;
    }

    .shiire-page .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 0 32px;
      min-width: 0;
    }

    #termContainer {
      min-width: 0;
      max-width: 100%;
    }

    .shiire-page .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .shiire-page .sub-text {
      margin: 6px 0 0;
      font-size: 14px;
      color: #6b7280;
    }

    .shiire-page .header-actions {
      display: flex;
      gap: 10px;
    }

    .shiire-page .card {
      background: #ffffff;
      border: 1px solid #d9e0ea;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      margin-bottom: 16px;
      max-width: 100%;
      min-width: 0;
    }

    .shiire-page .card-header {
      padding: 16px 18px;
      border-bottom: 1px solid #e7edf5;
    }

    .shiire-page .card-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .shiire-page .filter-area {
      padding: 18px;
    }

    /* スマホ・タブレット：検索条件の折りたたみ（初期は .is-open で展開、hatchujokyokanri と同系） */
    .shiire-search-toggle-sp {
      display: none;
    }

    .shiire-search-collapse {
      display: block;
    }

    @media (max-width: 1024px) {
      .shiire-search-toggle-sp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin: 0;
        padding: 14px 16px;
        font-family: inherit;
        font-weight: 600;
        font-size: var(--fs-sm);
        color: var(--color-text);
        background: var(--color-card);
        border: none;
        border-bottom: 1px solid #e7edf5;
        border-radius: 0;
        cursor: pointer;
        text-align: left;
        box-sizing: border-box;
      }

      .shiire-search-toggle-sp-label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
        gap: 8px;
      }

      .shiire-search-toggle-sp-icon {
        flex-shrink: 0;
        vertical-align: middle;
      }

      .shiire-search-toggle-sp-text {
        font-size: var(--fs-sm);
      }

      .shiire-search-toggle-sp::after {
        content: "＋";
        font-size: 1.15em;
        color: var(--color-text-muted);
        flex-shrink: 0;
      }

      .shiire-search-collapse.is-open .shiire-search-toggle-sp::after {
        content: "ー";
      }

      .shiire-search-panel {
        display: none;
      }

      .shiire-search-collapse.is-open .shiire-search-panel {
        display: block;
      }

      .shiire-page .filter-card.shiire-filter-card {
        padding: 0;
        overflow: hidden;
      }

      .shiire-page .filter-card.shiire-filter-card .card-header.shiire-search-card-header {
        display: none;
      }

      .shiire-search-collapse:not(.is-open) .shiire-search-toggle-sp {
        border-radius: var(--radius-lg);
        border-bottom: none;
      }

      .shiire-search-collapse.is-open .shiire-search-toggle-sp {
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }
    }

    @media (min-width: 1025px) {
      .shiire-search-panel {
        display: block !important;
      }
    }

    .shiire-page .form-grid {
      display: grid;
      gap: 16px;
    }

    .shiire-page .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .shiire-page .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .shiire-page .form-group input,
    .shiire-page .form-group select {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #cfd7e3;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    .shiire-page .form-group input:focus,
    .shiire-page .form-group select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.12);
    }

    .shiire-page .form-footer {
      display: flex;
      gap: 10px;
    }

    .shiire-page .btn {
      height: 40px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--fs-lg);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .shiire-page .btn-primary {
      background: var(--color-primary);
      color: #fff;
    }

    .shiire-page .btn-primary:hover {
      background: var(--color-primary-dark);
    }

    .shiire-page .btn-secondary {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .shiire-page .btn-secondary:hover {
      filter: brightness(1.08);
    }

    .shiire-page .btn-light {
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .shiire-page .btn-light:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .shiire-page .term-card {
      padding-top: 8px;
      overflow: hidden;
    }

    .shiire-page .term-title-row {
      padding: 12px 16px 0;
    }

    .shiire-page .term-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .shiire-page .term-title-left {
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .shiire-page .term-title-left h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .shiire-page .inline-rate {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .shiire-page .inline-rate span {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .shiire-page .inline-rate strong {
      font-size: 18px;
      color: #111827;
    }

    .shiire-page .wide-summary-wrap {
      padding: 14px 16px 16px;
      max-width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
    }

    .shiire-page .matrix-table {
      width: 100%;
      min-width: 1450px;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .shiire-page .matrix-table th,
    .shiire-page .matrix-table td {
      border: 1px solid #4b5563;
      text-align: center;
      padding: 0;
      height: 52px;
      font-size: 14px;
    }

    .shiire-page .matrix-table thead th {
      height: 32px;
      font-weight: 400;
      background: #ffffff;
    }

    .shiire-page .item-col {
      width: 210px;
      min-width: 210px;
      text-align: left !important;
      padding-left: 14px !important;
      background: #ffffff;
    }

    .shiire-page .row-name {
      color: black;
      font-weight: 400;
    }

    .shiire-page .highlight-head,
    .shiire-page .highlight-cell {
      background: #efe7bf !important;
    }

    .shiire-page .total-col {
      width: 100px;
      min-width: 100px;
      background: #ffffff;
    }

    .shiire-page .total-cell {
      background: #ffffff;
      font-weight: 700;
      padding: 0 10px !important;
    }

    .shiire-page .cell-link {
      width: 100%;
      height: 100%;
      min-height: 52px;
      border: none;
      background: transparent;
      color: #111827;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .shiire-page .cell-link:hover {
      background: rgba(0, 134, 50, 0.08);
      color: var(--color-primary-dark);
    }

    #detailModal.detail-modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1000;
    }

    #detailModal.detail-modal-overlay.show {
      display: flex;
    }

    #detailModal .modal-content {
      width: min(900px, 100%);
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    #detailModal .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid #eef2f7;
    }

    #detailModal .modal-header h2 {
      margin: 0;
      font-size: 20px;
      border-bottom: none;
      color: #1f2937;
    }

    #detailModal .modal-subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
    }

    #detailModal .modal-close {
      width: 40px;
      height: 40px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    #detailModal .modal-close:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    #detailModal .modal-summary {
      display: flex;
      gap: 14px;
      padding: 18px 20px 0;
      flex-wrap: wrap;
    }

    #detailModal .mini-stat {
      min-width: 140px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f8fafc;
    }

    #detailModal .mini-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #6b7280;
    }

    #detailModal .mini-stat strong {
      font-size: 20px;
    }

    /* 明細テーブル（モーダル内のみ・一覧と区別） */
    #detailModal .detail-table-wrap {
      padding: 16px 20px 20px;
      overflow-x: auto;
    }

    #detailModal .detail-table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
    }

    #detailModal .detail-table th,
    #detailModal .detail-table td {
      border: 1px solid #d9e1ea;
      padding: 12px 14px;
      font-size: 14px;
      text-align: center;
    }

    #detailModal .detail-table thead th {
      background: #f8fafc;
      font-weight: 700;
    }

    #detailModal .text-right {
      text-align: right !important;
    }

    #detailModal .detail-expand-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    #detailModal .detail-expand-btn:hover {
      color: var(--color-primary-dark);
    }

    #detailModal .detail-expand-btn .expand-icon {
      display: inline-block;
      width: 1em;
      color: var(--color-primary);
      transition: transform 0.2s ease;
    }

    #detailModal .detail-expand-btn[aria-expanded="true"] .expand-icon {
      transform: rotate(90deg);
    }

    #detailModal .detail-child-row td {
      padding: 0;
      background: #f8fafc;
      border-top: none;
    }

    #detailModal .detail-nested-wrap {
      padding: 12px 14px 14px 36px;
    }

    #detailModal .detail-nested-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    #detailModal .detail-nested-table th,
    #detailModal .detail-nested-table td {
      border: 1px solid #d9e1ea;
      padding: 10px 12px;
      font-size: 13px;
    }

    #detailModal .detail-nested-table thead th {
      background: #eef6f0;
      font-weight: 700;
      color: #374151;
    }

    .shiire-page .top-margin {
      margin-top: 18px;
    }

    .shiire-page .basis-card {
      padding: 14px 18px;
    }

    .shiire-page .basis-switch {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .shiire-page .basis-label {
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .shiire-page .basis-buttons {
      display: inline-flex;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 4px;
      gap: 4px;
    }

    .shiire-page .basis-btn {
      min-width: 120px;
      height: 40px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .shiire-page .basis-btn:hover:not(.active) {
      background: rgba(0, 134, 50, 0.06);
      color: var(--color-text);
    }

    .shiire-page .basis-btn.active {
      background: var(--color-primary);
      color: #fff;
    }

    .shiire-page .basis-btn.active:hover {
      background: var(--color-primary-dark);
    }

    .shiire-page .basis-chip {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(0, 134, 50, 0.1);
      color: var(--color-primary-dark);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 1024px) {
      .shiire-page .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .shiire-page {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .shiire-page .page {
        padding: 0;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .shiire-page .page-header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .shiire-page .header-actions {
        justify-content: stretch;
        gap: 8px;
      }

      .shiire-page .header-actions .btn {
        flex: 1 1 auto;
        min-width: 0;
      }

      .shiire-page .grid-4 {
        grid-template-columns: 1fr;
      }

      .shiire-page .form-footer {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .shiire-page .term-title-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      #budgetEntryModal.modal-budget-overlay {
        align-items: flex-end;
        justify-content: center;
        padding: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
      }

      #budgetEntryModal .budget-modal-sheet {
        width: 100%;
        max-width: 100%;

  <script>
    function loadSharedSidebar() {
      const mount = document.getElementById("sidebarMount");
      if (!mount) return;

      if (typeof window.SHARED_SIDEBAR_HTML !== "string" || !window.SHARED_SIDEBAR_HTML.trim()) {
        console.error("Sidebar include error: SHARED_SIDEBAR_HTML is not available.");
        return;
      }

      mount.innerHTML = window.SHARED_SIDEBAR_HTML;
      initSidebarCollapseToggle();
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector(".sidebar");
      const toggle = document.querySelector(".sidebar-toggle");
      const content = document.querySelector(".content");
      if (!toggle || !sidebar || !content || toggle.dataset.bound === "1") return;

      const toggleImg = toggle.querySelector("img");
      toggle.addEventListener("click", () => {
        sidebar.classList.toggle("closed");
        content.classList.toggle("expanded");

        if (sidebar.classList.contains("closed")) {
          if (toggleImg) toggleImg.src = "images/chevron_right_20dp_FFFFF.svg";
        } else {
          if (toggleImg) toggleImg.src = "images/chevron_left_20dp_FFFFF.svg";
        }
      });

      toggle.dataset.bound = "1";
    }

    function toggleSidebar() {
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.querySelector(".overlay");
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle("active");

      if (sidebar.classList.contains("active")) {
        overlay.classList.add("show");
      } else {
        overlay.classList.remove("show");
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.querySelector(".overlay");
      if (!sidebar || !overlay) return;

      sidebar.classList.remove("active");
      overlay.classList.remove("show");
    }

    const modal = document.getElementById("detailModal");

    const modalCount = document.getElementById("modalCount");

    function formatNumber(value) {
      return Number(value).toLocaleString("ja-JP");
    }

    /** 別注予算サマリ（得意先×ライセンス×品種）のデモ配分 */
    const batchuBudgetSplitTemplates = [
      { customer: "ABC商事", license: "キャラクターA", variety: "インテリア", ratio: 0.32 },
      { customer: "ABC商事", license: "キャラクターB", variety: "雑貨", ratio: 0.18 },
      { customer: "サンプル商会", license: "キャラクターA", variety: "タオル", ratio: 0.22 },
      { customer: "サンプル商会", license: "ブランドC", variety: "インテリア", ratio: 0.15 },
      { customer: "テスト物産", license: "ブランドC", variety: "雑貨", ratio: 0.13 }
    ];

    function createBatchuBudgetSummary(total) {
      let allocated = 0;
      return batchuBudgetSplitTemplates.map((item, index) => {
        const isLast = index === batchuBudgetSplitTemplates.length - 1;
        const amount = isLast
          ? total - allocated
          : Math.round(total * item.ratio);
        if (!isLast) allocated += amount;
        return {
          customer: item.customer,
          license: item.license,
          variety: item.variety,
          amount
        };
      });
    }

    function createDetailData(label, value) {
      const a = Math.round(value * 0.4);
      const b = Math.round(value * 0.25);
      const c = value - a - b;

      if (label.includes("売上")) {
        return [
          { label: "国内売上", amount: a },
          { label: "EC売上", amount: b },
          { label: "海外売上", amount: c }
        ];
      }

      if (label.includes("仕入")) {
        const teiban = Math.round(value * 0.65);
        const batchu = value - teiban;
        return [
          { label: "定番仕入", amount: teiban },
          { label: "別注仕入額", amount: batchu, expandable: true, expandType: "batchu-budget" }
        ];
      }

      return [
        { label: "インテリア", amount: a },
        { label: "タオル", amount: b },
        { label: "営業部", amount: c }
      ];
    }

    function renderBatchuNestedRows(batchuTotal, rowIndex) {
      const rows = createBatchuBudgetSummary(batchuTotal);
      const bodyRows = rows.map(row => `
        <tr>
          <td>${row.customer}</td>
          <td>${row.license}</td>
          <td>${row.variety}</td>
          <td class="text-right">${formatNumber(row.amount)}</td>
        </tr>
      `).join("");

      return `
        <tr
          class="detail-child-row"
          id="batchuBudgetDetail${rowIndex}"
          data-batchu-child
          data-parent-index="${rowIndex}"
          hidden>
          <td colspan="2">
            <div class="detail-nested-wrap">
              <table class="detail-nested-table">
                <thead>
                  <tr>
                    <th>得意先</th>
                    <th>ライセンス</th>
                    <th>品種</th>
                    <th>予算</th>
                  </tr>
                </thead>
                <tbody>${bodyRows}</tbody>
              </table>
            </div>
          </td>
        </tr>
      `;
    }

    function renderDetailRows(details) {
      return details.map((row, index) => {
        const amountCell = `<td class="text-right">${formatNumber(row.amount)}</td>`;
        const expandLabel = row.expandType === "batchu-budget"
          ? `${row.label}（${batchuBudgetSplitTemplates.length}件）`
          : row.label;
        const labelCell = row.expandable
          ? `<td>
              <button
                type="button"
                class="detail-expand-btn"
                data-expand-type="${row.expandType}"
                data-row-index="${index}"
                aria-expanded="false"
                aria-controls="batchuBudgetDetail${index}">
                <span class="expand-icon" aria-hidden="true">▶</span>
                <span>${expandLabel}</span>
              </button>
            </td>`
          : `<td>${row.label}</td>`;

        const childRow = row.expandable && row.expandType === "batchu-budget"
          ? renderBatchuNestedRows(row.amount, index)
          : "";

        return `
          <tr class="detail-parent-row" data-row-index="${index}">
            ${labelCell}
            ${amountCell}
          </tr>
          ${childRow}
        `;
      }).join("");
    }

    function buildTable(frameInfo) {
      const termInfo = termDataMap[currentBasis][frameInfo.selectedTerm];

      const rowsHtml = termInfo.rows.map(row => {
        const showTotal = row.label === "売上" || row.label === "仕入";
        const total = showTotal
          ? row.values.reduce((sum, value) => sum + value, 0)
          : null;

        const valueCells = row.values.map((value, index) => {
          const month = months[index];
          const highlightClass = highlightMonths.includes(month) ? "highlight-cell" : "";

          return `
          <td class="${highlightClass}">
            <button
              type="button"
              class="cell-link open-detail"
              data-basis="${currentBasis}"
              data-term="${termInfo.term}"
              data-label="${row.label}"
              data-month="${month}"
              data-value="${value}">
              ${formatNumber(value)}
            </button>
          </td>
        `;
        }).join("");

        return `
        <tr>
          <th class="item-col row-name">${row.label}</th>
          ${valueCells}
          <td class="total-cell">${total !== null ? formatNumber(total) : ""}</td>
        </tr>
      `;
      }).join("");

      const headerCells = months.map(month => {
        const highlightClass = highlightMonths.includes(month) ? "highlight-head" : "";
        return `<th class="${highlightClass}">${month}</th>`;
      }).join("");

      const basisLabel = currentBasis === "previous" ? "前年ベース" : "目標ベース";

      return `
      <section class="card term-card">
        <div class="term-title-row">
          <div class="term-header">
            <div class="term-title-left">
              <h2>${termInfo.term}</h2>
              <span class="basis-chip">${basisLabel}</span>
              <div class="inline-rate">
                <span>営業在庫回転率</span>
                <strong>${termInfo.salesTurnoverRate}</strong>
              </div>
              <div class="inline-rate">
                <span>経理在庫回転率</span>
                <strong>${termInfo.accountingTurnoverRate}</strong>
              </div>
            </div>
          </div>
        </div>

        <div class="wide-summary-wrap">
          <table class="matrix-table">
            <thead>
              <tr>
                <th class="item-col">項目</th>
                ${headerCells}
                <th class="total-col">合計</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      </section>
    `;
    }

    function renderTerms() {
      const orderedFrames = [...frameSelections].sort(
        (a, b) => Number(b.selectedTerm) - Number(a.selectedTerm)
      );
      termContainer.innerHTML = orderedFrames.map(frame => buildTable(frame)).join("");
      bindDetailEvents();
      bindBasisButtons();
    }

    function bindBasisButtons() {
      document.querySelectorAll(".basis-btn").forEach(button => {
        button.addEventListener("click", () => {
          currentBasis = button.dataset.basis;
          document.querySelectorAll(".basis-btn").forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");
          renderTerms();
        });
      });
    }

    function bindDetailEvents() {
      document.querySelectorAll(".open-detail").forEach(button => {
        button.addEventListener("click", () => {
          const term = button.dataset.term;
          const label = button.dataset.label;
          const month = button.dataset.month;
          const value = Number(button.dataset.value);
          const basis = button.dataset.basis === "previous" ? "前年ベース" : "目標ベース";

          const details = createDetailData(label, value);
          const total = details.reduce((sum, row) => sum + row.amount, 0);

          modalTitle.textContent = `${label} / ${month} / ${term} / ${basis}`;
          modalTotal.textContent = formatNumber(total);
          modalCount.textContent = `${details.length}件`;
          modalDetailBody.innerHTML = renderDetailRows(details);

          modal.classList.add("show");
        });
      });
    }

    modalDetailBody.addEventListener("click", (e) => {
      const expandBtn = e.target.closest(".detail-expand-btn");
      if (!expandBtn || expandBtn.dataset.expandType !== "batchu-budget") return;

      const rowIndex = expandBtn.dataset.rowIndex;
      const childRow = modalDetailBody.querySelector(
        `[data-batchu-child][data-parent-index="${rowIndex}"]`
      );
      if (!childRow) return;

      const isExpanded = expandBtn.getAttribute("aria-expanded") === "true";
      expandBtn.setAttribute("aria-expanded", isExpanded ? "false" : "true");
      childRow.hidden = isExpanded;
    });

    closeModalBtn.addEventListener("click", () => {
      modal.classList.remove("show");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("show");
      }
    });

    renderTerms();

    /* budget-entry と同一のフォーム連携 */
    const segmentButtons = document.querySelectorAll("#budgetEntryModal .segment-btn");
    const standardForm = document.getElementById("standardForm");
    const customForm = document.getElementById("customForm");

    segmentButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        segmentButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        if (btn.dataset.type === "standard") {
          standardForm.classList.add("active");
          customForm.classList.remove("active");
        } else {
          customForm.classList.add("active");
          standardForm.classList.remove("active");
        }
      });
    });

    const followAmount = document.getElementById("followAmount");
    const shipmentAmount = document.getElementById("shipmentAmount");
    const totalAmount = document.getElementById("totalAmount");

    function calcTotal() {
      const follow = Number(followAmount.value) || 0;
      const shipment = Number(shipmentAmount.value) || 0;
      totalAmount.value = follow + shipment;
    }

    if (followAmount && shipmentAmount && totalAmount) {
      followAmount.addEventListener("input", calcTotal);
      shipmentAmount.addEventListener("input", calcTotal);
    }

    /* 定番：月別仕入の一括反映・クリア */
    function getStandardMonthInputs() {
      return Array.from(document.querySelectorAll("#standardForm [data-standard-month-index]"));
    }

    function clearStandardBudgetForm() {
      const year = document.getElementById("budgetStandardYear");
      const landing = document.getElementById("budgetStandardLanding");
      const bulk = document.getElementById("budgetStandardBulkAmount");
      if (year) year.selectedIndex = 0;
      if (landing) landing.value = "";
      if (bulk) bulk.value = "";
      getStandardMonthInputs().forEach((inp) => {
        inp.value = "";
      });
    }

    const budgetStandardBulkApply = document.getElementById("budgetStandardBulkApply");
    const budgetStandardBulkAmount = document.getElementById("budgetStandardBulkAmount");
    if (budgetStandardBulkApply && budgetStandardBulkAmount) {
      budgetStandardBulkApply.addEventListener("click", () => {
        const raw = budgetStandardBulkAmount.value.trim();
        if (raw === "") {
          getStandardMonthInputs().forEach((inp) => {
            inp.value = "";
          });
          return;
        }
        const n = Number(raw);
        if (!Number.isFinite(n)) return;
        const str = String(n);
        getStandardMonthInputs().forEach((inp) => {
          inp.value = str;
        });
      });
      budgetStandardBulkAmount.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          budgetStandardBulkApply.click();
        }
      });
    }

    const budgetStandardClear = document.getElementById("budgetStandardClear");
    if (budgetStandardClear) {
      budgetStandardClear.addEventListener("click", clearStandardBudgetForm);
    }

    const budgetCustomExcelImport = document.getElementById("budgetCustomExcelImport");
    const budgetCustomExcelFile = document.getElementById("budgetCustomExcelFile");
    if (budgetCustomExcelImport && budgetCustomExcelFile) {
      budgetCustomExcelImport.addEventListener("click", () => {
        budgetCustomExcelFile.click();
      });
      budgetCustomExcelFile.addEventListener("change", () => {
        budgetCustomExcelFile.value = "";
      });
    }
  </script>
