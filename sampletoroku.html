<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 56px 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
    .content-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      overflow: hidden;
    }

    /* エントリーフォーム用スクロールエリア */
    .entry-form {
      /* 種類～個数のブロック間*/
      --entry-form-section-gap: 8px;
      --entry-form-label-width: 100px;
      /* 行タイトル */
      --sample-tier-prefix-label-width: 8em;
      /* 到着日ラベル列 */
      --sample-arrival-sub-label-width: 8em;
      /* 個数　ラベル列 */
      --sample-count-label-width: 7.5em;
      --sample-count-input-width: calc(10ch + 30px);
      /* PC: 個数ラベルと入力の間（スマホは max-width:768px で gap:6px のまま） */
      --sample-count-inline-gap-pc: 0px;
      /* PC: 個数ラベル列幅（7.5em より狭くし、ラベル文字の直後に入力を寄せる） */
      --sample-count-label-width-pc: 3em;
      /* PC: 到着日入力～個数ラベルまで（行の gap に加算。スマホは margin-left:0） */
      --sample-count-after-arrival-margin-pc: 24px;
      /* 商品名ラベル */
      --product-name-label-min-width: 8em;
      /* 商品コード＋品名ラベルを収める列幅（--product-name-label-min-width と連動） */
      --product-code-column-width: 310px;
      --arrival-column-offset: 48px;
      /* PC: 到着日列の左オフセット*/
      --entry-form-arrival-margin-pc: 200px;
      /* PC: 到着日列ラベル幅 */
      --sample-arrival-filter-label-width-pc: 5em;
      --sample-arrival-sub-label-width-pc: 4em;
      /* .form-row と動的「種類」行の横方向 gap（スマホは下のメディアクエリで上書き） */
      --entry-form-row-gap: 5px;
      /* PC: ステータス列と商品画像ブロックの間 */
      --entry-form-status-image-gap: 16px;
      /* 商品画像プレビュー（全行で同一サイズ・開始位置揃えの基準） */
      --product-image-preview-w: 72px;
      --product-image-preview-h: 64px;
      /* 商品画像ブロックの上下余白（全行共通） */
      --product-image-preview-margin-y: -3px;
      /* PC: ステータス列（ラベル幅を抑えて select の開始位置を左に） */
      --status-inline-label-width: 6em;
      --status-inline-col-width: calc(var(--status-inline-label-width) + 6px + 180px);
      /* 商品間の区切り線を左右にのばす量（.content-box の横パディング程度まで） */
      --product-separator-extend-x: 50px;
      margin-top: 16px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding-right: 8px;
      box-sizing: border-box;
    }

    /* サンプル登録：1行目も縦積みにし、ブロック間隔を動的行と同一にする */
    .entry-form .filter-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--entry-form-section-gap);
      margin-bottom: 0;
    }

    .entry-form .form-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 0;
      gap: var(--entry-form-row-gap);
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    /* 最終サンプル到着日はサンプル到着日の下に配置 */
    .entry-form .form-column-arrival-final {
      flex-basis: auto;
      width: auto;
      max-width: none;
      /* 別行先頭でも、サンプル到着日と同じ開始位置に揃える */
      margin-left: calc(var(--product-code-column-width) + var(--entry-form-row-gap) + var(--arrival-column-offset));
    }

    /* 最終サンプル個数はサンプル個数の下に配置 */
    .entry-form .form-column-count-final {
      width: auto;
      max-width: none;
      flex: 0 0 auto;
    }

    /* 既定: 区切り線なし */
    .entry-form .filter-row > .form-row {
      border-top: none;
      padding-top: 0;
    }
    /* 商品コードが2件目以降の行のみ、行全体に区切り線を表示（線幅を左右に拡張） */
    .entry-form .filter-row > .form-row.form-row-product-code-extra {
      border-top: 1px solid var(--color-border);
      padding-top: 8px;
      margin-left: calc(-1 * var(--product-separator-extend-x));
      margin-right: calc(-1 * var(--product-separator-extend-x) - 8px);
      padding-left: var(--product-separator-extend-x);
      padding-right: calc(var(--product-separator-extend-x) + 8px);
      box-sizing: border-box;
      /* 親幅だけだと flex 子がはみ出すとき border が画像列より短く見える → 行幅を中身（画像まで）に合わせる */
      align-self: flex-start;
      width: max-content;
      min-width: 100%;
      max-width: none;
    }

    /* 商品コード列：ラベルと入力欄を横並び */
    .entry-form .form-column-product-code {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 6px;
      width: var(--product-code-column-width);
      flex: 0 0 var(--product-code-column-width);
      min-width: 0;
      box-sizing: border-box;
    }
    .entry-form .form-column-product-code > .filter-label {
      width: auto;
      flex: 0 0 auto;
      margin-right: 0;
      white-space: nowrap;
    }

    .entry-form .form-column-product-code > .filter-label:last-of-type {
      min-width: var(--product-name-label-min-width);
      box-sizing: border-box;
    }

    /* 商品コード列：履歴（ラベルより前） */
    .entry-form .form-column-product-code > .js-btn-history-modal {
      flex: 0 0 auto;
      align-self: center;
      margin-right: 2px;
    }

    /* 商品コード入力欄（readonly input）を固定幅で表示 */
    .entry-form .form-column-product-code > input[type="text"] {
      flex: 0 0 auto;
      width: 90px;
      min-width: 90px;
      max-width: 90px;
      box-sizing: border-box;
    }

    /* 商品コード行：選択と品名（PCは横並び） */
    .entry-form .product-code-inputs {
      flex: 0 0 auto;
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 12px;
    }

    .entry-form .product-code-inputs text {
      width: 70px;
      min-width: 70px;
      max-width: 70px;
      box-sizing: border-box;
    }

    /* 品名列：ラベルと入力欄を商品コードのすぐ隣に配置 */
    .entry-form .form-column-hinmei-inline {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 6px;
      width: auto;
      flex: 0 0 auto;
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form .form-column-hinmei-inline > .filter-label {
      width: auto;
      flex: 0 0 auto;
      min-width: var(--product-name-label-min-width);
      margin-right: 0;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .entry-form .form-column-hinmei-inline > input[type="text"] {
      width: 220px;
      max-width: 220px;
      flex: 0 0 auto;
    }

    /* サンプル到着日列：品名の隣に配置 */
    .entry-form .form-column-arrival-inline {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 3px;
      margin-left: 300px;
      width: auto;
      flex: 0 0 auto;
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form .form-column-arrival-inline > .filter-label {
      width: 11em;
      flex: 0 0 11em;
      margin-right: 0;
      white-space: nowrap;
    }

    .entry-form .form-column-arrival-inline > label:not(.filter-label) + .filter-label {
      width: var(--sample-arrival-sub-label-width);
      flex: 0 0 var(--sample-arrival-sub-label-width);
      min-width: var(--sample-arrival-sub-label-width);
      max-width: var(--sample-arrival-sub-label-width);
    }

    .entry-form .form-column-arrival-inline .period-range-row--from-only,
    .entry-form .form-column-arrival-inline .period-range-field {
      display: inline-flex;
      align-items: center;
      width: auto;
      min-width: 0;
    }

    /* サンプル個数列：到着日の隣に配置 */
    .entry-form .form-column-count-inline {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 3px;
      margin-left: 10px;
      width: auto;
      flex: 0 0 auto;
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form .form-column-count-inline > .filter-label {
      width: var(--sample-count-label-width);
      flex: 0 0 var(--sample-count-label-width);
      min-width: var(--sample-count-label-width);
      max-width: var(--sample-count-label-width);
      margin-right: 0;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .entry-form .form-column-count-inline > input[type="text"] {
      flex: 0 0 auto;
      width: var(--sample-count-input-width);
      min-width: var(--sample-count-input-width);
      box-sizing: border-box;
    }

    /* ステータス列：ラベルとセレクトを横並び */
    .entry-form .form-column-status-inline {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 6px;
      margin-left: 10px;
      width: auto;
      flex: 0 0 auto;
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form .form-column-status-inline > .filter-label {
      width: var(--status-inline-label-width);
      flex: 0 0 var(--status-inline-label-width);
      min-width: var(--status-inline-label-width);
      max-width: var(--status-inline-label-width);
      margin-right: 0;
      white-space: nowrap;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .entry-form .form-column-status-inline > div > select,
    .entry-form .form-column-status-inline > select {
      width: 180px;
      min-width: 180px;
      max-width: 180px;
      box-sizing: border-box;
    }

    /* 商品画像（全行でサイズ・ブロック幅を統一） */
    .entry-form .product-image-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      align-self: flex-start;
      flex: 0 0 var(--product-image-preview-w);
      width: var(--product-image-preview-w);
      min-width: var(--product-image-preview-w);
      max-width: var(--product-image-preview-w);
      margin-top: var(--product-image-preview-margin-y);
      margin-bottom: var(--product-image-preview-margin-y);
      margin-left: 0;
      padding-top: 0;
      box-sizing: border-box;
    }

    .entry-form .product-image-wrapper {
      width: var(--product-image-preview-w);
      max-width: var(--product-image-preview-w);
      min-width: var(--product-image-preview-w);
      height: var(--product-image-preview-h);
      max-height: var(--product-image-preview-h);
      min-height: var(--product-image-preview-h);
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .entry-form .product-image-wrapper img.product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* サンプル1行：プレビュー画像の横に「追加」 */
    .entry-form .product-image-block-with-sample-add {
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
      max-width: none;
      align-items: flex-start;
    }

    .entry-form .product-image-preview-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .entry-form .btn-add-sample2-green {
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-sizing: border-box;
      background: var(--color-primary);
      color: #fff;
      border: 1px solid var(--color-primary);
    }

    .entry-form .btn-add-sample2-green:hover:not(:disabled) {
      filter: brightness(0.94);
    }

    .entry-form .btn-add-sample2-green:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 追加サンプル行：参考画像（mitsumorijohotoroku の .btn-delete-image）と同一見た目の×を画像枠の横に */
    .entry-form .product-image-block-with-sample-delete {
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
      max-width: none;
      align-items: flex-start;
    }

    .entry-form .js-extra-sample-row .product-image-preview-row--extra-sample .btn-delete-image {
      position: static;
      flex-shrink: 0;
      z-index: 2;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .entry-form .js-extra-sample-row.is-extra-sample-tail .product-image-preview-row--extra-sample .btn-delete-image {
      display: flex;
    }

    .entry-form .js-extra-sample-row.is-extra-sample-tail .product-image-preview-row--extra-sample .btn-delete-image:hover {
      background: rgba(200, 0, 0, 0.9);
    }

    .entry-form .product-name-label {
      color: var(--color-text-muted);
      font-weight: 100;
      display: inline-block;
      transform: translateY(2mm);
      min-width: var(--product-name-label-min-width);
      max-width: 1000px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 動的追加行の商品コード（ラベル＋入力ブロック） */
    .entry-form .product-code-dynamic-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form label {
      font-weight: 500;
      width: var(--entry-form-label-width);
      flex-shrink: 0;
      padding-top: 4px;
      line-height: 1.35;
    }

    /* 「1st」等、到着日列のプレフィックス用（filter-label ではない label）。共通幅だと空きが大きすぎる */
    .entry-form .form-column-arrival-inline > label:not(.filter-label) {
      width: var(--sample-tier-prefix-label-width);
      flex: 0 0 var(--sample-tier-prefix-label-width);
      min-width: 0;
      max-width: var(--sample-tier-prefix-label-width);
      box-sizing: border-box;
      white-space: nowrap;
    }

    /* 仕様書Noは折り返さず1行表示 */
    .entry-form #specificationNo {
      width: auto;
      max-width: none;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    /*
     * 仕様書No. 下の線を商品間と同じ左右の出幅にする。
     * max-content はラベル幅に縮み線が短くなるため、.filter-row の幅いっぱい（stretch + 100%）に固定する。
     */
    .entry-form .filter-row > .form-row.form-row-specification-no {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
      margin-left: calc(-1 * var(--product-separator-extend-x));
      margin-right: calc(-1 * var(--product-separator-extend-x) - 8px);
      padding-left: var(--product-separator-extend-x);
      padding-right: calc(var(--product-separator-extend-x) + 8px);
      box-sizing: border-box;
      align-self: stretch;
      width: 100%;
      max-width: none;
    }

    .entry-form input,
    .entry-form textarea {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base);
      box-sizing: border-box;
    }

    /* ラジオ・チェックはテキスト入力と同じ枠線・余白を付けない（1行目・動的行で見た目を揃える） */
    .entry-form input[type="radio"],
    .entry-form input[type="checkbox"] {
      flex: 0 0 auto;
      width: auto;
      height: auto;
      min-width: 0;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      font-family: inherit;
      font-size: inherit;
      vertical-align: middle;
      accent-color: var(--color-primary);
    }

    /* 種類のラジオ付きラベル（filter-label 以外）：幅180pxを付けず横並び */
    .entry-form label.entry-form-radio-option {
      width: auto;
      max-width: none;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding-top: 4px;
      line-height: 1.35;
      margin: 0;
      white-space: nowrap;
    }

    /* 動的行の flex 内で、ラジオ同士の &nbsp; が潰れないようにする */
    .entry-form .entry-form-radio-option-gap {
      flex: 0 0 1ch;
      min-width: 1ch;
      white-space: pre;
      font-size: inherit;
      line-height: 1.35;
      padding-top: 4px;
      box-sizing: border-box;
    }

    /* 動的行の「種類」＋ラジオ：1行目 .form-row と同じ横 gap */
    .entry-form .entry-form-type-radio-row {
      display: flex;
      align-items: flex-start;
      gap: var(--entry-form-row-gap);
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .entry-form .form-row-hinshu .hinshu-inputs {
      flex: 1;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .entry-form .form-row-hinshu .hinshu-inputs input {
      flex: 1;
      min-width: 0;
    }

    .entry-form .form-actions {
      margin-top: 4px;
      display: flex;
      gap: 12px;
    }

    .entry-form .btn-primary,
    .entry-form .btn-secondary {
      min-width: 100px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    .entry-form .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .entry-form .btn-secondary {
      background: var(--color-card);
      color: var(--color-text);
    }

    /* content-box内のpage-titleはdashboardのview-layout-titleと同じ見た目に合わせる */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 4px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    .content-box .search-box {
      flex-shrink: 0;
    }

    /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
    .content-box .pc-only {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-box .sp-only {
      flex: 1;
      min-height: 0;
    }

    .content-box .content-section {
      flex: 1;
      min-height: 0;
    }

    .modal-window {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      padding: 28px;
      width: 85%;
      max-width: 900px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2001;
    }

    /* 履歴：履歴参照モーダル */
    .modal-backdrop-history {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2100;
      backdrop-filter: blur(2px);
    }

    .modal-backdrop-history.show {
      display: block;
    }

    .modal-window-history {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      width: min(92vw, 520px);
      max-height: min(88vh, 680px);
      overflow: hidden;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2101;
      box-sizing: border-box;
      flex-direction: column;
    }

    .modal-window-history.show {
      display: flex;
    }

    .history-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .history-modal-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--color-text);
    }

    .history-modal-close {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.08);
      color: var(--color-text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-modal-close:hover {
      background: rgba(200, 0, 0, 0.12);
    }

    .history-modal-body {
      padding: 16px 18px 20px;
      overflow: auto;
      font-size: var(--fs-base, 14px);
      color: var(--color-text-muted);
    }

    /* 履歴：表相当の項目を吹き出し列で表示 */
    .history-bubble-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-bubble {
      position: relative;
      margin: 0 0 0 8px;
      padding: 12px 14px 12px 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .history-bubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 8px solid var(--color-border);
    }

    .history-bubble::after {
      content: "";
      position: absolute;
      left: -5px;
      top: 15px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 7px solid var(--color-surface);
    }

    /* 右側開始の吹き出し（承認者コメントなど） */
    .history-bubble.history-bubble-right {
      margin: 0 8px 0 0;
      margin-left: 24px;
      background: #93c47d;
    }

    .history-bubble.history-bubble-right::before {
      left: auto;
      right: -7px;
      border-right: none;
      border-left: 8px solid #93c47d;
    }

    .history-bubble.history-bubble-right::after {
      left: auto;
      right: -5px;
      border-right: none;
      border-left: 7px solid #93c47d;
    }

    .history-bubble-grid {
      display: block;
      margin: 0;
      min-width: 0;
    }

    .history-bubble-grid label {
      display: block;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.5;
    }

    .history-bubble-grid dt {
      margin: 0;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .history-bubble-grid dd {
      margin: 0;
      font-weight: 500;
      color: var(--color-text);
      word-break: break-word;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .entry-form {
        /* 既定(180px)より約1cm左に寄せる */
        --entry-form-label-width: 100px;
        /* 1行目 .form-row と動的「種類」行の横 gap を同一に */
        --entry-form-row-gap: 1px;
        /* スマホは .content-box の横パディングが狭いので区切り線の拡張も控えめに */
        --product-separator-extend-x: 8px;
        /*
         * スマホ：商品コード入力・品名ラベル・到着日/個数/ステータスの入力左端を揃える
         * （ラベル列幅＋gap を全行で共通）
         */
        --sample-sp-label-column: 11em;
        --sample-sp-label-field-gap: 6px;
      }

      /* スマホ時は各項目を1つずつ改行して表示 */
      .entry-form .form-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .entry-form .filter-row > .form-row.form-row-product-code-extra {
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
        align-self: stretch;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      .entry-form .form-row > .form-column {
        width: 100%;
        max-width: 100%;
        flex: 1 1 auto;
        margin-left: 0;
      }
      

      /* スマホ時：各入力項目の幅を統一 */
      .entry-form .form-row > .form-column input[type="text"],
      .entry-form .form-row > .form-column select,
      .entry-form .form-row > .form-column textarea {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .entry-form .form-row > .form-column .period-range-row--from-only,
      .entry-form .form-row > .form-column .period-range-field,
      .entry-form .form-row > .form-column .period-range-input {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      /*
       * スマホ：商品コード・品名・到着日・個数・ステータスを同一 Grid（ラベル列｜値列）にし、
       * テキストボックス／品名ラベル／到着日入力／select の左端を列で一致させる
       */
      .entry-form .form-column-hinmei-inline,
      .entry-form .form-column-count-inline,
      .entry-form .form-column-status-inline {
        display: grid;
        grid-template-columns: var(--sample-sp-label-column) minmax(0, 1fr);
        column-gap: var(--sample-sp-label-field-gap);
        row-gap: var(--sample-sp-label-field-gap);
        align-items: center;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-left: 0;
      }

      .entry-form .form-column-arrival-inline {
        display: grid;
        grid-template-columns: var(--sample-sp-label-column) minmax(0, 1fr);
        column-gap: var(--sample-sp-label-field-gap);
        row-gap: var(--sample-sp-label-field-gap);
        align-items: center;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-left: 0;
      }

      .entry-form .form-column-arrival-final {
        margin-left: 0;
      }

      /* 到着日：1st / 2nd / 最終 は全幅行、その下が ラベル列｜日付 */
      .entry-form .form-column-arrival-inline > label:not(.filter-label) {
        grid-column: 1 / -1;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding-top: 0;
      }

      .entry-form .form-column-product-code {
        display: grid;
        grid-template-columns: var(--sample-sp-label-column) minmax(0, 1fr);
        column-gap: var(--sample-sp-label-field-gap);
        row-gap: var(--sample-sp-label-field-gap);
        align-items: center;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-left: 0;
      }

      .entry-form .form-column-product-code > .filter-label {
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding-top: 0;
        line-height: 1.35;
        min-height: 0;
      }

      .entry-form .form-column-product-code > .js-btn-history-modal {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        align-self: center;
        margin: 0;
      }

      .entry-form .form-column-product-code > .filter-label:first-of-type {
        grid-column: 1;
        grid-row: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        white-space: nowrap;
      }

      .entry-form .form-column-product-code > input[type="text"] {
        grid-column: 2;
        grid-row: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      /* 品名は値列のみ（商品コード入力と左端一致） */
      .entry-form .form-column-product-code > .filter-label:last-of-type {
        grid-column: 2;
        grid-row: 3;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        white-space: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .entry-form .form-column-arrival-inline > .filter-label,
      .entry-form .form-column-count-inline > .filter-label,
      .entry-form .form-column-status-inline > .filter-label {
        grid-column: 1;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        white-space: nowrap;
        box-sizing: border-box;
      }

      .entry-form .form-column-hinmei-inline > .filter-label {
        grid-column: 1;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        white-space: nowrap;
        box-sizing: border-box;
      }

      .entry-form .form-row > .form-column.form-column-arrival-inline > .period-range-row--from-only {
        grid-column: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        box-sizing: border-box;
      }

      .entry-form .form-column-arrival-inline .period-range-row--from-only .period-range-row--from-only,
      .entry-form .form-column-arrival-inline .period-range-field {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      .entry-form .form-column-arrival-inline .period-range-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }
      .entry-form .form-column-hinmei-inline > input[type="text"] {
        grid-column: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .form-column-count-inline > input[type="text"] {
        grid-column: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .form-column-status-inline > div {
        grid-column: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .form-row > .form-column.form-column-product-code > input[type="text"] {
        grid-column: 2;
        grid-row: 2;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      /* グローバル label の padding-top による横方向の見かけのずれを防ぐ */
      .entry-form .form-row > .form-column label.filter-label {
        padding-top: 0;
      }

      /* 品名はセレクトの下に表示・折り返さない（長い場合は横スクロール） */
      .entry-form .product-code-inputs {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
        flex: 1 1 auto;
      }

      .entry-form .product-code-inputs select {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      .entry-form .form-column-status-inline > div > select,
      .entry-form .form-column-status-inline > select {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      /* スマホ時: 商品画像はステータスselectの下（枠サイズは PC と同一変数） */
      .entry-form .form-row .product-image-block {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        flex: 1 1 auto;
        margin-top: var(--product-image-preview-margin-y);
        margin-bottom: var(--product-image-preview-margin-y);
        margin-left: 0;
        padding-top: 0;
        align-self: stretch;
        justify-content: flex-start;
      }

      /* スマホ：画像の下に「追加」（履歴は商品コード列先頭） */
      .entry-form .product-image-block-with-sample-add .product-image-preview-row {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
      }

      .entry-form .form-row .product-image-wrapper {
        width: var(--product-image-preview-w);
        max-width: var(--product-image-preview-w);
        min-width: var(--product-image-preview-w);
        height: var(--product-image-preview-h);
        max-height: var(--product-image-preview-h);
        min-height: var(--product-image-preview-h);
      }

      .entry-form .product-image-block-with-sample-add .product-image-preview-row > .product-image-wrapper {
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .entry-form .product-name-label {
        white-space: nowrap;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        transform: none;
        display: block;
      }

      /* 到着日：スマホでも入力幅を縮めない（1行目/追加行とも同じクラスで統一） */
      .entry-form .period-range-row--from-only,
      .entry-form .period-range-field {
        display: inline-flex;
        align-items: center;
        width: auto;
        min-width: 0;
        max-width: 150%;
      }

      .entry-form .form-row > .form-column .period-range-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      /* 到着日内の period-range：下の width:auto 指定より後で、他入力と左端・幅を揃える */
      .entry-form .form-column-arrival-inline .period-range-row--from-only,
      .entry-form .form-column-arrival-inline .period-range-field {
        display: flex;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      /* 追加行は削除ボタンの横幅影響をなくし、商品コード幅を1行目とそろえる */
      .entry-form .supplier-input-item {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
      }

      .entry-form .supplier-input-row {
        width: 100%;
      }

      .entry-form .btn-delete-supplier {
        align-self: flex-end;
      }

      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      /* スマホ: 検索条件は折りたたみ式 */
      .search-toggle-sp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-weight: 500;
        color: var(--color-text);
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        cursor: pointer;
        text-align: left;
        box-sizing: border-box;
      }

      .search-toggle-sp-label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      .search-toggle-sp-icon {
        margin-right: 8px;
        flex-shrink: 0;
        vertical-align: middle;
      }

      .search-toggle-sp::after {
        content: "＋";
        color: var(--color-text-muted);
      }

      .search-box {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .search-box-inner {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }

      .search-box.is-open .search-box-inner {
        display: grid;
      }

      .search-box.is-open .search-toggle-sp::after {
        content: "ー";
      }

      /* 検索条件エリア：参照画面と同じ余白・レイアウト */
      .view-layout-1-group>.content-box:first-of-type {

    <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      // 履歴：履歴参照モーダル
      (function () {
        var backdrop = document.getElementById("historyModalBackdrop");
        var modal = document.getElementById("historyModal");
        if (!backdrop || !modal) return;

        function openHistoryModal() {
          backdrop.classList.add("show");
          modal.classList.add("show");
          backdrop.setAttribute("aria-hidden", "false");
          modal.setAttribute("aria-hidden", "false");
        }

        function closeHistoryModal() {
          backdrop.classList.remove("show");
          modal.classList.remove("show");
          backdrop.setAttribute("aria-hidden", "true");
          modal.setAttribute("aria-hidden", "true");
        }

        document.addEventListener("click", function (e) {
          if (e.target.closest(".js-btn-history-modal")) {
            e.preventDefault();
            openHistoryModal();
            return;
          }
          if (!modal.classList.contains("show")) return;
          if (e.target.closest(".history-modal-close") || e.target === backdrop) {
            e.preventDefault();
            closeHistoryModal();
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && modal.classList.contains("show")) {
            closeHistoryModal();
          }
        });
      })();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

      // 到着日（Fromのみ）：テキスト⇔カレンダー同期とカレンダーボタン表示
      function bindFromOnlyCalendar(textInput, pickerInput, openBtn) {
        if (!textInput || !pickerInput || !openBtn) return;

        function syncPickerFromText() {
          if (typeof normalizeYyyymmddInput !== "function" || typeof yyyymmddToIsoDate !== "function") return;
          var iso = yyyymmddToIsoDate(normalizeYyyymmddInput(textInput.value));
          if (iso) pickerInput.value = iso;
          else pickerInput.value = "";
        }

        function openPicker() {
          syncPickerFromText();
          if (typeof pickerInput.showPicker === "function") {
            try {
              pickerInput.showPicker();
            } catch (_) {
              pickerInput.focus();
              pickerInput.click();
            }
          } else {
            pickerInput.focus();
            pickerInput.click();
          }
        }

        function onPickerChange() {
          if (!pickerInput.value || typeof toYyyymmdd !== "function") return;
          textInput.value = toYyyymmdd(pickerInput.value);
          textInput.dispatchEvent(new Event("change", { bubbles: true }));
        }

        function onTextInput() {
          if (typeof normalizeYyyymmddInput !== "function") return;
          textInput.value = normalizeYyyymmddInput(textInput.value);
          if (typeof isValidYyyymmdd === "function") {
            textInput.classList.toggle(
              "period-range-invalid",
              textInput.value.length === 8 && !isValidYyyymmdd(textInput.value)
            );
          }
        }

        textInput.addEventListener("input", onTextInput);
        textInput.addEventListener("blur", onTextInput);
        openBtn.addEventListener("click", openPicker);
        pickerInput.addEventListener("change", onPickerChange);
        syncPickerFromText();
      }

      var boundPeriodFields = new WeakSet();
      function bindPeriodFieldsIn(root) {
        if (!root) root = document;
        var periodFields = root.querySelectorAll(".form-column-arrival-inline .period-range-field");
        Array.prototype.forEach.call(periodFields, function (periodField) {
          if (boundPeriodFields.has(periodField)) return;
          var textInput = periodField.querySelector(".period-range-input");
          var pickerInput = periodField.querySelector(".period-range-picker");
          var openBtn = periodField.querySelector(".period-range-calendar-btn");
          bindFromOnlyCalendar(textInput, pickerInput, openBtn);
          boundPeriodFields.add(periodField);
        });
      }

      // 固定行の「到着日」（全行の到着日欄を対象・動的行は後から bindPeriodFieldsIn(行)）
      bindPeriodFieldsIn(document);

      // 参考画像：追加・削除（画像クリックでファイル選択）
      (function () {
        var container = document.getElementById("referenceImagesContainer");
        var addBtn = document.getElementById("addImageBtn");
        if (!container || !addBtn) return;

        function createImageSlot() {
          var item = document.createElement("div");
          item.className = "reference-image-item";

          var preview = document.createElement("img");
          preview.className = "image-preview";
          preview.src = "images/noimage.png";
          preview.alt = "クリックして画像を選択";

          var fileInput = document.createElement("input");
          fileInput.type = "file";
          fileInput.accept = "image/*";
          fileInput.setAttribute("name", "referenceImage[]");
          fileInput.addEventListener("change", function () {
            var file = this.files && this.files[0];
            if (file && file.type && file.type.indexOf("image/") === 0) {
              var reader = new FileReader();
              reader.onload = function (e) {
                preview.src = e.target.result;
              };
              reader.readAsDataURL(file);
            } else {
              preview.src = "images/noimage.png";
            }
          });

          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn-delete-image";
          deleteBtn.innerHTML = "×";
          deleteBtn.title = "削除";
          deleteBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            item.remove();
          });

          item.appendChild(preview);
          item.appendChild(fileInput);
          item.appendChild(deleteBtn);
          return item;
        }

        addBtn.addEventListener("click", function () {
          container.appendChild(createImageSlot());
        });
      })();

      var boundProductImageBlocks = new WeakSet();
      function initProductImageBlock(block) {
        if (!block || boundProductImageBlocks.has(block)) return;
        boundProductImageBlocks.add(block);
        var img = block.querySelector("img.product-image");
        var fileInput = block.querySelector(".product-image-input");
        if (!img || !fileInput) return;

        img.style.cursor = "pointer";

        img.addEventListener("click", function () {
          fileInput.click();
        });

        fileInput.addEventListener("change", function () {
          var file = this.files && this.files[0];
          if (!file || !file.type || file.type.indexOf("image/") !== 0) return;

          var reader = new FileReader();
          reader.onload = function (e) {
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      // 商品画像: 画像クリックでファイル選択し、選択画像をプレビュー表示
      (function () {
        Array.prototype.forEach.call(document.querySelectorAll(".product-image-block"), initProductImageBlock);
      })();

      // 商品コード→品名 表示（各行のコンボボックス変更時）
      (function () {
        var codeRows = document.querySelectorAll(".form-column-product-code .product-code-inputs");
        if (!codeRows || codeRows.length === 0) return;

        function getProductNameFromSelection(selectEl) {
          var opt = selectEl.options[selectEl.selectedIndex];
          if (!opt) return "";

          // data属性を優先（画面側で対応付けできるため堅牢）
          if (opt.dataset && opt.dataset.productName) {
            return opt.dataset.productName;
          }

          // フォールバック：autocomplete.js に品名リストがある想定
          try {
            if (typeof lists !== "undefined" && Array.isArray(lists.productName)) {
              var idx = parseInt(selectEl.value, 10) - 1;
              if (!isNaN(idx)) return lists.productName[idx] || "";
            }
          } catch (_) {
            // lists が参照できない/存在しない場合は無視
          }
          return "";
        }

        Array.prototype.forEach.call(codeRows, function (rowEl) {
          var selectEl = rowEl.querySelector("select");
          var labelEl = rowEl.querySelector(".product-name-label");
          if (!selectEl || !labelEl) return;

          function updateLabel() {
            var name = getProductNameFromSelection(selectEl);
            labelEl.textContent = name ? name : "";
            labelEl.style.color = name ? "var(--color-text)" : "var(--color-text-muted)";
          }

          selectEl.addEventListener("change", updateLabel);
          updateLabel();
        });
      })();

      // スマホ: 検索条件の折りたたみ開閉
      (function () {
        var btn = document.getElementById("searchToggleSp");
        var box = document.getElementById("searchBox");
        if (btn && box) {
          btn.addEventListener("click", function () {
            var isOpen = box.classList.toggle("is-open");
            btn.setAttribute("aria-expanded", isOpen);
            var textEl = btn.querySelector(".search-toggle-sp-text");
            if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
          });
        }
      })();

      // 商品ごとのサンプル「追加」／行末「×」削除（9999991 / 9999992 / 9999993）
      (function () {
        var filterRow = document.querySelector(".entry-form .filter-row");
        if (!filterRow) return;

        function getAnchor(productKey) {
          return filterRow.querySelector('[data-sample-final-for="' + productKey + '"]');
        }

        function getTemplateRow(productKey) {
          return filterRow.querySelector(
            '.js-extra-sample-template[data-sample-product="' + productKey + '"]'
          );
        }

        function getExtraRows(productKey) {
          return filterRow.querySelectorAll(
            '.js-extra-sample-row[data-sample-product="' + productKey + '"]'
          );
        }

        function maxVisibleSampleNumber(productKey) {
          var max = 1;
          Array.prototype.forEach.call(getExtraRows(productKey), function (row) {
            if (row.hidden) return;
            var n = parseInt(row.getAttribute("data-sample-number"), 10);
            if (!isNaN(n)) max = Math.max(max, n);
          });
          return max;
        }

        function stripCloneIds(root) {
          Array.prototype.forEach.call(root.querySelectorAll("[id]"), function (el) {
            el.removeAttribute("id");
          });
        }

        function clearRowFields(row) {
          Array.prototype.forEach.call(row.querySelectorAll(".period-range-input"), function (inp) {
            inp.value = "";
            inp.classList.remove("period-range-invalid");
          });
          Array.prototype.forEach.call(row.querySelectorAll(".period-range-picker"), function (inp) {
            inp.value = "";
          });
          Array.prototype.forEach.call(row.querySelectorAll('input[type="text"]'), function (inp) {
            if (!inp.classList.contains("period-range-input")) inp.value = "";
          });
          Array.prototype.forEach.call(row.querySelectorAll("select"), function (sel) {
            sel.selectedIndex = 0;
          });
          var img = row.querySelector("img.product-image");
          if (img) img.src = "images/evidence.png";
          Array.prototype.forEach.call(row.querySelectorAll(".product-image-input"), function (inp) {
            inp.value = "";
          });
        }

        function setTierLabel(row, num) {
          var col = row.querySelector(".form-column-arrival-inline.form-column-arrival-final");
          if (!col) return;
          var lab = col.querySelector("label:not(.filter-label)");
          if (lab) lab.textContent = "サンプル" + num;
        }

        function refreshExtraSampleTailMarkerFor(productKey) {
          var rows = getExtraRows(productKey);
          Array.prototype.forEach.call(rows, function (r) {
            r.classList.remove("is-extra-sample-tail");
          });
          var visible = [];
          Array.prototype.forEach.call(rows, function (r) {
            if (!r.hidden) visible.push(r);
          });
          if (visible.length === 0) return;
          visible[visible.length - 1].classList.add("is-extra-sample-tail");
        }

        filterRow.addEventListener("click", function (e) {
          var addBtn = e.target.closest(".js-btn-add-extra-sample");
          if (addBtn) {
            e.preventDefault();
            var productKey = addBtn.getAttribute("data-sample-product");
            if (!productKey) return;
            var templateRow = getTemplateRow(productKey);
            var anchor = getAnchor(productKey);
            if (!templateRow || !anchor || !anchor.parentNode) return;

            if (templateRow.hidden) {
              templateRow.removeAttribute("hidden");
              refreshExtraSampleTailMarkerFor(productKey);
              return;
            }

            var nextNum = maxVisibleSampleNumber(productKey) + 1;
            var clone = templateRow.cloneNode(true);
            clone.removeAttribute("id");
            clone.removeAttribute("hidden");
            clone.classList.remove("js-extra-sample-template");
            clone.setAttribute("data-sample-number", String(nextNum));
            clone.setAttribute("data-sample-product", productKey);
            stripCloneIds(clone);
            clearRowFields(clone);
            setTierLabel(clone, nextNum);
            anchor.parentNode.insertBefore(clone, anchor);
            bindPeriodFieldsIn(clone);
            var imgBlock = clone.querySelector(".product-image-block");
            if (imgBlock) initProductImageBlock(imgBlock);
            refreshExtraSampleTailMarkerFor(productKey);
            return;
          }

          var delBtn = e.target.closest(
            ".js-extra-sample-row .product-image-preview-row--extra-sample .btn-delete-image"
          );
          if (!delBtn) return;
          e.preventDefault();
          e.stopPropagation();
          var row = delBtn.closest(".js-extra-sample-row");
          if (!row) return;
          var pk = row.getAttribute("data-sample-product");
          if (!pk) return;
          if (row.classList.contains("js-extra-sample-template")) {
            clearRowFields(row);
            setTierLabel(row, 2);
            row.setAttribute("hidden", "");
          } else {
            row.remove();
          }
          refreshExtraSampleTailMarkerFor(pk);
        });

        ["1", "2", "3"].forEach(function (k) {
          refreshExtraSampleTailMarkerFor(k);
        });
      })();
    </script>
</body>

</html>
