<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/autocomplete.js"></script>
  <style>
    :root {
      --font-size-base: 16pt;
      --fs-base: 16pt;
      --fs-sm: 14pt;
      --fs-xs: 12pt;
      --fs-lg: 18pt;
      --fs-xl: 20pt;
      --color-primary: #008632;
      --color-primary-dark: #006C29;
      --color-primary-light: #00a840;
      --color-surface: #f8faf9;
      --color-tanto-hover: #47bdc5;
      --color-card: #ffffff;
      --color-border: #e2e8e6;
      --color-text: #1a2e26;
      --color-text-muted: #5c6f66;
      --shadow-sm: 0 1px 3px rgba(0, 134, 50, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 134, 50, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 134, 50, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "Outfit", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    html {
      height: 100%;
      overflow: hidden;
      scrollbar-gutter: auto;
    }

    @supports (height: 100dvh) {
      html {
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    body {
      margin: 0;
      background: var(--color-surface);
      color: var(--color-text);
      height: 100%;
      min-height: 0;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @supports (height: 100dvh) {
      body {
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      /* max-height: calc(100%-48px); */
      overflow: hidden;
    }

    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 16px;
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      /* margin-left: 10px; */
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
      font-size: 16px;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      height: calc(100%-48px);
      width: 100%;
      background: var(--color-surface);
      padding: 24px 24px 24px 32px;
      transition: margin-left 0.3s ease;
    }


    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    /* #endregion */

    /* 画面右下固定 新規登録・修正ボタン（承認通知の詳細ボタンと同じ見た目） */
    .fab-buttons-wrap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      flex-direction: row;
      gap: 8px;
      align-items: center;
    }

    .fab-buttons-wrap .btn-fab-new {
      position: static;
    }

    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      min-width: 60px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 16px;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .view-layout {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-1-group,
    .view-layout-3 {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
    }

    .view-layout-1 {
      padding: 0;
    }

    .content-area {
      /*flex: 1;*/  
      height: 88%;
      /*background: var(--color-card);*/
      /*border: 1px solid var(--color-border);*/
      /*border-radius: var(--radius-lg);*/
      padding: 20px;
      /* margin-bottom: 24px; */
      /*box-shadow: var(--shadow-sm);*/
    }

    .tab-list {
      font-size: 16px;
      display: flex;
      gap: 0;
      margin: 0 0 0;
      padding: 0;
      list-style: none;
      border-bottom: 2px solid var(--color-border);
    }

    .tab-list li {
      margin: 0;
    }

    .tab-list button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-list button:hover {
      color: var(--color-text);
    }

    .tab-list button.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }

    .shiyosho-tabpanel {
      flex: 1;
      height: 85%;
      display: none;
      margin-top: 12px;
      min-height: 0;
      box-sizing: border-box;
    }

    .shiyosho-tabpanel.is-active {
      display: block;
    }

    .shiyosho-panel-grid {
      display: grid;
      grid-template-columns: 6.5fr 3.5fr;
      grid-template-rows: 1fr 12fr;
      gap: 12px;
      height: 105%;
      min-height: 0;
      box-sizing: border-box;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .shiyosho-panel1 {
      grid-row: 1 / -1;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel2 {
      grid-row: 1;
      grid-column: 2;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel3 {
      grid-row: 2;
      grid-column: 2;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
      width: 100%;
    }

    /* 登録などボタン行をパネル右端に揃える（複数ボタンは横並び・左から登録→契約書依頼） */
    .shiyosho-panel3 .panel3-btn-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .shiyosho-panel3-column {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    .shiyosho-panel3-column > .shiyosho-item.img-scroll {
      flex: 1;
      min-height: 0;
    }

    .btn-panel-register {
      display: inline-block;
      text-decoration: none;
      min-width: 80px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 16px;
      white-space: nowrap;
    }

    .btn-panel-register:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .panel2-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ページネーションエリア */
    #pagenationArea1 {
      padding-right: 130px;
      position: relative;
      z-index: 2;
    }

    #pagenationArea2 {
      padding-right: 15px;
    }

    #pagenationArea3 {
      padding-right: 20px;
    }

    #pagenationArea1 .btn-panel-page:not(.is-ellipsis),
    #pagenationArea1 .btn-panel-register {
      cursor: pointer;
    }

    /* パネル3：ページネーションとフォーマット選択を同じ高さに揃える */
    .panel2-with-format {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .panel2-with-format #pagenationArea3 {
      padding-right: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .panel2-with-format .filter-row {
      margin-bottom: 0;
    }

    .panel2-page-nav {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1px solid #d8d8d8;
      border-radius: 4px;
      overflow: hidden;
    }

    .btn-panel-page {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      background: transparent;
      color: #0d6efd;
      border: none;
      border-right: 1px solid #d8d8d8;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      font-size: 16px;
      line-height: 34px;
    }

    .btn-panel-page:last-child {
      border-right: none;
    }

    .btn-panel-page.is-current {
      background: #0d6efd;
      color: #fff;
      font-weight: 600;
    }

    .btn-panel-page.is-ellipsis {
      color: #6c757d;
      cursor: default;
    }

    .shiyosho-item {
      /* flex: 1; */
      max-width: 70%;
      padding: 12px;
    }

    .shiyosho-item.img-scroll {
      height: 90%;
      width: 100%;
      max-width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -ms-overflow-style: none;
    }

    .shiyosho-panel1>.shiyosho-item.img-scroll {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .shiyosho-item.img-scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .img-scroll img {
      /* width: 60%;
      max-width: 70%; */
      width: 100%;
      max-width: none;
      height: auto;
      display: block;
    }


    /*  */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      font-size: 16px;
      margin-right: 4px;
    }

    label.filter-label[for="carton-mark-format"] {
      white-space: nowrap;
    }

    .filter-row input[type="text"],
    .filter-row select {
      font-size: 16px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      min-width: 160px;
    }

    /*  */

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

      /* スマホ: panel1 は imgPanel1 配下に操作エリアを縦積み */
      #panel1 #imgPanel1.mobile-stacked {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #panel1 #imgPanel1.mobile-stacked > div:empty {
        display: none;
      }

      /* 上段: ページネーション */
      #panel1 #imgPanel1.mobile-stacked #pagenationArea1 {
        order: 1;
        margin-bottom: 8px;
      }

      /* 上段2: 契約書登録ボタン（panel1内の2つ目の shiyosho-panel2） */
      #panel1 #imgPanel1.mobile-stacked .shiyosho-panel2:not(#pagenationArea1) {
        order: 2;
        margin-top: 8px;
      }

      /* 中段: 発注書画像 */
      #panel1 #imgPanel1.mobile-stacked > .shiyosho-item.img-scroll {
        order: 3;
      }

      /* 下段: その他操作領域 */
      #panel1 #imgPanel1.mobile-stacked .shiyosho-panel3 {
        order: 4;
        margin-bottom: 72px;
      }

      /* スマホ: パネル1の「登録」「契約書依頼」を固定アクション（承認/申請）列に合わせる */
      #panel1 #imgPanel1.mobile-stacked .shiyosho-panel3 .panel3-btn-row {
        justify-content: flex-end;
        padding-right: 24px;
        box-sizing: border-box;
      }
      #panel1 #imgPanel1.mobile-stacked .shiyosho-panel3 .panel3-btn-row .btn-panel-register {
        min-width: 60px;
        padding: 6px 14px;
      }
      #panel1.is-active #imgPanel1.mobile-stacked .shiyosho-panel3 {
        margin-bottom: 0;
      }
      #panel1.is-active #imgPanel1.mobile-stacked .shiyosho-panel3 .panel3-btn-row {
        position: fixed;
        right: 29px;
        bottom: 78px;
        z-index: 2002;
        width: auto;
        display: flex;
        gap: 8px;
        padding-right: 0;
      }
      #panel1.is-active #imgPanel1.mobile-stacked .shiyosho-panel3 .panel3-btn-row .btn-panel-register {
        width: auto;
        min-width: 60px;
        box-sizing: border-box;
      }

      #panel1 #imgPanel1.mobile-stacked #pagenationArea1,
      #panel1 #imgPanel1.mobile-stacked .shiyosho-panel2,
      #panel1 #imgPanel1.mobile-stacked .shiyosho-panel3 {
        width: 100%;
        padding: 0;
        justify-content: flex-end;
      }

      #panel1 #imgPanel1.mobile-stacked #pagenationArea1 .panel2-controls {
        width: 100%;
        justify-content: flex-end;
      }

      /* スマホ: panel2 は imgPanel2 の上に pagenationArea2 を表示 */
      #panel2 #imgPanel2.mobile-stacked {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #panel2 #imgPanel2.mobile-stacked > div:empty {
        display: none;
      }

      #panel2 #imgPanel2.mobile-stacked #pagenationArea2 {
        order: 1;
      }

      #panel2 #imgPanel2.mobile-stacked > .shiyosho-item.img-scroll {
        order: 2;
      }

      #panel2 #imgPanel2.mobile-stacked .shiyosho-panel3 {
        order: 3;
        margin-bottom: 72px;
      }

      /* スマホ: パネル2の「登録」を固定アクション（承認）列に合わせる */
      #panel2 #imgPanel2.mobile-stacked .shiyosho-panel3 .panel3-btn-row {
        justify-content: flex-end;
        padding-right: 0;
        box-sizing: border-box;
      }
      #panel2 #imgPanel2.mobile-stacked .shiyosho-panel3 .panel3-btn-row .btn-panel-register {
        min-width: 60px;
        padding: 6px 14px;
      }

      /* スマホ: パネル2表示時は「登録」をパネル1と同じ位置基準に固定 */
      #panel2.is-active #imgPanel2.mobile-stacked .shiyosho-panel3 {
        margin-bottom: 0;
      }
      #panel2.is-active #imgPanel2.mobile-stacked .shiyosho-panel3 .panel3-btn-row {
        position: fixed;
        right: calc(24px + 60px - 34px);
        bottom: 78px;
        z-index: 2002;
      }
      #panel2.is-active #imgPanel2.mobile-stacked .shiyosho-panel3 .panel3-btn-row .btn-panel-register {
        width: 60px;
        min-width: 60px;
        box-sizing: border-box;
      }

      #panel2 #imgPanel2.mobile-stacked #pagenationArea2,
      #panel2 #imgPanel2.mobile-stacked .shiyosho-panel2,
      #panel2 #imgPanel2.mobile-stacked .shiyosho-panel3 {
        width: 100%;
        padding: 0;
        justify-content: flex-end;
      }

      #panel2 #imgPanel2.mobile-stacked #pagenationArea2 .panel2-controls {
        width: 100%;
        justify-content: flex-end;
      }

      /* スマホ: panel3 は imgPanel3 の上にページネーション＋フォーマットを表示 */
      #panel3 #imgPanel3.mobile-stacked {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #panel3 #imgPanel3.mobile-stacked > div:empty {
        display: none;
      }

      #panel3 #imgPanel3.mobile-stacked .panel2-with-format {
        order: 1;
        width: 100%;
        padding: 0;
        justify-content: flex-start;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      #panel3 #imgPanel3.mobile-stacked .panel2-with-format #pagenationArea3 {
        width: 100%;
        padding-left: 0;
        margin-left: 0;
        align-self: flex-start;
      }

      #panel3 #imgPanel3.mobile-stacked .panel2-with-format #pagenationArea3 .panel2-controls {
        width: 100%;
        justify-content: flex-start;

    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    tabs.forEach(tab => {
      const button = tab.querySelector('button');

      button.addEventListener('click', () => {

        // タブの状態切替
        tabs.forEach(t => {
          const btn = t.querySelector('button');
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-selected', 'true');

        // パネル切替
        const target = tab.getAttribute('aria-controls');
        panels.forEach(p => {
          if (p.id === target) {
            p.hidden = false;
            p.classList.add('is-active');
          } else {
            p.hidden = true;
            p.classList.remove('is-active');
          }
        });
      });
    });

    (function initCartonMarkFormatPreview() {
      const select = document.getElementById('carton-mark-format');
      const img = document.getElementById('carton-mark-preview');
      if (!select || !img) return;

      function applySelection() {
        const opt = select.options[select.selectedIndex];
        img.src = opt.value;
        img.alt = opt.text;
      }

      select.addEventListener('change', applySelection);
      applySelection();
    })();

    (function initResponsivePanelStacking() {
      if (!window.matchMedia) return;

      const mobileQuery = window.matchMedia('(max-width: 768px)');
      const panelConfigs = [
        { panelSelector: '#panel1 .shiyosho-panel-grid', imgPanelId: 'imgPanel1', paginationId: 'pagenationArea1' },
        { panelSelector: '#panel2 .shiyosho-panel-grid', imgPanelId: 'imgPanel2', paginationId: 'pagenationArea2' },
        { panelSelector: '#panel3 .shiyosho-panel-grid', imgPanelId: 'imgPanel3', paginationId: 'pagenationArea3' }
      ];

      const panelStates = panelConfigs.map(function (config) {
        return {
          config: config,
          initialized: false,
          isMobileApplied: false,
          items: []
        };
      });

      function initializePanelState(state) {
        if (state.initialized) return true;

        const panelGrid = document.querySelector(state.config.panelSelector);
        const imgPanel = document.getElementById(state.config.imgPanelId);
        const pagination = document.getElementById(state.config.paginationId);
        if (!panelGrid || !imgPanel || !pagination) return false;

        const children = Array.prototype.slice.call(panelGrid.children);
        const movable = children.filter(function (el) {
          return el !== imgPanel;
        });

        state.items = movable.map(function (el) {
          const placeholder = document.createComment('mobile-stack-placeholder');
          el.parentNode.insertBefore(placeholder, el);
          return { element: el, placeholder: placeholder };
        });
        state.panelGrid = panelGrid;
        state.imgPanel = imgPanel;
        state.initialized = true;
        return true;
      }

      function applyMobileLayout(state) {
        if (!initializePanelState(state) || state.isMobileApplied) return;
        state.items.forEach(function (item) {
          state.imgPanel.appendChild(item.element);
        });
        state.imgPanel.classList.add('mobile-stacked');
        state.isMobileApplied = true;
      }

      function restoreDesktopLayout(state) {
        if (!state.initialized || !state.isMobileApplied) return;
        state.items.forEach(function (item) {
          if (item.placeholder.parentNode) {
            item.placeholder.parentNode.insertBefore(item.element, item.placeholder);
          }
        });
        state.imgPanel.classList.remove('mobile-stacked');
        state.isMobileApplied = false;
      }

      function syncLayoutByViewport() {
        const isMobile = mobileQuery.matches;
        panelStates.forEach(function (state) {
          if (isMobile) {
            applyMobileLayout(state);
          } else {
            restoreDesktopLayout(state);
          }
        });
      }

      syncLayoutByViewport();

      if (typeof mobileQuery.addEventListener === 'function') {
        mobileQuery.addEventListener('change', syncLayoutByViewport);
      } else if (typeof mobileQuery.addListener === 'function') {
        mobileQuery.addListener(syncLayoutByViewport);
      }
    })();

  </script>
