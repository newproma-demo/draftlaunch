<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
<!--  <link rel="stylesheet" href="ship_schedule.css"> -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      /* font-family: "Yu Gothic", "Meiryo", sans-serif; */
      background: #f4f7fb;
      color: #333;
    }

  /* #region ヘッダー */
  .header {
    position: relative;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;

    background: var(--color-card);
    color: var(--color-text);
    display: flex;
    align-items: center;
    padding: 0 20px;
    box-shadow: var(--shadow-sm);
    border-bottom: 1px solid var(--color-border);
  }

  .header a {
    text-decoration: none;
    color: inherit;
    letter-spacing: 0.02em;
  }

  .header a:hover {
    color: var(--color-primary);
  }

  .hamburger {
    display: none;
  }

  .header-title {
    margin: 0;
    font-size: var(--fs-xl);
    font-weight: 700;
  }

  .header-user {
    position: absolute;
    right: 70px;
    padding: 0;
    font-size: 14pt;
    font-weight: 500;
    color: var(--color-text-muted);
  }

  .account-wrapper {
    position: absolute;
    right: 24px;
  }

  .account-menu {
    position: absolute;
    right: 0;
    top: 40px;
    min-height: 41px;
    background: var(--color-card);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    display: none;
    min-width: 120px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  .account-menu .menu-item {
    padding: 12px 16px;
    font-weight: 500;
    transition: background 0.2s ease;
  }

  .account-menu .menu-item:hover {
    background: var(--color-primary);
    color: #fff;
  }

  .header-account_circle {
    width: 28px;
    height: 28px;
    padding: 0;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .header-account_circle:hover {
    opacity: 0.85;
  }
  /* #endregion */

  /* #region ヘッダー下のメニューとメインコンテンツ */
  /* ヘッダーの下に全体レイアウトを配置 */
  .main-wrapper {
    display: flex;
    flex: 1;
    margin-top: 0;
    min-height: calc(100vh - 48px);
  }
  /* #endregion */

  /* #region メインコンテンツ */
  .content {
    background: var(--color-surface);
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 24px 56px 24px;
    overflow-y: auto;
    transition: margin-left 0.3s ease, padding-left 0.3s ease;
  }

  .content:not(.expanded) {
    padding-left: 32px;
  }

  .content.expanded {
    margin-left: -220px;
    padding-left: 32px;
  }

  .content h1 {
    margin-top: 0;
  }

  /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
  .content-box {
    display: flex;
    flex-direction: column;
    flex: 1;
    /* overflow: hidden; */
  }

  /* content-box内のpage-title */
  .content-box .page-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-primary);
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e8eef7;
  }
      
  /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
  .content-box .pc-only {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .content-box .sp-only {
    flex: 1;
    min-height: 0;
  }

  .content-box .content-section {
    flex: 1;
    min-height: 0;
  }

  .content-area {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }

  .content-box .search-box {
    flex-shrink: 0;
  }

  .search-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 24px;
    font-family: inherit;
    font-weight: 500;
    color: var(--color-text);
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    box-sizing: border-box;
  }

  .search-box .search-box-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px 24px;
    width: 100%;
  }

  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .search-row label {
    margin: 0;
    font-size: var(--fs-xs);
    font-weight: 500;
    color: var(--color-text-muted);
    white-space: nowrap;
  }

  .search-row select,
  .search-row input:not([type="checkbox"]) {
    font-size: var(--fs-xs);
    min-width: 160px;
    padding: 3px 12px;
    font-family: inherit;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-card);
    color: var(--color-text);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search-row option {
    font-size: var(--fs-xs);
  }

  .multi-select {
    position: relative;
    width: 100%;
  }

  .multi-select-toggle {
    width: 100%;
    text-align: left;
    font-size: var(--fs-xs);
    min-width: 160px;
    padding: 3px 12px;
    font-family: inherit;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-card);
    color: var(--color-text);
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .multi-select-toggle:hover {
    border-color: #b0bdb5;
  }

  .multi-select.is-open .multi-select-toggle {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.12);
  }

  .multi-select-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 10;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    max-height: 220px;
    padding: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
  }

  .multi-select.is-open .multi-select-menu {
    display: block;
  }

  .multi-select-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 2px;
    cursor: pointer;
    font-size: var(--fs-xs);
    white-space: normal;
    width: 100%;
    box-sizing: border-box;
  }

  .multi-select-option input[type="checkbox"] {
    margin: 0;
  }

  .multi-select-option input[type="checkbox"]:focus,
  .multi-select-option input[type="checkbox"]:focus-visible {
    outline: none;
    box-shadow: none;
  }

  .search-row select:hover,
  .search-row input:not([type="checkbox"]):hover {
    border-color: #b0bdb5;
  }

  .search-row select:focus,
  .search-row input:not([type="checkbox"]):focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.12);
  }

  .search-row input::placeholder {
    color: #9ca89f;
  }

  .search-cancel-wrapper {
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  .btn-search-cancel {
    display: inline-block;
    padding: 6px 14px;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    font-weight: 400;
    font-family: inherit;
    white-space: nowrap;
  }

  .btn-search-cancel:hover {
    background: var(--color-primary-dark);
    color: #fff;
  }
  /* #endregion */

  /* #region ship_schedule.css */
  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding: 20px 24px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .page-header h1 {
    margin: 0;
    font-size: 28px;
    color: #1f3c88;
  }

  .sub-title {
    margin: 6px 0 0;
    font-size: 14px;
    color: #666;
  }

  .list-area {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    padding: 20px;
  }

  .list-header {
    margin-bottom: 5px;
  }

  .list-header h2 {
    margin: 0;
    font-size: 16px;
    /* border-left: 5px solid #1f3c88; */
    padding-left: 0px;
  }

  .table-wrap {
    overflow-x: auto;
  }

  /* 一覧テーブル */
  .result-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 1200px;
  }

  .result-table th,
  .result-table td {
    padding: 8px 10px;
    border-top: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
    border-left: none;
    border-right: none;
    text-align: left;
    white-space: normal;
    word-break: break-word;
    font-size: 14px;
    vertical-align: top;
  }

  .result-table th {
    background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
    color: #fff;
    font-weight: 600;
    border-top: none;
  }

  .result-table tr:nth-child(even) {
    background: var(--color-surface);
  }

  .result-table tr:hover {
    background: rgba(0, 134, 50, 0.06);
  }

  /* zuankensaku.html と同一（セル内リンク用） */
  .result-table a {
    color: #0066cc;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .result-table a:hover {
    opacity: 0.9;
  }

  .empty-row td {
    text-align: center;
    color: #888;
    padding: 30px 10px;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .btn:hover {
    opacity: 0.9;
  }

  .btn-primary {
    background: #1f3c88;
    color: #fff;
  }

  .btn-secondary {
    background: #d9dee8;
    color: #333;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 999;
  }

  .hidden {
    display: none;
  }

  .modal-content {
    width: 100%;
    max-width: 900px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    overflow: hidden;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    background: var(--color-primary);
    color: #fff;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 20px;
  }

  .close-btn {
    border: none;
    background: transparent;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
  }

  .form-area {
    padding: 24px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.wide {
    grid-column: 1 / -1;
  }

  label {
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cfd7e6;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }

  /* モーダル: 納品日/納品時間をメーカー入力と同幅に揃える */
  #date,
  #time {
    width: 92%;
    min-width: 0;
    box-sizing: border-box;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #1f3c88;
    box-shadow: 0 0 0 3px rgba(31, 60, 136, 0.12);
  }

  .form-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  } 

  /* クリアボタン */
  #searchCancelAllBtn {
      display: inline-block;
      padding: 6px 14px;
      font-size: var(--fs-xs);
      background: var(--color-clearbutton-background);
      color: var(--color-text);
      border: 1px solid var(--color-clearbutton-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
      box-shadow: none;
    }
    #searchCancelAllBtn:hover {
      background:var(--color-clearbutton-background-hover);
      color: var(--color-text);
      border: 1px solid var(--color-clearbutton-border);
      transform: none;
      box-shadow: none;
    }

  @media (min-width: 769px) {
    .search-toggle-sp {
      display: none;
    }

    /* スマホ以外: メーカー入力幅を通常1カラム（乙仲と同じ）にする */

    .form-group .manufacturer-row,
    .form-group .manufacturer-row .autocomplete,
    .form-group .manufacturer-row .autocomplete input[name="manufacturer"] {
      width: 100%;
    }

    /* 画面右下固定 アクションボタン */
    .btn-fab-bar {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      min-width: 140px;
      width: 140px;
      box-sizing: border-box;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    button.btn-fab-new {
      font: inherit;
    }
  }

  /* スマホ */
  @media (max-width: 768px) {
    html,
    body {
      height: auto;
      min-height: 100%;
      overflow-y: auto;
    }

    .main-wrapper {
      display: flex;
      width: 100%;
      flex: 1;
      height: auto;
      min-height: calc(100vh - 48px);
      overflow: visible;
    }

    /* #sidebarMount / .sidebar は上書きしない */

    .header-title {
      margin: 5px 0px 0px 35px;
      font-size: var(--fs-xl);
    }

    .header-user {
      display: none;
    }

    .content {
      background: var(--color-surface);
      flex-direction: column;
      flex: 1;
      width: 100%;
      padding: 12px 12px 56px 12px;
      margin-left: -220px;
      overflow: visible;
    }

    .content:not(.expanded) {
      padding-left: 12px;
    }

    .content.expanded {
      width: 100%;
      margin-left: -220px;
      padding-left: 12px;
    }

    .content-box {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      flex: none;
      min-height: 0;
    }

    .content-box .page-title {
      margin: 0 0 16px;
      padding-bottom: 8px;
    }

    .search-toggle-sp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      font-family: inherit;
      font-weight: 500;
      color: var(--color-text);
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: left;
      box-sizing: border-box;
    }

    .search-toggle-sp-label {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .search-toggle-sp-icon {
      margin-right: 8px;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .search-toggle-sp-text {
      font-size: var(--fs-xs);
    }

    .search-toggle-sp::after {
      content: "＋";
      color: var(--color-text-muted);
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .search-box .search-box-inner {
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 12px 0 0;
      gap: 12px 16px;
    }

    .search-box.is-open .search-box-inner {
      display: grid;
    }

    .search-box.is-open .search-toggle-sp::after {
      content: "ー";
    }

    .search-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0px;
    }

    .search-row label {
      font-size: var(--fs-xs);
      flex-shrink: 0;
    }

    .search-row select,
    .search-row input {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }

    .search-row .multi-select,
    .search-row .multi-select-toggle {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }

    .search-row .manufacturer-row,
    .search-row .manufacturer-row .autocomplete,
    .search-row .manufacturer-row .autocomplete .autocomplete-input {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* スマホ: 納品日の検索欄・モーダルの納品日/納品時間を左寄せ（UA既定を上書き） */
    #periodFromOnly,
    #date,
    #time {
      text-align: left !important;
    }

    #periodFromOnly::-webkit-datetime-edit,
    #date::-webkit-datetime-edit,
    #time::-webkit-datetime-edit {
      text-align: left !important;
    }

    #periodFromOnly::-webkit-date-and-time-value,
    #date::-webkit-date-and-time-value,
    #time::-webkit-date-and-time-value {
      text-align: left !important;
    }

    .multi-select-menu {
      text-align: left;
    }

    .multi-select-option {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      justify-content: flex-start;
      justify-items: start;
      column-gap: 8px;
      text-align: left;
    }

    .multi-select-option span {
      justify-self: start;
      text-align: left;
    }

    .search-cancel-wrapper {
      grid-column: 2;
      margin-left: 0;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      align-self: end;
    }

    /* スマホ: 一覧の指定列は折り返ししない */
    .result-table th:nth-child(2),
    .result-table td:nth-child(2),
    .result-table th:nth-child(3),
    .result-table td:nth-child(3),
    .result-table th:nth-child(4),
    .result-table td:nth-child(4),
    .result-table th:nth-child(6),
    .result-table td:nth-child(6),
    .result-table th:nth-child(7),
    .result-table td:nth-child(7),
    .result-table th:nth-child(8),
    .result-table td:nth-child(8) {
      white-space: nowrap;
    }

    /* スマホ: メーカー入力幅を乙仲と同じにする */
    .manufacturer-group .manufacturer-row,
    .manufacturer-group .manufacturer-row .autocomplete,
    .manufacturer-group .manufacturer-row .autocomplete input[name="manufacturer"] {
      width: 100%;
      min-width: 0;
    }

    /* スマホ: 新規登録モーダルを縦スクロール可能にする */
    .modal {
      align-items: flex-start;
      overflow-y: auto;
    }

    .modal-content {
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      margin: 12px 0;
    }

    .btn-fab-bar {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 2001;
      display: grid;
      grid-template-columns: 140px 140px;
      justify-content: end;
      gap: 12px;
      align-items: stretch;
    }

    .btn-fab-bar > a:first-child {
      grid-column: 2;
      grid-row: 1;
    }

    .btn-fab-bar #openModalBtn {
      grid-column: 2;
      grid-row: 1;
      justify-self: end;
    }

    .btn-fab-bar #btnClear {
      grid-column: 1;
      grid-row: 2;
    }

    .btn-fab-bar #btnEntry {
      grid-column: 2;
      grid-row: 2;
    }

    .btn-fab-new {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 140px;
      min-width: 140px;
      height: 34px;
      padding: 6px 14px;
      box-sizing: border-box;
      background: var(--color-primary);
      color: #fff;
      border: none;

      cursor: pointer;
      text-align: center;
    }

    .btn-fab-new:hover {

      color: #fff;
    }

    /* ハンバーガーボタン */
    .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  /* #endregion */
  </style>
</head>
<body>
  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->

      <img src="images/menu_50dp_008632.svg" />

    <div class="header-title"><a href="dashboard.html">Proma</a></div>

  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->

    <!-- #endregion -->

    <!-- 画面右下固定 新規登録ボタン -->
    <div class="btn-fab-bar">
      <button type="button" class="btn-fab-new" id="openModalBtn">新規登録</button>
    </div>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <div class="content-box">
        <h2 class="page-title">Shipスケジュール登録</h2>
<!--
  <div class="page">
    <header class="page-header">
      <div>
        <h1>Shipスケジュール登録</h1>
        <p class="sub-title">コンテナ一覧・登録画面</p>
      </div>
      <button id="openModalBtn" class="btn btn-primary">新規登録</button>
    </header>
  -->
      <div class="view-layout view-layout-1-group">
        <!-- 検索条件ボックス -->
        <div class="content-area">
          <div class="search-box" id="searchBox">
            <button type="button" class="search-toggle-sp" id="searchToggleSp" aria-expanded="false"
              aria-controls="searchRowsPanel">
              <span class="search-toggle-sp-label">
                <img class="search-toggle-sp-icon" src="images/search_20dp_008632.svg" alt="" width="20" height="20">
                <span class="search-toggle-sp-text">検索条件を開く</span>
              </span>
            </button>
            <div class="search-box-inner" id="searchRowsPanel">
              <div class="search-row">
                <label for="searchItem">メーカー</label>  
                <div class="manufacturer-row input-actions">
                  <div class="autocomplete">
                    <input type="text" class="autocomplete-input" data-list="supplier" placeholder="メーカー検索"
                      id="searchItem">
                    <div class="autocomplete-dropdown"></div>
                  </div>
                </div>
              </div>
              <div class="search-row" id="deliveryDateFilterItem">
                <label for="periodFromOnly">納品日</label>               
                <div class="search-row period-range-row period-range-row--from-only">
                  <div class="period-range-field">
                    <input type="date" id="periodFromOnly" name="periodFromOnly"
                      class="period-range-input" autocomplete="off" aria-label="納品日">
                  </div>
                </div>
              </div>
              <div class="search-row">
                <label for="searchCategory">区分</label>
                <select id="categorySelect">
                  <option value="">選択してください</option>
                  <option value="直送">直送</option>
                  <option value="外部">外部</option>
                  <option value="瀬戸">瀬戸</option>
                </select>
              </div>
              <div class="search-row">
                <label for="searchINVNo">INVNo.</label>
                <input type="text" id="searchINVNo" placeholder="INVNo.を入力" autocomplete="off" aria-label="INVNo.">
              </div>
              <div class="search-cancel-wrapper">
                <button type="button" class="btn-search-cancel" id="searchCancelAllBtn">クリア</button>
              </div>
            </div>
          </div>
        </div>
        <!-- 検索結果一覧エリア -->
        <div class="content-area" id="approvalNoticeArea">
          <section class="list-area">
            <div class="list-header">
              <h2>コンテナ一覧</h2>
            </div>

            <div class="table-wrap">
              <table id="result-table" class="result-table">
                <thead>
                  <tr>
                    <th style="width: 15%;">メーカー</th>
                    <th style="width: 7%;">納品日</th>
                    <th style="width: 5%;">納品時間</th>
                    <th style="width: 5%;">区分</th>
                    <th style="width: 11%;">詳細</th>
                    <th style="width: 5%;">サイズ</th>
                    <th style="width: 7%;">ケース数</th>
                    <th style="width: 10%;">金額</th>
                    <th style="width: 10%;">INVNo.</th>
                    <th style="width: 10%;">乙仲</th>
                    <th style="width: 15%;">備考</th>
                  </tr>
                </thead>
                <tbody id="scheduleTbody">
                  <tr>
                    <td>今治ソフトパイル株式会社</td>
                    <td>2026/05/01</td>
                    <td>09:00</td>
                    <td>直送</td>
                    <td>定期便サンプル</td>
                    <td>40FT</td>
                    <td>120</td>
                    <td>250,000 円</td>
                    <td>INV-20260501-001</td>
                    <td>乙仲A</td>
                    <td>初期表示データ</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>

      <!-- モーダル -->
      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h2>新規登録</h2>
            <button id="closeModalBtn" class="close-btn" type="button">×</button>
          </div>

          <form id="scheduleForm" class="form-area">
            <div class="form-grid">
              <div class="form-group manufacturer-group">
                <label for="manufacturer">メーカー</label>
                <div class="manufacturer-row input-actions">
                  <div class="autocomplete">
                    <input type="text" id="manufacturer" class="autocomplete-input" data-list="supplier" placeholder="メーカーを入力" name="manufacturer">
                    <div class="autocomplete-dropdown"></div>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label for="date">納品日</label>
                <input type="date" id="date" name="date" required>
              </div>
              
              <div class="form-group">
                <label for="date">納品時間</label>
                <input type="time" id="time" name="time" required>
              </div>

              <div class="form-group">
                <label for="category">区分</label>
                <select id="category" name="category" required>
                  <option value="">選択してください</option>
                  <option value="直送">直送</option>
                  <option value="外部">外部</option>
                  <option value="瀬戸">瀬戸</option>
                </select>
              </div>

              <div class="form-group wide">
                <label for="detail">詳細</label>
                <input type="text" id="detail" name="detail" placeholder="詳細を入力" required>
              </div>

              <div class="form-group">
                <label for="size">サイズ</label>
                <select id="size" name="size" required>
                  <option value="">選択してください</option>
                  <option value="20FT">20FT</option>
                  <option value="40FT">40FT</option>
                  <option value="40HQ">40HQ</option>
                </select>
              </div>

              <div class="form-group">
                <label for="cases">ケース数</label>
                <input type="number" id="cases" name="cases" min="0" placeholder="0" required>
              </div>

              <div class="form-group">
                <label for="amount">金額</label>
                <input type="number" id="amount" name="amount" min="0" placeholder="0" required>
              </div>

              <div class="form-group">
                <label for="invNo">INVNo</label>
                <input type="text" id="invNo" name="invNo" placeholder="INV番号を入力" required>
              </div>

              <div class="form-group">
                <label for="broker">乙仲</label>
                <input type="text" id="broker" name="broker" placeholder="乙仲を入力">
              </div>

              <div class="form-group wide">
                <label for="remarks">備考</label>
                <textarea id="remarks" name="remarks" rows="3" placeholder="備考を入力"></textarea>
              </div>
            </div>

            <div class="form-footer">
              <button type="button" id="cancelBtn" class="btn-fab-new">閉じる</button>
              <button type="submit" id="submitBtn" class="btn-fab-new">登録</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- <script src="ship_schedule.js"></script> -->
    <script src="js/sidebar.js"></script>
    <script>
      // サイドバーの読み込み
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

      // スマホ: 検索条件の折りたたみ開閉
      (function () {
        var btn = document.getElementById("searchToggleSp");
        var box = document.getElementById("searchBox");
        if (btn && box) {
          btn.addEventListener("click", function () {
            var isOpen = box.classList.toggle("is-open");
            btn.setAttribute("aria-expanded", isOpen);
            var textEl = btn.querySelector(".search-toggle-sp-text");
            if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
          });
        }
      })();

      // 検索条件クリア: 画面を再読み込み
      (function () {
        var clearBtn = document.getElementById("searchCancelAllBtn");
        if (!clearBtn) return;
        clearBtn.addEventListener("click", function () {
          window.location.reload();
        });
      })();

      /* #region ship_schedule.js */
      const modal = document.getElementById("modal");
      const openModalBtn = document.getElementById("openModalBtn");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const scheduleForm = document.getElementById("scheduleForm");
      const scheduleTbody = document.getElementById("scheduleTbody");

      openModalBtn.addEventListener("click", () => {
        modal.classList.remove("hidden");
      });

      closeModalBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);

      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });

      function closeModal() {
        modal.classList.add("hidden");
        scheduleForm.reset();
      }

      scheduleForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const manufacturer = document.getElementById("manufacturer").value;
        const date = document.getElementById("date").value; 
        const time = document.getElementById("time").value;
        const category = document.getElementById("category").value;
        const detail = document.getElementById("detail").value;
        const size = document.getElementById("size").value;
        const cases = document.getElementById("cases").value;
        const amount = document.getElementById("amount").value;
        const invNo = document.getElementById("invNo").value;
        const broker = document.getElementById("broker").value;
        const remarks = document.getElementById("remarks").value;

        const emptyRow = scheduleTbody.querySelector(".empty-row");
        if (emptyRow) {
          emptyRow.remove();
        }

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(manufacturer)}</td>
          <td>${formatDate(date)}</td>
          <td>${escapeHtml(formatTime(time))}</td>
          <td>${escapeHtml(category)}</td>
          <td>${escapeHtml(detail)}</td>
          <td>${escapeHtml(size)}</td>
          <td>${escapeHtml(cases)}</td>
          <td>${formatNumber(amount)} 円</td>
          <td>${escapeHtml(invNo)}</td>
          <td>${escapeHtml(broker)}</td>
          <td>${escapeHtml(remarks)}</td>
        `;

        scheduleTbody.appendChild(row);
        closeModal();
      });

      function formatDate(dateString) {
        if (!dateString) return "";
        const date = new Date(dateString);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}/${m}/${d}`;
      }

      /** input[type=time] の値（例 HH:MM）を一覧表示用に整形 */
      function formatTime(timeString) {
        if (!timeString) return "";
        const parts = String(timeString).split(":");
        if (parts.length >= 2) {
          const h = parts[0].padStart(2, "0");
          const min = parts[1].padStart(2, "0");
          return `${h}:${min}`;
        }
        return String(timeString);
      }

      function formatNumber(value) {
        return Number(value).toLocaleString();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
      /* #endregion */      
    </script>
  </div>
  <!-- #endregion -->
</body>
