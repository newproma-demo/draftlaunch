<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 25px);
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 24px 32px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr 1fr;
      gap: 10px;
      height: 97vh;
      /* 登録ボタン（fixed bottom）の上まで確保 */
      padding-bottom: 50px;
      box-sizing: border-box;
      /* 必要なら画面いっぱいに */
    }

    .content h1 {
      grid-column: 1 / 3;
      grid-row: 1;
      margin-left: 10px;
    }

    .content-area-1 {
      grid-column: 1;
      grid-row: 2;
      width: 100%;
    }

    .content-area-2 {
      grid-column: 2;
      /* タイトル下の2段分をまたぎ、縦いっぱいに画像エリアを伸ばす */
      grid-row: 2 / 4;
      min-height: 600px;
      max-height: calc(100vh - 170px);
      overflow: visible;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-panel-toolbar {
      width: min(100%, 760px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .image-toolbar-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .image-toolbar-main-actions {
      display: flex;
      gap: 8px;
    }

    .product-image-wrapper {
      flex: 1 1 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      background-color: #fafafa;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .product-image-wrapper.dragover,
    .product-card.dragover .product-image-wrapper {
      border-color: var(--color-primary);
      background-color: #f0f8ff;
    }

    .image-panel-stage {
      width: min(100%, 760px);
      position: relative;
      padding-right: 0;
      box-sizing: border-box;
    }

    .image-add-btn {
      border: none;
      background: var(--color-primary);
      color: #fff;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
      z-index: 3;
    }

    .image-add-btn:hover {
      background: var(--color-primary-dark);
    }

    /* 画像内オーバーレイ（×・＜前へ・＞次へ 共通） */
    .product-image-remove-btn,
    .product-image-prev-btn,
    .product-image-next-btn {
      position: absolute;
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      box-sizing: border-box;
    }

    /* × は右上（noimage 時は JS で hidden） */
    .product-image-remove-btn {
      top: 8px;
      right: 8px;
    }

    /* 「前へ」は画像左・縦中央 */
    .product-image-prev-btn {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* 「次へ」は画像右・縦中央（× と縦位置は別で重ならない） */
    .product-image-next-btn {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .product-image-remove-btn:hover,
    .product-image-prev-btn:hover:not(:disabled),
    .product-image-next-btn:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.72);
    }

    .product-image-prev-btn:disabled,
    .product-image-next-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .product-image-prev-btn img,
    .product-image-next-btn img {
      width: 20px;
      height: 20px;
      display: block;
      pointer-events: none;
    }

    /* HTML の hidden が author stylesheet の display:flex に負けるのを防ぐ */
    .product-image-remove-btn[hidden],
    .product-image-prev-btn[hidden] {
      display: none !important;
      pointer-events: none;
    }

    .image-index-indicator {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      font-size: var(--fs-sm);
      line-height: 1.2;
      white-space: nowrap;
    }

    /* カード全体をドロップ可能に（子の canvas 上でも受け取れるよう capture で処理） */
    .product-card.dragover {
      outline: 2px dashed var(--color-primary);
      outline-offset: 2px;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が768px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
        /* 画像ブロックと商品ブロックの境目をはっきりさせる（重なりに見えないように） */
        gap: 12px;
        /* 明細追加時のスクロールアンカーで表示位置が跳ねるのを防ぐ */
        overflow-anchor: none;
      }

      .dashboard-section {
        display: flex;
        gap: 24px;
        margin-top: 0;
        width: 100%;
        flex-direction: column;
        padding-bottom: 20px;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      /*
       * order で画像の下に来ても DOM 順は area-1 → area-2 のため、
       * area-1 に z-index を付けると画像より手前に描画されかぶさる。z-index は付けない。
       */
      .content-area-1 {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        /* 親の余白を取りにいかない＝ボタン直上の位置が明細行数で変わらない */
        flex: 0 0 auto;
        align-self: stretch;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
      }

      .content-area-1-header {
        flex: 0 0 auto;
      }

      .btn-sel-product {
        position: relative;
      }

      /* 商品名などが多いときはこの領域だけ縦スクロール（高さは伸ばさない） */
      .detail-table-scroll-wrap {
        flex: 0 1 auto;
        min-height: 0;
        max-height: min(50vh, calc(100vh - 320px));
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overflow-anchor: none;
      }

      /* スマホ: 商品選択モーダルの各入力行を同じ開始位置/幅に揃える（ラベル列を確保して入力を右に寄せる） */
      .modal-product-select-page .filter-row .filter-item {
        display: grid;
        grid-template-columns: minmax(8.75rem, 10rem) minmax(0, 1fr);
        align-items: center;
        column-gap: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .modal-product-select-page .filter-row .filter-item .filter-label,
      .modal-product-select-page .filter-row .filter-item label {
        margin: 0;
        min-width: 0;
        max-width: 100%;
        padding-right: 2px;
        white-space: normal;
        word-break: keep-all;
        line-height: 1.35;
        align-self: center;
      }

      .modal-product-select-page .filter-row .filter-item select,
      .modal-product-select-page .filter-row .filter-item input[type="text"] {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        justify-self: stretch;
      }

      /* スマホ: 商品選択モーダルの結果テーブルは折り返さず横スクロール */
      .modal-product-select-page .modal-result-table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .modal-product-select-page .modal-result-table {
        width: max-content;
        min-width: 100%;
        table-layout: auto;
      }

      .modal-product-select-page .modal-result-table th,
      .modal-product-select-page .modal-result-table td {
        white-space: nowrap;
      }

      /* 図案追加: 登録ボタン（.btn-fab-new）と同系・ラベルは改行しない */
      .image-toolbar-main-actions {
        flex-wrap: nowrap;
        align-items: center;
        gap: 8px;
      }

      .image-add-btn {
        white-space: nowrap;
        flex-shrink: 0;
        box-sizing: border-box;
        padding: 6px 14px;
        min-width: 100px;
        width: max-content;
        border: none;
        border-radius: var(--radius-sm);
        font-family: var(--font-sans);
        line-height: 1.2;
        text-align: center;
      }

      .image-panel-stage {
        width: 100%;
        height: 48vh;
        max-height: 320px;
        padding-right: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        gap: 8px;
      }

      /* 明細が増えたときに flex が画像エリアを縮めない。画像を手前に描画して下のブロックと重ならない */
      .content-area-2 {
        order: -1;
        min-height: 5px;
        max-height: none;
        overflow: visible;
        flex-shrink: 0;
        flex-grow: 0;
        position: relative;
        z-index: 1;
      }

      .content h1 {
        order: -2;
        flex-shrink: 0;
      }

      .image-panel-stage .product-card {
        grid-column: 1;
        grid-row: 1;
        height: 100%;
        max-height: 100%;
      }
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    /* 商品選択モーダルは css/style.css の .product-select-modal-* を使用 */

    .btn-sel-product {
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
    }

    /* 画面右下固定 新規登録ボタン */
    .btn-fab-new {
      position: fixed;
      right: 24px;
      bottom: 12px;
      z-index: 2001;
      min-width: 100px;
      width: clamp(80px, 5vw, 120px);
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
    }

    .product-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-top: 0;
      margin-bottom: 3px;
      box-sizing: border-box;
      background: #fff;
      width: 100%;
      height: min(860px, calc(100vh - 220px));
      max-height: calc(100vh - 220px);
      min-height: 0;
      overflow: hidden;
    }

    .product-nav {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .product-nav-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--color-text);
      white-space: nowrap;
    }

    .product-nav-btn:hover:not(:disabled) {
      background: var(--color-surface);
    }

    .product-nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* 枠内に必ず収める（縦横比は維持・はみ出し・スクロールなし） */
    img.product-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    /* PDF は PDF.js で canvas に描画（iframe blob は多くの環境でブロックされるため） */
    .product-pdf-canvas-wrap {
      display: none;
      width: 100%;
      height: 100%;
      overflow: auto;
      align-items: center;
      justify-content: center;
      background: #e8e8e8;
      box-sizing: border-box;
    }

    .product-image-wrapper.is-pdf .product-pdf-canvas-wrap {
      display: flex;
    }

    .product-image-wrapper.is-pdf img.product-image {
      display: none;
    }

    .product-pdf-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .product-pdf-fallback {
      display: none;
      padding: 12px;
      text-align: center;
      font-size: var(--fs-sm, 14px);
    }

    .product-image-wrapper.is-pdf-fallback .product-pdf-fallback {
      display: block;
    }

    .product-image-wrapper.is-pdf-fallback .product-pdf-canvas-wrap {
      display: none;
    }

    .product-pdf-fallback a {
      color: var(--color-primary, #008632);
      word-break: break-all;
    }

    .product-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      order: 0;
    }

    .product-table th,
    .product-table td {
      font-size: clamp(var(--fs-sm), 0.5vw + 8px, var(--fs-lg));
      border: 1px solid var(--color-border);
      padding: 4px 6px;
      vertical-align: middle;
    }

    .product-table th {
      background: #f5f7fa;
    }

    .product-table input,
    .product-table textarea {
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 4px 6px;
    }

    .product-table .half-field {
      width: 100%;
      max-width: 100%;
    }

    .detail-table {
      width: 95%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .detail-table tr+tr td {
      border-top: 1px solid var(--color-border);
    }

    .detail-table td {
      padding: 6px 8px;
    }

    .detail-delete-cell {
      width: 32px;
      text-align: center;
      vertical-align: middle;
    }

    .detail-delete-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: #fff;
      color: #000;
      cursor: pointer;
      line-height: 1;
      font-weight: 700;
      padding: 0;
    }

    .detail-delete-btn:hover {
      background: #f0f0f0;
    }


    @media (min-width: 900px) {
      .product-card {
        padding: 8px;
        gap: 8px;
        min-height: 0;
        overflow: hidden;
      }

      .product-table th,
      .product-table td {
        padding: 2px 4px;
      }

      .product-table input,
      .product-table textarea,
      .product-table select {
        padding: 2px 4px;
      }

      .product-table textarea {
        min-height: 32px;
      }
    }

    .content-area-1 {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定 新規登録ボタン -->
    <button type="button" class="btn-fab-new">登録</button>

    <!--#region メインコンテンツ  -->
    <div class="content">
      <!-- 画面タイトル -->
      <h1>図案提出</h1>
      <!-- ========== : 検索条件・検索結果一覧 ========== -->
      <!-- 検索条件ボックス -->
      <div class="content-area-1">
        <div class="content-area-1-header">
          <button type="button" class="btn-sel-product" id="btnSelProduct">商品を選択</button>
        </div>
        <div class="detail-table-scroll-wrap">
          <table class="detail-table" id="detailTableProductList">
            <tbody id="detailTableProductListBody">
            </tbody>
          </table>
        </div>
      </div>
      <div class="content-area-2">
        <div class="image-panel-toolbar">
          <div class="image-index-indicator" id="productImageIndexIndicator">1 / 1</div>
          <div class="image-toolbar-actions">
            <div class="image-toolbar-main-actions">
              <button type="button" class="image-add-btn" id="productImageAddBtn">図案追加</button>
            </div>
          </div>
        </div>
        <div class="image-panel-stage">
          <div class="product-card is-active">
            <div class="product-image-wrapper">
              <button type="button" class="product-image-prev-btn" id="productImageNextBtn" title="前へ"
                aria-label="前へ" hidden aria-hidden="true"><img src="images/chevron_left_20dp_F4F6F9.svg" alt="" width="20"
                  height="20" decoding="async"></button>
              <button type="button" class="product-image-next-btn" id="productImagePrevBtn" title="次へ"
                aria-label="次へ"><img src="images/chevron_right_20dp_F4F6F9.svg" alt="" width="20" height="20"
                  decoding="async"></button>
              <img class="product-image" name="allimage" src="images/noimage.png" alt="商品画像プレビュー">
              <div class="product-pdf-canvas-wrap" aria-hidden="true">
                <canvas class="product-pdf-canvas"></canvas>
              </div>
              <div class="product-pdf-fallback">
                <p>この環境では埋め込み表示できません。</p>
                <p><a class="product-pdf-open-tab" href="#" target="_blank" rel="noopener">PDF / AI を新しいタブで開く</a></p>
              </div>
              <button type="button" class="product-image-remove-btn" id="productImageRemoveBtn" hidden
                aria-hidden="true" title="図案をクリア" aria-label="図案をクリア">×</button>
            </div>
            <input type="file" id="productImageInput" accept="image/*,application/pdf,.pdf,.ai" multiple
              class="product-image-input" style="display: none;">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 商品選択モーダル（閉じるボタンのみで閉じる） -->
  <div id="productSelectModalOverlay" class="product-select-modal-overlay" aria-hidden="true"></div>
  <div id="productSelectModalDialog" class="product-select-modal-dialog" role="dialog"
    aria-labelledby="productSelectModalTitle" aria-modal="true">
    <div class="product-select-modal-header">
      <span id="productSelectModalTitle">商品選択</span>
    </div>
    <div class="product-select-modal-body">
      <!-- modal-product-select.html を組み込み（iframe 廃止） -->
      <div class="modal-product-select-page product-select-modal-body-inner">
        <div class="view-layout view-layout-1">
          <div class="filter-row">
            <div class="filter-item">
              <span class="filter-label">販売区分</span>
              <select id="modalSearchHanbaiKubun">
                <option value="" selected disabled>選択してください</option>
                <option value="teiban">定番</option>
                <option value="teibankako">定番加工</option>
                <option value="betchu">別注</option>
                <option value="oem">OEM</option>
              </select>
            </div>
            <div class="filter-item" id="modalCommonTenjikaiField">
              <span class="filter-label">展示会</span>
              <select id="modalSearchTenjikai">

    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_F4F6F9.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_F4F6F9.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

    // 画像／PDF クリック／ドラッグ＆ドロップで複数登録・切り替え表示（PDFは PDF.js で canvas 描画）
    (function () {
      const wrapper = document.querySelector('.product-image-wrapper');
      const img = document.querySelector('.product-image');
      const pdfCanvas = document.querySelector('.product-pdf-canvas');
      const pdfOpenTab = document.querySelector('.product-pdf-open-tab');
      const fileInput = document.getElementById('productImageInput');
      const btnNext = document.getElementById('productImageNextBtn'); // 画像内「前へ」（＜）
      const btnPrev = document.getElementById('productImagePrevBtn'); // 画像内「次へ」（＞）
      const btnAdd = document.getElementById('productImageAddBtn');
      const btnRemove = document.getElementById('productImageRemoveBtn');
      const indexIndicator = document.getElementById('productImageIndexIndicator');

      if (!wrapper || !img || !fileInput) return;

      var pdfObjectUrl = null;
      var mediaItems = [{ type: 'image-url', src: 'images/noimage.png', isPlaceholder: true }];
      var currentMediaIndex = 0;
      var replaceCurrentOnly = false;

      if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      function revokePdfUrl() {
        if (pdfObjectUrl) {
          URL.revokeObjectURL(pdfObjectUrl);
          pdfObjectUrl = null;
        }
      }

      function showImagePreview(dataUrl) {
        revokePdfUrl();
        wrapper.classList.remove('is-pdf', 'is-pdf-fallback');
        if (pdfOpenTab) pdfOpenTab.href = '#';
        img.src = dataUrl;
      }

      function showPdfFallback(file) {
        revokePdfUrl();
        pdfObjectUrl = URL.createObjectURL(file);
        wrapper.classList.add('is-pdf', 'is-pdf-fallback');
        if (pdfOpenTab) pdfOpenTab.href = pdfObjectUrl;
      }

      function showPdfPreview(file) {
        wrapper.classList.remove('is-pdf-fallback');
        if (typeof pdfjsLib === 'undefined' || !pdfCanvas) {
          showPdfFallback(file);
          return;
        }

        revokePdfUrl();
        pdfObjectUrl = URL.createObjectURL(file);
        if (pdfOpenTab) pdfOpenTab.href = pdfObjectUrl;

        var reader = new FileReader();
        reader.onerror = function () {
          showPdfFallback(file);
        };
        reader.onload = function (e) {
          var arrayBuffer = e.target.result;
          var loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          loadingTask.promise.then(function (pdf) {
            return pdf.getPage(1);
          }).then(function (page) {
            var baseViewport = page.getViewport({ scale: 1 });
            var w = wrapper.clientWidth || 400;
            var h = wrapper.clientHeight || 300;
            var scale = Math.min(w / baseViewport.width, h / baseViewport.height, 2);
            var viewport = page.getViewport({ scale: scale });
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;
            var ctx = pdfCanvas.getContext('2d');
            return page.render({ canvasContext: ctx, viewport: viewport }).promise;
          }).then(function () {
            wrapper.classList.add('is-pdf');
          }).catch(function () {
            showPdfFallback(file);
          });
        };
        reader.readAsArrayBuffer(file);
      }

      function isPdfLike(file) {
        return file && (
          file.type === 'application/pdf' ||
          /\.pdf$/i.test(file.name || '') ||
          /\.ai$/i.test(file.name || '')
        );
      }

      function isImageFile(file) {
        return !!(file && file.type && file.type.indexOf('image/') === 0);
      }

      function updateSwitchButtons() {
        if (!btnNext || !btnPrev) return;
        // 「前へ」（左シェブロン）は先頭ページでは非表示
        var atFirst = currentMediaIndex <= 0;
        btnNext.hidden = atFirst;
        btnNext.setAttribute('aria-hidden', atFirst ? 'true' : 'false');
        btnNext.disabled = false;
        // 「次へ」は末尾でも新規ページ追加できるため常に活性
        btnPrev.disabled = false;
      }

      function updateIndexIndicator() {
        if (!indexIndicator) return;
        var current = mediaItems.length ? currentMediaIndex + 1 : 0;
        var total = mediaItems.length;
        indexIndicator.textContent = current + " / " + total;
      }

      function srcIsNoimagePng(src) {
        if (src == null || src === '') return false;
        var s = String(src).trim();
        if (/noimage\.png(\?|#|$)/i.test(s)) return true;
        try {
          var path = new URL(s, document.baseURI).pathname;
          return /(^|\/)noimage\.png$/i.test(path);
        } catch (err) {
          return /noimage\.png/i.test(s);
        }
      }

      function isCurrentMediaClearable() {
        var cur = mediaItems[currentMediaIndex];
        if (!cur) return false;
        if (cur.type === 'pdf-file') return true;
        if (cur.type === 'image-file') {
          var fn = cur.file && String(cur.file.name || '');
          if (/^noimage\.png$/i.test(fn)) return false;
          return true;
        }
        if (cur.type === 'image-url') {
          if (cur.isPlaceholder) return false;
          if (srcIsNoimagePng(cur.src)) return false;
          if (img && srcIsNoimagePng(img.src)) return false;
          return true;
        }
        return false;
      }

      function updateRemoveButtonVisibility() {
        if (!btnRemove) return;
        var show = isCurrentMediaClearable();
        btnRemove.hidden = !show;
        btnRemove.setAttribute('aria-hidden', show ? 'false' : 'true');
      }

      function renderCurrentMedia() {
        var current = mediaItems[currentMediaIndex];
        if (!current) {
          updateRemoveButtonVisibility();
          return;
        }

        if (current.type === 'image-url') {
          showImagePreview(current.src);
          updateSwitchButtons();
          updateIndexIndicator();
          updateRemoveButtonVisibility();
          return;
        }

        if (current.type === 'pdf-file') {
          showPdfPreview(current.file);
          updateSwitchButtons();
          updateIndexIndicator();
          updateRemoveButtonVisibility();
          return;
        }

        if (current.type === 'image-file') {
          var renderToken = currentMediaIndex;
          var reader = new FileReader();
          reader.onload = function (e) {
            if (renderToken !== currentMediaIndex) return;
            showImagePreview(e.target.result);
            updateRemoveButtonVisibility();
          };
          reader.readAsDataURL(current.file);
          updateSwitchButtons();
          updateIndexIndicator();
          updateRemoveButtonVisibility();
        }
      }

      function getFilesFromDataTransfer(dt) {
        if (!dt) return null;
        if (dt.files && dt.files.length) return dt.files;
        if (dt.items && dt.items.length) {
          var arr = [];
          for (var i = 0; i < dt.items.length; i++) {
            if (dt.items[i].kind === 'file') {
              var f = dt.items[i].getAsFile();
              if (f) arr.push(f);
            }
          }
          if (arr.length) return arr;
        }
        return null;
      }

      function handleFiles(files, options) {
        if (!files || !files.length) return;
        var replaceOnly = !!(options && options.replaceCurrentOnly);
        var normalized = [];
        Array.prototype.forEach.call(files, function (file) {
          if (isPdfLike(file)) {
            normalized.push({ type: 'pdf-file', file: file });
            return;
          }
          if (isImageFile(file)) {
            normalized.push({ type: 'image-file', file: file });
          }
        });

        if (!normalized.length) return;
        if (replaceOnly) {
          // 「図案追加」からは現在ページのみ更新
          mediaItems.splice(currentMediaIndex, 1, normalized[0]);
        } else {
          // 画像エリアからは現在ページに添付し、2件目以降は次ページとして挿入
          mediaItems.splice(currentMediaIndex, 1, normalized[0]);
          if (normalized.length > 1) {
            Array.prototype.splice.apply(mediaItems, [currentMediaIndex + 1, 0].concat(normalized.slice(1)));
          }
        }
        renderCurrentMedia();
      }

      // 画像（エリア）クリックでファイル選択 or カメラ起動
      wrapper.addEventListener('click', function (e) {
        var target = e.target;
        if (target && target.closest && target.closest('.image-add-btn')) return;
        if (target && target.closest && target.closest('.product-image-prev-btn')) return;
        if (target && target.closest && target.closest('.product-image-next-btn')) return;
        if (target && target.closest && target.closest('.product-image-remove-btn')) return;
        if (target && target.closest && target.closest('.product-pdf-open-tab')) return;
        if (target && target.closest && target.closest('img.product-image[name="allimage"]')) return;
        fileInput.click();
      });

      fileInput.addEventListener('change', function (e) {
        handleFiles(e.target.files, { replaceCurrentOnly: replaceCurrentOnly });
        replaceCurrentOnly = false;
        fileInput.value = "";
      });

      if (btnNext) {
        btnNext.addEventListener('click', function (e) {
          e.stopPropagation();
          if (currentMediaIndex <= 0) return;
          currentMediaIndex -= 1;
          renderCurrentMedia();
        });
      }

      if (btnPrev) {
        btnPrev.addEventListener('click', function (e) {
          e.stopPropagation();
          if (currentMediaIndex >= mediaItems.length - 1) {
            mediaItems.push({ type: 'image-url', src: 'images/noimage.png', isPlaceholder: true });
          }
          currentMediaIndex += 1;
          renderCurrentMedia();
        });
      }

      if (btnAdd) {
        btnAdd.addEventListener('click', function (e) {
          e.stopPropagation();
          replaceCurrentOnly = true;
          fileInput.click();
        });
      }

      if (btnRemove) {
        btnRemove.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          if (!isCurrentMediaClearable()) return;
          // 2ページ以上: 現在ページを削除して総数を1減らし、前ページ（より小さいインデックス）を表示
          if (mediaItems.length <= 1) {
            mediaItems.splice(0, 1, {
              type: 'image-url',
              src: 'images/noimage.png',
              isPlaceholder: true,
            });
            currentMediaIndex = 0;
          } else {
            mediaItems.splice(currentMediaIndex, 1);
            currentMediaIndex = Math.max(0, currentMediaIndex - 1);
          }
          renderCurrentMedia();
        });
      }

      // ドラッグ＆ドロップ（capture で子要素＝canvas 上でも drop 可能に）
      var dropZone = wrapper.closest('.product-card') || wrapper;

      function setDragOver(active) {
        wrapper.classList.toggle('dragover', active);
        if (dropZone !== wrapper) dropZone.classList.toggle('dragover', active);
      }

      function isOutsideDropZone(target) {
        if (!target || !dropZone.contains) return true;
        return !dropZone.contains(target);
      }

      dropZone.addEventListener('dragenter', function (e) {
        e.preventDefault();
        e.stopPropagation();
        setDragOver(true);
      }, true);

      dropZone.addEventListener('dragover', function (e) {
        e.preventDefault();
        e.stopPropagation();
        try {
          e.dataTransfer.dropEffect = 'copy';
        } catch (err) { /* ignore */ }
        setDragOver(true);
      }, true);

      dropZone.addEventListener('dragleave', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (isOutsideDropZone(e.relatedTarget)) setDragOver(false);
      }, true);

      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        e.stopPropagation();
        setDragOver(false);
        var fileList = getFilesFromDataTransfer(e.dataTransfer);
        if (fileList && fileList.length) handleFiles(fileList);
      }, true);

      dropZone.addEventListener('dragend', function () {
        setDragOver(false);
      }, true);

      if (pdfOpenTab) {
        pdfOpenTab.addEventListener('click', function (e) {
          e.stopPropagation();
          if (pdfOpenTab.getAttribute('href') === '#') e.preventDefault();
        });
      }

      updateSwitchButtons();
      updateIndexIndicator();
      renderCurrentMedia();
    })();

    // 商品を選択モーダル（閉じる／追加で閉じる）
    (function () {
      var overlay = document.getElementById('productSelectModalOverlay');
      var dialog = document.getElementById('productSelectModalDialog');
      var btnOpen = document.getElementById('btnSelProduct');
      var btnClose = document.getElementById('productSelectModalClose');
      var btnAdd = document.getElementById('productSelectModalAdd');
      if (!overlay || !dialog || !btnOpen || !btnClose) return;

      function openModal() {
        overlay.classList.add('is-open');
        dialog.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        // レスポンシブで描画が遅れる端末向けに次フレームでも表示確定
        requestAnimationFrame(function () {
          overlay.classList.add('is-open');
          dialog.classList.add('is-open');
        });
      }

      function closeModal() {
        overlay.classList.remove('is-open');
        dialog.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      btnOpen.addEventListener('click', function (e) {
        e.preventDefault();
        openModal();
      });

      btnClose.addEventListener('click', function (e) {
        e.preventDefault();
        closeModal();
      });

      if (btnAdd) {
        btnAdd.addEventListener('click', function (e) {
          e.preventDefault();
          var detailTbody = document.getElementById('detailTableProductListBody');
          var dialogEl = document.getElementById('productSelectModalDialog');
          if (!detailTbody || !dialogEl) {
            closeModal();
            return;
          }
          var checks = dialogEl.querySelectorAll('.modal-result-row-check:checked');
          if (!checks.length) {
            alert('追加する商品を選択してください。');
            return;
          }
          checks.forEach(function (cb) {
            var tr = cb.closest('tr');
            if (!tr) return;
            var tds = tr.querySelectorAll('td');
            // td[0]=checkbox, [1]=品名, [2]=販売区分, [3]=カテゴリー, [4]=アイテム, [5]=ブランド
            if (tds.length < 6) return;
            var hinmei = (tds[1].textContent || '').trim();
            var hanbai = (tds[2].textContent || '').trim();
            var category = (tds[3].textContent || '').trim();
            var item = (tds[4].textContent || '').trim();
            var brand = (tds[5].textContent || '').trim();
            var designer = (tds[6].textContent || '').trim();
            var meta = [hanbai, category, item, brand, designer].filter(function (s) { return s; }).join('｜');
            var newTr = document.createElement('tr');
            newTr.innerHTML =
              '<td class="detail-delete-cell">' +
              '<button type="button" class="detail-delete-btn">×</button>' +
              '</td>' +
              '<td>' +
              '<div class="detail-name"></div>' +
              '<div class="detail-meta"></div>' +
              '</td>';
            newTr.querySelector('.detail-name').textContent = hinmei;
            newTr.querySelector('.detail-meta').textContent = meta || '—';
            detailTbody.appendChild(newTr);
          });
          closeModal();
        });
      }

      // オーバーレイクリックでは閉じない（要件）
      // ESC でも閉じない（閉じるボタンのみ）
    })();

    // モーダル内 販売区分に応じた展示会フィールド表示（modal-product-select.html 組み込み分）
    (function () {
      var s = document.getElementById('modalSearchHanbaiKubun');
      var f = document.getElementById('modalCommonTenjikaiField');
      var t = document.getElementById('modalSearchTenjikai');
      if (!s || !f) return;

      u();
      s.addEventListener('change', u);

    // モーダル検索結果 チェックボックス 全選択／全選択解除
    (function () {
      var dialog = document.getElementById('productSelectModalDialog');
      if (!dialog) return;
      var selectAllCb = document.getElementById('modalResultSelectAll');
      var btnAll = document.getElementById('modalResultSelectAllBtn');
      var btnNone = document.getElementById('modalResultDeselectAllBtn');

      function getRowChecks() {
        return dialog.querySelectorAll('.modal-result-row-check');
      }

      function setAll(checked) {
        getRowChecks().forEach(function (cb) {
          cb.checked = checked;
        });
        if (selectAllCb) selectAllCb.checked = checked;
      }

      function syncHeaderCheckbox() {
        if (!selectAllCb) return;
        var checks = getRowChecks();
        if (!checks.length) {
          selectAllCb.checked = false;
          selectAllCb.indeterminate = false;
          return;
        }
        var n = 0;
        checks.forEach(function (cb) {
          if (cb.checked) n++;
        });
        selectAllCb.checked = n === checks.length;
        selectAllCb.indeterminate = n > 0 && n < checks.length;
      }

      if (btnAll) {
        btnAll.addEventListener('click', function () {
          setAll(true);
        });
      }
      if (btnNone) {
        btnNone.addEventListener('click', function () {
          setAll(false);
        });
      }
      if (selectAllCb) {
        selectAllCb.addEventListener('change', function () {
          setAll(selectAllCb.checked);
        });
      }
      getRowChecks().forEach(function (cb) {
        cb.addEventListener('change', syncHeaderCheckbox);
      });
      syncHeaderCheckbox();
    })();

    // 明細行の削除（×ボタン）
    (function () {
      const table = document.querySelector('.detail-table');
      if (!table) return;

      table.addEventListener('click', function (e) {
        const btn = e.target.closest('.detail-delete-btn');
        if (!btn) return;

        const row = btn.closest('tr');
        if (row) {
          row.remove();
        }
      });
    })();
  </script>
</body>

</html>
