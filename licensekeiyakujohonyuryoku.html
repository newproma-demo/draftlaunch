<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メニュー */
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: #fff;
      padding: 12px 0;
      box-sizing: border-box;
      overflow: visible;
      position: relative;
      z-index: 100;
      transition: transform 0.3s ease;
      box-shadow: 2px 0 12px rgba(0, 134, 50, 0.15);
    }

    .sidebar.closed {
      transform: translateX(-220px);
    }

    .sidebar-toggle {
      position: absolute;
      left: 220px;
      top: 12px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-left: none;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      cursor: pointer;
      padding: 6px 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s ease;
    }

    .sidebar-toggle:hover {
      background: var(--color-surface);
    }

    .sidebar-toggle img {
      width: 12px;
      height: 13px;
      padding-top: 0;
      pointer-events: none;
    }

    .sidebar h2 {
      margin: 8px 12px 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
    }

    .sidebar-logo-proma {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
    }

    .sidebar-logo-marushin {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 56px 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
    .content-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      overflow: hidden;
    }

    /* エントリーフォーム用スクロールエリア */
    .entry-form {
      margin-top: 16px;
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      box-sizing: border-box;
    }

    .entry-form .form-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .entry-form label {
      font-weight: 500;
      width: 180px;
      flex-shrink: 0;
      padding-top: 8px;
      line-height: 1.4;
    }

    .entry-form input,
    .entry-form textarea {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base);
      box-sizing: border-box;
    }

    .entry-form .form-row-hinshu .hinshu-inputs {
      flex: 1;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .entry-form .form-row-hinshu .hinshu-inputs input {
      flex: 1;
      min-width: 0;
    }

    .entry-form .form-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    /* 追加ボタン（mitsumorijohotoroku.html と同様） */
    .btn-add-image {
      align-self: flex-start;
      padding: 8px 16px;
      background: var(--color-primary);
      color: #fff;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      font-size: 16px;
      white-space: nowrap;
    }

    .btn-add-image:hover {
      background: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
    }

    .btn-add-image--small {
      transform: scale(0.75);
      transform-origin: left top;
    }

    .label-with-button {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-width: 180px;
    }

    .label-with-button-vertical {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .label-with-button label {
      width: 180px;
      padding-top: 8px;
      margin: 0;
      flex: 0 0 auto;
    }

    .sp-label-break {
      display: none;
    }

    .supplier-inputs-wrapper {
      flex: 1;
      min-width: 0;
    }

    .supplier-input-item {
      margin-bottom: 8px;
    }

    .supplier-input-item:last-child {
      margin-bottom: 0;
    }

    .supplier-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .supplier-input-row .autocomplete {
      flex: 0 0 260px;
      width: 260px;
      min-width: 260px;
      max-width: 260px;
    }

    .supplier-input-row .autocomplete .autocomplete-input {
      width: 100%;
    }

    #entryBrandCharaFirst,
    .supplier-input-row select,
    .brand-item-pair-field select {
      flex: 0 0 260px;
      width: 260px;
      min-width: 260px;
      max-width: 260px;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base);
      box-sizing: border-box;
    }

    .brand-item-pair-container {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-item-pair-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }

    .brand-item-pair-fields {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-item-pair-field .autocomplete {
      flex: 0 0 260px;
      width: 260px;
      min-width: 260px;
      max-width: 260px;
    }

    /* 仕入得意先・参考画像と同じ丸型×ボタン */
    .supplier-input-row .btn-delete-supplier,
    .brand-item-pair-row .btn-delete-supplier {
      z-index: 2;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .supplier-input-row .btn-delete-supplier:hover,
    .brand-item-pair-row .btn-delete-supplier:hover {
      background: rgba(200, 0, 0, 0.9);
    }

    .entry-form .btn-primary,
    .entry-form .btn-secondary {
      min-width: 100px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    .entry-form .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .entry-form .btn-secondary {
      background: var(--color-card);
      color: var(--color-text);
    }

    /* content-box内のpage-titleはdashboardのview-layout-titleと同じ見た目に合わせる */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    .content-box .search-box {
      flex-shrink: 0;
    }

    /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
    .content-box .pc-only {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-box .sp-only {
      flex: 1;
      min-height: 0;
    }

    .content-box .content-section {
      flex: 1;
      min-height: 0;
    }

    .modal-window {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      padding: 28px;
      width: 85%;
      max-width: 900px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2001;
    }

    /* #region レスポンシブ対応 */
    /* 画面の高さが750px以下ならロゴを非表示 */
    @media (max-height: 750px) {
      .sidebar-logo-proma {
        display: none;
      }
    }

    /* 画面の高さが600px以下ならロゴを非表示 */
    @media (max-height: 600px) {
      .sidebar-logo-marushin {
        display: none;
      }
    }

    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* サイドバーを隠す */
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 2000;
      }

      /* 開いた状態 */
      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar-toggle {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-box {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-box:first-of-type {
      margin-bottom: 5px;
    }

    .content-box h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }

    /* 画面右下固定アクションボタン群 */
    .fab-actions {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 画面右下固定 登録ボタン */
    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      min-width: 140px;
      width: 140px;
      box-sizing: border-box;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }
    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    /* ライセンス契約：エントリー内の From～To 日付（検索画面と同様） */
    .entry-form .form-row > .period-range-row {
      flex: 1;
      min-width: 0;
      max-width: 100%;
      padding-top: 4px;
    }

    /* スマホ:  */
    @media (max-width: 768px) {
      .entry-form .form-row {
        gap: 10px;
        margin-bottom: 2px;
      }

      .entry-form label {
        padding-top: 2px;
        width: 110px;
      }

      .label-with-button {
        min-width: 110px;
        gap: 2px;
      }

      .label-with-button label {
        width: 110px;
        padding-top: 2px;
      }

      .form-row-brand-chara .label-with-button {
        min-width: 110px;
      }

      .form-row-brand-chara .label-with-button label {
        width: 110px;
        line-height: 1.2;
      }

      .sp-label-break {
        display: inline;
      }

      .entry-form label[for="entryLicensor"] {
        width: 110px;
        white-space: nowrap;
      }

      /* スマホ: ブランド・キャラ / アイテムをライセンサーselectと同幅にする */
      #entryLicensor,
      #entryBrandCharaFirst,
      #entryItemFirst {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
      }

      #brandCharaInputsContainer .supplier-input-row select,
      #itemInputsContainer .supplier-input-row .autocomplete,
      #itemInputsContainer .supplier-input-row .autocomplete .autocomplete-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      /* スマホ: 動的追加行は×ボタンで幅が狭くならないよう静的入力と同幅にする */
      #brandCharaInputsContainer .supplier-input-row.is-dynamic-row,
      #itemInputsContainer .supplier-input-row.is-dynamic-row {
        position: relative;
      }

      #brandCharaInputsContainer .supplier-input-row.is-dynamic-row .btn-delete-supplier,
      #itemInputsContainer .supplier-input-row.is-dynamic-row .btn-delete-supplier {
        position: absolute;
        top: 0;
        right: -30px;
      }
    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定 ボタン -->
    <div class="fab-actions">
      <a class="btn-fab-new">登録</a>
    </div>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <div class="content-box">
        <h2 class="page-title">ライセンス契約情報入力</h2>
        <form class="entry-form">
          <div class="form-row">
            <label for="entryLicensor">ライセンサー</label>
            <div>
              <select id="entryLicensor" name="licensor" aria-label="ライセンサー">
                <option value="0">選択してください</option>
                <option value="1">ディズニー</option>
                <option value="2">ユニバーサル</option>
                <option value="3">サンリオ</option>
                <option value="4">ジブリ</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <label for="entryYukoKigenFrom">契約期間</label>
            <div class="period-range-row">
              <div class="period-range-inputs">
                <div class="period-range-field">
                  <input type="text" id="entryYukoKigenFrom" name="yukoKigenFrom" class="period-range-input period-range-yyyymmdd" inputmode="numeric" maxlength="8" placeholder="yyyymmdd" autocomplete="off" aria-label="契約期間（From） yyyymmdd" title="8桁で入力（例: 20260315）またはカレンダー">
                  <input type="date" class="period-range-picker" aria-hidden="true" tabindex="-1" title="">
                  <button type="button" class="period-range-calendar-btn" aria-label="契約期間（From）をカレンダーで選択">📅</button>
                </div>
                <span class="period-range-sep" aria-hidden="true">～</span>
                <div class="period-range-field">
                  <input type="text" id="entryYukoKigenTo" name="yukoKigenTo" class="period-range-input period-range-yyyymmdd" inputmode="numeric" maxlength="8" placeholder="yyyymmdd" autocomplete="off" aria-label="契約期間（To） yyyymmdd" title="8桁で入力（例: 20260331）またはカレンダー">
                  <input type="date" class="period-range-picker" aria-hidden="true" tabindex="-1" title="">
                  <button type="button" class="period-range-calendar-btn" aria-label="契約期間（To）をカレンダーで選択">📅</button>

          <div class="form-row form-row-brand-chara">
            <div class="label-with-button label-with-button-vertical">
              <label for="entryBrandCharaFirst">ブランド・<span class="sp-label-break"><br></span>キャラ</label>
              <button type="button" class="btn-add-image btn-add-image--small js-add-brand-chara" title="ブランド・キャラを追加">追加</button>
            </div>
            <div class="supplier-inputs-wrapper">
              <div id="brandCharaInputsContainer" class="js-brand-chara-container">
                <div class="supplier-input-item">
                  <div class="supplier-input-row">
                    <select id="entryBrandCharaFirst" name="brandChara[]" aria-label="ブランド・キャラ">
                      <option value="0">選択してください</option>
                      <option value="1">ミッキーマウス</option>
                      <option value="2">ミニーマウス</option>
                      <option value="3">ドナルドダック</option>
                      <option value="4">デイジーダッグ</option>

          <div class="form-row">
            <div class="label-with-button label-with-button-vertical">
              <label for="entryItemFirst">アイテム</label>
              <button type="button" class="btn-add-image btn-add-image--small js-add-item" title="アイテムを追加">追加</button>
            </div>
            <div class="supplier-inputs-wrapper">
              <div id="itemInputsContainer" class="js-item-container">
                <div class="supplier-input-item">
                  <div class="supplier-input-row">
                    <div class="autocomplete">
                      <input type="text" class="autocomplete-input" data-list="item" placeholder="アイテムを入力" id="entryItemFirst" name="item[]" autocomplete="off" aria-label="アイテム">
                      <div class="autocomplete-dropdown"></div>

    <!--#region モーダル(通知のリンク)  -->
    <div id="modal-window" class="modal-window">
    </div>
    <!-- #endregion -->

    <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      // 契約期間: yyyymmdd入力とカレンダーボタン連携（スマホ対応）
      (function initEntryPeriodRange() {
        function isoToYyyymmdd(iso) {
          if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
          return iso.replace(/-/g, "");
        }

        function yyyymmddToIso(text) {
          if (!text || !/^\d{8}$/.test(text)) return "";
          var y = text.slice(0, 4);
          var m = text.slice(4, 6);
          var d = text.slice(6, 8);
          var dt = new Date(y + "-" + m + "-" + d + "T00:00:00");
          if (
            dt.getFullYear() !== Number(y) ||
            dt.getMonth() + 1 !== Number(m) ||
            dt.getDate() !== Number(d)
          ) return "";
          return y + "-" + m + "-" + d;
        }

        var fields = document.querySelectorAll(".entry-form .period-range-field");
        Array.prototype.forEach.call(fields, function (field) {
          var textInput = field.querySelector(".period-range-input");
          var picker = field.querySelector(".period-range-picker");
          var btn = field.querySelector(".period-range-calendar-btn");
          if (!textInput || !picker || !btn) return;

          textInput.addEventListener("input", function () {
            textInput.value = textInput.value.replace(/\D/g, "").slice(0, 8);
            var iso = yyyymmddToIso(textInput.value);
            picker.value = iso;
          });

          textInput.addEventListener("blur", function () {
            var iso = yyyymmddToIso(textInput.value);
            if (iso) textInput.value = isoToYyyymmdd(iso);
          });

          picker.addEventListener("change", function () {
            textInput.value = isoToYyyymmdd(picker.value);
          });

          btn.addEventListener("click", function (event) {
            event.preventDefault();
            if (typeof picker.showPicker === "function") {
              picker.showPicker();
            } else {
              // showPicker未対応（主に一部スマホ）向けフォールバック
              var restoreOpacity = picker.style.opacity;
              var restorePointerEvents = picker.style.pointerEvents;
              picker.style.opacity = "0.01";
              picker.style.pointerEvents = "auto";
              picker.focus();
              picker.click();
              window.setTimeout(function () {
                picker.style.opacity = restoreOpacity;
                picker.style.pointerEvents = restorePointerEvents;
              }, 0);
            }
          });
        });
      })();

      // ブランド・キャラ / アイテム: それぞれ個別に追加と削除
      (function initDynamicBrandAndItemRows() {
        function createDeleteButton(targetRow) {
          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn-delete-supplier";
          deleteBtn.innerHTML = "×";
          deleteBtn.title = "削除";
          deleteBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            targetRow.remove();
          });
          return deleteBtn;
        }

        function createBrandRow() {
          var baseSelect = document.getElementById("entryBrandCharaFirst");
          var item = document.createElement("div");
          item.className = "supplier-input-item";

          var row = document.createElement("div");
          row.className = "supplier-input-row is-dynamic-row";

          var select = document.createElement("select");
          select.setAttribute("name", "brandChara[]");
          select.setAttribute("aria-label", "ブランド・キャラ");

          if (baseSelect && baseSelect.options) {
            Array.prototype.forEach.call(baseSelect.options, function (opt) {
              select.appendChild(opt.cloneNode(true));
            });
          }

          row.appendChild(select);
          row.appendChild(createDeleteButton(item));
          item.appendChild(row);
          return item;
        }

        function createItemRow() {
          var item = document.createElement("div");
          item.className = "supplier-input-item";

          var row = document.createElement("div");
          row.className = "supplier-input-row is-dynamic-row";

          var autocompleteDiv = document.createElement("div");
          autocompleteDiv.className = "autocomplete";

          var input = document.createElement("input");
          input.type = "text";
          input.className = "autocomplete-input";
          input.setAttribute("data-list", "item");
          input.placeholder = "アイテムを入力";
          input.setAttribute("name", "item[]");
          input.setAttribute("autocomplete", "off");
          input.setAttribute("aria-label", "アイテム");

          var dropdown = document.createElement("div");
          dropdown.className = "autocomplete-dropdown";

          autocompleteDiv.appendChild(input);
          autocompleteDiv.appendChild(dropdown);
          row.appendChild(autocompleteDiv);
          row.appendChild(createDeleteButton(item));
          item.appendChild(row);
          return item;
        }

        document.addEventListener("click", function (e) {
          var addBrand = e.target.closest(".js-add-brand-chara");
          if (addBrand) {
            e.preventDefault();
            var brandContainer = document.getElementById("brandCharaInputsContainer");
            if (!brandContainer) return;
            brandContainer.appendChild(createBrandRow());
            return;
          }

          var addItem = e.target.closest(".js-add-item");
          if (!addItem) return;
          e.preventDefault();
          var itemContainer = document.getElementById("itemInputsContainer");
          if (!itemContainer) return;
          var itemRow = createItemRow();
          itemContainer.appendChild(itemRow);

          if (window.initAutocomplete) {
            var ac = itemRow.querySelector(".autocomplete");
            if (ac) window.initAutocomplete(ac);
          }
        });
      })();

    </script>
</body>
