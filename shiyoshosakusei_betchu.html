<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/autocomplete.js"></script>
  <style>
    :root {
      --font-size-base: 16pt;
      --fs-base: 16pt;
      --fs-sm: 14pt;
      --fs-xs: 12pt;
      --fs-lg: 18pt;
      --fs-xl: 20pt;
      --color-primary: #008632;
      --color-primary-dark: #006C29;
      --color-primary-light: #00a840;
      --color-surface: #f8faf9;
      --color-tanto-hover: #47bdc5;
      --color-card: #ffffff;
      --color-border: #e2e8e6;
      --color-text: #1a2e26;
      --color-text-muted: #5c6f66;
      --shadow-sm: 0 1px 3px rgba(0, 134, 50, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 134, 50, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 134, 50, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "Outfit", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    html {
      height: 100%;
      overflow: hidden;
      scrollbar-gutter: auto;
    }

    @supports (height: 100dvh) {
      html {
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    body {
      margin: 0;
      background: var(--color-surface);
      color: var(--color-text);
      height: 100%;
      min-height: 0;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @supports (height: 100dvh) {
      body {
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      /* max-height: calc(100%-48px); */
      overflow: hidden;
    }

    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 16px;
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      /* margin-left: 10px; */
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
      font-size: 16px;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      height: calc(100%-48px);
      width: 100%;
      background: var(--color-surface);
      padding: 24px 24px 24px 32px;
      transition: margin-left 0.3s ease;
    }


    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    /* #endregion */

    /* 画面右下固定 新規登録・修正ボタン（承認通知の詳細ボタンと同じ見た目） */
    .fab-buttons-wrap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      display: flex;
      flex-direction: row;
      gap: 8px;
      align-items: center;
    }

    .fab-buttons-wrap .btn-fab-new {
      position: static;
    }

    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      min-width: 60px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .view-layout {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-1-group,
    .view-layout-3 {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
    }

    .view-layout-1 {
      padding: 0;
    }

    .content-area {
      flex: 1;
      height: 88%;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      /* margin-bottom: 24px; */
      box-shadow: var(--shadow-sm);
    }

    .tab-list {
      font-size: 16px;
      display: flex;
      gap: 0;
      margin: 0 0 0;
      padding: 0;
      list-style: none;
      border-bottom: 2px solid var(--color-border);
    }

    .tab-list li {
      margin: 0;
    }

    .tab-list button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-list button:hover {
      color: var(--color-text);
    }

    .tab-list button.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }

    .shiyosho-tabpanel {
      flex: 1;
      height: 85%;
      display: none;
      margin-top: 12px;
      min-height: 0;
      box-sizing: border-box;
    }

    .shiyosho-tabpanel.is-active {
      display: block;
    }

    .shiyosho-panel-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .shiyosho-panel1 {
      grid-row: 1 / -1;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel2 {
      grid-row: 1;
      grid-column: 2;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .shiyosho-panel3 {
      grid-row: 2;
      grid-column: 2;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .btn-panel-register {
      display: inline-block;
      text-decoration: none;
      min-width: 80px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      font-size: inherit;
    }

    .btn-panel-register:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .panel2-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel2-page-nav {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1px solid #d8d8d8;
      border-radius: 4px;
      overflow: hidden;
    }

    .btn-panel-page {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      background: transparent;
      color: #0d6efd;
      border: none;
      border-right: 1px solid #d8d8d8;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      font-size: 16px;
      line-height: 34px;
    }

    .btn-panel-page:last-child {
      border-right: none;
    }

    .btn-panel-page.is-current {
      background: #0d6efd;
      color: #fff;
      font-weight: 600;
    }

    .btn-panel-page.is-ellipsis {
      color: #6c757d;
      cursor: default;
    }

    .shiyosho-item {
      /* flex: 1; */
      max-width: 70%;
      padding: 12px;
    }

    .shiyosho-item.img-scroll {
      height: 90%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -ms-overflow-style: none;
    }

    .shiyosho-panel1 > .shiyosho-item.img-scroll {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .shiyosho-item.img-scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .img-scroll img {
      /* width: 60%;
      max-width: 70%; */
      width: 80%;
      height: auto;
      display: block;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

    }

    /* #endregion */

  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定 新規登録・修正ボタン -->
    <div class="fab-buttons-wrap">
      <a href="#" class="btn-fab-new">入稿</a>
      <a href="#" class="btn-fab-new">申請</a>
    </div>

    <!--#region メインコンテンツ  -->
    <div class="content">
      <div class="content-area" id="approvalNoticeArea">
        <h2 class="view-layout-title">仕様書作成</h2>

        <ul class="tab-list" role="tablist" aria-label="表示切替">
          <li id="tab1" role="tab" aria-controls="panel1">
            <button type="button" class="shiyosho-tab active" aria-selected="true">
              別注試作依頼書
            </button>
          </li>
          <li id="tab2" role="tab" aria-controls="panel2">
            <button type="button" class="shiyosho-tab" aria-selected="false">
              別注資材試作依頼書
            </button>
          </li>
          <li id="tab3" role="tab" aria-controls="panel3">
            <button type="button" class="shiyosho-tab" aria-selected="false">
              別注色指示書
            </button>
          </li>
          <li id="tab4" role="tab" aria-controls="panel4">
            <button type="button" class="shiyosho-tab" aria-selected="false">
              別注仕様指示書
            </button>
          </li>
          <li id="tab5" role="tab" aria-controls="panel5">
            <button type="button" class="shiyosho-tab" aria-selected="false">
              別注最終仕様書
            </button>
          </li>
          <li id="tab6" role="tab" aria-controls="panel6">
            <button type="button" class="shiyosho-tab" aria-selected="false">
              別注最終資材仕様書
            </button>
          </li>
          <li id="tab7" role="tab" aria-controls="panel7">
            <button type="button" class="shiyosho-tab" aria-selected="false">
              別注校正指示書
            </button>
          </li>
        </ul>

        <!-- パネル1：試作依頼書 -->
        <div id="panel1" class="shiyosho-tabpanel is-active" role="tabpanel" aria-labelledby="tab1">
          <div class="shiyosho-panel-grid">
            <div class="shiyosho-panel1">
              <div class="shiyosho-item img-scroll">
                <img src="images/帳票/仕様書/通常/別注/①別注試作依頼書.png" alt="別注試作依頼書">
              </div>
              <div>
              </div>
            </div>
            <div class="shiyosho-panel2"></div>
            <div class="shiyosho-panel3">
              <button type="button" class="btn-panel-register">
                登録
              </button>
            </div>
          </div>
        </div>

        <!-- パネル2：資材試作依頼書 -->
        <div id="panel2" class="shiyosho-tabpanel" role="tabpanel" aria-labelledby="tab2" hidden>
          <div class="shiyosho-panel-grid">
            <div class="shiyosho-panel1">
              <div class="shiyosho-item img-scroll">
                <img src="images/帳票/仕様書/通常/別注/②別注資材試作依頼書.png" alt="別注資材試作依頼書">
              </div>
            </div>
            <div class="shiyosho-panel2">
              <div class="panel2-controls">
                <div class="panel2-page-nav" aria-label="ページネーション">
                  <button type="button" class="btn-panel-page" aria-label="前のページ">‹</button>
                  <button type="button" class="btn-panel-page is-current" aria-current="page">1</button>
                  <button type="button" class="btn-panel-page">2</button>
                  <button type="button" class="btn-panel-page">3</button>
                  <button type="button" class="btn-panel-page">4</button>
                  <button type="button" class="btn-panel-page is-ellipsis" tabindex="-1" aria-hidden="true">…</button>
                  <button type="button" class="btn-panel-page" aria-label="次のページ">›</button>
                </div>
                <button type="button" class="btn-panel-register">新規追加</button>
              </div>
            </div>
            <div class="shiyosho-panel3">
              <button type="button" class="btn-panel-register">
                登録
              </button>
            </div>
          </div>
        </div>

        <!-- パネル3：色指示書 -->
        <div id="panel3" class="shiyosho-tabpanel" role="tabpanel" aria-labelledby="tab3" hidden>
          <div class="shiyosho-panel-grid">
            <div class="shiyosho-panel1">
              <div class="shiyosho-item img-scroll">
                <img src="images/帳票/仕様書/通常/別注/⑦別注色指示書.png" alt="別注色指示書">
              </div>
            </div>
            <div class="shiyosho-panel2">
              <div class="panel2-controls">
                <div class="panel2-page-nav" aria-label="ページネーション">
                  <button type="button" class="btn-panel-page" aria-label="前のページ">‹</button>
                  <button type="button" class="btn-panel-page is-current" aria-current="page">1</button>
                  <button type="button" class="btn-panel-page">2</button>
                  <button type="button" class="btn-panel-page">3</button>
                  <button type="button" class="btn-panel-page">4</button>
                  <button type="button" class="btn-panel-page is-ellipsis" tabindex="-1" aria-hidden="true">…</button>
                  <button type="button" class="btn-panel-page" aria-label="次のページ">›</button>
                </div>
                <button type="button" class="btn-panel-register">新規追加</button>
              </div>
            </div>
            <div class="shiyosho-panel3">
              <button type="button" class="btn-panel-register">
                登録
              </button>
            </div>
          </div>
        </div>

        <!-- パネル4：仕様指示書 -->
        <div id="panel4" class="shiyosho-tabpanel" role="tabpanel" aria-labelledby="tab4" hidden>
          <div class="shiyosho-panel-grid">
            <div class="shiyosho-panel1">
              <div class="shiyosho-item img-scroll">
                <img src="images/帳票/仕様書/通常/別注/⑨別注仕様指示書.png" alt="別注仕様指示書">
              </div>
            </div>
            <div class="shiyosho-panel2">
              <div class="panel2-controls">
                <div class="panel2-page-nav" aria-label="ページネーション">
                  <button type="button" class="btn-panel-page" aria-label="前のページ">‹</button>
                  <button type="button" class="btn-panel-page is-current" aria-current="page">1</button>
                  <button type="button" class="btn-panel-page">2</button>
                  <button type="button" class="btn-panel-page">3</button>
                  <button type="button" class="btn-panel-page">4</button>
                  <button type="button" class="btn-panel-page is-ellipsis" tabindex="-1" aria-hidden="true">…</button>
                  <button type="button" class="btn-panel-page" aria-label="次のページ">›</button>
                </div>
                <button type="button" class="btn-panel-register">新規追加</button>
              </div>
            </div>
            <div class="shiyosho-panel3">
              <button type="button" class="btn-panel-register">
                登録
              </button>
            </div>
          </div>
        </div>

        <!-- パネル5：最終仕様書 -->

  <script src="js/sidebar.js"></script>
  <script>
    function loadSharedSidebar() {
      const mount = document.getElementById('sidebarMount');
      if (!mount) return;

      if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
        console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
        return;
      }

      mount.innerHTML = window.SHARED_SIDEBAR_HTML;
      initSidebarCollapseToggle();
    }

    function initSidebarCollapseToggle() {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      const content = document.querySelector('.content');
      if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

      const toggleImg = toggle.querySelector('img');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        content.classList.toggle('expanded');

        if (sidebar.classList.contains('closed')) {
          if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
        } else {
          if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
        }
      });

      toggle.dataset.bound = '1';
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.classList.add('show');
      } else {
        overlay.classList.remove('show');
      }
    }

    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.querySelector('.overlay');
      if (!sidebar || !overlay) return;

      sidebar.classList.remove('active');
      overlay.classList.remove('show');
    }

    loadSharedSidebar();
    
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    tabs.forEach(tab => {
      const button = tab.querySelector('button');

      button.addEventListener('click', () => {

        // タブの状態切替
        tabs.forEach(t => {
          const btn = t.querySelector('button');
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-selected', 'true');

        // パネル切替
        const target = tab.getAttribute('aria-controls');
        panels.forEach(p => {
          if (p.id === target) {
            p.hidden = false;
            p.classList.add('is-active');
          } else {
            p.hidden = true;
            p.classList.remove('is-active');
          }
        });
      });
    });

  </script>
