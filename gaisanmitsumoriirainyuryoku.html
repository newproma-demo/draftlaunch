<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* #region ヘッダー */
    .header {
      position: relative;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;

      background: var(--color-card);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .header a {
      text-decoration: none;
      color: inherit;
      letter-spacing: 0.02em;
    }

    .header a:hover {
      color: var(--color-primary);
    }

    .hamburger {
      display: none;
    }

    .header-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 700;
    }

    .header-user {
      position: absolute;
      right: 70px;
      padding: 0;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .account-wrapper {
      position: absolute;
      right: 24px;
    }

    .account-menu {
      position: absolute;
      right: 0;
      top: 40px;
      min-height: 41px;
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: none;
      min-width: 120px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .account-menu .menu-item {
      padding: 12px 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .account-menu .menu-item:hover {
      background: var(--color-primary);
      color: #fff;
    }

    .header-account_circle {
      width: 28px;
      height: 28px;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .header-account_circle:hover {
      opacity: 0.85;
    }

    /* #endregion */

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      min-height: calc(100vh - 48px);
    }

    /* #endregion */

    /* #region メニュー */
    .overlay {
      display: none;
    }

    .overlay.show {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1500;
      backdrop-filter: blur(2px);
    }

    .menu-item {
      margin: 2px 8px;
      position: relative;
      border-radius: var(--radius-sm);
    }

    .menu-title {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
    }

    .menu-title img {
      margin-right: 10px;
      opacity: 0.9;
    }

    .menu-item:hover>.submenu {
      display: block;
    }

    .menu-item:hover .menu-title {
      background: rgba(255, 255, 255, 0.15);
    }

    .arrow {
      transition: transform 0.2s ease;
      margin-left: auto;
      opacity: 0.8;
    }

    /* サブメニュー */
    .submenu {
      display: none;
      position: absolute;
      /* 右側に出すために絶対配置 */
      top: -13px;
      left: 105%;
      background: #008632;
      padding: 0px 0px 0px 0px;
      border-radius: 3px;
      display: none;
      min-width: 330px;
      list-style: none;
    }

    /* 隙間を埋める透明のホバー領域 */
    .submenu::before {
      content: "";
      display: flex;
      position: absolute;
      top: 0;
      left: -5%;
      width: 5%;
      height: 100%;
      background: transparent;
      display: block;
    }

    .submenu li {
      padding: 8px 10px;
      height: auto;
      /* ←折り返し対応 */
    }

    .submenu li:hover {
      background: #006C29;
      /* 好きな色に変更 */
      border-radius: 4px;
      /* 角丸にしたい場合 */
    }

    .submenu li a {
      display: block;
      /* 折り返しを効かせる */
      white-space: normal;
      /* 折り返しOK */
      word-break: break-word;
      /* 日本語も途中で折れる */
      line-height: 1.1;
      /* 行間を少し広めに */
    }

    .submenu a {
      text-decoration: none;
      color: inherit;
    }

    /* #endregion */

    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 56px 24px;
      overflow-y: auto;
      transition: margin-left 0.3s ease, padding-left 0.3s ease;
    }

    .content:not(.expanded) {
      padding-left: 32px;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 32px;
    }

    .content h1 {
      margin-top: 0;
    }

    /* 1つのボックス内に画面タイトル・検索条件・一覧を表示 */
    .content-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      overflow: hidden;
    }

    /* エントリーフォーム用スクロールエリア */
    .entry-form {
      margin-top: 16px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding-right: 8px;
      box-sizing: border-box;
    }

    .entry-form .form-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .entry-form label {
      font-weight: 500;
      width: 180px;
      flex-shrink: 0;
      padding-top: 8px;
      line-height: 1.4;
    }

    .entry-form input,
    .entry-form textarea {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base);
      box-sizing: border-box;
    }

    .entry-form .form-row-hinshu .hinshu-inputs {
      flex: 1;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .entry-form .form-row-hinshu .hinshu-inputs input {
      flex: 1;
      min-width: 0;
    }

    .entry-form .form-actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .entry-form .btn-primary,
    .entry-form .btn-secondary {
      min-width: 100px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    .entry-form .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .entry-form .btn-secondary {
      background: var(--color-card);
      color: var(--color-text);
    }

    /* content-box内のpage-titleはdashboardのview-layout-titleと同じ見た目に合わせる */
    .content-box .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-primary);
      flex-shrink: 0;
    }

    .content-box .search-box {
      flex-shrink: 0;
    }

    /* ボックス内のpc-onlyとsp-onlyは崩さない（sp-onlyはPCでは非表示のためdisplayは触らない） */
    .content-box .pc-only {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-box .sp-only {
      flex: 1;
      min-height: 0;
    }

    .content-box .content-section {
      flex: 1;
      min-height: 0;
    }

    .modal-window {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-card);
      padding: 28px;
      width: 85%;
      max-width: 900px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      z-index: 2001;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が650px以下ならスマホ*/
    @media (max-width: 768px) {
      .pc-only {
        display: none;
      }

      .content-box .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .content-box .sp-only {
        display: flex;
        flex-direction: column;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px 20px 56px 20px;
        margin-left: -220px;
        width: 100%;
      }

      .content-box {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        min-height: 0;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      /* スマホ: 検索条件は折りたたみ式 */
      .search-toggle-sp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-weight: 500;
        color: var(--color-text);
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        cursor: pointer;
        text-align: left;
        box-sizing: border-box;
      }

      .search-toggle-sp-label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      .search-toggle-sp-icon {
        margin-right: 8px;
        flex-shrink: 0;
        vertical-align: middle;
      }

      .search-toggle-sp::after {
        content: "＋";
        color: var(--color-text-muted);
      }

      .search-box {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .search-box-inner {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }

      .search-box.is-open .search-box-inner {
        display: grid;
      }

      .search-box.is-open .search-toggle-sp::after {
        content: "ー";
      }

      /* 検索条件エリア：参照画面と同じ余白・レイアウト */
      .view-layout-1-group>.content-box:first-of-type {
        padding: 8px;
      }

      .view-layout-1-group>.content-box:first-of-type .view-layout-title {
        margin: 0 0 12px;
        padding: 0 0 8px;
      }

      .search-box-inner .filter-row {
        display: contents;
      }

      .search-box-inner .filter-item {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        min-width: 0;
      }

      .search-box-inner .filter-item .filter-label {
        margin-right: 0;
      }

      .search-box-inner .filter-item select,
      .search-box-inner .filter-item input[type="text"] {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }

      .search-box-inner .search-row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        min-width: 0;
      }

      .search-box-inner .search-row label {
        flex-shrink: 0;
      }

      .search-box-inner .search-row select,
      .search-box-inner .search-row input {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }

      /* 検索結果一覧：スマホ時はカード形式（ヘッダ「図案情報」・5段構成） */
      #approvalListArea {
        overflow-x: visible;
        max-height: none;
      }

      #approvalListArea .result-table {
        min-width: 0;
      }

      #approvalListArea .result-table thead {
        display: none;
      }

      #approvalListArea .result-table tbody tr {
        display: block;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        margin-bottom: 12px;
        background: var(--color-card);
      }

      #approvalListArea .result-table tbody tr::before {

        display: block;
        color: var(--color-primary);
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--color-border);
      }

      #approvalListArea .result-table tbody td {
        display: block;
        border: none;
        padding: 4px 0;
        white-space: normal;
      }

      #approvalListArea .result-table tbody td:nth-child(1)::before {
        content: "図案依頼番号：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(2)::before {
        content: "得意先名：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(3)::before {
        content: "デザイナー担当：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(4)::before {
        content: "図案予定期日：";
        font-weight: 600;
      }

      #approvalListArea .result-table tbody td:nth-child(5)::before {
        content: "商品発売時期：";
        font-weight: 600;
      }

      /* イメージ案②: スマホ用 */
      .view-layout-2 .status-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      /* ガントチャート */
      .timeline-wrapper {
        width: 100%;
        max-width: 400px;
      }

      .timeline-line {
        left: 20px;
        right: 20px;
      }
    }

    .dashboard-box select:hover {
      border-color: var(--color-primary);
    }

    .dashboard-box select:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.15);
    }

    /* ========== イメージ案：3つとも一括表示 ========== */
    .view-layout {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    .view-layout-1-group,
    .view-layout-3 {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    /* 図案情報検索（ページタイトル）専用の余白・線調整 */
    h1.view-layout-title {
      margin: 4px 0 8px 12px;
      padding-bottom: 0;
      border-bottom: none;
    }

    /* ========== 案①: 半円グラフ・承認通知・全体・課別 ========== */
    .view-layout-1 {
      padding: 0;
    }

    /* PCでは検索条件開閉ボタンを非表示（スマホは別メディアクエリで表示） */
    @media (min-width: 769px) {
      .search-toggle-sp {
        display: none;
      }
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    .filter-row input[type="text"],
    .filter-row select {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      min-width: 160px;
    }

    /* 検索条件：得意先名（オートコンプリート用 .search-row） */
    .search-box-inner .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .search-box-inner .search-row label {
      margin: 0;
      white-space: nowrap;
    }

    .search-box-inner .search-row .autocomplete-dropdown,
    .search-box-inner .search-row .autocomplete-dropdown div {
      font-size: var(--fs-base);
      font-weight: 500;
    }

    .search-box-inner .search-row select,
    .search-box-inner .search-row input {
      min-width: 160px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box-inner .search-row select:hover,
    .search-box-inner .search-row input:hover {
      border-color: #b0bdb5;
    }

    .search-box-inner .search-row select:focus,
    .search-box-inner .search-row input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 134, 50, 0.12);
    }

    .search-box-inner .search-row input::placeholder {
      color: #9ca89f;
    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-box {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-box:first-of-type {
      margin-bottom: 5px;
    }

    .content-box h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }

    /* 検索結果一覧テーブル（スクロール対応） */
    /* PC/タブレット共通：テーブルエリアに縦横スクロール */
    #approvalListArea {
      width: 100%;
      max-height: 70vh;
      overflow-x: auto;
      overflow-y: auto;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      table-layout: fixed;
    }

    .result-table th,
    .result-table td {
      padding: 8px 10px;
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      border-left: none;
      border-right: none;
      text-align: left;
      white-space: nowrap;
    }

    .result-table th {
      background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: #fff;
      font-weight: 600;
      border-top: none;
    }

    .result-table tr:nth-child(even) {
      background: var(--color-surface);
    }

    .result-table tr:hover {
      background: rgba(0, 134, 50, 0.06);
    }

    /* 図案管理番号リンク */
    .result-table a {
      color: #0066cc;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .result-table a:hover {
      opacity: 0.9;
    }

    /* 画面右下固定 新規登録ボタン（承認通知の詳細ボタンと同じ見た目） */
    .btn-fab-new {
      display: inline-block;
      text-decoration: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      min-width: 70px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    /* ========== 案②: ステータスボタン・①～⑨一覧・詳細ボタン ========== */
    .view-layout-2 {
      padding: 0;
    }

    .view-layout-2 .status-buttons {
      margin-bottom: 20px;
    }

    .view-layout-2 .list-section-title {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
    }

    /* 追加ボタン共通 */
    .btn-add-image {
      align-self: flex-start;
      padding: 8px 16px;
      background: var(--color-primary);
      color: #fff;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      font-size: 16px;
    }

    .btn-add-image:hover {
      background: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
    }

    .btn-add-image--small {
      transform: scale(0.75);
      transform-origin: left top;
    }

    /* ラベルの真下にボタンを縦並びで配置する用 */
    .label-with-button {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 180px;
      flex-shrink: 0;
    }

    .label-with-button > label {
      padding-top: 8px;
    }

    /* 参考画像 */
    .reference-images-wrapper {
      flex: 1;
      min-width: 0;
      display: flex;

    <script src="js/sidebar.js"></script>
    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();

      const icon = document.querySelector('.header-account_circle');
      const menu = document.querySelector('.account-menu');

      icon.addEventListener('click', (e) => {
        e.stopPropagation(); // クリックが外側に伝播しないように
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

      // 参考画像：追加・削除（画像クリックでファイル選択）
      (function () {
        var container = document.getElementById("referenceImagesContainer");
        var addBtn = document.getElementById("addImageBtn");
        if (!container || !addBtn) return;

        function createImageSlot() {
          var item = document.createElement("div");
          item.className = "reference-image-item";

          var preview = document.createElement("img");
          preview.className = "image-preview";
          preview.src = "images/noimage.png";
          preview.alt = "クリックして画像を選択";

          var fileInput = document.createElement("input");
          fileInput.type = "file";
          fileInput.accept = "image/*";
          fileInput.setAttribute("name", "referenceImage[]");
          fileInput.addEventListener("change", function () {
            var file = this.files && this.files[0];
            if (file && file.type && file.type.indexOf("image/") === 0) {
              var reader = new FileReader();
              reader.onload = function (e) {
                preview.src = e.target.result;
              };
              reader.readAsDataURL(file);
            } else {
              preview.src = "images/noimage.png";
            }
          });

          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn-delete-image";
          deleteBtn.innerHTML = "×";
          deleteBtn.title = "削除";
          deleteBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            item.remove();
          });

          item.appendChild(preview);
          item.appendChild(fileInput);
          item.appendChild(deleteBtn);
          return item;
        }

        addBtn.addEventListener("click", function () {
          container.appendChild(createImageSlot());
        });
      })();

      // 仕入得意先：追加（2つ目以降は削除可、追加行もオートコンプリート対応）
      (function () {
        var container = document.getElementById("supplierInputsContainer");
        var addBtn = document.getElementById("addSupplierBtn");
        if (!container || !addBtn) return;

        function createSupplierRow() {
          var item = document.createElement("div");
          item.className = "supplier-input-item";

          var row = document.createElement("div");
          row.className = "supplier-input-row";

          var autocompleteDiv = document.createElement("div");
          autocompleteDiv.className = "autocomplete";
          var input = document.createElement("input");
          input.type = "text";
          input.className = "autocomplete-input";
          input.setAttribute("data-list", "supplier");
          input.placeholder = "仕入得意先を入力";
          input.setAttribute("name", "supplier[]");
          var dropdown = document.createElement("div");
          dropdown.className = "autocomplete-dropdown";
          autocompleteDiv.appendChild(input);
          autocompleteDiv.appendChild(dropdown);

          var deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn-delete-supplier";
          deleteBtn.textContent = "×";
          deleteBtn.addEventListener("click", function () {
            item.remove();
          });

          row.appendChild(autocompleteDiv);
          item.appendChild(row);
          item.appendChild(deleteBtn);
          return item;
        }

        addBtn.addEventListener("click", function () {
          var item = createSupplierRow();
          container.appendChild(item);
          if (window.initAutocomplete) {
            window.initAutocomplete(item.querySelector(".autocomplete"));
          }
        });
      })();

      // 検索条件による検索結果一覧の絞り込み（得意先名入力時に実行）
      (function () {
        var inpTokuisaki = document.getElementById("searchTokuisaki");
        var tbody = document.querySelector("#approvalListArea .result-table tbody");
        if (!tbody) return;

        function applyFilter() {
          var cond = inpTokuisaki ? inpTokuisaki.value.trim() : "";
          Array.prototype.forEach.call(tbody.rows, function (row) {
            var cellTokuisaki = row.cells[1] ? row.cells[1].textContent.trim() : "";
            var match = !cond || cellTokuisaki.indexOf(cond) !== -1;
            row.style.display = match ? "" : "none";
          });
        }

        if (inpTokuisaki) {
          inpTokuisaki.addEventListener("input", applyFilter);
          inpTokuisaki.addEventListener("change", applyFilter);
        }
        applyFilter();
      })();

      // スマホ: 検索条件の折りたたみ開閉
      (function () {
        var btn = document.getElementById("searchToggleSp");
        var box = document.getElementById("searchBox");
        if (btn && box) {
          btn.addEventListener("click", function () {
            var isOpen = box.classList.toggle("is-open");
            btn.setAttribute("aria-expanded", isOpen);
            var textEl = btn.querySelector(".search-toggle-sp-text");
            if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
          });
        }
      })();
    </script>
