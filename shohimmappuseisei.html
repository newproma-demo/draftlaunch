<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="js/autocomplete.js"></script>
  <style>
    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    /* #region ヘッダー下のメニューとメインコンテンツ */
    /* ヘッダーの下に全体レイアウトを配置 */
    .main-wrapper {
      display: flex;
      flex: 1;
      margin-top: 0;
      height: calc(100vh - 48px);
      min-height: calc(100vh - 48px);
      overflow: hidden;
    }
    /* #endregion */
    /* #region メインコンテンツ */
    .content {
      background: var(--color-surface);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 24px 24px 32px;
      overflow: hidden;
      transition: margin-left 0.3s ease;
    }

    .content.expanded {
      margin-left: -220px;
      padding-left: 24px;
    }

    .content-area-2 {
      flex: 1;
    }

    /* ガントチャート */
    .timeline-wrapper {
      position: relative;
      margin-bottom: 0;
      width: 450px;
    }

    .timeline-line {
      position: absolute;
      top: 47%;
      left: 50px;
      right: 50px;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      z-index: 1;
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* #region レスポンシブ対応 */
    /* 画面の幅が768px以下ならスマホ*/
    @media (max-width: 767px) {
      .pc-only {
        display: none;
      }

      .sp-only {
        display: block;
      }

      .header-title {
        margin: 5px 0px 0px 35px;
        font-size: var(--fs-xl);
      }

      .header-user {
        display: none;
      }

      /* ハンバーガーボタン */
      .hamburger {
        display: block;
        position: fixed;
        margin: 6px 10px 0px 0px;
        cursor: pointer;
        z-index: 3000;
      }

      .hamburger img {
        width: 30px;
      }

      .content {
        background: var(--color-surface);
        flex-direction: column;
        flex: 1;
        padding: 20px;
        margin-left: -220px;
        width: 100%;
      }

      .dashboard-section {
        display: flex;
        gap: 24px;
        margin-top: 0;
        width: 100%;
        flex-direction: column;
        padding-bottom: 20px;
      }

      /* イメージ案①: スマホ用 */
      .filter-row {
        flex-wrap: wrap;
      }

      .filter-item {
        flex: 1 1 100%;
      }

      .print-header-bulk-row {
        flex-direction: column;
        align-items: stretch;
      }

      .print-header-bulk-input {
        min-width: 0;
        width: 100%;
        flex: none;
      }

      .btn-print-header-bulk {
        margin-left: 0;
        align-self: flex-end;
        width: auto;
      }

      /* スマホ: 検索条件は折りたたみ式 */
      .search-toggle-sp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-weight: 500;
        color: var(--color-text);
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        cursor: pointer;
        text-align: left;
        box-sizing: border-box;
      }

      .search-toggle-sp-label {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      .search-toggle-sp-icon {
        margin-right: 8px;
        flex-shrink: 0;
        vertical-align: middle;
      }

      .search-toggle-sp::after {
        content: "+";
        color: var(--color-text-muted);
      }

      .search-box {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .search-box-inner {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
        margin-top: 10px;
      }

      .search-box.is-open .search-box-inner {
        display: grid;
        max-height: calc(100vh - 250px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .search-box.is-open .search-toggle-sp::after {
        content: "-";
      }

      .search-box-inner .filter-row {
        display: contents;
      }

      .search-box-inner .filter-item {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        min-width: 0;
      }

      .search-box-inner .filter-item .filter-label {
        margin-right: 0;
      }

      .search-box-inner .filter-item select,
      .search-box-inner .filter-item input[type="text"] {
        min-width: 0;
        width: 100%;
      }

      .search-box-inner .search-cancel-wrapper {
        grid-column: 1 / -1;
        width: 100%;
        margin-left: 0;
        display: flex;
        justify-content: flex-end;
      }

      .timeline-line {
        left: 20px;
        right: 20px;
      }
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .filter-row .filter-label {
      margin-right: 4px;
    }

    .filter-row input[type="text"] {
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    /* 検索条件：アイテムオートコンプリート */
    .filter-row .autocomplete {
      position: relative;
    }
    .filter-row .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      z-index: 100;
      display: none;
    }
    .filter-row .autocomplete-dropdown div {
      padding: 6px 12px;
      cursor: pointer;
      font-size: var(--fs-base);
    }
    .filter-row .autocomplete-dropdown div:hover {
      background: rgba(0, 134, 50, 0.08);
    }

    /* 承認通知／検索結果・ボックス共通 */
    .content-area {

      margin-bottom: 10px;
    }

    /* 検索条件と検索結果一覧の間の余白（5px） */
    .view-layout-1-group>.content-area:first-of-type {
      margin-bottom: 5px;
    }
    
    .content-area h3 {
      margin: 0 0 12px;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 8px;
    }


    /* 商品情報エリア：3行が1画面に収まるように高さを確保 */
    #approvalNoticeArea {
      width: 100%;
      max-height: none;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 画面右下固定 新規登録ボタン（承認通知の詳細ボタンと同じ見た目） */
    .btn-fab-new {
      position: fixed;
      right: 24px;
      bottom: 12px;
      z-index: 2001;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
    }

    .btn-fab-new:hover {
      background: var(--color-primary-dark);
    }

    .product-swiper {
      position: relative;
      width: 100%;
      /* カード内でスクロールさせず、全体レイアウト側でスクロール */
      overflow: visible;
      touch-action: pan-y;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 10px;
      margin-bottom: 3px;
      box-sizing: border-box;
      background: #fff;
      cursor: move;
      user-select: none;
    }

    .product-card.dragging {
      opacity: 0.6;
      box-shadow: var(--shadow-lg);
    }

    .product-nav {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .product-nav-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--color-text);
      white-space: nowrap;
    }

    .product-nav-btn:hover:not(:disabled) {
      background: var(--color-surface);
    }

    .product-nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .product-image-block {
      display: flex;

      align-items: center;
      align-self: center;
    }

    .product-image-wrapper {
      width: 100%;
      /* 画像が見切れないように高さを拡大 */
      max-height: 140px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image-wrapper.drag-over {
      border-color: var(--color-primary);
      background: #e6f4ea;
    }

    .product-image-wrapper img.product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      order: 0;
    }

    .product-table th,
    .product-table td {
      font-size: clamp(var(--fs-xs), 0.5vw + 8px, var(--fs-sm));
      border: 1px solid var(--color-border);
      padding: 4px 6px;
      vertical-align: middle;
      text-align: left
    }

    .product-table th {
      background: #f5f7fa;
    }

    .product-table input,
    .product-table textarea {
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 4px 6px;
    }

    .product-table .half-field {
      width: 100%;
      max-width: 100%;
    }

    .mmf-image-list {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      width: 100%;
    }

    .mmf-image-col {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
    }

    .mmf-image-item {
      width: 100%;
      height: 100%;
      background: #fff;
      object-fit: contain;
      display: block;
    }

    .barcode-list {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      width: 100%;
    }

    .barcode-item {
      flex: 1;
      min-width: 0;
    }

    .barcode-field {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 4px 2px;
      background: #fff;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .barcode-image {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 64px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .product-swiper {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        /* 行の高さはカード内容に応じて自動伸長 */
        grid-auto-rows: max-content;
        gap: 10px 16px;
        align-items: start;
        max-height: none;
        min-height: auto;
        overflow: visible;
      }

      .product-card {
        padding: 8px;
        gap: 8px;
        min-height: auto;
        height: auto;
        max-height: none;
        overflow: visible;
      }

      .product-table th,
      .product-table td {
        padding: 2px 4px;
      }

      .product-table input,
      .product-table textarea,
      .product-table select {
        padding: 2px 4px;
      }

      .product-table textarea {
        min-height: 32px;
      }

      .product-image-block {
        max-width: 160px;
      }

      .product-image-wrapper {
        /* PC 画面ではさらに高さを確保して見切れを防止 */
        max-height: 160px;
      }
    }

    .content-area {
      width: 100%;
      box-sizing: border-box;
    }

    /* 検索条件の開閉（PC/SP共通） */
    .search-toggle-sp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-weight: 500;
      color: var(--color-text);
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: left;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    .search-toggle-sp-label {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .search-toggle-sp-icon {
      margin-right: 8px;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .search-toggle-sp::after {
      content: "+";
      color: var(--color-text-muted);
    }

    .search-box-inner {
      display: none;
    }

    .search-box.is-open .search-box-inner {
      display: block;
    }

    .search-box.is-open .search-toggle-sp::after {
      content: "-";
    }

    /* 検索条件エリア右端：クリアボタン */
    .search-cancel-wrapper {
      margin-left: auto;
      display: flex;
      align-items: center;
    }

    .btn-search-cancel {
      display: inline-block;
      min-width: 140px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-search-cancel:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    /* 検索条件とカードの間：ページ番号（グループ単位） */
    .pagination-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 10px;
      padding: 0 2px;
      gap: 12px;
    }

    .pagination-current {
      flex-shrink: 0;
      margin-left: auto;
      font-weight: 600;
      color: var(--color-text);
      white-space: nowrap;
    }

    .print-header-field {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      justify-content: flex-start;
    }

    .print-header-label {
      flex-shrink: 0;
      font-weight: 500;
      color: var(--color-text);
      white-space: nowrap;
    }

    .print-header-input {
      flex: 1;
      min-width: 120px;
      max-width: 100%;
      box-sizing: border-box;
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base, 14px);
      color: var(--color-text);
      background: #fff;
    }

    .print-header-input::placeholder {
      color: var(--color-text-muted);
    }

    .print-header-bulk-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
    }

    .print-header-bulk-label {
      flex-shrink: 0;
      font-weight: 500;
      color: var(--color-text);
      white-space: nowrap;
    }

    .print-header-bulk-input {
      flex: 1;
      min-width: 200px;
      box-sizing: border-box;
      padding: 4px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--fs-base, 14px);
      color: var(--color-text);
      background: #fff;
    }

    .print-header-bulk-input::placeholder {
      color: var(--color-text-muted);
    }

    .btn-print-header-bulk {
      flex-shrink: 0;
      margin-left: auto;
      min-width: 100px;
      padding: 6px 14px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .btn-print-header-bulk:hover {
      background: var(--color-primary-dark);
      color: #fff;
    }

    .product-page-group {
      margin-bottom: 24px;
    }

    .product-page-group:last-child {
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <div class="overlay" onclick="closeSidebar()"></div>

  <!--#region ヘッダー  -->
  <div class="header">
    <div class="hamburger" onclick="toggleSidebar()">
      <img src="images/menu_50dp_008632.svg" />
    </div>
    <div class="header-title"><a href="dashboard.html">Proma</a></div>
    <div class="header-user">デジタルマネジメントストラテジー事業部　丸眞 太郎</div>
    <div class="account-wrapper">
      <img class="header-account_circle" src="images/account_circle_16dp_008632.svg">
      <div class="account-menu">
        <div class="menu-item">ログアウト</div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- ヘッダー下のレイアウト -->
  <div class="main-wrapper">

    <!--#region メニュー（js/sidebar.js の SHARED_SIDEBAR_HTML） -->
    <div id="sidebarMount"></div>
    <!-- #endregion -->

    <!-- 画面右下固定 新規登録ボタン -->
    <button type="button" class="btn-fab-new">マップ出力</button>
    <!-- #endregion -->

    <!--#region メインコンテンツ  -->
    <div class="content">
      <!-- 画面タイトル -->
      <h1>商品マップ生成</h1>
      <!-- ========== : 検索条件・検索結果一覧 ========== -->

      <!-- 利用区分ラジオボタン -->
      <div class="content-area">
        <div class="filter-row">
          <div class="filter-item">
            <label><input type="radio" name="useType" value="internal" checked> 社内用</label>
            <label><input type="radio" name="useType" value="sales"> 営業用</label>
            <label><input type="radio" name="useType" value="maker"> メーカー用</label>
            <label><input type="radio" name="useType" value="tanto"> 担当者別</label>
          </div>
        </div>
      </div>

      <!-- 検索条件ボックス -->
      <div class="content-area">
        <div class="view-layout view-layout-1">
          <div class="search-box" id="searchBox">
            <button type="button" class="search-toggle-sp" id="searchToggleSp" aria-expanded="false" aria-controls="searchRowsPanel">
              <span class="search-toggle-sp-label">
                <img class="search-toggle-sp-icon" src="images/search_20dp_008632.svg" alt="" width="20" height="20">
                <span class="search-toggle-sp-text">検索条件を開く</span>
              </span>
            </button>
            <div class="search-box-inner" id="searchRowsPanel">
              <div class="filter-row">
<!--
                <div class="filter-item">
                  <span class="filter-label">販売区分</span>
                  <select id="searchSalesType">
                    <option value="">すべて</option>
                    <option value="teiban">定番</option>
                    <option value="teiban-kakou">定番加工</option>
                    <option value="betsuchu">別注</option>
                    <option value="oem">OEM</option>
                  </select>
                </div>
-->
                <div class="filter-item">
                  <span class="filter-label">展示会</span>
                  <select id="searchTenjikai">
                    <option value="all">すべて</option>
                    <option value="2026.01">2026.01 展示会</option>
                    <option value="2026.02">2026.02 展示会</option>
                    <option value="2026.03">2026.03 展示会</option>
                    <option value="2026.04">2026.04 展示会</option>
                    <option value="2026.05">2026.05 展示会</option>
                    <option value="2026.06">2026.06 展示会</option>
                    <option value="2026.07">2026.07 展示会</option>
                    <option value="2026.08">2026.08 展示会</option>
                    <option value="2026.09">2026.09 展示会</option>
                  </select>
                </div>
                <div class="filter-item">
                  <label class="filter-label manufacturer-label">メーカー</label>
                  <div class="manufacturer-row input-actions">
                    <div class="autocomplete">
                      <input type="text" class="autocomplete-input" data-list="supplier" placeholder="メーカー検索"
                        id="searchItem">
                      <div class="autocomplete-dropdown"></div>
                    </div>
                  </div>
                </div>
                <div class="filter-item">
                  <span class="filter-label">カテゴリー</span>
                  <div class="autocomplete">
                    <input type="text" class="autocomplete-input" data-list="category2" placeholder="カテゴリー検索" id="searchCategory">
                    <div class="autocomplete-dropdown"></div>
                  </div>
                </div>
                <div class="filter-item">
                  <span class="filter-label">商品コード</span>
                  <select id="searchProductCode">
                    <option value="all">すべて</option>
                    <option value="4900000001">4900000001</option>
                    <option value="4900000002">4900000002</option>
                    <option value="4900000003">4900000003</option>
                    <option value="4900000004">4900000004</option>
                    <option value="4900000005">4900000005</option>

    <script>
      function loadSharedSidebar() {
        const mount = document.getElementById('sidebarMount');
        if (!mount) return;

        if (typeof window.SHARED_SIDEBAR_HTML !== 'string' || !window.SHARED_SIDEBAR_HTML.trim()) {
          console.error('Sidebar include error: SHARED_SIDEBAR_HTML is not available.');
          return;
        }

        mount.innerHTML = window.SHARED_SIDEBAR_HTML;
        initSidebarCollapseToggle();
      }

      function initSidebarCollapseToggle() {
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        const content = document.querySelector('.content');
        if (!toggle || !sidebar || !content || toggle.dataset.bound === '1') return;

        const toggleImg = toggle.querySelector('img');
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('closed');
          content.classList.toggle('expanded');

          if (sidebar.classList.contains('closed')) {
            if (toggleImg) toggleImg.src = 'images/chevron_right_20dp_FFFFF.svg';
          } else {
            if (toggleImg) toggleImg.src = 'images/chevron_left_20dp_FFFFF.svg';
          }
        });

        toggle.dataset.bound = '1';
      }

      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.toggle('active');

        if (sidebar.classList.contains('active')) {
          overlay.classList.add('show');
        } else {
          overlay.classList.remove('show');
        }
      }

      function closeSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        if (!sidebar || !overlay) return;

        sidebar.classList.remove('active');
        overlay.classList.remove('show');
      }

      loadSharedSidebar();
    
    const icon = document.querySelector('.header-account_circle');
    const menu = document.querySelector('.account-menu');

    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // クリックが外側に伝播しないように
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });


    var GAUGE_ARC_LENGTH = Math.PI * 40;
    function setGaugeFillSegments(fillId, warn7Id, delayId, done, total, warn7, delay) {
      var L = GAUGE_ARC_LENGTH;
      var t = total > 0 ? total : 1;
      var w7 = (warn7 != null ? warn7 : 0);
      var dly = (delay != null ? delay : 0);
      var lenDone = (done / t) * L;
      var lenWarn7 = (w7 / t) * L;
      var lenDelay = (dly / t) * L;
      var el = document.getElementById(fillId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDone.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", "0");
      }
      el = document.getElementById(warn7Id);
      if (el) {
        el.setAttribute("stroke-dasharray", lenWarn7.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-lenDone).toFixed(2));
      }
      el = document.getElementById(delayId);
      if (el) {
        el.setAttribute("stroke-dasharray", lenDelay.toFixed(2) + " " + L.toFixed(2));
        el.setAttribute("stroke-dashoffset", (-(lenDone + lenWarn7)).toFixed(2));
      }
    }

      // 利用区分（社内用／営業用／メーカー用）に応じて、カード内の行表示を制御
      function applyUseTypeToCard(card, useType) {
        var rows = card.querySelectorAll(".product-table tbody tr");
        if (!rows || !rows.length) return;

        rows.forEach(function (row) {
          var th = row.querySelector("th");
          if (!th) return;
          var label = th.textContent.trim();

          if (useType === "sales") {
            // 営業用：指定された項目のみ表示
            if (SALES_VISIBLE_FIELDS.indexOf(label) !== -1) {
              row.style.display = "";
            } else {
              row.style.display = "none";
            }
          } else if (useType === "maker") {
            // メーカー用：メーカー用リストに含まれる項目のみ表示
            if (MAKER_VISIBLE_FIELDS.indexOf(label) !== -1) {
              row.style.display = "";
            } else {
              row.style.display = "none";
            }
          } else if (useType === "tanto") {
            // 担当者別：担当者別リストに含まれる項目のみ表示
            if (TANTO_VISIBLE_FIELDS.indexOf(label) !== -1) {
              row.style.display = "";
            } else {
              row.style.display = "none";
            }
          } else {
            // 社内用など：全て表示
            row.style.display = "";
          }
        });
      }

      function applyUseTypeToAllCards(useType) {
        getAllCards().forEach(function (card) {
          applyUseTypeToCard(card, useType);
        });
      }

      function normalizeJanCode(value) {
        return (value || "").toString().replace(/\D/g, "");
      }

      function renderJanBarcodeToField(field, janValue) {
        if (!field) return;
        var jan = normalizeJanCode(janValue);
        field.removeAttribute("src");

        if (!jan || (jan.length !== 12 && jan.length !== 13) || typeof JsBarcode !== "function") {
          return;
        }

        var canvas = document.createElement("canvas");
        try {
          JsBarcode(canvas, jan, {
            format: "EAN13",
            displayValue: true,
            margin: 4,
            width: 1.2,
            height: 22,
            fontSize: 11,
            textMargin: 3,
            marginBottom: 6
          });
          field.src = canvas.toDataURL("image/png");
        } catch (e) {
          field.removeAttribute("src");
        }
      }

      function updateCardBarcodes(card, janValue) {
        var barcodeFields = card.querySelectorAll(".barcode-image");
        if (!barcodeFields || !barcodeFields.length) return;
        Array.prototype.forEach.call(barcodeFields, function (field) {
          renderJanBarcodeToField(field, janValue);
        });
      }

        var sosei = card.querySelector('input[name="sosei"]');
        var shiyo = card.querySelector('input[name="shiyo"]');
        var janUmu = card.querySelector('input[name="janUmu"]');
        var nohinKeitai = card.querySelector('input[name="nohinKeitai"]');

        // まず既存値をクリア
        [tenjikai, category, productName, itemName, jan, koteiJodai, shinJodai, yoteiKadai,
          setoZaiko, tehaiKanouSuu, yoteiHatchuSuu, maker, sizeWeight, gensankoku,
          sosei, shiyo, janUmu, nohinKeitai
        ].forEach(function (el) {
          if (el) el.value = "";
        });
        updateCardBarcodes(card, "");
        toggleBarcodeImages(card, !!code);

        // 画像も初期化（空カード時も画像エリアは表示）
        if (img) {
          img.src = "images/noimage.png";
        }
        if (wrapper) {
          wrapper.style.display = "flex";
        }
        if (mmfImage1) {
          mmfImage1.removeAttribute("src");

        if (code && mmfImage4) {
          mmfImage4.src = "images/mnf-recycled.svg";
          mmfImage4.style.display = "block";
        }
        if (code && mmfImage2) {
          mmfImage2.src = "images/mnf-natural.svg";
        }
        if (code && mmfImage3) {
          mmfImage3.src = "images/mnf-polyester.svg";
        }
        if (code && mmfImage4) {
          mmfImage4.src = "images/mnf-recycled.svg";
        }

        // サンプルデータに存在する商品コードは、サンプル値を優先して反映
        if (code) {
          var sample = sampleProducts.find(function (p) { return p.code === code; });
          if (sample) {
            if (img && sample.image) img.src = sample.image;
            if (tenjikai) tenjikai.value = (sample.tenjikaiKey || "") + " 展示会";
            if (category) category.value = sample.category || "";
            if (productName) productName.value = sample.name || "";
            if (itemName) itemName.value = sample.item || "";
            if (jan) jan.value = sample.jan || "";
            updateCardBarcodes(card, sample.jan || "");
            toggleBarcodeImages(card, true);
            if (koteiJodai) koteiJodai.value = sample.koteiJodai || "";
            if (shinJodai) shinJodai.value = sample.shinJodai || "";
            if (yoteiKadai) yoteiKadai.value = sample.yoteiKadai || "";
            if (setoZaiko) setoZaiko.value = sample.setoZaiko || "";
            if (tehaiKanouSuu) tehaiKanouSuu.value = sample.tehaiKanouSuu || "";
            if (yoteiHatchuSuu) yoteiHatchuSuu.value = sample.yoteiHatchuSuu || "";
            if (maker) maker.value = sample.maker || "";
            if (sizeWeight) sizeWeight.value = sample.sizeWeight || "";
            if (gensankoku) gensankoku.value = sample.gensankoku || "";
            if (sosei) sosei.value = sample.sosei || "";
            if (shiyo) shiyo.value = sample.shiyo || "";
            if (janUmu) janUmu.value = sample.janUmu || "";
            if (nohinKeitai) nohinKeitai.value = sample.nohinKeitai || "";
            return;
          }
        }
      }

      function resetCard(card) {
        Array.prototype.forEach.call(card.querySelectorAll("input, textarea"), function (el) {
          if (el.type === "file") {
            el.value = "";
          } else {
            el.value = "";
          }
        });
        var img = card.querySelector(".product-image");
        if (img) {
          img.src = "images/noimage.png";
        }
      }

      // 各カードに商品コード選択時のイベントを設定
      function attachProductCodeHandler(card) {
        var select = card.querySelector('select[name="shohinCode"]');
        if (!select) return;
        select.addEventListener("change", function () {
          applyProductData(card, this.value);
        });
      }

      function getFilteredProducts() {
        var tenjikaiValue = normalize((document.getElementById("searchTenjikai") || {}).value);
        var categoryValue = normalize((document.getElementById("searchCategory") || {}).value);
        var productCodeValue = normalize((document.getElementById("searchProductCode") || {}).value);
        var janCodeValue = normalize((document.getElementById("searchJanCode") || {}).value);
        var nameValue = normalize((document.getElementById("searchName") || {}).value);
        var itemValue = normalize((document.getElementById("searchItem") || {}).value);
        var hasCriteria = (
          (tenjikaiValue && tenjikaiValue !== "all") ||
          !!categoryValue ||
          (productCodeValue && productCodeValue !== "all") ||
          (janCodeValue && janCodeValue !== "all") ||
          !!nameValue ||
          !!itemValue
        );

        if (!hasCriteria) {
          return [];
        }

        return sampleProducts.filter(function (product) {
          var matchTenjikai = (!tenjikaiValue || tenjikaiValue === "all" || normalize(product.tenjikaiKey) === tenjikaiValue);
          var matchCategory = (!categoryValue || normalize(product.category).indexOf(categoryValue) !== -1);
          var matchProductCode = (!productCodeValue || productCodeValue === "all" || normalize(product.code) === productCodeValue);
          var matchJanCode = (!janCodeValue || janCodeValue === "all" || normalize(product.jan) === janCodeValue);
          var matchName = (!nameValue || normalize(product.name).indexOf(nameValue) !== -1);
          var matchItem = (!itemValue || normalize(product.item).indexOf(itemValue) !== -1);

          return (
            matchTenjikai &&
            matchCategory &&
            matchProductCode &&
            matchJanCode &&
            matchName &&
            matchItem
          );
        });
      }

      function refreshProductCodeOptions() {
        var codes = sampleProducts.map(function (p) { return p.code; });

        var searchCodeSelect = document.getElementById("searchProductCode");
        if (searchCodeSelect) {
          searchCodeSelect.innerHTML = "";
          var allOption = document.createElement("option");
          allOption.value = "all";
          allOption.textContent = "すべて";
          searchCodeSelect.appendChild(allOption);
          codes.forEach(function (code) {
            var opt = document.createElement("option");
            opt.value = code;
            opt.textContent = code;
            searchCodeSelect.appendChild(opt);
          });
        }

        getAllCards().forEach(function (card) {
          var select = card.querySelector('select[name="shohinCode"]');
          if (!select) return;
          select.innerHTML = "";
          var placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "選択してください";
          select.appendChild(placeholder);
          codes.forEach(function (code) {
            var opt = document.createElement("option");
            opt.value = code;
            opt.textContent = code;
            select.appendChild(opt);
          });
        });
      }

      // カードのドラッグ＆ドロップ並び替えを有効化（同一ページ内の .product-swiper のみ）
      function enableCardDragAndDrop(swiperEl) {
        var dragSrcEl = null;

        function handleDragStart(e) {
          dragSrcEl = this;
          this.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", "");
        }

        function handleDragOver(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          var target = e.target.closest(".product-card");
          if (!target || target === dragSrcEl || !swiperEl.contains(target)) return;

          var cardsArray = Array.prototype.slice.call(swiperEl.querySelectorAll(".product-card"));
          var srcIndex = cardsArray.indexOf(dragSrcEl);
          var targetIndex = cardsArray.indexOf(target);

          if (srcIndex < 0 || targetIndex < 0) return;

          var rect = target.getBoundingClientRect();
          var insertBefore = e.clientY < rect.top + rect.height / 2;

          if (insertBefore) {
            swiperEl.insertBefore(dragSrcEl, target);
          } else {
            swiperEl.insertBefore(dragSrcEl, target.nextSibling);
          }
        }

        function handleDrop(e) {
          e.preventDefault();
        }

        function handleDragEnd() {
          this.classList.remove("dragging");
        }

        Array.prototype.forEach.call(swiperEl.querySelectorAll(".product-card"), function (card) {
          card.setAttribute("draggable", "true");
          card.addEventListener("dragstart", handleDragStart);
          card.addEventListener("dragover", handleDragOver);
          card.addEventListener("drop", handleDrop);
          card.addEventListener("dragend", handleDragEnd);
        });
      }

      function renderProductPages() {
        var filteredProducts = getFilteredProducts();
        var total = filteredProducts.length;
        var numPages = total === 0 ? 1 : Math.ceil(total / CARDS_PER_PAGE);

        pagesContainer.innerHTML = "";

        var cardProto = cardTemplateEl.content.querySelector(".product-card");
        if (!cardProto) return;

        for (var p = 0; p < numPages; p++) {
          var pageGroup = document.createElement("div");
          pageGroup.className = "product-page-group";

          var row = document.createElement("div");
          row.className = "pagination-row page-group-pagination";

          var printHeaderWrap = document.createElement("div");
          printHeaderWrap.className = "print-header-field";
          var printHeaderLabel = document.createElement("label");
          printHeaderLabel.className = "print-header-label";
          printHeaderLabel.setAttribute("for", "printHeaderInput_" + p);
          printHeaderLabel.textContent = "印刷用ヘッダー";
          var printHeaderInput = document.createElement("input");
          printHeaderInput.type = "text";
          printHeaderInput.className = "print-header-input";
          printHeaderInput.id = "printHeaderInput_" + p;
          printHeaderInput.setAttribute("autocomplete", "off");
          printHeaderInput.placeholder = "印刷用ヘッダーを入力";
          printHeaderWrap.appendChild(printHeaderLabel);
          printHeaderWrap.appendChild(printHeaderInput);
          row.appendChild(printHeaderWrap);

          var label = document.createElement("div");
          label.className = "pagination-current";
          label.textContent = (p + 1) + "Page";
          if (p === 0) {
            label.id = "currentPageLabel";
          }
          row.appendChild(label);
          pageGroup.appendChild(row);

          var swiper = document.createElement("div");
          swiper.className = "product-swiper";

          for (var slot = 0; slot < CARDS_PER_PAGE; slot++) {
            var card = cardProto.cloneNode(true);
            resetCard(card);
            attachProductCodeHandler(card);
            swiper.appendChild(card);
          }
          pageGroup.appendChild(swiper);
          pagesContainer.appendChild(pageGroup);

          enableCardDragAndDrop(swiper);
        }

        refreshProductCodeOptions();

        var allCards = pagesContainer.querySelectorAll(".product-card");
        Array.prototype.forEach.call(allCards, function (card, idx) {
          var product = filteredProducts[idx] || null;
          var select = card.querySelector('select[name="shohinCode"]');
          var code = product ? product.code : "";
          if (select) select.value = code;
          applyProductData(card, code);
        });

        var useTypeRadios = document.querySelectorAll('input[name="useType"]');
        var checkedRadio = Array.prototype.find.call(useTypeRadios, function (r) { return r.checked; });
        var ut = checkedRadio ? checkedRadio.value : "internal";
        applyUseTypeToAllCards(ut);
      }

      // サンプルデータ（検索条件で抽出してカードへ反映）
      sampleProducts = [];
      for (var sampleNo = 1; sampleNo <= 30; sampleNo++) {
        var code = "49000000" + String(sampleNo).padStart(2, "0");
        var tenjikaiKey = (sampleNo <= 25) ? "2026.01" : (sampleNo <= 28 ? "2026.02" : "2026.03");
        var imageNo = ((sampleNo - 1) % 6) + 1;
        var imagePath = "images/zuan00" + imageNo + ".png";

        sampleProducts.push({
          code: code,
          tenjikaiKey: tenjikaiKey,
          image: imagePath,
          category: (sampleNo % 3 === 0) ? "OEM" : ((sampleNo % 2 === 0) ? "別注" : "定番"),
          name: "サンプル商品" + String(sampleNo).padStart(2, "0"),
          item: (sampleNo % 4 === 0) ? "フェイスタオル" : ((sampleNo % 4 === 1) ? "ミニタオル" : ((sampleNo % 4 === 2) ? "ハンドタオル" : "スポーツタオル")),
          jan: "4900000" + String(sampleNo).padStart(5, "0"),
          koteiJodai: String(480 + sampleNo * 15),
          shinJodai: "0",
          yoteiKadai: "0",
          setoZaiko: String(50 + sampleNo),
          tehaiKanouSuu: String(120 + sampleNo * 2),
          yoteiHatchuSuu: String(800 + sampleNo * 25),
          maker: "サンプルメーカー" + String.fromCharCode(65 + ((sampleNo - 1) % 6)),
          sizeWeight: (24 + (sampleNo % 8)) + "×" + (24 + (sampleNo % 8)) + "cm/" + (30 + sampleNo) + "g",
          gensankoku: (sampleNo % 2 === 0) ? "中国" : "ベトナム",
          sosei: "綿100%",
          shiyo: (sampleNo % 2 === 0) ? "ジャカード" : "プリント",
          janUmu: "有",
          nohinKeitai: (sampleNo % 2 === 0) ? "10枚袋" : "個包装"
        });
      }

      // 検索条件で絞り込み（販売区分・ブランド/キャラは除外）
      [
        "searchTenjikai",
        "searchCategory",
        "searchProductCode",
        "searchJanCode",
        "searchName",
        "searchItem"
      ].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var eventName = (el.tagName === "SELECT") ? "change" : "input";
        el.addEventListener(eventName, function () {
          renderProductPages();
        });
      });

      // 利用区分ラジオボタンの変更に応じて表示項目を切替
      var useTypeRadios = document.querySelectorAll('input[name="useType"]');
      if (useTypeRadios && useTypeRadios.length) {
        useTypeRadios.forEach(function (radio) {
          radio.addEventListener("change", function () {
            if (!this.checked) return;
            applyUseTypeToAllCards(this.value);
          });
        });
      }

      // 初期描画（ページグループをデータ件数に応じて縦に生成）
      renderProductPages();
    })();

    // スマホ: 検索条件の折りたたみ開閉
    (function () {
      var btn = document.getElementById("searchToggleSp");
      var box = document.getElementById("searchBox");
      if (btn && box) {
        btn.addEventListener("click", function () {
          var isOpen = box.classList.toggle("is-open");
          btn.setAttribute("aria-expanded", isOpen);
          var textEl = btn.querySelector(".search-toggle-sp-text");
          if (textEl) textEl.textContent = isOpen ? "検索条件を閉じる" : "検索条件を開く";
        });
      }
    })();

    (function () {
      var cancelAllBtn = document.getElementById("searchCancelAllBtn");
      if (cancelAllBtn) {
        cancelAllBtn.addEventListener("click", function () {
          // 初期表示へ戻す（リフレッシュ）
          window.location.reload();
        });
      }
    })();

    (function () {
      var bulkBtn = document.getElementById("printHeaderBulkApplyBtn");
      var bulkInput = document.getElementById("printHeaderBulkInput");
      var pagesContainer = document.getElementById("productPagesContainer");
      if (!bulkBtn || !bulkInput || !pagesContainer) return;
      bulkBtn.addEventListener("click", function () {
        var v = bulkInput.value;
        pagesContainer.querySelectorAll(".print-header-input").forEach(function (el) {
          el.value = v;
        });
      });
    })();

  </script>
</body>

</html>
